<title>HookMill Tour v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: prototype bar on top, the product inside a device frame (desktop 1280 or phone 390), event log beside it. Single light look = the HookMill product (ink sidebar, lime only for the main action). */
:root {
  --bg: #eeeeea; --card: #fdfdfb; --card-2: #f3f4f0; --field: #ffffff;
  --line: #dcddd7; --line-soft: #e4e5e0; --line-strong: #cfd1cb;
  --fg: #15171a; --fg-2: #3b4047; --fg-3: #5a6068;
  --brand: #c8f03c; --brand-hover: #bde52f; --brand-ink: #3e5200; --brand-soft: #f0f8d2; --brand-edge: #a9cc2a;
  --ink: #16181b; --ink-2: #202328; --ink-3: #2a2e33; --ink-line: #2e3238; --ink-fg: #f2f3ee; --ink-fg-2: #c5cad0; --ink-fg-3: #9aa1a9;
  --ok-bg: #e2f3e8; --ok: #0b6b43; --ok-dot: #1c9a5e;
  --warn-bg: #fbf0d3; --warn: #7a5000; --warn-edge: #e9c76b;
  --bad-bg: #fbe7dd; --bad: #a8360c; --bad-edge: #e4b9a6;
  --info-bg: #e6ebfc; --info: #2b4bc8; --info-edge: #c3cef6;
  --overlay: rgba(22,24,27,.62);
  --th-sky: #8fb3c9; --th-sand: #d8c3a0; --th-sage: #9fb89a; --th-dusk: #6f6a8f; --th-clay: #c08a6a; --th-red: #d83a2a; --th-chat-b: #3d6cf0; --th-white: #ffffff;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r-chip: 8px; --r-ctl: 10px; --r-btn: 12px; --r-card: 16px; --r-panel: 18px;
  color-scheme: light;
}
* { box-sizing: border-box }
html, body { background: var(--bg); color: var(--fg) }
body { font-family: var(--display); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px }
h1, h2, h3 { margin: 0; text-wrap: balance }
h1 { font-size: 26px; line-height: 1.1; font-weight: 800; font-stretch: 125%; letter-spacing: -0.015em }
h2 { font-size: 16px; font-weight: 700 }
h3 { font-size: 14px; font-weight: 700 }
p { margin: 0 }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3) }
.num { font-variant-numeric: tabular-nums }
.muted { color: var(--fg-3) }

/* prototype bar */
.proto { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--warn-bg); border-bottom: 1px solid var(--warn-edge); font-size: 12px; color: var(--warn) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 31; background: var(--warn-bg) }
.proto b { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase }
.proto label { display: inline-flex; gap: 6px; align-items: center }
.proto select, .proto button { border: 1px solid var(--warn-edge); background: var(--card); border-radius: var(--r-chip); padding: 4px 8px; font-size: 12px; color: var(--fg) }
.intro { display: flex; flex-wrap: wrap; gap: 6px 24px; align-items: baseline; padding-block: 18px 12px; max-width: 1280px; margin-inline: auto }
.intro h1 { font-size: 22px }
.intro p { color: var(--fg-2); max-width: 70ch }

.stage { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; max-width: 1600px; margin-inline: auto; align-items: start }
.stage.phone { grid-template-columns: minmax(0, 390px) minmax(0, 360px); justify-content: center }
@media (max-width: 1100px) { .stage, .stage.phone { grid-template-columns: minmax(0, 1fr); justify-content: stretch } .stage.phone .device { margin-inline: auto } }

/* device */
.device { position: relative; height: 780px; border: 1px solid var(--line-strong); border-radius: 22px; overflow: hidden; background: color-mix(in oklab, var(--bg) 88%, var(--fg)); box-shadow: 0 10px 40px rgba(21,23,26,.12) }
.device.desk { display: grid; grid-template-columns: 228px minmax(0, 1fr); gap: 10px; padding: 10px }
.device.ph { width: 100%; max-width: 390px; display: flex; flex-direction: column; border-radius: 30px; background: var(--bg) }
.scroll { position: relative; min-width: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin }
.desk .scroll { background: var(--bg); border: 1px solid var(--line); border-radius: 18px }
.ph .scroll { flex: 1 }
.view { padding: 22px 24px 120px; display: flex; flex-direction: column; gap: 16px }
.ph .view { padding: 16px 16px 150px; gap: 14px }

/* sidebar / topbar */
.side { background: var(--ink); color: var(--ink-fg-2); padding: 16px 12px; border-radius: 18px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; min-height: 0 }
.logo { font-weight: 800; font-stretch: 112%; font-size: 16px; color: var(--ink-fg); padding: 2px 8px 12px; display: flex; gap: 8px; align-items: center }
.logo i { width: 18px; height: 18px; border-radius: 5px; background: var(--brand); border: 1px solid var(--brand-edge) }
.ws { margin: 0 2px 6px; padding: 8px 10px; border: 1px solid var(--ink-line); background: var(--ink-2); border-radius: var(--r-btn); font-size: 13px; color: var(--ink-fg); display: grid; gap: 1px }
.ws small { font-size: 11px; color: var(--ink-fg-3); display: flex; gap: 6px; align-items: center }
.ws small i { width: 7px; height: 7px; border-radius: 50%; background: currentColor }
.ws small.ok { color: #8bd7a9 } .ws small.no { color: #efc45a }
.grp { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-fg-3); padding: 12px 10px 4px }
.nav { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: var(--r-chip); border: 0; background: none; text-align: left; color: var(--ink-fg-2); min-height: 36px; width: 100%; font-weight: 500 }
.nav:hover { background: var(--ink-2) }
.nav.on { background: var(--ink-3); color: var(--ink-fg); font-weight: 700 }
.nav.on .ic { background: var(--brand) }
.nav .ic { width: 7px; height: 7px; border-radius: 2px; background: var(--ink-fg-3) }
.soon { margin-left: auto; font-family: var(--mono); font-size: 9px; padding: 1px 5px; border-radius: 4px; border: 1px dashed var(--ink-fg-3); color: var(--ink-fg-3) }
.badge { margin-left: auto; font-family: var(--mono); font-size: 10px; padding: 0 6px; border-radius: 99px; background: var(--brand); color: var(--fg); font-weight: 600 }
.foot { margin-top: auto; display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--ink-line) }
.meter { border: 1px solid var(--ink-line); border-radius: var(--r-ctl); padding: 10px; display: grid; gap: 6px; font-size: 12px }
.meter .top { display: flex; justify-content: space-between; align-items: baseline }
.meter b { color: var(--ink-fg); font-size: 18px; font-weight: 800; font-stretch: 112% }
.meter .segs { display: flex; gap: 3px } .meter .segs i { flex: 1; height: 4px; border-radius: 3px; background: var(--brand) } .meter .segs i.used { background: var(--ink-3) }
.meter button { background: none; border: 1px solid var(--ink-line); color: var(--ink-fg); border-radius: var(--r-chip); padding: 5px 8px; font-size: 12px }
.acct { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 2px }
.acct button { background: none; border: 0; color: var(--ink-fg-3); font-size: 11.5px; padding: 2px 4px; text-decoration: underline; text-underline-offset: 2px }
.topbar { background: var(--ink); color: var(--ink-fg); height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 14px; flex: none }
.topbar .ws { flex: 1; margin: 0; padding: 5px 10px; min-width: 0 }
.cpill { font-family: var(--mono); font-size: 11px; border: 1px solid var(--ink-line); border-radius: 99px; padding: 4px 9px; color: var(--ink-fg); white-space: nowrap; background: var(--ink-2) }
.menu { width: 40px; height: 40px; border-radius: var(--r-ctl); border: 1px solid var(--ink-line); background: none; color: var(--ink-fg); display: grid; place-items: center }
.sheet { position: absolute; inset: 56px 0 auto; background: var(--ink); z-index: 40; padding: 8px 12px 16px; display: flex; flex-direction: column; gap: 2px; border-bottom: 1px solid var(--ink-line) }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 14px; border-radius: var(--r-btn); border: 1px solid var(--line-strong); background: var(--card); font-weight: 600; font-size: 13px; color: var(--fg); white-space: nowrap }
.btn:hover { background: var(--card-2) }
.btn.lime { background: var(--brand); border-color: var(--brand-edge) }
.btn.lime:hover { background: var(--brand-hover) }
.btn.ghost { border-color: transparent; background: none; color: var(--fg-2) }
.btn.ink { background: var(--fg); border-color: var(--fg); color: var(--card) }
.btn:disabled { opacity: .45; cursor: not-allowed }
.btn.sm { min-height: 34px; padding: 6px 10px; font-size: 12px; border-radius: var(--r-ctl) }
.pill { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 11px; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--line); background: var(--card-2); color: var(--fg-2); white-space: nowrap }
.pill.ok { background: var(--ok-bg); border-color: transparent; color: var(--ok) }
.pill.warn { background: var(--warn-bg); border-color: var(--warn-edge); color: var(--warn) }
.pill.info { background: var(--info-bg); border-color: var(--info-edge); color: var(--info) }
.pill.lime { background: var(--brand-soft); border-color: var(--brand-edge); color: var(--brand-ink) }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; display: flex; flex-direction: column; gap: 10px }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.between { justify-content: space-between }
.ink-box { background: var(--ink); color: var(--ink-fg); border-radius: var(--r-card); padding: 14px 16px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center }
.ink-box p { color: var(--ink-fg-2); font-size: 13px }
.ink-box .segs { display: flex; gap: 4px } .ink-box .segs i { width: 22px; height: 6px; border-radius: 3px; background: var(--brand) } .ink-box .segs i.used { background: var(--ink-3) }

/* brain */
.brain-stage { background: var(--ink); border-radius: var(--r-panel); height: 440px; position: relative; overflow: hidden }
.brain-stage svg { width: 100%; height: 100%; display: block }
.brain-legend { position: absolute; left: 14px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px }
.brain-legend span { font-family: var(--mono); font-size: 10.5px; color: var(--ink-fg-2); border: 1px solid var(--ink-line); border-radius: 99px; padding: 2px 8px; background: var(--ink-2) }
.blist { display: grid; gap: 6px }
.bitem { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); background: var(--card); border-radius: var(--r-ctl); font-size: 13px }
.bitem.miss { border-style: dashed; color: var(--warn) }
.prog { height: 6px; border-radius: 4px; background: var(--line-soft); overflow: hidden } .prog i { display: block; height: 100%; background: var(--fg) }

/* templates */
.search { flex: 1 1 220px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); background: var(--field); border-radius: var(--r-ctl); padding: 0 12px; min-height: 40px; color: var(--fg-3); max-width: 380px }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-ctl); overflow: hidden; background: var(--card) }
.seg button { border: 0; background: none; padding: 0 14px; min-height: 38px; font-size: 13px; font-weight: 600; color: var(--fg-2) }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--card) }
.pinned { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; border: 1px solid var(--brand-edge); background: var(--brand-soft); border-radius: var(--r-ctl); padding: 10px 12px; font-size: 13px }
.pinned .th { width: 30px; aspect-ratio: 9/16; border-radius: 5px; background: var(--th-clay) }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px }
.ph .grid { grid-template-columns: 1fr 1fr; gap: 10px }
.tcard { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); padding: 7px; display: flex; flex-direction: column; gap: 8px; min-width: 0 }
.tcard.on { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg) }
.tcard.off .thumb { opacity: .6; filter: saturate(.3) }
.thumb { position: relative; aspect-ratio: 9/16; border-radius: 10px; overflow: hidden; background: var(--th-sky); max-width: 100% }
.thumb .cap { position: absolute; left: 10%; right: 10%; top: 14%; background: var(--th-white); color: var(--fg); font-weight: 800; font-size: 11px; padding: 4px 6px; border-radius: 4px; text-align: center; line-height: 1.15 }
.thumb .fig { position: absolute; left: 28%; right: 28%; bottom: 0; height: 52%; border-radius: 40% 40% 0 0; background: rgba(21,23,26,.28) }
.thumb .tag { position: absolute; left: 6px; top: 6px; font-family: var(--mono); font-size: 9.5px; padding: 1px 5px; border-radius: 4px; background: rgba(22,24,27,.72); color: var(--ink-fg) }
.chk { position: absolute; right: 6px; bottom: 6px; width: 34px; height: 34px; border-radius: 8px; background: rgba(22,24,27,.72); display: grid; place-items: center; border: 0 }
.chk i { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--ink-fg-2); display: grid; place-items: center; color: var(--fg); font-style: normal; font-size: 12px; font-weight: 800 }
.chk[aria-checked="true"] i { background: var(--brand); border-color: var(--brand) }
.chk:disabled { opacity: .45; cursor: not-allowed }
.tcard .meta { display: flex; flex-direction: column; gap: 5px; padding: 0 3px 3px }
.tcard .meta .row { gap: 6px; flex-wrap: nowrap; justify-content: space-between }
.tcard .meta b { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.tcard .meta p { font-size: 12px; color: var(--fg-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.9em }
.selbar { position: absolute; left: 50%; transform: translateX(-50%); bottom: 14px; width: min(720px, calc(100% - 24px)); z-index: 20; background: var(--card); border: 1px solid var(--line-strong); border-radius: var(--r-panel); box-shadow: 0 12px 34px rgba(21,23,26,.18); padding: 10px 10px 10px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; font-size: 13px }
.desk .selbar { left: calc(50% + 119px) }
.ph .selbar { bottom: 12px; padding: 10px }
.ph .selbar .acts { width: 100%; display: flex; gap: 8px } .ph .selbar .acts .btn { flex: 1 }

/* ad step */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none }
.tabs button { border: 0; background: none; padding: 10px 12px; font-weight: 600; color: var(--fg-3); border-bottom: 2px solid transparent; white-space: nowrap; min-height: 44px }
.tabs button[aria-selected="true"] { color: var(--fg); border-color: var(--fg) }
.adrow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); background: var(--card); border-radius: var(--r-ctl); text-align: left; width: 100% }
.adrow.on { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg) }
.adrow .th { aspect-ratio: 9/16; border-radius: 5px; background: var(--th-sage) }
.adrow small { color: var(--fg-3); font-size: 12px }
.drop { border: 1.5px dashed var(--line-strong); border-radius: var(--r-card); padding: 28px 16px; display: grid; justify-items: center; gap: 8px; text-align: center; color: var(--fg-2); background: var(--card) }

/* plan / gen / result */
.layout2 { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start }
.ph .layout2 { grid-template-columns: minmax(0, 1fr) }
.pline { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--card) }
.pline .thumb { border-radius: 6px }
.field { display: grid; gap: 4px; font-size: 12px; color: var(--fg-3) }
.field input { border: 1px solid var(--line-strong); background: var(--field); border-radius: var(--r-chip); padding: 7px 9px; font-size: 13px; color: var(--fg); width: 100%; min-width: 0 }
.cost dl { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; margin: 0; font-size: 13px }
.cost dt { color: var(--fg-3) } .cost dd { margin: 0; text-align: right; font-weight: 600 }
.gen { position: relative; border-radius: var(--r-card); padding: 1.5px; background: var(--line); overflow: hidden }
.gen.run::before { content: ""; position: absolute; inset: -60%; background: conic-gradient(from 0deg, transparent 0 70%, var(--brand-edge) 82%, transparent 92%); animation: beam 2.4s linear infinite }
.gen > .in { position: relative; background: var(--card); border-radius: calc(var(--r-card) - 1.5px); padding: 16px; display: grid; gap: 12px }
@keyframes beam { to { transform: rotate(360deg) } }
.steprow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: 13px; align-items: center }
.steprow .prog { grid-column: 1 / -1 }
.pieces { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px }
.ph .pieces { grid-template-columns: 1fr 1fr; gap: 10px }
.piece { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); padding: 7px; display: grid; gap: 7px }
.piece.on { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg) }
.blur { position: absolute; left: 0; right: 0; bottom: 0; top: 32%; backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px); background: rgba(253,253,251,.18); display: grid; place-items: center }
.blur span { font-family: var(--mono); font-size: 10px; background: rgba(22,24,27,.78); color: var(--ink-fg); padding: 3px 7px; border-radius: 5px; text-align: center }
.sharp { position: absolute; left: 6px; right: 6px; top: calc(32% - 18px); font-family: var(--mono); font-size: 9.5px; color: var(--ink-fg); display: flex; justify-content: space-between }
.sharp i { font-style: normal; background: rgba(22,24,27,.72); padding: 1px 4px; border-radius: 3px }

/* modal */
.scrim { position: absolute; inset: 0; background: rgba(22,24,27,.45); z-index: 50; display: grid; place-items: center; padding: 16px }
.ph .scrim { place-items: end center; padding: 8px }
.modal { background: var(--card); border-radius: var(--r-panel); width: min(520px, 100%); padding: 20px; display: grid; gap: 14px; box-shadow: 0 18px 50px rgba(21,23,26,.28) }
.modal select { border: 1px solid var(--line-strong); background: var(--field); border-radius: var(--r-ctl); padding: 9px 10px; width: 100% }
.sendacts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; padding-top: 6px; border-top: 1px solid var(--line) }
.ph .sendacts .btn { flex: 1 1 100% }
.toast { position: absolute; left: 50%; transform: translateX(-50%); bottom: 18px; z-index: 70; background: var(--ink); color: var(--ink-fg); border-radius: var(--r-btn); padding: 10px 14px; font-size: 13px; box-shadow: 0 10px 30px rgba(21,23,26,.3); white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis }

/* eddy end of onboarding */
.chat { max-width: 560px; margin: 30px auto; display: grid; gap: 12px }
.bub { background: var(--card); border: 1px solid var(--line); border-radius: 16px 16px 16px 4px; padding: 12px 14px; font-size: 14px }
.bub.me { justify-self: end; background: var(--ink); color: var(--ink-fg); border-color: var(--ink); border-radius: 16px 16px 4px 16px }
.who { display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 13px }
.who i { width: 22px; height: 22px; border-radius: 50%; background: var(--brand); border: 1px solid var(--brand-edge) }

/* tour */
.lock { position: absolute; inset: 0; z-index: 59 }
.spot { position: absolute; z-index: 60; border-radius: 14px; box-shadow: 0 0 0 9999px var(--overlay), 0 0 0 2px var(--brand); pointer-events: none; transition: top .3s cubic-bezier(.2,.7,.2,1), left .3s cubic-bezier(.2,.7,.2,1), width .3s cubic-bezier(.2,.7,.2,1), height .3s cubic-bezier(.2,.7,.2,1) }
.coach { position: absolute; z-index: 61; width: 340px; max-width: calc(100% - 32px); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 9px; box-shadow: 0 18px 50px rgba(21,23,26,.28); animation: up .2s ease-out }
.coach h3 { font-size: 17px; font-weight: 800; font-stretch: 112% }
.coach p { color: var(--fg-2); font-size: 13.5px }
.coach .dots { display: flex; gap: 4px } .coach .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong) } .coach .dots i.on { background: var(--fg) }
.coach .acts { display: flex; gap: 8px; align-items: center; padding-top: 2px }
.coach .skip { margin-right: auto; border: 0; background: none; color: var(--fg-3); font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px; padding: 6px 2px; min-height: 36px }

/* event log */

/* ---------------- events ---------------- */
function ev(name, extra = {}, mile = false) {
  const variant = `meta:${S.meta !== "none"} winner:${S.meta === "winner"} sample:${S.plan === "sample"}`;
  S.events.unshift({ name, extra, mile, at: ((Date.now() - S.t0) / 1000).toFixed(1), variant });
  if (S.events.length > 60) S.events.pop();
  renderLog();
}
function renderLog() {
  const ms = S.mile;
  document.getElementById("kpi").innerHTML = [
    ["firstBatchAt", ms.batch], ["firstGenerateAt", ms.gen], ["firstReadyAt", ms.ready], ["firstSendAt", ms.send]
  ].map(([k, v]) => `<span>${k}</span><b>${v ? "+" + v + " s" : "—"}</b>`).join("");
  document.getElementById("log").innerHTML = S.events.map((e) =>
    `<li class="${e.mile ? "mile" : ""}"><b>${esc(e.name)}</b> ${esc(Object.entries(e.extra).map(([k, v]) => k + ":" + v).join(" "))}<br><span class="muted">+${e.at}s · ${esc(e.variant)}</span></li>`).join("");
}
function milestone(k, name) { if (!S.mile[k]) { S.mile[k] = ((Date.now() - S.t0) / 1000).toFixed(0); ev(name, {}, true) } }

/* ---------------- tour model ---------------- */
const phone = () => S.view === "ph";
function stops() { return S.role === "client" ? ["brain", "review"] : ["brain", "templates", "credits"] }
const ROUTE = { brain: "brain", templates: "templates", credits: "templates", review: "review" };
function target(stop) {
  return { brain: phone() ? "#t-brain-summary" : "#t-brain", templates: "#t-templates-grid", credits: "#t-credits", review: "#t-review-list" }[stop];
}
function copy(stop) {
  if (stop === "brain") return [t("brainT", { name: NAME }), t("brainB")];
  if (stop === "templates") return [t("tplT"), S.plan === "sample" ? t("tplBS") : S.meta === "winner" ? t("tplBW", { ad: WIN.name }) : t("tplB")];
  if (stop === "credits") return S.plan === "sample" ? [t("crTS"), t("crBS")] : [t("crT"), t("crB")];
  if (stop === "review") return [t("revT", { name: NAME }), t("revB", { name: NAME })];
}
function startTour(replay) {
  S.tour = { i: 0, replay }; S.sheet = false; S.send = false; S.stopAt = Date.now();
  ev("tour_started", { source: replay ? "replay" : "onboarding" });
  goStop();
}
function goStop() {
  const st = stops()[S.tour.i];
  S.screen = ROUTE[st]; S.stopAt = Date.now();
  render();
  ev("tour_stop_viewed", { stop: st, n: S.tour.i + 1, total: stops().length });
}
function tourNext() {
  const st = stops()[S.tour.i];
  ev("tour_stop_next", { stop: st, msOnStop: Date.now() - S.stopAt });
  if (S.tour.i >= stops().length - 1) { ev("tour_completed", { msTotal: Date.now() - S.t0 }); S.tour = null; render(); focusFirst(); return }
  S.tour.i++; goStop();
}
function tourBack() { ev("tour_stop_back", { stop: stops()[S.tour.i] }); S.tour.i--; goStop() }
function tourSkip() { ev("tour_skipped", { stop: stops()[S.tour.i], n: S.tour.i + 1 }); S.tour = null; render() }
function focusFirst() { setTimeout(() => document.querySelector("#device .chk:not(:disabled)")?.focus(), 50) }

/* ---------------- tips ---------------- */
function currentTip() {
  if (S.tour || S.role === "client") return null;
  let key = null;
  if (S.send) key = "send";
  else if (S.screen === "ad") key = "adSource";
  else if (S.screen === "plan") key = "plan";
  else if (S.screen === "result") key = "result";
  if (!key || S.tips.has(key)) return null;
  const noMeta = S.meta === "none", sample = S.plan === "sample";
  const m = {
    adSource: { sel: "#t-ad-source", v: noMeta ? "noMeta" : "default", h: noMeta ? t("adTN") : t("adT"), b: noMeta ? t("adBN") : t("adB") },
    plan: { sel: "#t-plan", beacon: "#t-generate", v: sample ? "sample" : "paid", h: t("planT"), b: t("planB") },
    result: sample ? { sel: "#t-pieces", v: "sample", h: t("resTS"), b: t("resBS"), a: t("resAS"), act: "plans" }
      : noMeta ? { sel: "#t-pieces", v: "paidNoMeta", h: t("resT"), b: t("resBN"), a: t("resAN"), act: "connect_meta" }
      : { sel: "#t-pieces", beacon: "#t-send", v: "paid", h: t("resT"), b: t("resB") },
    send: { sel: "#t-send-review", v: "default", h: t("sendT"), b: t("sendB") }
  }[key];
  return { key, ...m };
}
let shownTip = null;

/* ---------------- screens ---------------- */
function thumb(tp, extra = "") {
  return `<div class="thumb" style="background:var(${tp.c})"><span class="tag">${esc(tp.tag)}</span><span class="cap">${esc(tp.cap)}</span><span class="fig"></span>${extra}</div>`;
}
function scrEddy() {
  const w = S.meta === "winner";
  return `<div class="view"><div class="chat">
    <div class="bub me">${t("meDone")}</div>
    <div class="who"><i></i>Eddy</div>
    <div class="bub">${esc(t("eddyHi", { name: NAME }))}</div>
    <div class="bub">${esc(w ? t("eddyWin", { ad: WIN.name, cpa: WIN.cpa, avg: WIN.avg }) : S.meta === "nowin" ? t("eddyHi", { name: NAME }).split(".")[0] + "." : t("eddyNoWin"))}</div>
    <div class="row"><button class="btn lime" data-a="start">${t("start")} →</button></div>
    <p class="muted" style="font-size:12px">${S.lang === "en" ? "One button only. It opens the Brain and the tour starts; the tour ends inside Templates." : "Um botão só. Abre o Cérebro e o tour começa; o tour termina dentro de Templates."}</p>
  </div></div>`;
}
function brainSvg() {
  const pts = []; let s = 7;
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;

}

/* ---------------- placement ---------------- */
function rel(el, d) { const r = el.getBoundingClientRect(), b = d.getBoundingClientRect(); return { top: r.top - b.top, left: r.left - b.left, w: r.width, h: r.height, bottom: r.bottom - b.top } }
let placing = false;
function place() {
  const d = document.getElementById("device"); if (!d) return;
  const dw = d.clientWidth, dh = d.clientHeight, sc = document.getElementById("scroll");
  if (S.tour) {
    const sel = target(stops()[S.tour.i]); const el = d.querySelector(sel);
    const spot = document.getElementById("spot"), coach = document.getElementById("coach");
    if (!el) { ev("tour_stop_missing", { stop: stops()[S.tour.i], target: sel }); return }
    if (sc && sc.contains(el) && !placing) {
      const r = rel(el, d), sr = rel(sc, d);
      if (r.top < sr.top + 20 || r.top > sr.top + 120) { placing = true; sc.scrollTop += r.top - sr.top - 70; placing = false }
    }
    const r = rel(el, d);
    const maxH = Math.max(120, dh - (phone() ? 300 : 160));
    const sp = { top: r.top - 8, left: r.left - 8, w: r.w + 16, h: Math.min(r.h + 16, maxH) };
    Object.assign(spot.style, { top: sp.top + "px", left: sp.left + "px", width: sp.w + "px", height: sp.h + "px" });
    if (phone()) coach.style.width = (dw - 32) + "px";
    const ch = coach.offsetHeight, cw = coach.offsetWidth;
    let top, left;
    if (phone()) { left = 16; top = sp.top + sp.h + 14; if (top + ch > dh - 16) top = dh - ch - 16 }
    else if (sp.left + sp.w + 16 + cw <= dw - 16) { left = sp.left + sp.w + 16; top = Math.max(16, Math.min(sp.top, dh - ch - 16)) }
    else { left = Math.min(Math.max(16, sp.left), dw - cw - 16); top = sp.top + sp.h + 14; if (top + ch > dh - 16) top = Math.max(16, dh - ch - 16) }
    Object.assign(coach.style, { top: top + "px", left: left + "px" });
  }
  const tipEl = document.getElementById("tip");
  if (tipEl) {
    const tip = currentTip(); const el = tip && d.querySelector(tip.sel); if (!el) return;
    const r = rel(el, d); const bel = d.querySelector(tip.beacon || tip.sel); const br = bel ? rel(bel, d) : r;
    const bc = document.getElementById("beacon");
    Object.assign(bc.style, { top: (br.top - 5) + "px", left: (br.left + br.w - 7) + "px" });
    const th = tipEl.offsetHeight, tw = tipEl.offsetWidth;
    if (phone()) {
      const bar = d.querySelector(".selbar"); const off = bar ? bar.offsetHeight + 24 : 16;
      Object.assign(tipEl.style, { left: "12px", width: (dw - 24) + "px", top: (dh - th - off) + "px" });
    } else {
      let top = r.top + 12, left = r.left + r.w + 14;
      if (left + tw > dw - 12) { left = Math.min(Math.max(12, r.left + r.w - tw), dw - tw - 12); top = r.bottom + 12; if (top + th > dh - 12) top = Math.max(12, r.top - th - 12) }
      top = Math.max(12, Math.min(top, dh - th - 12));
      Object.assign(tipEl.style, { top: top + "px", left: left + "px" });
    }
  }
}
window.addEventListener("resize", () => { autoView(); place() });

/* ---------------- actions ---------------- */
function toast(m) { S.toast = m; render(); clearTimeout(toast.h); toast.h = setTimeout(() => { S.toast = null; render() }, 2600) }
function nav(k) {
  S.sheet = false; S.send = false;
  if (["campaigns", "eddy", "concepts"].includes(k)) return toast(S.lang === "en" ? "Outside the tour; not in this mockup" : "Fora do tour; não está neste mockup");
  if (S.role === "client" && k === "templates") k = "review";
  S.screen = k; render();
}
function toPlan() { milestone("batch", "first_batch_created"); S.screen = "plan"; render() }
function generate() {
  milestone("gen", "first_generate"); S.screen = "gen"; S.gen = 0; render();
  clearInterval(S.genTimer);
  S.genTimer = setInterval(() => {
    S.gen += 7;
    if (S.gen >= 140) { clearInterval(S.genTimer); milestone("ready", "first_ready"); if (S.screen === "gen") { S.screen = "result" } render(); return }
    if (S.screen === "gen") render();
  }, 350);
}
document.getElementById("device").addEventListener("click", (e) => {
  const b = e.target.closest("[data-a]"); if (!b || b.disabled) return;
  const a = b.dataset.a, s = b.dataset.s;
  if (S.tour && !["tnext", "tback", "tskip"].includes(a)) return;
  switch (a) {
    case "start": startTour(false); break;
    case "tnext": tourNext(); break;
    case "tback": tourBack(); break;
    case "tskip": tourSkip(); break;
    case "nav": nav(s); break;
    case "sheet": S.sheet = !S.sheet; render(); break;
    case "pick": S.picked = S.picked.includes(s) ? S.picked.filter((x) => x !== s) : [...S.picked, s]; render(); break;
    case "clearsel": S.picked = []; render(); break;
    case "use": S.picked = [s]; /* falls through */
    case "continue": S.adPick = null; S.adTab = null; if (S.meta === "winner") { S.adPick = "m0"; toPlan() } else { S.screen = "ad"; render() } break;
    case "adtab": S.adTab = s; S.adPick = null; render(); break;
    case "adpick": S.adPick = s; render(); break;
    case "toplan": toPlan(); break;
    case "generate": generate(); break;
    case "piece": S.chosenPieces.has(s) ? S.chosenPieces.delete(s) : S.chosenPieces.add(s); render(); break;
    case "opensend": S.send = true; render(); break;
    case "closesend": S.send = false; render(); break;
    case "dosend": S.send = false; milestone("send", "first_send"); toast(s === "review" ? t("reviewOpen") : t("sent", { n: S.chosenPieces.size })); break;
    case "tipok": { const tp = currentTip(); S.tips.add(tp.key); ev("tip_dismissed", { tip: tp.key, how: "got_it" }); render(); break }
    case "tipact": { const tp = currentTip(); S.tips.add(tp.key); ev("tip_action", { tip: tp.key, action: tp.act }); toast(tp.a); break }
    case "replay": S.sheet = false; startTour(true); break;
    case "resettips": S.tips.clear(); S.sheet = false; ev("tips_reset"); toast(t("tipsReset")); break;
    case "toast": toast(b.dataset.m); break;
  }
});
document.getElementById("device").addEventListener("keydown", (e) => {
  if (!S.tour) return;
  if (e.key === "Escape") { if (S.tour.replay) tourSkip(); e.preventDefault() }
});

/* ---------------- prototype bar ---------------- */
function autoView() {
  const forced = window.innerWidth < 800;
  const sel = document.getElementById("p-view");
  if (forced && S.view !== "ph") { S.view = "ph"; sel.value = "ph"; render() }
  sel.disabled = forced;
}
const bind = (id, k) => document.getElementById(id).addEventListener("change", (e) => {
  S[k] = e.target.value;
  if (k === "plan" || k === "meta") { S.picked = []; S.chosenPieces.clear(); }
  if (k === "role" && S.screen !== "eddy") { S.tour = null; S.screen = e.target.value === "client" ? "review" : "templates" }
  render();
});
[["p-view", "view"], ["p-meta", "meta"], ["p-plan", "plan"], ["p-role", "role"], ["p-lang", "lang"]].forEach(([i, k]) => bind(i, k));
document.getElementById("p-restart").addEventListener("click", () => {
  clearInterval(S.genTimer);
  Object.assign(S, { screen: "eddy", tour: null, tips: new Set(), picked: [], adPick: null, adTab: null, send: false, sheet: false, chosenPieces: new Set(), events: [], mile: {}, t0: Date.now() });
  render(); renderLog();
});
autoView(); render(); renderLog();
</script>
