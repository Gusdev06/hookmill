<title>HookMill Templates</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: HookMill app shell (ink sidebar + light main). Templates = gallery of 9:16 example videos; using one = Template → Ad → Plan → Generate → Download, with a sticky action bar.
   Single light theme on purpose (same as the product, web/src/app/globals.css). Lime = the one action per screen, never a status. */
:root {
  --bg: #eeeeea; --card: #fdfdfb; --card-2: #f3f4f0; --field: #ffffff;
  --line: #dcddd7; --line-soft: #e4e5e0; --line-strong: #cfd1cb;
  --fg: #15171a; --fg-2: #3b4047; --fg-3: #5a6068;
  --brand: #c8f03c; --brand-hover: #bde52f; --brand-ink: #3e5200; --brand-soft: #f0f8d2; --brand-edge: #a9cc2a;
  --ink: #16181b; --ink-2: #202328; --ink-3: #2a2e33; --ink-line: #2e3238; --ink-fg: #f2f3ee; --ink-fg-2: #c5cad0; --ink-fg-3: #9aa1a9;
  --ok-bg: #e2f3e8; --ok: #0b6b43; --ok-dot: #1c9a5e;
  --warn-bg: #fbf0d3; --warn: #7a5000; --warn-edge: #e9c76b;
  --bad-bg: #fbe7dd; --bad: #a8360c; --bad-edge: #e4b9a6;
  --info-bg: #e6ebfc; --info: #2b4bc8; --info-edge: #c3cef6; --info-on-ink: #8fa6ff;
  /* drawn example videos (placeholders) */
  --th-sky: #8fb3c9; --th-sand: #d8c3a0; --th-sage: #9fb89a; --th-dusk: #6f6a8f; --th-clay: #c08a6a;
  --th-skin: #c99b7c; --th-skin-2: #8d5f45; --th-hair: #3a2b22; --th-shirt: #3b4047;
  --th-red: #d83a2a; --th-pink: #f2a7c3; --th-chat: #e9e9ef; --th-chat-b: #3d6cf0; --th-white: #ffffff;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r-chip: 8px; --r-ctl: 10px; --r-btn: 12px; --r-card: 16px; --r-panel: 18px;
  color-scheme: light;
}
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--display); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px }
h1, h2, h3 { margin: 0; text-wrap: balance }
h1 { font-size: 30px; line-height: 1.1; font-weight: 800; font-stretch: 125%; letter-spacing: -0.015em }
h2 { font-size: 16px; font-weight: 700 }
h3 { font-size: 14px; font-weight: 700 }
p { margin: 0 }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3) }
.num { font-variant-numeric: tabular-nums }
.muted { color: var(--fg-3) }

/* shell */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh }
.side { background: var(--ink); color: var(--ink-fg-2); padding: 18px 12px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; overflow-y: auto }
.logo { font-weight: 800; font-stretch: 112%; font-size: 17px; color: var(--ink-fg); padding: 4px 10px 14px; display: flex; gap: 8px; align-items: center }
.logo i { width: 18px; height: 18px; border-radius: 5px; background: var(--brand); border: 1px solid var(--brand-edge) }
.ws { margin: 0 4px 12px; padding: 8px 10px; border: 1px solid var(--ink-line); border-radius: var(--r-ctl); font-size: 13px; color: var(--ink-fg); display: flex; justify-content: space-between }
.grp { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-fg-3); padding: 14px 10px 6px }
.nav { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--r-chip); border: 0; background: none; text-align: left; color: var(--ink-fg-2); min-height: 36px; width: 100% }
.nav:hover { background: var(--ink-3) }
.nav.on { background: var(--ink-3); color: var(--ink-fg); font-weight: 600 }
.nav .new { margin-left: auto; font-family: var(--mono); font-size: 9px; padding: 1px 5px; border-radius: 4px; background: var(--brand); color: var(--fg) }
.side .foot { margin-top: auto; display: grid; gap: 8px; padding-top: 14px }
.meter { border: 1px solid var(--ink-line); border-radius: var(--r-ctl); padding: 10px; display: grid; gap: 6px; font-size: 12px }
.meter b { color: var(--ink-fg); font-size: 18px; font-weight: 800; font-stretch: 112% }
.meter .bar { height: 4px; background: var(--ink-3); border-radius: 4px; overflow: hidden }
.meter .bar i { display: block; height: 100%; background: var(--ink-fg-2) }
.meter button { background: none; border: 1px solid var(--ink-line); color: var(--ink-fg); border-radius: var(--r-chip); padding: 6px 8px; font-size: 12px }
.topbar { display: none }

.main { min-width: 0; display: flex; flex-direction: column }
.proto { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--warn-bg); border-bottom: 1px solid var(--warn-edge); font-size: 12px; color: var(--warn) }
.proto b { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase }
.proto label { display: inline-flex; gap: 6px; align-items: center }
.proto select { border: 1px solid var(--warn-edge); background: var(--card); border-radius: var(--r-chip); padding: 4px 6px; font-size: 12px; max-width: 200px }
.view { padding-block: 24px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; width: 100%; max-width: 1240px }

/* buttons, chips */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 14px; border-radius: var(--r-btn); border: 1px solid var(--line-strong); background: var(--card); font-weight: 600; font-size: 13px; color: var(--fg); white-space: nowrap }
.btn:hover { background: var(--card-2) }
.btn.lime { background: var(--brand); border-color: var(--brand-edge); color: var(--fg) }
.btn.lime:hover { background: var(--brand-hover) }
.btn.ghost { border-color: transparent; background: none; color: var(--fg-2) }
.btn.ink { background: var(--fg); border-color: var(--fg); color: var(--card) }
.btn:disabled { opacity: .45; cursor: not-allowed }
.btn.sm { min-height: 34px; padding: 6px 10px; font-size: 12px; border-radius: var(--r-ctl) }
.pill { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 11px; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--line); background: var(--card-2); color: var(--fg-2); white-space: nowrap }
.pill.cr { background: var(--card); border-color: var(--line-strong); color: var(--fg) }
.pill.ai { background: var(--ink); border-color: var(--ink); color: var(--ink-fg) }
.pill.ok { background: var(--ok-bg); border-color: transparent; color: var(--ok) }
.pill.warn { background: var(--warn-bg); border-color: var(--warn-edge); color: var(--warn) }
.pill.bad { background: var(--bad-bg); border-color: var(--bad-edge); color: var(--bad) }
.pill.info { background: var(--info-bg); border-color: var(--info-edge); color: var(--info) }
.pill.beta { border-style: dashed }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--fg-3) }
.dot.prog { background: var(--info); box-shadow: 0 0 0 3px var(--info-bg); animation: pulse 1.6s ease-in-out infinite }
.dot.okd { background: var(--ok-dot) }

/* library header */
.lhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap }
.lhead .t { display: grid; gap: 6px; min-width: 0 }
.lhead .t p { color: var(--fg-2); max-width: 62ch }
.bal { display: flex; gap: 8px; align-items: center }
.bal .n { display: grid; text-align: right; font-size: 12px; color: var(--fg-3) }
.bal .n b { font-size: 20px; font-weight: 800; font-stretch: 112%; color: var(--fg); line-height: 1 }
.sample { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--ink); color: var(--ink-fg); border-radius: var(--r-card); padding: 14px 16px }
.sample p { color: var(--ink-fg-2); font-size: 13px }
.sample .ticks { display: flex; gap: 4px }
.sample .ticks i { width: 22px; height: 6px; border-radius: 3px; background: var(--brand) }
.sample .ticks i.used { background: var(--ink-3) }
.tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.search { flex: 1 1 260px; display: flex; align-items: center; gap: 8px; background: var(--field); border: 1px solid var(--line-strong); border-radius: var(--r-ctl); padding: 0 12px; min-height: 40px; max-width: 420px }
.search input { border: 0; outline: 0; background: none; flex: 1; min-width: 0; font-size: 14px }
.search:focus-within { outline: 2px solid var(--info); outline-offset: 1px }
.tabs { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-ctl); overflow: hidden; background: var(--card) }
.tabs button { border: 0; background: none; padding: 8px 14px; font-weight: 600; font-size: 13px; color: var(--fg-2); min-height: 38px }
.tabs button[aria-pressed="true"] { background: var(--fg); color: var(--card) }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px }
.chips::-webkit-scrollbar { display: none }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 6px 12px; font-size: 13px; color: var(--fg-2); white-space: nowrap; min-height: 34px }
.chip[aria-pressed="true"] { border-color: var(--fg); color: var(--fg); font-weight: 600; box-shadow: inset 0 0 0 1px var(--fg) }
.chip small { font-family: var(--mono); font-size: 10px; color: var(--fg-3); margin-left: 4px }
.sect { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 4px; flex-wrap: wrap }
.sect .eyebrow b { color: var(--fg) }

/* grid of templates */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px }
.tcard { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); padding: 8px; display: flex; flex-direction: column; gap: 10px; min-width: 0; text-align: left; cursor: pointer }
.tcard:hover { border-color: var(--line-strong) }
.tcard:hover .vid .play { opacity: 1 }
.tcard .body { display: grid; gap: 6px; padding: 0 4px 2px; min-width: 0 }
.tcard .nm { display: flex; justify-content: space-between; gap: 8px; align-items: center }
.tcard .nm b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tcard .ds { font-size: 12.5px; color: var(--fg-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; min-height: 3.9em }
.tcard .ft { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 0 4px 4px }
.tcard .ft .u { font-size: 11px; color: var(--fg-3); font-family: var(--mono) }
.tcard.off { cursor: default }
.tcard.off .vid { filter: saturate(.3); opacity: .7 }
.tcard.nofit .vid::after { content: ""; position: absolute; inset: 0; background: rgba(238, 238, 234, .55) }
.fit { font-size: 11.5px; display: flex; gap: 5px; align-items: center }
.fit.y { color: var(--ok) } .fit.n { color: var(--warn) }

/* the auto pack card */
.pack { grid-column: span 2; background: var(--ink); color: var(--ink-fg); border-color: var(--ink); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 14px; padding: 14px }
.pack .stack { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; align-content: start }
.pack .stack .vid { border-radius: 8px }
.pack .txt { display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.pack .txt p { color: var(--ink-fg-2); font-size: 13px }
.pack .txt ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 12.5px; color: var(--ink-fg-2) }
.pack .txt li { display: flex; gap: 8px }
.pack .txt li::before { content: ""; width: 6px; height: 6px; border-radius: 2px; background: var(--brand); margin-top: 6px; flex: none }
.pack .pill { background: var(--ink-3); border-color: var(--ink-line); color: var(--ink-fg) }
.pack .btn { margin-top: auto; align-self: flex-start; background: var(--ink-2); border-color: var(--ink-line); color: var(--ink-fg) }

/* drawn example video */
.vid { position: relative; aspect-ratio: 9 / 16; width: 100%; max-width: 100%; border-radius: 10px; overflow: hidden; background: var(--th-sky); isolation: isolate }
.vid .ph { position: absolute; top: 7px; left: 7px; z-index: 5; font-family: var(--mono); font-size: 8.5px; letter-spacing: .06em; background: rgba(22, 24, 27, .78); color: var(--ink-fg); padding: 2px 5px; border-radius: 4px }
.vid .asp { position: absolute; top: 7px; right: 7px; z-index: 5; font-family: var(--mono); font-size: 9px; background: rgba(255, 255, 255, .88); color: var(--fg); padding: 2px 5px; border-radius: 4px }
.vid .play { position: absolute; z-index: 6; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(22, 24, 27, .62); display: grid; place-items: center; opacity: .0; transition: opacity .15s }
.vid .play::after { content: ""; border-left: 13px solid var(--th-white); border-top: 8px solid transparent; border-bottom: 8px solid transparent; margin-left: 3px }
.vid .prog { position: absolute; z-index: 5; left: 7px; right: 7px; bottom: 7px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .3); overflow: hidden }
.vid .prog i { display: block; height: 100%; background: var(--th-white); transform-origin: left; animation: tick 9s linear infinite }
.sc { position: absolute; inset: 0; background: linear-gradient(180deg, var(--th-sky), var(--th-sand)) }
.sc.b { background: linear-gradient(180deg, var(--th-sage), var(--th-sand)) }
.sc.c { background: linear-gradient(180deg, var(--th-dusk), var(--th-clay)) }
.pp { position: absolute; left: 50%; bottom: 0; width: 62%; aspect-ratio: 3 / 4; transform: translateX(-50%) }
.pp i { position: absolute; display: block }
.pp .hr { inset: 0 12% 60%; border-radius: 50% 50% 22% 22%; background: var(--th-hair) }
.pp .h { inset: 8% 18% 36%; border-radius: 48% 48% 44% 44%; background: var(--th-skin) }
.pp .bd { left: 0; right: 0; bottom: 0; height: 36%; border-radius: 40% 40% 0 0; background: var(--th-shirt) }
.pp.alt .h { background: var(--th-skin-2) } .pp.alt .hr { inset: 2% 20% 66%; border-radius: 50% }
.cap { position: absolute; z-index: 3; left: 8%; right: 8%; bottom: 13%; text-align: center; font-weight: 800; font-size: 11px; color: var(--th-white); text-shadow: 0 1px 3px rgba(0,0,0,.7); line-height: 1.15 }
.k { position: absolute; z-index: 3; font-weight: 800; line-height: 1.12 }
.k em { font-style: normal }
.box-w { background: var(--th-white); color: var(--fg); border-radius: 6px; padding: 6px 7px; font-size: 10.5px }
.ink-box { background: var(--ink); color: var(--ink-fg) }
.bub { max-width: 80%; padding: 5px 8px; border-radius: 11px; font-size: 9.5px; line-height: 1.25; font-weight: 500 }
.bub.in { background: var(--th-chat); color: var(--fg); align-self: flex-start }
.bub.out { background: var(--th-chat-b); color: var(--th-white); align-self: flex-end }

/* step bar */
.flow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px }
.flow span { display: inline-flex; gap: 6px; align-items: center; color: var(--fg-3); padding: 4px 10px 4px 4px; border-radius: 99px; border: 1px solid var(--line) }
.flow span i { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-family: var(--mono); font-size: 10px; background: var(--card-2); color: var(--fg-3) }
.flow span.done { color: var(--fg-2); background: var(--card) } .flow span.done i { background: var(--fg); color: var(--card) }
.flow span.cur { color: var(--fg); font-weight: 600; border-color: var(--fg) } .flow span.cur i { background: var(--brand); color: var(--fg) }
.flow .sep { width: 10px; height: 1px; background: var(--line-strong); border: 0; padding: 0 }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; display: grid; gap: 12px; min-width: 0 }
.panel { background: var(--ink); color: var(--ink-fg); border-radius: var(--r-panel); padding: 18px; display: grid; gap: 14px; position: sticky; top: 16px }
.panel .eyebrow { color: var(--ink-fg-3) }
.panel .row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--ink-fg-2) }
.panel .row b { color: var(--ink-fg); font-weight: 600; text-align: right }
.panel hr { border: 0; border-top: 1px solid var(--ink-line); margin: 0; width: 100% }
.panel .total { display: flex; justify-content: space-between; align-items: baseline }
.panel .total b { font-size: 26px; font-weight: 800; font-stretch: 112%; color: var(--ink-fg) }
.panel .small { font-size: 12px; color: var(--ink-fg-3) }
.panel .after { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-fg-2) }
.panel .after b { color: var(--ink-fg) }
.panel .after.low b { color: var(--warn-edge) }

/* detail sheet */
.scrim { position: fixed; inset: 0; background: rgba(22, 24, 27, .5); z-index: 40; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.sheet { background: var(--card); border-radius: var(--r-panel); width: min(860px, 100%); max-height: calc(100vh - 32px); overflow: auto; display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 22px; padding: 20px; position: relative }
.sheet .x { position: absolute; right: 12px; top: 12px; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-size: 18px; line-height: 1 }
.sheet .info { display: flex; flex-direction: column; gap: 14px; min-width: 0; padding-top: 6px }
.kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px 12px; font-size: 13px }
.kv dt { color: var(--fg-3) } .kv dd { margin: 0 }
.needs { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 13px }
.needs li { display: flex; gap: 8px; align-items: center }
.needs li::before { content: ""; width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--fg-3); flex: none }
.sheet .act { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line) }

/* source picker */
.srcrow { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--card); text-align: left; width: 100% }
.srcrow:hover { border-color: var(--line-strong) }
.srcrow[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg) }
.srcrow .vid { border-radius: 6px }
.srcrow .vid .ph, .srcrow .vid .asp, .srcrow .vid .prog { display: none }
.srcrow .m { display: grid; gap: 3px; min-width: 0 }
.srcrow .m b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.srcrow .m span { font-size: 12px; color: var(--fg-3) }
.srcrow .r { display: grid; gap: 4px; justify-items: end; font-size: 12px }
.list { display: grid; gap: 8px }
.drop { border: 1.5px dashed var(--line-strong); border-radius: var(--r-card); padding: 28px 16px; text-align: center; display: grid; gap: 8px; justify-items: center; color: var(--fg-2); background: var(--card) }

/* waiting */
.wait { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: start }
.orb { width: 56px; height: 56px; position: relative; flex: none }
.orb i { position: absolute; inset: 0; border-radius: 50%; mix-blend-mode: multiply; animation: orb 3.2s ease-in-out infinite }
.orb i:nth-child(1) { background: radial-gradient(circle at 35% 35%, var(--fg-3) 0, rgba(90,96,104,.35) 30%, transparent 62%) }
.orb i:nth-child(2) { background: radial-gradient(circle at 65% 45%, var(--info) 0, rgba(43,75,200,.3) 30%, transparent 60%); animation-delay: -1s; animation-duration: 2.6s }
.orb i:nth-child(3) { background: radial-gradient(circle at 45% 70%, var(--brand) 0, var(--brand-edge) 30%, transparent 60%); animation-delay: -2s; animation-duration: 3.8s }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px }
.steps li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13.5px }
.steps li .ic { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line-strong) }
.steps li.done .ic { background: var(--ok-dot); border-color: var(--ok-dot) }
.steps li.run .ic { border-color: var(--info); border-top-color: transparent; animation: spin 1s linear infinite }
.steps li.todo { color: var(--fg-3) }
.steps li small { font-family: var(--mono); font-size: 11px; color: var(--fg-3) }
.bar { height: 6px; background: var(--card-2); border-radius: 6px; overflow: hidden }
.bar i { display: block; height: 100%; background: var(--info); border-radius: 6px }
.beam { position: relative }

      '<div class="field"><label for="f3">Call to action <span class="src-tag">from: Brain › CTA</span></label><input id="f3" value="Start tonight"></div>' +
      '<div class="field"><label>Clips of your creator</label><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="pill num">0:02–0:09</span><span class="pill num">0:14–0:22</span><span class="pill num">0:30–0:38</span></div></div>' +
      '<p class="muted" style="font-size:12.5px">Edits here are free. Every word comes from your ad or your Brain; we never invent numbers or testimonials.</p></div></div></div>' +
      costPanel(t) + '</div>';
    h += abar(S.state === 'sample' ? '<b>Free sample</b> · ' + (S.sampleLeft - 1) + ' left after this' : '<b>' + crLabel(t) + '</b> · balance ' + credits(),
      '<button class="btn ghost" type="button" data-go="source">Back</button>' + (incompat && S.state !== 'sample' ? '<button class="btn lime" type="button" data-go="source" data-srcTab="upload">Upload without captions</button>' : genBtn(t)));
    return h;
  }
  function vPlanAI() {
    var t = byId(S.tpl).tier === 'ai' ? byId(S.tpl) : byId('face');
    S.tpl = t.id;
    var h = flow(2);
    h += '<div style="display:grid;gap:6px"><span class="eyebrow">Approve before we spend · preparing was free</span><h1>' + esc(t.name) + ' on "' + esc(adById(S.ad).name) + '"</h1><p style="color:var(--fg-2)">Here are the 3 faces. Same voice and same edit as your ad. Swap any face for free, up to 3 times.</p></div>';
    if (S.state === 'sample') h += '<div class="banner warn"><b>AI templates are on paid plans.</b><p>Your free sample covers Edit templates. Your ad is read and saved, so you can come back here after unlocking.</p><div class="acts"><button class="btn" type="button" data-go="buy">See how to unlock</button><button class="btn ghost" type="button" data-go="library">Back to Edit templates</button></div></div>';
    h += '<div class="cols"><div class="card"><div class="faces">' + [1, 2, 3].map(function (i) {
      return '<div class="face-c"><div class="vid">' + scene(['', 'b', 'c'][i - 1], i === 2) + '<span class="ph">FACE ' + i + '</span></div><div class="r"><b>Face ' + i + '</b><button type="button">Swap · free</button></div></div>';
    }).join('') + '</div><p class="muted" style="font-size:12.5px">3 free swaps left. Faces are generated people, never the person in your ad.</p></div>' +
      costPanel(t) + '</div>';
    var sample = S.state === 'sample';
    h += abar('<b>' + crLabel(t) + '</b> · 3 videos · charged when you approve',
      '<button class="btn ghost" type="button" data-go="source">Back</button>' + (sample ? '<button class="btn lime" type="button" data-go="buy">See how to unlock</button>' : (credits() < t.cr ? '<button class="btn" type="button" disabled>Approve</button><button class="btn lime" type="button" data-go="buy">Get credits</button>' : '<button class="btn lime" type="button" data-go="generating">Approve and generate · ' + t.cr + ' credits</button>')));
    return h;
  }
  function vPlanAuto() {
    var sample = S.state === 'sample';
    var picks = ['headline', 'chat', 'pm', 'news', 'meme', 'cut', 'endcard', 'post'];
    if (sample) picks = picks.slice(0, 4);
    var n = sample ? 0 : Math.min(10, picks.length);
    var h = flow(2);
    h += '<div style="display:grid;gap:6px"><span class="eyebrow">Let HookMill pick · plan ready</span><h1>' + picks.length + ' templates fit "' + esc(adById(S.ad).name) + '"</h1><p style="color:var(--fg-2)">Ordered by how well each one fits your ad. Uncheck anything you don\'t want; the total updates.</p></div>';
    h += '<div class="cols"><div class="card"><div class="pick">' + picks.map(function (id) {
      var t = byId(id);
      return '<label><input type="checkbox" checked><div class="vid">' + art(t.kind) + '</div><div class="m"><b>' + esc(t.name) + '</b><span>' + t.out + '</span></div><span class="pill ' + (sample ? 'ok' : 'cr') + '">' + (sample ? 'Free' : '1 credit') + '</span></label>';
    }).join('') + '</div>' +
      (sample ? '' : '<span class="eyebrow" style="margin-top:6px">Suggested with AI · off unless you check them</span><div class="pick">' + ['face', 'discovery'].map(function (id) {
        var t = byId(id);
        return '<label class="sugg"><input type="checkbox"><div class="vid">' + art(t.kind) + '</div><div class="m"><b>' + esc(t.name) + '</b><span>' + t.out + ' · approve faces before we spend</span></div><span class="pill ai">' + crLabel(t) + '</span></label>';
      }).join('') + '</div>') +
      '</div>' + costPanel(null, n) + '</div>';
    h += abar(sample ? '<b>Free sample</b> · 4 videos' : '<b>' + picks.length + ' videos · ' + n + ' credits</b> · pack price, capped at 10', '<button class="btn ghost" type="button" data-go="source">Back</button>' + (sample ? '<button class="btn lime" type="button" data-go="generating">Generate free sample</button>' : (credits() < n ? '<button class="btn" type="button" disabled>Generate</button><button class="btn lime" type="button" data-go="buy">Get credits</button>' : '<button class="btn lime" type="button" data-go="generating">Generate · ' + n + ' credits</button>')));
    return h;
  }

  /* ---------- 6 · generating ---------- */
  function vGenerating() {
    var t = byId(S.tpl);
    var ai = t.tier === 'ai';
    var h = flow(3);
    h += '<div class="cols"><div class="card" style="display:grid;gap:16px">' +
      '<div style="display:grid;gap:6px"><span class="eyebrow">Generating · ' + (ai ? 'about 12 min left' : 'about 1 min left') + '</span><h1 style="font-size:24px">' + esc(t.name) + '</h1><p style="color:var(--fg-2)">' + (S.state === 'sample' ? 'Free sample · nothing charged.' : crLabel(t) + ' reserved. Charged when the video is ready; back to you if it fails.') + '</p></div>' +
      '<div style="display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:18px;align-items:start">' +
      '<div class="vid beam" style="border-radius:10px"><div class="sc" style="background:var(--card-2)"></div><span class="ph">RENDERING</span></div>' +
      '<ul class="steps" aria-live="polite">' + (ai ?
        '<li class="done"><span class="ic"></span><span>Faces approved</span><small></small></li><li class="done"><span class="ic"></span><span>Face 1 · lipsync</span><small>done</small></li><li class="run"><span class="ic"></span><span>Face 2 · lipsync</span><small class="num">0:18 of 0:32</small></li><li class="todo"><span class="ic"></span><span>Face 3 · lipsync</span><small></small></li><li class="todo"><span class="ic"></span><span>Putting your edit back on</span><small></small></li>' :
        '<li class="done"><span class="ic"></span><span>Texts written from your ad</span><small></small></li><li class="run"><span class="ic"></span><span>Rendering 9:16</span><small class="num">62%</small></li><li class="todo"><span class="ic"></span><span>Checking every word on screen</span><small></small></li>') +
      '</ul></div><div class="bar" aria-hidden="true"><i style="width:' + (ai ? 41 : 62) + '%"></i></div>' +
      '<p class="muted" style="font-size:13px">You can leave. It lands in Download and in your Library, and the Templates tab shows a dot while it runs.</p></div>' +
      '<aside class="panel"><span class="eyebrow">While you wait</span><p class="small">Same ad, other templates that fit it:</p><div class="rail">' + ['chat', 'headline', 'news'].map(function (id) { var x = byId(id); return '<button type="button" class="mini" data-use="' + id + '" style="background:var(--ink-2);border-color:var(--ink-line);color:var(--ink-fg)">' + vid(x.kind, { noplay: true }) + '<b>' + esc(x.name) + '</b></button>'; }).join('') + '</div></aside></div>';
    h += abar('Running · you can leave this page', '<button class="btn" type="button" data-go="library">Back to Templates</button><button class="btn lime" type="button" data-go="ready">See result (mockup)</button>');
    return h;
  }

  /* ---------- 7 · ready ---------- */
  function vReady() {
    var t = byId(S.tpl);
    var sample = S.state === 'sample';
    var h = flow(4);
    h += '<div style="display:grid;gap:6px"><span class="eyebrow">' + (sample ? 'Free sample · ready' : 'Ready · in your Library') + '</span><h1>' + esc(t.name) + ' · ' + esc(adById(S.ad).name) + '</h1></div>';
    h += '<div class="cols"><div class="stage">' + vid(t.kind, { cls: sample ? 'lockv' : '', extra: sample ? '<div class="lk"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>First 3 seconds play in full.<br>Unlock to watch the rest.</div>' : '' }) + '</div>' +
      '<aside class="card" style="align-content:start"><span class="eyebrow">Download</span>' +
      (sample ? '<p style="color:var(--fg-2);font-size:13px">This is your free sample. Unlock to download it, make 4:5 and 1:1 versions and send it to Meta. No new render; the same video unlocks.</p>' :
        '<div style="display:grid;gap:8px"><button class="btn" type="button" id="dl">Download MP4 · 9:16</button><div style="display:flex;gap:8px"><button class="btn sm" type="button" style="flex:1">Make 4:5</button><button class="btn sm" type="button" style="flex:1">Make 1:1</button></div><button class="btn" type="button">Send to Meta</button></div><p class="muted" style="font-size:12px">File name MC_1031_PERSON-MOTION_9x16.mp4 · 4:5 and 1:1 don\'t cost credits.</p>') +
      '<hr style="border:0;border-top:1px solid var(--line);width:100%;margin:4px 0"><span class="eyebrow">Same ad, another template</span><div class="rail">' + ['chat', 'headline', 'face'].map(function (id) { var x = byId(id); return '<button type="button" class="mini" data-use="' + id + '">' + vid(x.kind, { noplay: true }) + '<b>' + esc(x.name) + '</b><span class="muted">' + crLabel(x) + '</span></button>'; }).join('') + '</div></aside></div>';
    h += abar(sample ? '<b>' + (S.sampleLeft - 1) + ' free samples left</b>' : 'Saved to your Library', sample ? '<button class="btn ghost" type="button" data-go="library">Templates</button><button class="btn lime" type="button" data-go="buy">Unlock full videos</button>' : '<button class="btn ghost" type="button" data-go="library">Templates</button><button class="btn lime" type="button" id="dl2">Download MP4</button>');
    return h;
  }

  /* ---------- buy ---------- */
  function vBuy() {
    var h = '<div style="display:grid;gap:6px"><span class="eyebrow">Credits</span><h1>Get credits</h1><p style="color:var(--fg-2);max-width:62ch">Edit templates cost 1 credit. AI templates cost more because they generate new people and scenes, and their price covers the whole job, retries included. Credits don\'t expire.</p></div>';
    h += '<div class="banner warn"><b>Checkout isn\'t open in the app yet.</b><p>Talk to us and we add the credits to your workspace by hand, usually the same day.</p><div class="copyrow"><span>hello@hookmill.app</span><button class="btn sm" type="button" id="copy">Copy</button></div></div>';
    h += '<div class="packs">' + [['Starter', 'X', 'about 50 edit videos'], ['Studio', 'Y', 'about 150 edit videos, or 18 New face jobs'], ['Agency', 'Z', 'for several client workspaces']].map(function (p) {
      return '<div class="card"><span class="eyebrow">' + p[0] + '</span><b style="font-size:22px;font-weight:800;font-stretch:115%">' + p[1] + ' credits</b><span class="muted" style="font-size:13px">' + p[2] + '</span><span class="pill warn" style="justify-self:start">Price to be set</span></div>';
    }).join('') + '</div>';
    h += '<div class="card"><span class="eyebrow">History · this workspace</span><div class="tbl" style="border:0"><table><thead><tr><th>Date</th><th>What</th><th>Credits</th><th>Balance</th></tr></thead><tbody>' +
      '<tr><td class="num">Oct 31</td><td>Person + motion · Sleep in 7 nights</td><td class="num">−1</td><td class="num">42</td></tr>' +
      '<tr><td class="num">Oct 31</td><td>New face · 3am wake-ups (1 face failed, refunded)</td><td class="num">−8 +3</td><td class="num">43</td></tr>' +
      '<tr><td class="num">Oct 30</td><td>Added by HookMill (manual)</td><td class="num">+50</td><td class="num">48</td></tr></tbody></table></div><p class="muted" style="font-size:12px">Example rows.</p></div>';
    return h;
  }

  /* ---------- admin ---------- */
  function vAdmin() {
    var h = '<div class="lhead"><div class="t"><span class="eyebrow">Admin · visible to HookMill staff only</span><h1>Template catalog</h1><p>Upload the example video for each template. A template without an example stays hidden from customers.</p></div><button class="btn lime" type="button">Upload example videos</button></div>';
    h += '<div class="tbl"><table><thead><tr><th>Example</th><th>Template</th><th>Type inside</th><th>Tier</th><th>Credits</th><th>Uses</th><th>Status</th><th></th></tr></thead><tbody>' +
      TPL.map(function (t, i) {
        var has = i % 5 !== 3;
        return '<tr><td>' + (has ? '<div class="vid">' + art(t.kind) + '</div>' : '<div class="empty-v" title="No example yet"></div>') + '</td><td><b>' + esc(t.name) + '</b></td><td class="num" style="font-family:var(--mono);font-size:11.5px">' + typeOf(t) + '</td><td>' + (t.tier === 'ai' ? '<span class="pill ai">AI</span>' : '<span class="pill">Edit</span>') + '</td><td><input type="number" aria-label="Credits for ' + esc(t.name) + '" value="' + (t.cr == null ? '' : t.cr) + '"></td><td class="num">' + t.uses + '</td><td>' + (t.beta ? '<span class="pill">Hidden · beta</span>' : (has ? '<span class="pill ok">Live</span>' : '<span class="pill warn">Needs example</span>')) + '</td><td><button class="btn sm" type="button">' + (has ? 'Replace video' : 'Upload video') + '</button></td></tr>';
      }).join('') + '</tbody></table></div>';
    h += '<p class="muted" style="font-size:12.5px">Example video: MP4 9:16, up to 60 s, plays muted in the card and with sound in the detail. Uses = times generated across all workspaces.</p>';
    return h;
  }
  function typeOf(t) {
    var m = { news: 'FRAME:news', meme: 'FRAME:meme', post: 'FRAME:post_card', question: 'FRAME:question_box', ranking: 'FRAME:ranking', live: 'FRAME:live', split: 'FRAME:split_stack', gossip: 'FRAME:gossip_page', headline: 'HEADLINE ×3', search: 'NATIVE_SEARCH', cut: 'CUT 15+20', cold: 'COLD_OPEN', endcard: 'ENDCARD', chat: 'CHAT_DM', pm: 'PERSON_MOTION', static: 'STATIC', face: 'AVATAR_FACE', persona: 'AVATAR_PERSONA', discovery: 'REMIX_DISCOVERY', podcast: 'REMIX_PODCAST' };
    return m[t.id];
  }

  /* ---------- render ---------- */
  var view = document.getElementById('view');
  var layer = document.getElementById('layer');
  function render() {
    var s = S.screen;
    layer.innerHTML = '';
    var map = { library: vLibrary, detail: vLibrary, source: vSource, reading: vReading, plan: vPlan, planai: vPlanAI, planauto: vPlanAuto, generating: vGenerating, ready: vReady, buy: vBuy, admin: vAdmin };
    view.innerHTML = (map[s] || vLibrary)();
    if (s === 'detail') layer.innerHTML = sheet();
    document.getElementById('pScreen').value = s;
    var bal = S.state === 'sample' ? 0 : credits();
    document.getElementById('sideBal').textContent = bal;
    document.getElementById('sideBar').style.width = Math.min(100, bal) + '%';
    document.getElementById('topBal').textContent = (S.state === 'sample' ? S.sampleLeft + ' free left' : bal + ' credits');
    document.querySelectorAll('.side .nav').forEach(function (n) { n.classList.toggle('on', n.getAttribute('data-go') === (s === 'buy' ? '' : s === 'admin' ? 'admin' : 'library')); });
    var q = document.getElementById('q');
    if (q && S.focusQ) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); S.focusQ = false; }
  }
  function go(screen) {
    S.screen = screen;
    if (screen === 'planai' && byId(S.tpl).tier !== 'ai') S.tpl = 'face';
    if (screen === 'plan' && byId(S.tpl).tier === 'ai') S.screen = 'planai';
    document.getElementById('side').classList.remove('open');
    render();
    window.scrollTo(0, 0);
  }
  function toast(msg) {
    var t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
    document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2200);
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-close],[data-use],[data-open],[data-go],[data-tab],[data-chip],[data-src],[data-ad],[data-pack],#clearQ,#anyway,#dl,#dl2,#copy,#menuBtn');
    if (!el) return;
    if (el.hasAttribute('data-close')) { if (e.target === el || el.classList.contains('x')) { S.screen = 'library'; render(); } return; }
    if (el.id === 'menuBtn') { document.getElementById('side').classList.toggle('open'); return; }
    if (el.hasAttribute('data-use')) { e.stopPropagation(); S.tpl = el.getAttribute('data-use'); S.mode = 'single'; go('source'); return; }
    if (el.hasAttribute('data-pack')) { e.stopPropagation(); S.mode = 'pack'; S.ad = 'a1'; go('planauto'); return; }
    if (el.hasAttribute('data-open')) { S.tpl = el.getAttribute('data-open'); S.screen = 'detail'; render(); var x = layer.querySelector('.x'); if (x) x.focus(); return; }
    if (el.hasAttribute('data-srcTab')) S.srcTab = el.getAttribute('data-srcTab');
    if (el.hasAttribute('data-go')) { go(el.getAttribute('data-go')); return; }
    if (el.hasAttribute('data-tab')) { S.tab = el.getAttribute('data-tab'); S.chip = null; render(); return; }
    if (el.hasAttribute('data-chip')) { S.chip = el.getAttribute('data-chip') || null; render(); return; }
    if (el.hasAttribute('data-src')) { S.srcTab = el.getAttribute('data-src'); render(); return; }
    if (el.hasAttribute('data-ad')) { S.ad = el.getAttribute('data-ad'); render(); return; }
    if (el.id === 'clearQ') { S.q = ''; render(); return; }
    if (el.id === 'anyway') { if (S.state === 'incompat') S.state = 'normal'; go('generating'); return; }
    if (el.id === 'dl' || el.id === 'dl2') { toast('Download starts in the real app (mockup)'); return; }
    if (el.id === 'copy') {
      try { navigator.clipboard.writeText('hello@hookmill.app').then(function () { toast('Copied'); }, function () { toast('Select the address to copy it'); }); } catch (err) { toast('Select the address to copy it'); }
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && S.screen === 'detail') { S.screen = 'library'; render(); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-open],[data-pack].tcard')) { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'q') { S.q = e.target.value; S.focusQ = true; render(); }
  });
  document.getElementById('pScreen').addEventListener('change', function (e) {
    var v = e.target.value;
    if (v === 'detail') { S.screen = 'detail'; render(); return; }
    if (v === 'plan' && byId(S.tpl).tier === 'ai') S.tpl = 'pm';
    go(v);
  });
  document.getElementById('pState').addEventListener('change', function (e) {
    S.state = e.target.value;
    if (S.state === 'incompat') { S.tpl = 'pm'; S.ad = 'a2'; if (S.screen === 'library' || S.screen === 'detail') S.screen = 'plan'; }
    if (S.state === 'nocredits' && (S.screen === 'library' || S.screen === 'detail')) { S.tpl = 'face'; S.ad = 'a1'; S.screen = 'planai'; }
    if (S.state === 'loading') S.screen = 'library';
    if (S.state === 'normal' && S.ad === 'a2') S.ad = 'a1';
    render();
  });
  S.ad = 'a1';
  render();
})();
</script>
