<title>HookMill · With AI · previews</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* HookMill · Templates › With AI › 4 image previews › approve › videos (decision 07/11).
   Same skin as the product (web/src/app/globals.css): light main, ink sidebar, lime = the one action per screen, colour only for status.
   The yellow bar is the prototype control, not product. "Phone 390" renders the app in a 390 px frame (container queries). */
:root {
  --bg: #eeeeea; --card: #fdfdfb; --card-2: #f3f4f0; --field: #ffffff;
  --line: #dcddd7; --line-soft: #e4e5e0; --line-strong: #cfd1cb;
  --fg: #15171a; --fg-2: #3b4047; --fg-3: #5a6068;
  --brand: #c8f03c; --brand-hover: #bde52f; --brand-ink: #3e5200; --brand-soft: #f0f8d2; --brand-edge: #a9cc2a;
  --ink: #16181b; --ink-2: #202328; --ink-3: #2a2e33; --ink-line: #2e3238; --ink-fg: #f2f3ee; --ink-fg-2: #c5cad0; --ink-fg-3: #9aa1a9;
  --ok-bg: #e2f3e8; --ok: #0b6b43; --ok-dot: #1c9a5e; --ok-edge: #b7dec5;
  --warn-bg: #fbf0d3; --warn: #7a5000; --warn-edge: #e9c76b;
  --bad-bg: #fbe7dd; --bad: #a8360c; --bad-edge: #e4b9a6;
  --info-bg: #e6ebfc; --info: #2b4bc8; --info-edge: #c3cef6;
  /* drawn placeholder images */
  --th-sky: #8fb3c9; --th-sand: #d8c3a0; --th-sage: #9fb89a; --th-dusk: #6f6a8f; --th-clay: #c08a6a; --th-wine: #6b3a46; --th-teal: #3f6f6a;
  --th-skin: #c99b7c; --th-skin-2: #8d5f45; --th-skin-3: #e0b896; --th-hair: #3a2b22; --th-hair-2: #a0683a; --th-shirt: #3b4047; --th-shirt-2: #7a8a5a;
  --th-mic: #1d1f22; --th-white: #ffffff; --th-yellow: #ffe14d;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r-chip: 8px; --r-ctl: 10px; --r-btn: 12px; --r-card: 16px; --r-panel: 18px;
  color-scheme: light;
}
* { box-sizing: border-box }
html, body { margin: 0; height: 100% }
body { background: var(--bg); color: var(--fg); font-family: var(--display); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px }
h1, h2, h3 { margin: 0; text-wrap: balance }
h1 { font-size: 30px; line-height: 1.1; font-weight: 800; font-stretch: 125%; letter-spacing: -0.015em }
h2 { font-size: 17px; font-weight: 700 }
h3 { font-size: 14px; font-weight: 700 }
p { margin: 0 }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3) }
.num { font-variant-numeric: tabular-nums }
.muted { color: var(--fg-3) }
.mono { font-family: var(--mono) }

/* prototype bar (outside the product frame) */
.proto { flex: none; display: flex; gap: 8px 14px; align-items: center; padding: 8px 16px; background: var(--warn-bg); border-bottom: 1px solid var(--warn-edge); font-size: 12px; color: var(--warn); overflow-x: auto; white-space: nowrap }
.proto b { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase }
.proto label { display: inline-flex; gap: 6px; align-items: center }
.proto select { border: 1px solid var(--warn-edge); background: var(--card); border-radius: var(--r-chip); padding: 4px 6px; font-size: 12px; max-width: 220px }
.seg { display: inline-flex; border: 1px solid var(--warn-edge); border-radius: 8px; overflow: hidden; background: var(--card) }
.seg button { border: 0; background: none; padding: 4px 9px; font-size: 12px; color: var(--warn) }
.seg button[aria-pressed="true"] { background: var(--warn); color: var(--warn-bg) }

/* product frame: transform makes position:fixed children (bars, sheets) stick to the frame, so Phone 390 behaves like a phone */
.stagebox { flex: 1; min-height: 0; display: grid; place-items: stretch }
.frame { --fh: 100%; position: relative; transform: translateZ(0); container: app / inline-size; overflow: hidden; background: var(--bg); width: 100%; height: 100% }
.scroller { height: 100%; overflow-y: auto; overflow-x: hidden }
body.phone .stagebox { place-items: center; background: #d9dad4; padding: 16px }
body.phone .frame { width: min(390px, 100%); height: min(844px, 100%); border-radius: 28px; border: 1px solid var(--line-strong); box-shadow: 0 20px 50px rgba(22,24,27,.18) }

/* shell */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100% }
.side { background: var(--ink); color: var(--ink-fg-2); padding: 18px 12px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: calc(100dvh - 41px); overflow-y: auto }
body.phone .side { height: auto }
.logo { font-weight: 800; font-stretch: 112%; font-size: 17px; color: var(--ink-fg); padding: 4px 10px 14px; display: flex; gap: 8px; align-items: center }
.logo i { width: 18px; height: 18px; border-radius: 5px; background: var(--brand); border: 1px solid var(--brand-edge) }
.ws { margin: 0 4px 12px; padding: 8px 10px; border: 1px solid var(--ink-line); border-radius: var(--r-ctl); font-size: 13px; color: var(--ink-fg); display: flex; justify-content: space-between }
.grp { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-fg-3); padding: 14px 10px 6px }
.nav { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--r-chip); border: 0; background: none; text-align: left; color: var(--ink-fg-2); min-height: 36px; width: 100% }
.nav:hover { background: var(--ink-3) }
.nav.on { background: var(--ink-3); color: var(--ink-fg); font-weight: 600 }
.nav .cnt { margin-left: auto; font-family: var(--mono); font-size: 10px; padding: 1px 6px; border-radius: 4px; background: var(--info); color: var(--th-white) }
.side .foot { margin-top: auto; display: grid; gap: 8px; padding-top: 14px }
.meter { border: 1px solid var(--ink-line); border-radius: var(--r-ctl); padding: 10px; display: grid; gap: 6px; font-size: 12px }
.meter b { color: var(--ink-fg); font-size: 18px; font-weight: 800; font-stretch: 112% }
.meter .bar { height: 4px; background: var(--ink-3); border-radius: 4px; overflow: hidden }
.meter .bar i { display: block; height: 100%; background: var(--ink-fg-2) }
.topbar { display: none }
.main { min-width: 0; display: flex; flex-direction: column }
.view { padding: 24px 24px 140px; display: flex; flex-direction: column; gap: 18px; width: 100%; max-width: 1280px }

/* buttons, pills */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 14px; border-radius: var(--r-btn); border: 1px solid var(--line-strong); background: var(--card); font-weight: 600; font-size: 13px; color: var(--fg); white-space: nowrap; text-decoration: none }
.btn:hover { background: var(--card-2) }
.btn.lime { background: var(--brand); border-color: var(--brand-edge); color: var(--fg) }
.btn.lime:hover { background: var(--brand-hover) }
.btn.ghost { border-color: transparent; background: none; color: var(--fg-2) }
.btn.ghost:hover { background: var(--card-2) }
.btn.ink { background: var(--fg); border-color: var(--fg); color: var(--card) }
.btn:disabled { opacity: .45; cursor: not-allowed }
.btn.sm { min-height: 34px; padding: 6px 10px; font-size: 12px; border-radius: var(--r-ctl) }
.btn svg { flex: none }
.pill { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 11px; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--line); background: var(--card-2); color: var(--fg-2); white-space: nowrap }
.pill.ai { background: var(--ink); border-color: var(--ink); color: var(--ink-fg) }
.pill.tbd { border-style: dashed; background: transparent; color: var(--fg-3) }
.pill.ok { background: var(--ok-bg); border-color: transparent; color: var(--ok) }
.pill.warn { background: var(--warn-bg); border-color: var(--warn-edge); color: var(--warn) }
.pill.bad { background: var(--bad-bg); border-color: var(--bad-edge); color: var(--bad) }
.pill.info { background: var(--info-bg); border-color: var(--info-edge); color: var(--info) }
.pill.soon { border-style: dashed }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--fg-3); display: inline-block }
.dot.prog { background: var(--info); box-shadow: 0 0 0 3px var(--info-bg); animation: pulse 1.6s ease-in-out infinite }
.dot.okd { background: var(--ok-dot) } .dot.badd { background: var(--bad) }

/* gallery */
.lhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap }
.lhead .t { display: grid; gap: 6px; min-width: 0 }
.lhead .t p { color: var(--fg-2); max-width: 62ch }
.bal { display: flex; gap: 8px; align-items: center }
.bal .n { display: grid; text-align: right; font-size: 12px; color: var(--fg-3) }
.bal .n b { font-size: 20px; font-weight: 800; font-stretch: 112%; color: var(--fg); line-height: 1 }
.tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.search { flex: 1 1 260px; display: flex; align-items: center; gap: 8px; background: var(--field); border: 1px solid var(--line-strong); border-radius: var(--r-ctl); padding: 0 12px; min-height: 40px; max-width: 420px; color: var(--fg-3) }
.search input { border: 0; outline: 0; background: none; flex: 1; min-width: 0; font-size: 14px; color: var(--fg) }
.tabs { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-ctl); overflow: hidden; background: var(--card) }
.tabs button { border: 0; background: none; padding: 8px 14px; font-weight: 600; font-size: 13px; color: var(--fg-2); min-height: 38px }
.tabs button[aria-pressed="true"] { background: var(--fg); color: var(--card) }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px }
.chips::-webkit-scrollbar { display: none }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 6px 12px; font-size: 13px; color: var(--fg-2); white-space: nowrap; min-height: 34px }
.chip[aria-pressed="true"] { border-color: var(--fg); color: var(--fg); font-weight: 600; box-shadow: inset 0 0 0 1px var(--fg) }
.chip small { font-family: var(--mono); font-size: 10px; color: var(--fg-3); margin-left: 4px }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px }
.tcard { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); padding: 8px; display: flex; flex-direction: column; gap: 10px; min-width: 0; text-align: left; cursor: pointer }
.tcard:hover { border-color: var(--line-strong) }
.tcard .body { display: grid; gap: 6px; padding: 0 4px 2px; min-width: 0 }
.tcard .nm { display: flex; justify-content: space-between; gap: 8px; align-items: center }
.tcard .nm b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tcard .ds { font-size: 12.5px; color: var(--fg-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; min-height: 3.9em }
.tcard .ft { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 0 4px 4px; margin-top: auto }
.tcard .ft .u { font-size: 11px; color: var(--fg-3); font-family: var(--mono) }
.tcard.off { cursor: default }
.tcard.off .vid { filter: saturate(.25); opacity: .65 }
.sect { margin-top: 4px }
.sect .eyebrow b { color: var(--fg) }

/* drawn 9:16 image / video */
.vid { position: relative; aspect-ratio: 9 / 16; width: 100%; border-radius: 10px; overflow: hidden; background: var(--th-sky); isolation: isolate }
.vid .ph { position: absolute; top: 7px; left: 7px; z-index: 6; font-family: var(--mono); font-size: 8.5px; letter-spacing: .06em; background: rgba(22, 24, 27, .78); color: var(--ink-fg); padding: 2px 5px; border-radius: 4px }
.vid .asp { position: absolute; top: 7px; right: 7px; z-index: 6; font-family: var(--mono); font-size: 9px; background: rgba(255, 255, 255, .88); color: var(--fg); padding: 2px 5px; border-radius: 4px }
.vid .prog { position: absolute; z-index: 6; left: 7px; right: 7px; bottom: 7px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .3); overflow: hidden }
.vid .prog i { display: block; height: 100%; background: var(--th-white); transform-origin: left; animation: tick 9s linear infinite }
.sc { position: absolute; inset: 0 }
.sc .wall { position: absolute; inset: 0 }
.sc .desk { position: absolute; left: 0; right: 0; bottom: 0; height: 22%; background: rgba(22, 24, 27, .55) }
.sc .lamp { position: absolute; width: 40%; aspect-ratio: 1; border-radius: 50%; top: 6%; right: -8%; background: radial-gradient(circle, rgba(255, 225, 77, .45), transparent 65%) }
.pp { position: absolute; bottom: 0; width: 62%; aspect-ratio: 3 / 4; left: 50%; transform: translateX(-50%) }
.pp i { position: absolute; display: block }
.pp .hr { inset: 0 12% 60%; border-radius: 50% 50% 22% 22%; background: var(--th-hair) }
.pp .h { inset: 8% 18% 36%; border-radius: 48% 48% 44% 44%; background: var(--th-skin) }
.pp .bd { left: 0; right: 0; bottom: 0; height: 36%; border-radius: 40% 40% 0 0; background: var(--th-shirt) }
.pp .hp { inset: 4% 12% 52%; border-radius: 50% 50% 0 0; border: 5px solid var(--th-mic); border-bottom: 0 }
.pp.b .h { background: var(--th-skin-2) } .pp.b .hr { inset: 2% 20% 66%; border-radius: 50% }
.pp.c .h { background: var(--th-skin-3) } .pp.c .hr { background: var(--th-hair-2); inset: 0 8% 50%; border-radius: 50% 50% 30% 30% }
.pp.g .bd { background: var(--th-shirt-2) }
.pp.d .hr { background: #8a8780; inset: 2% 16% 62% } .pp.d .h { background: var(--th-skin-3) }
.pp.e .hr { background: #1a1410; inset: -2% 6% 48%; border-radius: 50% } .pp.e .h { background: var(--th-skin-2) }
.pp.w .bd { background: #6b3a46 } .pp.s .bd { background: #2f4a6b }
/* F10: one image per speaker, side by side (contract §6: no two-shot in v1) */
.vid.split { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: var(--ink) }
.vid.split .half { position: relative; overflow: hidden; min-width: 0 }
.vid.split .half .pp { width: 96% }
.vid.split .half .mic { left: 44%; width: 13% }
.vid .who { position: absolute; z-index: 6; top: 26px; font-family: var(--mono); font-size: 8px; letter-spacing: .06em; background: rgba(22, 24, 27, .7); color: var(--ink-fg); padding: 1px 4px; border-radius: 3px }
.mic { position: absolute; z-index: 4; bottom: 18%; width: 7%; height: 11%; border-radius: 40% 40% 30% 30%; background: var(--th-mic) }
.mic::after { content: ""; position: absolute; left: 42%; top: 100%; width: 16%; height: 90%; background: var(--th-mic) }
.qcard { position: absolute; z-index: 4; left: 9%; right: 9%; top: 15%; background: var(--th-white); color: var(--fg); border-radius: 8px; padding: 7px 8px; font-weight: 800; font-size: 10.5px; line-height: 1.15; box-shadow: 0 4px 12px rgba(0, 0, 0, .18) }
.qcard small { display: block; font-family: var(--mono); font-weight: 500; font-size: 8px; color: var(--fg-3); margin-bottom: 3px; letter-spacing: .06em }
.ptag { position: absolute; z-index: 4; left: 8px; top: 26px; font-family: var(--mono); font-size: 8px; padding: 2px 5px; border-radius: 3px; background: var(--th-red, #d83a2a); color: var(--th-white) }
.cap { position: absolute; z-index: 5; left: 7%; right: 7%; bottom: 25%; text-align: center; font-weight: 800; font-size: 11px; color: var(--th-white); text-shadow: 0 1px 3px rgba(0,0,0,.75); line-height: 1.15 }
.cap em { font-style: normal; background: var(--th-yellow); color: var(--fg); text-shadow: none; padding: 0 3px; border-radius: 2px }
.big .cap { font-size: clamp(14px, 4.4cqi, 22px) }
.toon .pp .h { border: 2px solid var(--fg) } .toon .pp .bd { border: 2px solid var(--fg) } .toon .pp .hr { border: 2px solid var(--fg) }
.notes { position: absolute; z-index: 4; inset: 14% 10% auto; font-size: 22px; color: var(--th-white); letter-spacing: 10px; text-align: center }
.bars { position: absolute; z-index: 4; left: 12%; right: 12%; top: 22%; display: grid; gap: 6px }
.bars i { display: block; height: 14px; border-radius: 4px; background: var(--th-white) }
.bars i:nth-child(2) { width: 72%; background: var(--th-yellow) } .bars i:nth-child(3) { width: 50% }

/* image generation (wait state only): blurred image resolving + scan line */
.vid.gen .sc, .vid.gen .pp, .vid.gen .mic, .vid.gen .qcard, .vid.gen .cap { filter: blur(12px) saturate(.6) }
.vid.gen::after { content: ""; position: absolute; inset: 0; z-index: 7; background-image: radial-gradient(rgba(255,255,255,.35) 1px, transparent 1.4px); background-size: 7px 7px; animation: grain 1.2s steps(4) infinite }
.vid.gen .scan { position: absolute; z-index: 8; left: 0; right: 0; height: 30%; background: linear-gradient(180deg, transparent, rgba(255,255,255,.28), transparent); animation: scan 2.2s ease-in-out infinite }
.vid.empty-img { background: var(--card-2) }
.vid.empty-img .sc { background: repeating-linear-gradient(135deg, var(--card-2) 0 10px, var(--line-soft) 10px 20px) }

/* flow bar */
.flow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px }
.flow span { display: inline-flex; gap: 6px; align-items: center; color: var(--fg-3); padding: 4px 10px 4px 4px; border-radius: 99px; border: 1px solid var(--line) }
.flow span i { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-family: var(--mono); font-size: 10px; background: var(--card-2); color: var(--fg-3) }
.flow span.done { color: var(--fg-2); background: var(--card) } .flow span.done i { background: var(--fg); color: var(--card) }
.flow span.cur { color: var(--fg); font-weight: 600; border-color: var(--fg) } .flow span.cur i { background: var(--brand); color: var(--fg) }
.flow .sep { width: 10px; height: 1px; background: var(--line-strong); border: 0; padding: 0 }

/* champion strip: always visible after step 2 */
.champ { position: sticky; top: 0; z-index: 12; display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); padding: 8px 12px 8px 8px; box-shadow: 0 6px 14px -12px rgba(22,24,27,.4) }
.champ .vid { width: 40px; flex: none; border-radius: 6px }
.champ .vid .ph, .champ .vid .asp, .champ .vid .prog, .champ .vid .cap { display: none }
.champ .m { display: grid; gap: 2px; min-width: 0; flex: 1 }
.champ .m .l1 { display: flex; gap: 8px; align-items: center; min-width: 0 }
.champ .m b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.champ .m .l2 { font-size: 12px; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.champ .m .l2 q { color: var(--fg-2) }
.champ .arrow { font-family: var(--mono); font-size: 11px; color: var(--fg-3); display: flex; gap: 6px; align-items: center; white-space: nowrap }
.champ .arrow b { color: var(--fg); font-family: var(--display); font-size: 13px }

/* winner list */
.list { display: grid; gap: 8px }
.srcrow { display: grid; grid-template-columns: 22px 54px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--card); text-align: left; width: 100% }
.srcrow:hover { border-color: var(--line-strong) }
.srcrow[aria-checked="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg) }
.srcrow:disabled { cursor: not-allowed; opacity: .7 }
.srcrow .radio { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center }
.srcrow[aria-checked="true"] .radio { border-color: var(--fg) }
.srcrow[aria-checked="true"] .radio::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--fg) }
.srcrow .vid { border-radius: 6px }
.srcrow .vid .ph, .srcrow .vid .asp, .srcrow .vid .prog, .srcrow .vid .cap { display: none }
.srcrow .m { display: grid; gap: 3px; min-width: 0 }
.srcrow .m b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.srcrow .m span { font-size: 12px; color: var(--fg-3) }
.srcrow .r { display: grid; gap: 4px; justify-items: end; font-size: 12px }
.subtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line) }
.subtabs button { border: 0; background: none; padding: 9px 12px; font-size: 13px; color: var(--fg-3); border-bottom: 2px solid transparent; margin-bottom: -1px; min-height: 40px }
.subtabs button[aria-selected="true"] { color: var(--fg); font-weight: 600; border-bottom-color: var(--fg) }
.two { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start }
.howto { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; display: grid; gap: 12px; position: sticky; top: 0 }

    $('pFmt').value = S.fmt;
    document.querySelectorAll('[data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === S.lang)); });
    document.querySelectorAll('[data-vp]').forEach(function (b) { b.setAttribute('aria-pressed', String((b.dataset.vp === 'phone') === S.phone)); });
    document.documentElement.lang = S.lang === 'pt' ? 'pt-BR' : 'en';
  }

  function go(screen, state) {
    clearTimers();
    S.screen = screen; S.menu = null; S.zoom = null; if (screen !== 'confirm') S.after = false;
    var states = SCREENS.filter(function (x) { return x[0] === screen; })[0][2];
    S.state = state || states[0][0];
    if (screen === 'previews') setupPreviews();
    if (screen === 'confirm') { S.prev = null; S.regen = {}; if (!approvedAny()) S.sel = { A: true, B: false, C: true, D: false }; }
    if (screen === 'progress') setupProgress();
    if (screen === 'ready') S.pct = {};
    render();
    $('scroller').scrollTop = 0;
  }

  function setupPreviews() {
    S.regen = {}; S.swapped = {}; S.rc = S.state === 'limit' ? { A: 3, B: 1, D: 2 } : {};
    if (S.state === 'limit') { S.sel = { A: true, B: false, C: true, D: false }; S.prev = null; return; }
    if (S.state === 'generating') {
      S.prev = { A: 'frame', B: 'angle', C: 'frame', D: 'angle' }; S.sel = { A: false, B: false, C: false, D: false };
      var order = [['A', 1400], ['C', 2600], ['B', 2900], ['D', 4300], ['Bf', 1500], ['Df', 3000]];
      order.forEach(function (o) {
        timers.push(setTimeout(function () {
          if (o[0].length === 2) S.prev[o[0][0]] = S.prev[o[0][0]] === 'ready' ? 'ready' : 'frame'; else S.prev[o[0]] = 'ready';
          if (['A', 'B', 'C', 'D'].every(function (l) { return S.prev[l] === 'ready'; })) { S.state = 'ready'; toast(t('4 previews ready. Approve the ones worth a video.', '4 prévias prontas. Aprove as que valem um vídeo.')); }
          render();
        }, o[1]));
      });
    } else {
      S.prev = null;
      if (S.state === 'none') { S.sel = { A: false, B: false, C: false, D: false }; }
      else if (S.state === 'ready' || S.state === 'failed') { if (!approvedAny()) S.sel = { A: true, B: false, C: true, D: false }; }
      if (S.state === 'regen') { S.sel = { A: true, B: false, C: true, D: false }; S.regen = { D: true }; }
    }
  }
  function approvedAny() { return ['A', 'B', 'C', 'D'].some(function (l) { return S.sel[l]; }); }

  function setupProgress() {
    S.pct = {};
    S.made.forEach(function (l, i) { S.pct[l] = i ? 34 : 58; });
    if (S.state !== 'running') return;
    timers.push(setInterval(function () {
      var done = true;
      S.made.forEach(function (l) { S.pct[l] = Math.min(100, S.pct[l] + 2); if (S.pct[l] < 100) done = false; });
      if (done) { clearTimers(); toast(t('Your videos are ready.', 'Seus vídeos estão prontos.')); timers.push(setTimeout(function () { go('ready'); }, 900)); }
      render();
    }, 450));
  }

  function toast(msg) {
    var d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = msg;
    $('frame').appendChild(d); setTimeout(function () { d.remove(); }, 2600);
  }

  // ───────── events ─────────
  document.addEventListener('click', function (e) {
    var el = e.target.closest('button, [data-open], .scrim');
    if (!el) { if (S.menu) { S.menu = null; render(); } return; }
    var d = el.dataset;
    if (el.classList.contains('scrim') && e.target !== el) return;
    if (d.close) { S.zoom = null; if (S.screen === 'detail') S.screen = 'gallery'; if (S.screen === 'confirm') { S.screen = 'previews'; S.state = 'ready'; } render(); return; }
    if (d.lang) { S.lang = d.lang; render(); return; }
    if (d.vp) { S.phone = d.vp === 'phone'; document.body.classList.toggle('phone', S.phone); history.replaceState(null, '', S.phone ? '#phone' : '#'); render(); return; }
    if (d.tab) { S.tab = d.tab; S.chip = null; render(); return; }
    if (d.chip !== undefined && el.classList.contains('chip')) { S.chip = d.chip || null; render(); return; }
    if (d.use) { S.fmt = d.use; go('winner'); return; }
    if (d.open && !e.target.closest('button')) { S.fmt = d.open; S.screen = 'detail'; S.state = 'normal'; render(); return; }
    if (d.sub) { S.subtab = d.sub; render(); return; }
    if (d.ad) { S.ad = d.ad; render(); return; }
    if (d.make) { go('previews', 'generating'); return; }
    if (d.sel) { S.sel[d.sel] = !S.sel[d.sel]; if (S.state === 'none' && approvedAny()) S.state = 'ready'; render(); return; }
    if (d.all) { ['A', 'B', 'C', 'D'].forEach(function (l) { if (!madeAlready(l)) S.sel[l] = true; }); render(); return; }
    if (d.menu) { S.menu = S.menu === d.menu ? null : d.menu; render(); return; }
    if (d.regen || d.retry) {
      var l = d.regen || d.retry, kind = d.kind || 'angle';
      if (d.regen && regenOut(l)) return;
      S.menu = null; S.regen[l] = true; S.sel[l] = false; if (d.regen) S.rc[l] = (S.rc[l] || 0) + 1; render();
      timers.push(setTimeout(function () { delete S.regen[l]; if (kind === 'angle') S.swapped[l] = !S.swapped[l]; if (S.state === 'failed' && l === 'B') S.swapped.B = true; if (S.state === 'regen') S.state = 'ready'; render(); }, 2400));
      return;
    }
    if (d.zoom) { S.zoom = d.zoom; render(); return; }
    if (d.confirm) { var a = approvedList(); if (!a.length) a = ['A', 'C']; S.made = S.after ? S.made.concat(a).sort() : a; go('progress', 'running'); return; }
    if (d.vid) { S.vid = d.vid; render(); return; }
    if (d.more) { var others = ['A', 'B', 'C', 'D'].filter(function (x) { return S.made.indexOf(x) < 0; }); S.sel = { A: false, B: false, C: false, D: false }; others.forEach(function (x) { S.sel[x] = true; }); S.after = true; S.screen = 'previews'; S.state = 'ready'; S.prev = null; S.regen = {}; render(); return; }
    if (d.toast === 'dl') { toast(t('Downloading SW·' + S.fmt.toUpperCase() + '·' + S.vid + '.mp4', 'Baixando SW·' + S.fmt.toUpperCase() + '·' + S.vid + '.mp4')); return; }
    if (d.rerun) { toast(t('Trying again from lip-sync. Finished steps are reused.', 'Tentando de novo a partir do lipsync. As etapas prontas são reaproveitadas.')); go('progress', 'running'); return; }
    if (d.go) {
      if (d.go === 'confirm') { S.screen = 'confirm'; S.state = 'normal'; render(); return; }
      if (d.go === 'gallery') S.tab = 'ai';
      go(d.go); $('side').classList.remove('open'); return;
    }
    if (el.id === 'menuBtn') { $('side').classList.toggle('open'); return; }
    if (S.menu && !el.closest('.menu')) { S.menu = null; render(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (S.menu || S.zoom) { S.menu = null; S.zoom = null; render(); } else if (S.screen === 'detail' || S.screen === 'confirm') { S.screen = S.screen === 'detail' ? 'gallery' : 'previews'; S.state = S.screen === 'previews' ? 'ready' : 'normal'; render(); } }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.open) { e.preventDefault(); S.fmt = e.target.dataset.open; S.screen = 'detail'; S.state = 'normal'; render(); }
  });
  $('pScreen').addEventListener('change', function (e) { go(e.target.value); });
  $('pState').addEventListener('change', function (e) {
    if (S.screen === 'confirm' || S.screen === 'detail') { S.state = e.target.value; render(); return; }
    go(S.screen, e.target.value);
  });
  $('pFmt').addEventListener('change', function (e) { S.fmt = e.target.value; render(); });

  if (location.hash === '#phone') { S.phone = true; document.body.classList.add('phone'); }
  go('gallery');
})();
</script>
