<title>HookMill Brain 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: same shell as onboarding-v2 / campaigns (dark sidebar, light work area). The Brain globe lives in an ink "stage"
   (the instrument-panel rule of fase2: dark surface = where you watch, light = where you work). Drawer is a light card over the stage. */
:root{
  --bg:#EEEEEA; --card:#FDFDFB; --card-2:#F3F4F0; --input:#FFFFFF;
  --line:#DCDDD7; --line-soft:#E4E5E0; --line-strong:#CFD1CB; --control:#B9BCB5;
  --fg:#15171A; --fg-2:#3B4047; --fg-3:#5A6068; --fg-btn:#4A5058; --on-ink-btn:#FFFFFF;
  --accent:#C8F03C; --accent-ink:#3E5200; --accent-soft:#F0F8D2; --accent-edge:#A9CC2A;
  --ink:#16181B; --ink-2:#202328; --ink-3:#2A2E33; --ink-line:#2E3238; --ink-fg:#F2F3EE; --ink-fg-2:#C5CAD0; --ink-fg-3:#9AA1A9; --ink-body:#E8EAE4;
  --stage:#0E1012; --stage-2:#16191C;
  --ok-bg:#E2F3E8; --ok:#0B6B43; --ok-dot:#1C9A5E;
  --warn-bg:#FBF0D3; --warn:#7A5000; --warn-line:#E9C76B; --warn-dot:#D9A21B;
  --bad-bg:#FBE7DD; --bad:#A8360C; --bad-edge:#E4B9A6;
  --info-bg:#E6EBFC; --info:#2B4BC8; --info-line:#C3CEF6;
  --scrim:rgba(22,24,27,.55);
  /* category palette, on the dark stage only (data colors, not status, not accent) */
  --c-business:#E6E1D3; --c-offer:#F2B33D; --c-audience:#4CC9B0; --c-goal:#9AA8FF;
  --c-hook:#FF8466; --c-script:#C7A4F5; --c-creative:#6FC8F2; --c-ad:#F27BA8;
  --font:'Archivo','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r-card:16px; --r-panel:18px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;font-family:var(--font);font-size:14px;line-height:1.45;color:var(--fg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:100;background:var(--ink)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
a{color:var(--fg)}
svg{flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* prototype bar */
.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--ink);color:var(--ink-fg-2);border-bottom:1px solid var(--ink-line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:12px}
.proto b{color:var(--ink-fg);font-family:var(--mono);font-size:11px;letter-spacing:.08em}
.proto select{background:var(--ink-2);color:var(--ink-fg);border:1px solid var(--ink-line);border-radius:8px;min-height:32px;padding:0 8px;max-width:100%}
.pg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--ink-2);border:1px solid var(--ink-line);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;color:var(--ink-fg-2);border-radius:7px;min-height:28px;padding:0 9px;cursor:pointer;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--fg);font-weight:700}
.proto .note{color:var(--ink-fg-3)}

/* frame + shell */
.frame{container-type:inline-size;container-name:app;margin:0 auto;width:100%;background:var(--bg);position:relative}
.frame.phone{width:390px;max-width:100%;margin-block:20px;border:1px solid var(--line-strong);border-radius:28px;overflow:hidden;box-shadow:0 10px 40px rgba(21,23,26,.12)}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 50px)}
.side{background:var(--ink);color:var(--ink-fg-2);padding:18px 14px 20px;display:flex;flex-direction:column;gap:18px;position:sticky;top:50px;height:calc(100vh - 50px);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 6px;color:var(--ink-fg);text-decoration:none}
.brand-mark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--fg);font-weight:800;font-stretch:125%;font-size:10px;flex:none}
.brand-name{font-weight:800;font-stretch:125%;font-size:15px}
.client{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 10px;border-radius:12px;background:var(--ink-2);border:1px solid var(--ink-line);color:var(--ink-fg);text-align:left;width:100%}
.client-av{display:inline-grid;place-items:center;flex:none;width:32px;height:32px;border-radius:9px;background:#1E2550;color:#E9DFC9;font-weight:800}
.client .t{flex:1;min-width:0;display:flex;flex-direction:column}
.client small{font-size:12px;color:#8BD7A9}
.navgrp{display:flex;flex-direction:column;gap:2px}
.navlab{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink-fg-3);padding:0 10px 6px}
.nav{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 10px;border-radius:10px;border:0;background:transparent;color:var(--ink-fg-2);font-weight:500;cursor:pointer;text-align:left;width:100%}
.nav svg{stroke:var(--ink-fg-3)}
.nav:hover{background:var(--ink-2)}
.nav[aria-current="page"]{background:var(--ink-3);color:#fff;font-weight:700}
.nav[aria-current="page"] svg{stroke:var(--accent)}
.badge{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--fg);background:var(--accent);border-radius:999px;padding:1px 7px}
.soon-mini{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-fg-3);border:1px dashed var(--ink-fg-3);border-radius:999px;padding:0 6px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--ink-line);padding-top:12px}
.me{display:flex;align-items:center;gap:10px;padding:0 6px}
.me-av{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:999px;background:var(--ink-line);color:var(--ink-fg);font-weight:700;font-size:13px;flex:none}
.me .t{min-width:0;flex:1} .me b{color:var(--ink-fg);display:block;font-weight:600} .me small{font-size:12px;color:var(--ink-fg-3)}
.lang{display:inline-flex;border:1px solid var(--ink-line);border-radius:8px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;color:var(--ink-fg-3);font-family:var(--mono);font-size:11px;min-height:30px;padding:0 8px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink-3);color:var(--ink-fg)}
.topm{display:none}
main.work{min-width:0;padding:24px 32px 80px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--fg-3);text-transform:uppercase}
.h1{margin:0;font-size:30px;line-height:1.1;font-weight:800;font-stretch:125%;letter-spacing:-.015em;text-wrap:balance}
.lede{margin:0;color:var(--fg-3);max-width:640px;text-wrap:pretty}
.muted{color:var(--fg-3)} .small{font-size:13px} .tiny{font-size:12px}
.headrow{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.head{display:flex;flex-direction:column;gap:6px;min-width:0}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid transparent;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-sm{min-height:36px;padding:0 12px;border-radius:10px;font-size:13px}
.btn-accent{background:var(--accent);color:var(--fg)} .btn-accent:hover{background:#BDE52F}
.btn-ink{background:var(--fg);color:var(--on-ink-btn)}
.btn-out{background:var(--card);border-color:var(--line-strong);font-weight:600} .btn-out:hover{border-color:var(--fg)}
.btn-ghost{background:transparent;color:var(--fg-btn);font-weight:600} .btn-ghost:hover{background:var(--card-2)}
.btn-icon{width:36px;min-height:36px;padding:0;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;height:fit-content}
.t-ok{background:var(--ok-bg);color:var(--ok)} .t-warn{background:var(--warn-bg);color:var(--warn)} .t-info{background:var(--info-bg);color:var(--info)}
.t-neutral{background:var(--card-2);color:var(--fg-2);border:1px solid var(--line-soft)}
.t-win{background:var(--fg);color:var(--accent)}
.t-hm{background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent-edge);font-family:var(--mono);font-size:10px}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;border:1px solid;flex-wrap:wrap}
.alert .a-body{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 240px}
.al-bad{background:var(--bad-bg);border-color:var(--bad-edge);color:#5E1E06}
.al-info{background:var(--info-bg);border-color:var(--info-line);color:#1D2F7A}
.lseg{display:inline-flex;gap:2px;background:var(--card-2);border:1px solid var(--line);border-radius:11px;padding:2px;flex:none}
.lseg button{border:0;background:transparent;color:var(--fg-btn);border-radius:9px;min-height:32px;padding:0 10px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.lseg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 0 0 1px var(--line-strong)}

/* ===== stage ===== */
.stage{position:relative;height:660px;border-radius:var(--r-panel);background:var(--stage);overflow:hidden;color:var(--ink-body);isolation:isolate}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.stage canvas.grab{cursor:grabbing} .stage canvas.hov{cursor:pointer}
.ov-tl,.ov-tr,.ov-bl,.ov-br{position:absolute;z-index:3;display:flex;gap:8px;pointer-events:none}
.ov-tl>*,.ov-tr>*,.ov-bl>*,.ov-br>*{pointer-events:auto}
.ov-tl{top:14px;left:14px;flex-direction:column;align-items:flex-start;max-width:min(520px,calc(100% - 28px))}
.ov-tr{top:14px;right:14px;align-items:center}
.ov-bl{bottom:14px;left:14px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 28px)}
.ov-br{bottom:14px;right:14px}
.glass{background:rgba(22,25,28,.82);border:1px solid var(--ink-line);border-radius:12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.knows{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;cursor:pointer;color:var(--ink-fg);text-align:left}
.knows:hover{border-color:#454a52}
.knows .t{display:flex;flex-direction:column} .knows small{color:var(--ink-fg-3);font-size:12px}
.mring{width:40px;height:40px;position:relative;flex:none}
.mring svg{width:40px;height:40px;transform:rotate(-90deg)}
.mring circle{fill:none;stroke-width:5}
.mring .tr{stroke:var(--ink-line)} .mring .pr{stroke:var(--accent);stroke-linecap:round}
.mring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:600}
.ssearch{display:flex;align-items:center;gap:8px;padding:0 10px;min-height:38px;width:300px;max-width:100%;color:var(--ink-fg-2);position:relative}
.ssearch input{border:0;outline:0;background:transparent;color:var(--ink-fg);flex:1;min-width:0;min-height:36px}
.ssearch input::placeholder{color:var(--ink-fg-3)}
.ssearch kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--ink-line);border-radius:5px;padding:0 5px;color:var(--ink-fg-3)}
.sres{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:6;padding:6px;display:flex;flex-direction:column;max-height:320px;overflow:auto}
.sres button{display:flex;align-items:center;gap:10px;min-height:40px;padding:4px 8px;border:0;background:transparent;border-radius:8px;color:var(--ink-fg);text-align:left;cursor:pointer}
.sres button:hover,.sres button.on{background:var(--ink-3)}
.sres .d{width:8px;height:8px;border-radius:999px;flex:none}
.sres .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sres small{color:var(--ink-fg-3);font-size:11px;font-family:var(--mono)}
.tools{display:flex;gap:2px;padding:3px}
.tool{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 10px;border:0;border-radius:9px;background:transparent;color:var(--ink-fg-2);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.tool:hover{background:var(--ink-3);color:var(--ink-fg)}
.tool[aria-pressed="true"]{background:var(--ink-3);color:var(--ink-fg)}
.tool kbd{font-family:var(--mono);font-size:10px;color:var(--ink-fg-3);border:1px solid var(--ink-line);border-radius:4px;padding:0 4px}
.cats{display:flex;gap:4px;flex-wrap:wrap;padding:4px}
.cat{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 10px;border-radius:999px;border:1px solid transparent;background:transparent;color:var(--ink-fg);cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
.cat:hover{background:var(--ink-3)}
.cat i{width:9px;height:9px;border-radius:999px;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
.cat .n{font-family:var(--mono);font-size:11px;color:var(--ink-fg-3)}
.cat[aria-pressed="false"]{color:var(--ink-fg-3)} .cat[aria-pressed="false"] i{background:transparent;box-shadow:none;border:1.5px solid var(--c)}
.cat.ghost{border:1px dashed var(--ink-line);color:var(--ink-fg-3);cursor:help}
.cat.ghost i{background:transparent;box-shadow:none;border:1.5px dashed var(--c)}
.cat.win i{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.stat{font-family:var(--mono);font-size:11px;color:var(--ink-fg-3);padding:6px 10px}
.hover{position:absolute;z-index:4;pointer-events:none;transform:translate(14px,14px);padding:8px 10px;max-width:280px;display:flex;flex-direction:column;gap:2px;font-size:12px}
.hover b{color:var(--ink-fg);font-size:13px} .hover span{color:var(--ink-fg-3)}
.hint{position:absolute;z-index:3;left:50%;bottom:64px;transform:translateX(-50%);padding:14px 16px;max-width:min(460px,calc(100% - 28px));display:flex;flex-direction:column;gap:8px;color:var(--ink-fg-2)}
.hint b{color:var(--ink-fg)}
.centerload{position:absolute;inset:0;display:grid;place-items:center;z-index:3;pointer-events:none}
.centerload div{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink-fg-2);font-size:13px;margin-top:180px}
.cinema-exit{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:5;padding:6px 12px;font-size:12px;color:var(--ink-fg-3)}
.stage.cine{position:fixed;inset:0;height:auto;border-radius:0;z-index:80}
.layer.phone .stage.cine,.frame.phone .stage.cine{left:50%;right:auto;width:390px;max-width:100%;transform:translateX(-50%)}

/* drawer (light card over the stage, right) */
.drawer{position:absolute;z-index:7;top:12px;right:12px;bottom:12px;width:400px;max-width:calc(100% - 24px);background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;animation:dr .18s ease-out}
@keyframes dr{from{opacity:0;transform:translateX(12px)}}
.dr-h{display:flex;gap:10px;align-items:flex-start;padding:14px 14px 10px 16px;border-bottom:1px solid var(--line-soft)}
.dr-h .head{flex:1;gap:4px}
.dr-h h2{margin:0;font-size:18px;font-weight:800;font-stretch:112%;letter-spacing:-.01em;text-wrap:balance}
.dr-cat{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--fg-3);text-transform:uppercase}
.dr-cat i{width:9px;height:9px;border-radius:999px;background:var(--c);border:1px solid rgba(0,0,0,.15)}
.dr-b{flex:1;overflow:auto;padding:14px 16px 18px;display:flex;flex-direction:column;gap:14px}
.dr-f{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line-soft);background:var(--card)}
.dr-f .btn{flex:1 1 auto}
.quote{font-size:17px;font-weight:700;line-height:1.3;text-wrap:balance;border-left:3px solid var(--line-strong);padding-left:12px}
.prose{color:var(--fg-2);white-space:pre-line}
.kvs{display:flex;flex-direction:column}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line-soft);font-size:13px}
.kv:first-child{border-top:0}
.kv span:first-child{color:var(--fg-3)} .kv span:last-child{font-weight:600;text-align:right}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.metrics div{background:var(--card-2);border:1px solid var(--line-soft);border-radius:10px;padding:8px;display:flex;flex-direction:column;min-width:0}
.metrics small{font-size:11px;color:var(--fg-3)} .metrics span{font-family:var(--mono);font-weight:600;font-size:14px}
.conn-g{display:flex;flex-direction:column;gap:2px}
.conn-g .gt{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--fg-3);padding:4px 0}
.conn-g .gt i{width:8px;height:8px;border-radius:999px;background:var(--c);border:1px solid rgba(0,0,0,.15)}
.conn{display:flex;align-items:center;gap:8px;min-height:36px;padding:4px 8px;border-radius:8px;border:0;background:transparent;text-align:left;cursor:pointer;width:100%}
.conn:hover{background:var(--card-2)}
.conn .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.conn .k{font-family:var(--mono);font-size:10px;color:var(--fg-3);white-space:nowrap}
.sec-t{font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.player{position:relative;width:100%;max-width:240px;aspect-ratio:9/16;border-radius:12px;background:var(--t,#1E2550);overflow:hidden;align-self:center;display:grid;place-items:center;border:0;cursor:pointer;color:#fff}
.player .pl{width:54px;height:54px;border-radius:999px;background:rgba(0,0,0,.45);display:grid;place-items:center}
.player .cap{position:absolute;left:10px;right:10px;bottom:34px;font-weight:800;font-size:15px;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.6);line-height:1.2}
.player .pbar{position:absolute;left:10px;right:10px;bottom:14px;height:4px;border-radius:999px;background:rgba(255,255,255,.3);overflow:hidden}
.player .pbar i{display:block;height:100%;width:0;background:#fff}
.player.playing .pbar i{animation:play 9s linear forwards}
.player.playing .pl{opacity:0}
.player .ex{position:absolute;top:8px;left:8px;font-family:var(--mono);font-size:9px;background:rgba(0,0,0,.45);padding:1px 6px;border-radius:999px}
@keyframes play{to{width:100%}}
.bsec{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line-soft)}
.bsec:first-child{border-top:0;padding-top:0}
.bsec .ck{width:24px;height:24px;border-radius:999px;display:inline-grid;place-items:center;flex:none;border:1.5px solid var(--control);color:var(--fg-3)}
.bsec .ck.ok{background:var(--accent);border-color:var(--accent);color:var(--fg)}
.bsec .ck.part{background:var(--warn-bg);border-color:var(--warn-bg);color:var(--warn)}
.bsec .t{flex:1;min-width:0;display:flex;flex-direction:column} .bsec small{color:var(--fg-3);font-size:13px}

/* gallery (inside the stage) */
.gallery{position:absolute;inset:0;z-index:6;background:rgba(14,16,18,.96);display:flex;flex-direction:column;padding:16px;gap:12px;overflow:hidden}
.gal-h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.gal-h h2{margin:0;font-size:18px;font-weight:800;color:var(--ink-fg);font-stretch:112%}
.gal-h .sp{flex:1}
.chips{display:flex;gap:4px;flex-wrap:wrap}

   ${NODES.some(n=>n.cat==='creative'||n.cat==='ad')?`<button class="tool" data-act="gallery" aria-pressed="${S.gallery}">${ic('grid',14)}${T('gallery')} <kbd>G</kbd></button>`:''}
   <button class="tool" data-act="grow">${ic('grow',14)}${T('grow')} <kbd>D</kbd></button>
   <button class="tool" data-act="cinema">${ic('expand',14)}<span class="sr">${T('cinema')}</span><kbd>C</kbd></button>
   <button class="tool" data-act="motion" aria-pressed="${!S.motion}" title="${S.motion?T('pause'):T('play')}">${ic(S.motion?'pause':'play',14)}<span class="sr">${S.motion?T('pause'):T('play')}</span></button></div></div>
  <div class="ov-bl">${catChips()}</div>
  <div class="ov-br"><span class="stat glass">${T('nodes',{n:vis,l:lk})}${st==='nometa'?'':' · '+T('synced')}</span></div>`}
  ${isNew&&!S.sel&&!S.tour&&!S.cinema?`<div class="hint glass"><b>${T('newT')}</b><span>${T('newB')}</span><div><button class="btn btn-accent btn-sm" data-act="toast:Opens New concepts">${T('newCta')}</button></div></div>`:''}
  ${S.gallery&&!S.cinema?gallery():''}
  ${S.tour?coach():''}
  ${(S.sel||S.knows)&&!S.cinema&&!narrow()&&!S.gallery?`<aside class="drawer" role="dialog" aria-labelledby="drt">${drawer()}</aside>`:''}
 </div>`}
function coach(){return `<div class="coach" role="dialog" aria-modal="true" aria-labelledby="cot"><div class="ce"><span class="eyebrow">Tour · 1 of 5</span><span class="dots"><i class="on"></i><i></i><i></i><i></i><i></i></span></div><h3 id="cot">${T('tourT',{c:'Mooncloth'})}</h3><p>${T('tourB')}</p><div class="cb"><span></span><button class="btn btn-ink btn-sm" data-act="tourNext">Next</button></div></div>`}

function gallery(){
 const items=NODES.filter(n=>(n.cat==='creative'||n.cat==='ad')&&n.fmt==='video');
 const offs=[['all','All offers'],['o1','Sleep mask'],['o2','Silk bundle'],['o3','60-night trial']];
 const sts=[['all','All'],['win','Winners'],['running','Running on Meta'],['approved','Approved'],['review','In review']];
 const okS=n=>S.gStat==='all'||(S.gStat==='win'&&n.win)||(S.gStat==='running'&&n.cat==='ad')||(S.gStat==='approved'&&n.status==='approved')||(S.gStat==='review'&&n.status==='in review');
 const list=items.filter(n=>(S.gOffer==='all'||n.offer===S.gOffer)&&okS(n)).sort((a,b)=>(b.win?1:0)-(a.win?1:0)||(b.spend||0)-(a.spend||0));
 return `<div class="gallery" role="dialog" aria-labelledby="galt"><div class="gal-h"><h2 id="galt">${T('gallery')}</h2><span class="stat">${list.length} · Winners first</span><span class="sp"></span><button class="tool" data-act="gallery">${ic('x',14)}${T('close')}</button></div>
 <div class="chips">${offs.map(([k,l])=>`<button class="chip" data-act="goff:${k}" aria-pressed="${S.gOffer===k}">${l}</button>`).join('')}</div>
 <div class="chips">${sts.map(([k,l])=>`<button class="chip" data-act="gst:${k}" aria-pressed="${S.gStat===k}">${l}<span class="n">${items.filter(n=>(S.gOffer==='all'||n.offer===S.gOffer)&&(k==='all'||(k==='win'&&n.win)||(k==='running'&&n.cat==='ad')||(k==='approved'&&n.status==='approved')||(k==='review'&&n.status==='in review'))).length}</span></button>`).join('')}</div>
 <div class="ggrid">${list.map(n=>`<button class="gcard ${n.win?'win':''}" data-act="gsel:${n.id}"><span class="pv" style="--t:${n.t}"><span class="st">${n.win?'<span class="tag t-win">Winner</span>':''}${n.hm?'<span class="tag t-hm">HM</span>':''}${n.cat==='creative'?`<span class="tag t-neutral">${n.status}</span>`:''}</span><span class="cp">${esc((byId.get(n.hook)||{}).title||'')}</span><span class="du">${n.cat==='ad'?'$'+n.spend.toLocaleString('en-US'):'0:'+n.dur}</span></span><b>${esc(n.title)}</b><small>${n.cat==='ad'?'CPA $'+n.cpa.toFixed(2):n.engine}</small></button>`).join('')||'<span class="stat">Nothing with these filters.</span>'}</div></div>`}

function drawer(){
 if(S.knows&&!S.sel)return knowsDrawer();
 const n=byId.get(S.sel);if(!n)return '';
 if(n.cat==='core')return knowsDrawer();
 const cat=catOf(n.cat),ro=S.role==='client';
 let body='',acts=[];
 const metrics=n.cat==='ad'?`<div class="metrics"><div><small>Spend 30 d</small><span>$${n.spend.toLocaleString('en-US')}</span></div><div><small>CPA</small><span>$${n.cpa.toFixed(2)}</span></div><div><small>CTR</small><span>${n.ctr.toFixed(2)}%</span></div><div><small>Hook rate</small><span>${n.hr==null?'—':n.hr.toFixed(1)+'%'}</span></div></div>`:'';
 const chips=[n.win?'<span class="tag t-win">Winner</span>':'',n.trend==='working'?'<span class="tag t-ok">Working</span>':n.trend==='tiring'?'<span class="tag t-warn">Tiring</span>':n.trend==='steady'&&n.cat==='ad'?'<span class="tag t-neutral">Steady</span>':'',n.hm?'<span class="tag t-hm">HOOKMILL</span>':'',n.status?`<span class="tag ${n.status==='approved'?'t-ok':n.status==='in review'?'t-info':'t-neutral'}">${n.status}</span>`:''].join('');
 const player=(n.fmt==='video')?`<button class="player ${S.playing===n.id?'playing':''}" style="--t:${n.t}" data-act="play:${n.id}" aria-label="Play ${esc(n.title)}"><span class="ex">EXAMPLE</span><span class="pl">${ic('play',22)}</span><span class="cap">${esc((byId.get(n.hook)||{}).title||'')}</span><span class="pbar"><i></i></span></button>`:n.fmt==='image'?`<div class="player" style="--t:${n.t};aspect-ratio:1/1;cursor:default"><span class="ex">IMAGE AD</span></div>`:'';
 if(['business','offer','audience','goal'].includes(n.cat)){body=`<div class="prose">${esc(n.body)}</div><span class="muted small">From setup · step ${n.step} of 6</span>`;if(!ro)acts.push(`<button class="btn btn-ink" data-act="toast:Opens /onboarding/step-${n.step}?mode=edit (Edit setup), back to Brain on Save and exit">${T('editSetup')}</button>`)}
 else if(n.cat==='hook'){const ads=(adj.get(n.id)||[]).map(e=>byId.get(e.o)).filter(o=>o.cat==='ad');const best=ads.sort((a,b)=>a.cpa-b.cpa)[0];
  body=`<div class="quote">${esc(n.title)}</div><div class="kvs"><div class="kv"><span>Angle</span><span>${n.angle}</span></div><div class="kv"><span>Scripts</span><span>${(adj.get(n.id)||[]).filter(e=>byId.get(e.o).cat==='script').length}</span></div><div class="kv"><span>Meta ads using it</span><span>${ads.length}</span></div>${best?`<div class="kv"><span>Best CPA</span><span>$${best.cpa.toFixed(2)}</span></div>`:''}</div>`;
  if(!ro)acts.push(`<button class="btn btn-ink" data-act="toast:Opens New concepts with this hook pre-filled">${T('newConcept')}</button>`)}
 else if(n.cat==='script'){body=`<div class="prose">${esc(n.body)}</div>`;if(!ro)acts.push(`<button class="btn btn-out" data-act="toast:Opens the creative wizard on this script">Open script</button>`)}
 else if(n.cat==='creative'){body=`<div style="display:flex;flex-wrap:wrap;gap:6px">${chips}</div>${player}<div class="kvs"><div class="kv"><span>Engine</span><span>${n.engine}</span></div><div class="kv"><span>Length</span><span>0:${n.dur}</span></div><div class="kv"><span>Cost</span><span>$${n.cost}</span></div>${n.iterOf?`<div class="kv"><span>Iterated from</span><span>${esc(byId.get(n.iterOf).title)}</span></div>`:''}</div>`;
  acts.push(`<button class="btn btn-ink" data-act="toast:Opens /creatives/${n.id}">${T('openCreative')}</button>`);if(!ro&&n.status==='approved'&&!(adj.get(n.id)||[]).some(e=>e.k==='published'))acts.push(`<button class="btn btn-out" data-act="toast:Opens Send to Meta for this creative">${T('sendMeta')}</button>`)}
 else if(n.cat==='ad'){body=`<div style="display:flex;flex-wrap:wrap;gap:6px">${chips}</div>${player}${metrics}<div class="kvs"><div class="kv"><span>Running</span><span>${n.days} days</span></div><div class="kv"><span>Hook</span><span>${esc((byId.get(n.hook)||{}).title||'—')}</span></div></div>`;
  if(!ro&&n.fmt==='video')acts.push(`<button class="btn ${n.win?'btn-accent':'btn-out'}" data-act="toast:POST /iterate { metaAdId } → Iterate wizard">${ic('iter',14)}${n.win?T('iterateW'):T('iterate')}</button>`);
  acts.push(`<button class="btn btn-out" data-act="toast:Opens /campaigns with this ad selected">${T('campaigns')}</button>`)}
 // connections grouped by category
 const groups={};(adj.get(n.id)||[]).forEach(e=>{const o=byId.get(e.o);(groups[o.cat]=groups[o.cat]||[]).push({o,k:e.k})});
 const conn=Object.keys(groups).length?`<div class="sec-t">${T('connections')} <span class="muted tiny num">${n.deg}</span></div>${[{id:'core',c:'#C8F03C',en:'Client'},...CATS].filter(c=>groups[c.id]).map(c=>`<div class="conn-g"><span class="gt" style="--c:${c.c}"><i></i>${c.id==='core'?'Client':catL(c)} (${groups[c.id].length})</span>${groups[c.id].slice(0,8).map(x=>`<button class="conn" data-act="sel:${x.o.id}"><span class="t">${esc(x.o.title)}</span><span class="k">${EDGE[S.lang][x.k]}</span></button>`).join('')}${groups[c.id].length>8?`<span class="muted tiny" style="padding:4px 8px">and ${groups[c.id].length-8} more</span>`:''}</div>`).join('')}`:'';
 return `<div class="dr-h"><div class="head"><span class="dr-cat" style="--c:${cat.c}"><i></i>${catL(cat)}${n.angle?' · '+n.angle:''}</span><h2 id="drt">${esc(n.title)}</h2></div><button class="btn btn-ghost btn-icon" data-act="close" aria-label="${T('close')}">${ic('x',18)}</button></div>
  <div class="dr-b">${body}${conn}</div>${acts.length?`<div class="dr-f">${acts.join('')}</div>`:''}`}
function knowsDrawer(){
 const isNew=S.state==='new';
 const secs=[['Business & offer','ok','Online store · Sleep products · the weighted mask offer'],['Audience',isNew?'part':'ok',isNew?'Missing: 2 more segments, objections':'4 segments'],['Proof',isNew?'empty':'part',isNew?'Missing: reviews or numbers':'Missing: numbers you can show on screen'],['Custom instructions',isNew?'empty':'empty','Missing: words to use and never use'],['Goals','ok','CPA ≤ $22 · $15,000 a month · purchases']];
 return `<div class="dr-h"><div class="head"><span class="dr-cat" style="--c:#C8F03C"><i></i>Mooncloth</span><h2 id="drt">${T('knowsT')}</h2></div><button class="btn btn-ghost btn-icon" data-act="close" aria-label="${T('close')}">${ic('x',18)}</button></div>
 <div class="dr-b"><div style="display:flex;gap:12px;align-items:center">${ring(isNew?33:BRAIN_PCT)}<span class="muted small">The same 5 sections as setup. Fill what's missing and every new script gets sharper.</span></div>
 <div>${secs.map(s=>`<div class="bsec"><span class="ck ${s[1]==='ok'?'ok':s[1]==='part'?'part':''}">${s[1]==='ok'?ic('check',14,2.4):s[1]==='part'?ic('minus',14,2.4):''}</span><span class="t"><b>${s[0]}</b><small>${s[2]}</small></span>${s[1]!=='ok'&&S.role!=='client'?`<button class="btn btn-ghost btn-sm" data-act="toast:Opens the setup step for this section">${T('fill')}</button>`:''}</div>`).join('')}</div></div>
 ${S.role!=='client'?`<div class="dr-f"><button class="btn btn-out" data-act="toast:Opens the wizard in Edit setup mode">${T('revisit')}</button></div>`:''}`}

function listView(){
 const q=S.q.trim().toLowerCase();
 const nogl=S.state==='nogl';
 return `${nogl?`<div class="alert al-info">${ic('alert',18)}<div class="a-body"><span>${T('nogl')}</span></div></div>`:''}
 ${narrow()&&!nogl?`<button class="open3d" data-act="m3d"><span class="mini">${CATS.map((c,i)=>`<i style="background:${c.c};left:${18+Math.cos(i)*20+14}px;top:${18+Math.sin(i*1.7)*18+10}px"></i>`).join('')}</span><span class="t"><b>${T('open3d')}</b><small>${T('open3dSub')}</small></span>${ic('chev')}</button>`:''}
 <div class="ltool"><button class="knows glass" data-act="knows" style="background:var(--stage)">${ring(S.state==='new'?33:BRAIN_PCT)}<span class="t"><b>${T('known',{p:S.state==='new'?33:BRAIN_PCT})}</b><small>${T('missing',{n:S.state==='new'?6:3})}</small></span></button>
 <label class="lsearch">${ic('search')}<span class="sr">${T('search')}</span><input id="lq" placeholder="${T('search')}" value="${esc(S.q)}" autocomplete="off"></label>
 ${!narrow()&&!nogl?`<div class="lseg"><button data-act="view:3d" aria-pressed="false">${T('v3d')}</button><button aria-pressed="true">${T('vlist')}</button></div>`:''}</div>
 <div class="listv">${CATS.map(c=>{const items=NODES.filter(n=>n.cat===c.id&&(!q||(n.title+' '+(n.body||'')).toLowerCase().includes(q))).sort((a,b)=>(b.win?1:0)-(a.win?1:0)||(b.spend||0)-(a.spend||0)||b.deg-a.deg);
  const total=NODES.filter(n=>n.cat===c.id).length;
  return `<details class="lcat" style="--c:${c.c}" ${(q&&items.length)||['offer','hook','ad'].includes(c.id)&&total?'open':''}><summary><i></i>${catL(c)}<span class="n">${total}</span><span class="sp"></span>${ic('chev')}</summary>
  ${items.length?items.slice(0,12).map(n=>`<button class="lrow" data-act="sel:${n.id}">${n.fmt?`<span class="th" style="--t:${n.t};${n.fmt==='image'?'aspect-ratio:1/1':''}"></span>`:''}<span class="t"><b>${esc(n.title)}</b><small>${n.cat==='ad'?`$${n.spend.toLocaleString('en-US')} · CPA $${n.cpa.toFixed(2)}`:n.cat==='creative'?`${n.status} · ${n.engine}`:n.angle||n.deg+' connections'}</small></span>${n.win?'<span class="tag t-win">Winner</span>':''}${n.hm?'<span class="tag t-hm">HM</span>':''}${ic('chev',14)}</button>`).join('')+(items.length>12?`<div class="lempty">and ${items.length-12} more · search to find one</div>`:'')
   :`<div class="lempty">${total?'Nothing matches.':c.id==='ad'?(S.state==='nometa'?'Connect Meta to read your ads.':'Appear after you connect Meta.'):c.id==='creative'?'Appear after your first video.':'Appear after your first concepts.'}</div>`}</details>`}).join('')}</div>`}

function page(){
 const st=S.state;
 const useList=S.view==='list'||st==='nogl'||(narrow()&&!S.m3d);
 const body=useList&&!['loading','error'].includes(st)?listView():stage();
 return shell(header()+body);
}

/* ============ render ============ */
function render(){
 const F=document.getElementById('frame');F.className='frame '+(S.dev==='phone'?'phone':'');
 const qa=document.activeElement&&['bq','lq'].includes(document.activeElement.id)?document.activeElement.id:null;const pos=qa?document.activeElement.selectionStart:0;
 // phone 3D opens as a full-screen stage in the layer
 const phone3d=narrow()&&S.m3d&&!['loading','error','nogl'].includes(S.state);
 F.innerHTML=page().replace(phone3d?/<div class="stage[^]*$/:/$^/,'');
 const L=document.getElementById('layer');L.className='layer '+(S.dev==='phone'?'phone':'');
 let lh='';
 if(phone3d){S.cinemaPrev=S.cinema;lh+=`<div class="sheet-scrim" style="background:#0E1012"></div><div style="position:fixed;inset:0;z-index:84;${S.dev==='phone'?'left:50%;right:auto;width:390px;max-width:100%;transform:translateX(-50%);':''}">${stage().replace('class="stage','class="stage" style="height:100%;border-radius:0" data-x="')}<button class="btn btn-out btn-sm" data-act="m3dclose" style="position:absolute;z-index:9;top:calc(64px + env(safe-area-inset-top,0px));left:14px">${ic('left',14)}${T('vlist')}</button></div>`}
 if((S.sel||S.knows)&&(narrow()||S.view==='list'||S.state==='nogl'||S.gallery))lh+=`<div class="sheet-scrim" data-act="close"></div><div class="sheet"><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drt">${drawer()}</aside></div>`;
 L.innerHTML=lh;
 if(qa){const q=document.getElementById(qa);if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}}
 ['bq','lq'].forEach(id=>{const el=document.getElementById(id);if(el){el.oninput=e=>{S.q=e.target.value;S.qi=0;render()};el.onkeydown=e=>{const r=searchList();if(e.key==='ArrowDown'){S.qi=Math.min(r.length-1,S.qi+1);render();e.preventDefault()}if(e.key==='ArrowUp'){S.qi=Math.max(0,S.qi-1);render();e.preventDefault()}if(e.key==='Enter'&&r[S.qi]&&id==='bq'){select(r[S.qi].id);S.q='';render()}if(e.key==='Escape'){S.q='';el.blur();render()}}}});
 wireCanvas();
 document.getElementById('pstate').value=S.state;
 document.querySelectorAll('#prole button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.role));
 document.querySelectorAll('#ptour button').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.v==='on')===S.tour));
 document.querySelectorAll('#pdev button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.dev));
}
function select(id){S.sel=id;S.knows=false;S.gallery=false;S.playing=null;const n=byId.get(id);if(n.cat!=='core'&&!S.cats.has(n.cat))S.cats.add(n.cat);if(S.winners&&!winSet.has(id))S.winners=false;flyTo(n);render()}
function load(kind){build(kind);S.cats=new Set(CATS.map(c=>c.id));winSet=null;pickHubs();S.sel=null;S.knows=false;S.gallery=false}
function startGrow(dur){G.grow={start:performance.now(),dur:S.motion?dur:1};G.ty=null;G.dist=1450;setTimeout(()=>{G.td=1250;G.ty=G.yaw;G.tp=G.pitch},200)}
const toastEl=document.getElementById('toast');let tt;function toast(m){toastEl.textContent=m;toastEl.hidden=false;clearTimeout(tt);tt=setTimeout(()=>toastEl.hidden=true,2600)}

function onAct(e){
 const b=e.target.closest('[data-act]');if(!b)return;e.preventDefault();
 const [k,v]=b.dataset.act.split(/:(.*)/s);
 switch(k){
  case 'noop':return;
  case 'toast':toast(v);return;
  case 'lang':S.lang=v;render();return;
  case 'nav':if(v!=='brain')toast('Goes to '+v);return;
  case 'state':S.state=v;load(v==='new'?'new':v==='nometa'?'nometa':'full');render();return;
  case 'cat':{if(e.shiftKey||e.altKey)S.cats=new Set([v]);else if(S.cats.has(v)&&S.cats.size===1)S.cats=new Set(CATS.map(c=>c.id));else S.cats.has(v)?S.cats.delete(v):S.cats.add(v);if(S.sel&&!visible(byId.get(S.sel)))S.sel=null;render();return}
  case 'winners':S.winners=!S.winners;computeWin();if(S.sel&&!visible(byId.get(S.sel)))S.sel=null;render();return;
  case 'sel':S.q='';select(v);return;
  case 'gsel':select(v);return;
  case 'close':S.sel=null;S.knows=false;S.playing=null;G.ty=G.yaw;G.tp=-.22;G.td=1250;render();return;
  case 'knows':S.knows=true;S.sel=null;S.gallery=false;render();return;
  case 'gallery':S.gallery=!S.gallery;S.sel=null;S.knows=false;render();return;
  case 'goff':S.gOffer=v;render();return;
  case 'gst':S.gStat=v;render();return;
  case 'grow':S.sel=null;S.gallery=false;S.knows=false;render();startGrow(9000);return;
  case 'cinema':S.cinema=!S.cinema;S.sel=null;S.gallery=false;render();return;
  case 'motion':S.motion=!S.motion;render();return;
  case 'view':S.view=v;S.sel=null;render();return;
  case 'play':S.playing=S.playing===v?null:v;render();return;
  case 'm3d':S.m3d=true;S.sel=null;render();return;
  case 'm3dclose':S.m3d=false;S.sel=null;render();return;
  case 'tourNext':S.tour=false;render();toast('Tour stop 2: Iterate a winner');return;
 }
}
document.getElementById('frame').addEventListener('click',onAct);
document.getElementById('layer').addEventListener('click',onAct);
document.addEventListener('keydown',e=>{
 const typing=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);
 if(e.key==='Escape'){if(S.cinema){S.cinema=false;render()}else if(S.sel||S.knows){S.sel=null;S.knows=false;render()}else if(S.gallery){S.gallery=false;render()}return}
 if(typing||S.tour)return;
 if(e.key==='/'){const q=document.getElementById('bq')||document.getElementById('lq');if(q){e.preventDefault();q.focus()}}
 else if(e.key==='g'||e.key==='G'){S.gallery=!S.gallery;S.sel=null;render()}
 else if(e.key==='d'||e.key==='D'){S.sel=null;render();startGrow(9000)}
 else if(e.key==='c'||e.key==='C'){if(S.view==='3d'){S.cinema=!S.cinema;render()}}
});
const ps=document.getElementById('pstate');STATES.forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;ps.appendChild(o)});
ps.addEventListener('change',e=>{S.state=e.target.value;S.view='3d';S.m3d=false;load(S.state==='new'?'new':S.state==='nometa'?'nometa':'full');render()});
document.getElementById('prole').addEventListener('click',e=>{const b=e.target.closest('button');if(b){S.role=b.dataset.v;render()}});
document.getElementById('ptour').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.tour=b.dataset.v==='on';S.sel=null;S.gallery=false;S.knows=false;S.cinema=false;S.view='3d';if(S.tour&&narrow())S.m3d=true;render();if(S.tour){startGrow(6000)}});
document.getElementById('pdev').addEventListener('click',e=>{const b=e.target.closest('button');if(b){S.dev=b.dataset.v;S.m3d=false;S.sel=null;render()}});
try{if(location.hash==='#phone')S.dev='phone'}catch(_){}
load('full');render();requestAnimationFrame(draw);
})();
</script>
