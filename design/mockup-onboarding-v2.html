<title>HookMill Onboarding v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: same shell as fase2 (dark sidebar + light work area). New here: a minimal shell for signup → mode → wizard → resume,
   a route-based first-run tour drawn over the real screens, and the Home scoreboard. Single light theme by decision (12/10). */
:root{
  --bg:#EEEEEA; --card:#FDFDFB; --card-2:#F3F4F0; --input:#FFFFFF;
  --line:#DCDDD7; --line-soft:#E4E5E0; --line-strong:#CFD1CB; --control:#B9BCB5; --sep:#9A9F96;
  --fg:#15171A; --fg-2:#3B4047; --fg-3:#5A6068; --fg-btn:#4A5058; --on-ink-btn:#FFFFFF;
  --accent:#C8F03C; --accent-ink:#3E5200; --accent-soft:#F0F8D2; --accent-edge:#A9CC2A;
  --ink:#16181B; --ink-2:#202328; --ink-3:#2A2E33; --ink-line:#2E3238; --ink-fg:#F2F3EE; --ink-fg-2:#C5CAD0; --ink-fg-3:#9AA1A9; --ink-body:#E8EAE4;
  --ok-bg:#E2F3E8; --ok:#0B6B43; --ok-dot:#1C9A5E;
  --warn-bg:#FBF0D3; --warn:#7A5000; --warn-line:#E9C76B; --warn-dot:#D9A21B;
  --bad-bg:#FBE7DD; --bad:#A8360C; --bad-edge:#E4B9A6;
  --info-bg:#E6EBFC; --info:#2B4BC8; --info-on-ink:#8FA6FF;
  --meta:#1877F2;
  --font:'Archivo','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r-chip:8px; --r-ctl:10px; --r-btn:12px; --r-card:16px; --r-panel:18px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;font-family:var(--font);font-size:14px;line-height:1.45;color:var(--fg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
a{color:var(--fg)} a:hover{color:var(--accent-ink)}
.mono{font-family:var(--mono)} .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg{flex:none}

/* ---------- prototype bar (not product) ---------- */
.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--ink);color:var(--ink-fg-2);border-bottom:1px solid var(--ink-line);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:12px}
.proto b{color:var(--ink-fg);font-family:var(--mono);font-size:11px;letter-spacing:.08em}
.proto select{background:var(--ink-2);color:var(--ink-fg);border:1px solid var(--ink-line);border-radius:8px;min-height:32px;padding:0 8px;font:inherit;max-width:100%}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--ink-2);border:1px solid var(--ink-line);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;color:var(--ink-fg-2);border-radius:7px;min-height:28px;padding:0 10px;cursor:pointer;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--fg);font-weight:700}
.proto .note{margin-left:auto;color:var(--ink-fg-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- frame ---------- */
.stagewrap{padding-block:0}
.frame{container-type:inline-size;container-name:app;margin:0 auto;width:100%;background:var(--bg);position:relative}
.frame.phone{width:390px;max-width:100%;margin-block:20px;border:1px solid var(--line-strong);border-radius:28px;overflow:hidden;box-shadow:0 10px 40px rgba(21,23,26,.12)}
.frame.touring{overflow:hidden}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 50px)}
.side{background:var(--ink);color:var(--ink-fg-2);padding:18px 14px 20px;display:flex;flex-direction:column;gap:18px;position:sticky;top:50px;height:calc(100vh - 50px);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 6px;color:var(--ink-fg);text-decoration:none}
.brand-mark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--fg);font-weight:800;font-stretch:125%;font-size:10px;flex:none}
.brand-name{font-weight:800;font-stretch:125%;font-size:15px;letter-spacing:-.01em}
.client{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 10px;border-radius:12px;background:var(--ink-2);border:1px solid var(--ink-line);color:var(--ink-fg);cursor:pointer;text-align:left;width:100%}
.client-av{display:inline-grid;place-items:center;flex:none;width:32px;height:32px;border-radius:9px;background:#1E2550;color:#E9DFC9;font-weight:800}
.client .t{flex:1;min-width:0;display:flex;flex-direction:column}
.client b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.client small{display:block;font-size:12px;color:var(--ink-fg-3)}
.wsid{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 10px;border-radius:12px;background:var(--ink-2);border:1px solid var(--ink-line);color:var(--ink-fg)}
.wsid .t{flex:1;min-width:0;display:flex;flex-direction:column}
.wsid b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsid small{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-fg-3)}
.wsid small.ok{color:#8BD7A9} .wsid small.warn{color:#EFC45A}
.navgrp{display:flex;flex-direction:column;gap:2px}
.navlab{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink-fg-3);padding:0 10px 6px}
.nav{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 10px;border-radius:10px;border:0;background:transparent;color:var(--ink-fg-2);font-weight:500;cursor:pointer;text-align:left;width:100%}
.nav svg{stroke:var(--ink-fg-3)}
.nav:hover{background:var(--ink-2)}
.nav[aria-current="page"]{background:var(--ink-3);color:#fff;font-weight:700}
.nav[aria-current="page"] svg{stroke:var(--accent)}
.badge{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--fg);background:var(--accent);border-radius:999px;padding:1px 7px}
.soon-mini{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink-fg-3);border:1px dashed var(--ink-fg-3);border-radius:999px;padding:0 6px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--ink-line);padding-top:12px}
.me{display:flex;align-items:center;gap:10px;padding:0 6px}
.me-av{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:999px;background:var(--ink-line);color:var(--ink-fg);font-weight:700;font-size:13px;flex:none}
.me .t{min-width:0;flex:1}
.me b{color:var(--ink-fg);font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me small{font-size:12px;color:var(--ink-fg-3)}
.lang{display:inline-flex;border:1px solid var(--ink-line);border-radius:8px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;color:var(--ink-fg-3);font-family:var(--mono);font-size:11px;min-height:30px;padding:0 8px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink-3);color:var(--ink-fg)}
.lang.light{border-color:var(--line-strong)} .lang.light button{color:var(--fg-3)} .lang.light button[aria-pressed="true"]{background:var(--card-2);color:var(--fg)}
.topm{display:none}
main.work{min-width:0;padding:24px max(32px,env(safe-area-inset-right,0px)) 120px max(32px,env(safe-area-inset-left,0px))}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* ---------- minimal shell (mode · wizard · resume) ---------- */
.min{min-height:calc(100vh - 50px);display:flex;flex-direction:column}
.min-top{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px max(32px,env(safe-area-inset-right,0px)) 8px max(32px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:50px;z-index:20}
.min-top .brand{color:var(--fg)}
.min-top .who{display:flex;align-items:center;gap:10px;min-width:0;padding-left:12px;border-left:1px solid var(--line)}
.min-top .who .client-av{width:28px;height:28px;font-size:12px;border-radius:8px}
.min-top .who .t{display:flex;flex-direction:column;min-width:0}
.min-top .who b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.min-top .spacer{flex:1}
.min-body{flex:1;padding:32px max(32px,env(safe-area-inset-right,0px)) 140px max(32px,env(safe-area-inset-left,0px))}
.center{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.center.narrow{max-width:640px}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mode{display:flex;flex-direction:column;gap:12px;padding:22px;border-radius:var(--r-card);border:1.5px solid var(--line);background:var(--card);text-align:left;cursor:pointer;min-height:230px;position:relative}
.mode:hover{border-color:var(--fg)}
.mode[aria-checked="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.mode .mi{width:44px;height:44px;border-radius:12px;background:var(--card-2);display:grid;place-items:center}
.mode[aria-checked="true"] .mi{background:var(--accent)}
.mode h3{margin:0;font-size:19px;font-weight:800;font-stretch:125%;letter-spacing:-.01em}
.mode p{margin:0;color:var(--fg-2)}
.mode ul{margin:0;padding:0 0 0 18px;color:var(--fg-3);font-size:13px;display:grid;gap:4px}
.mode .pick{position:absolute;top:16px;right:16px}

/* progress (wizard) */
.prog{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 18px}
.prog .r1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.prog .r1 .l{display:flex;align-items:baseline;gap:10px;min-width:0}
.prog .pct{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.prog .steps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.prog .stp{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--fg-3);min-width:0;border:0;background:transparent;padding:0;text-align:left;cursor:pointer}
.prog .stp[disabled]{cursor:default}
.prog .stp i{display:block;height:6px;border-radius:999px;background:var(--line)}
.prog .stp.d i{background:var(--fg)} .prog .stp.c i{background:var(--accent);outline:1px solid var(--accent-edge)}
.prog .stp.c{color:var(--fg);font-weight:700}
.prog .stp span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog .m{display:none}

/* ---------- type ---------- */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--fg-3);text-transform:uppercase}
.h1{margin:0;font-size:30px;line-height:1.1;font-weight:800;font-stretch:125%;letter-spacing:-.015em;text-wrap:balance}
.h2{margin:0;font-size:16px;font-weight:700}
.h3{margin:0;font-size:14px;font-weight:700}
.lede{margin:0;color:var(--fg-3);max-width:640px;text-wrap:pretty}
.head{display:flex;flex-direction:column;gap:8px}
.headrow{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.muted{color:var(--fg-3)} .small{font-size:13px} .tiny{font-size:12px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h .h2{display:flex;align-items:center;gap:8px}
.count{font-family:var(--mono);font-size:12px;font-weight:600;background:var(--card-2);border:1px solid var(--line-soft);border-radius:999px;padding:1px 8px}

/* ---------- surfaces ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.sel{border:1.5px solid var(--fg)}
.card.soft{background:var(--accent-soft);border-color:var(--accent-edge)}
.ink{background:var(--ink);color:var(--ink-body);border-radius:var(--r-panel);padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ink .eyebrow{color:var(--ink-fg-2)}
.ink-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ink-list li{display:flex;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--ink-line)}
.ink-list li:last-child{border-bottom:0;padding-bottom:0}
.ink-list span:first-child{color:var(--ink-fg-2)} .ink-list span:last-child{color:#fff;font-weight:600;text-align:right}
.big{font-family:var(--mono);font-size:54px;font-weight:600;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.col-main{flex:999 1 480px;min-width:0;display:flex;flex-direction:column;gap:16px}
.col-side{flex:1 1 300px;max-width:100%;min-width:0;display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.divider{border-top:1px solid var(--line-soft)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line-soft)}
.list li:first-child{border-top:0;padding-top:0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-btn);border:1px solid transparent;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-lg{min-height:50px;padding:0 18px}
.btn-sm{min-height:36px;padding:0 12px;border-radius:10px;font-size:13px}
.btn-accent{background:var(--accent);color:var(--fg)} .btn-accent:hover{background:#BDE52F;color:var(--fg)}
.btn-ink{background:var(--fg);color:var(--on-ink-btn)} .btn-ink:hover{color:var(--on-ink-btn);background:#2A2E33}
.btn-out{background:var(--card);border-color:var(--line-strong);font-weight:600}
.btn-out:hover{border-color:var(--fg)}
.btn-ghost{background:transparent;color:var(--fg-btn);font-weight:600}
.btn-bad{background:var(--card);border-color:var(--bad-edge);color:var(--bad);font-weight:600}
.btn-on-ink{background:transparent;color:var(--ink-body);font-weight:600;border-color:var(--ink-line)}
.btn-meta{background:var(--meta);color:#fff} .btn-meta:hover{background:#1466D1;color:#fff}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.spin{width:16px;height:16px;border-radius:999px;border:2px solid var(--line-strong);border-top-color:var(--fg);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- tags ---------- */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;height:fit-content}
.t-ok{background:var(--ok-bg);color:var(--ok)} .t-warn{background:var(--warn-bg);color:var(--warn)}
.t-bad{background:var(--bad-bg);color:var(--bad)} .t-info{background:var(--info-bg);color:var(--info)}
.t-neutral{background:var(--card-2);color:var(--fg-2);border:1px solid var(--line-soft)}
.t-ink{background:var(--fg);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:999px;background:currentColor;flex:none}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.soon{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;padding:3px 9px;border-radius:999px;background:var(--card);color:var(--fg-2);border:1px dashed var(--control);white-space:nowrap;height:fit-content}
.example{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;padding:2px 7px;border-radius:999px;background:repeating-linear-gradient(135deg,var(--card-2) 0 6px,var(--line-soft) 6px 12px);color:var(--fg-2);border:1px solid var(--line-strong);white-space:nowrap}

/* ---------- alerts ---------- */
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;border:1px solid;flex-wrap:wrap}
.alert .a-body{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 240px}
.alert .a-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.alert b{font-weight:700}
.al-bad{background:var(--bad-bg);border-color:var(--bad-edge);color:#5E1E06}
.al-warn{background:var(--warn-bg);border-color:var(--warn-line);color:#4A3100}
.al-ok{background:var(--ok-bg);border-color:#B7DEC5;color:#0B4D31}
.al-info{background:var(--info-bg);border-color:#C3CEF6;color:#1D2F7A}
.al-neutral{background:var(--card);border-color:var(--line);color:var(--fg-2)}

/* ---------- action bar ---------- */
.actionbar{position:sticky;bottom:0;z-index:5;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:10px 10px 10px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;box-shadow:0 -6px 24px rgba(21,23,26,.06);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.actionbar .hint{flex:1 1 220px;color:var(--fg-2);font-size:13px;min-width:0}
.actionbar .hint.warn{color:var(--warn)}
.actionbar .btns{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- waiting effects ---------- */
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
.beam{position:relative}
.beam::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--a),transparent 0 70%,var(--accent) 82%,var(--info) 92%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:beam 2.4s linear infinite;pointer-events:none}
@keyframes beam{to{--a:360deg}}
@media (prefers-reduced-motion:reduce){.beam::before,.pulse,.spin,.coach,.spot,.ring i{animation:none!important;transition:none!important}.beam::before{background:linear-gradient(90deg,var(--accent),var(--info))}}

/* ---------- bars ---------- */
.bar{height:8px;border-radius:999px;background:var(--line-soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--fg);transition:width .4s ease-out}
.bar.okb i{background:var(--ok-dot)} .bar.lime i{background:var(--accent-edge)} .bar.warnb i{background:var(--warn-dot)}
.ink .bar{background:var(--ink-line)} .ink .bar i{background:var(--accent)}

/* ---------- form bits ---------- */
label.lab{font-weight:700;font-size:13px}
.inp,.ta,.sel{width:100%;border:1px solid var(--line-strong);border-radius:10px;background:var(--input);font:inherit;color:var(--fg);padding:10px 12px;min-height:44px}
.fieldrow{display:flex;flex-direction:column;gap:6px;min-width:0}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fields .full{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--card);font-weight:600;color:var(--fg-btn);cursor:pointer}
.chip.on{background:var(--fg);color:#fff;border-color:var(--fg)}
.radio{width:20px;height:20px;border-radius:999px;border:1.5px solid var(--control);display:inline-grid;place-items:center;flex:none}
.radio.on{border-color:var(--fg)} .radio.on::after{content:"";width:10px;height:10px;border-radius:999px;background:var(--fg)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line-soft);font-size:13px}
.kv:first-child{border-top:0;padding-top:0}
.kv span:first-child{color:var(--fg-3)}

/* ---------- meta connect ---------- */
.acc{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;text-align:left;width:100%}
.acc.on{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.acc.off{cursor:not-allowed} .acc.off .t{opacity:.55}
.acc .t{flex:1;min-width:0;display:flex;flex-direction:column}
.acc .t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .t small{font-family:var(--mono);font-size:12px;color:var(--fg-3)}
.hl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.hl li{display:flex;gap:10px;align-items:flex-start}
.hl .st{width:22px;height:22px;border-radius:999px;display:inline-grid;place-items:center;flex:none;margin-top:1px}

/* ================= 5 · TOUR ================= */
const TOUR=[
 {k:'1 Brain',scr:()=>screenBrain(),target:'#t-brain',title:"We're building Mooncloth's Brain",body:'Everything from setup is already in: business, offer, audience, goals. Every ad starts here. The more it knows, the better the ads; the missing items are a 5-minute job.',pos:'right',anim:true},
 {k:'2 Winner (Meta)',scr:()=>screenIterate(true),target:'#t-winner',title:'This ad is already working',body:'From your Meta account: "I tried 11 sleep masks" costs $19.40 per purchase, 38% under the account average. The fastest win is more versions of it. That is Iterate a winner.',pos:'below'},
 {k:'2 Upload (no Meta)',scr:()=>screenIterate(false),target:'#t-upload',title:'Start from an ad that worked',body:'Drop a video or paste an Ad Library link. We break it down, keep what sells and make new versions. Connect Meta later and your best ad shows up here on its own.',pos:'below'},
 {k:'3 New concepts',scr:()=>screenConcepts(),target:'#t-concepts',title:'Or start from a blank page',body:'New concepts writes scripts from the Brain, picks a face, generates the scenes and edits the video. About 12 minutes, in the background; you get called when it needs you.',pos:'right'},
 {k:'4 Eddy',scr:()=>screenEddy(),target:'#t-eddy',title:'Eddy will read your campaigns',body:"Soon you can ask Eddy what's tiring, what to scale and what to iterate, from the same numbers Home shows. Not live yet; you'll see it in the sidebar when it is.",pos:'below'},
 {k:'5 Home',scr:()=>screenHome(),target:'#t-kpis',title:'Home is your scoreboard',body:'Spend, cost per purchase, ROAS and the ads running, from Meta. The top ads to iterate, and whatever is waiting on you. That is the tour. Go make an ad.',pos:'below',last:true},
];
function tourIndex(){const i=TOUR.findIndex(t=>t.k===st());return i<0?0:i}
function tourNum(i){return i<=1?i+1:i===2?2:i}  /* two variants of stop 2 */
function screenTour(){
 const i=tourIndex(); const t=TOUR[i]; const n=tourNum(i);
 return t.scr()+`<div class="tour-lock" aria-hidden="true"></div><div class="spot" id="spot"></div>
  <div class="coach" id="coach" role="dialog" aria-modal="true" aria-labelledby="coach-t"><div class="ce"><span class="eyebrow">Tour · ${n} of 5</span><span class="dots" aria-hidden="true">${[1,2,3,4,5].map(d=>`<i class="${d<=n?'on':''}"></i>`).join('')}</span></div>
   <h3 id="coach-t">${t.title}</h3><p>${t.body}</p>
   <div class="cb">${i>0?`<button class="btn btn-ghost btn-sm" data-act="tour:${i===2?0:i===3?1:i-1}">Back</button>`:''}${t.last?`<button class="btn btn-accent" data-act="tour:done">Finish ${ic('check',16)}</button>`:`<button class="btn btn-ink" data-act="tour:${i===1?3:i+1}">Next ${ic('right',16)}</button>`}</div></div>`;
}
function placeTour(){
 const frame=document.getElementById('frame'); const spot=document.getElementById('spot'); const coach=document.getElementById('coach'); if(!spot||!coach) return;
 const i=tourIndex(); const t=TOUR[i]; const el=frame.querySelector(t.target); if(!el) return;
 const fr=frame.getBoundingClientRect(); const r=el.getBoundingClientRect(); const pad=8;
 const top=r.top-fr.top-pad, left=r.left-fr.left-pad, w=r.width+pad*2, h=r.height+pad*2;
 Object.assign(spot.style,{top:top+'px',left:left+'px',width:w+'px',height:h+'px'});
 const narrow=fr.width<=760; const cw=narrow?fr.width-32:360;
 let ct,cl;
 if(!narrow&&t.pos==='right'&&left+w+16+cw<=fr.width-16){cl=left+w+16;ct=top}
 else{ct=top+h+14;cl=Math.min(Math.max(16,left),fr.width-cw-16)}
 Object.assign(coach.style,{top:ct+'px',left:cl+'px'});
 const y=window.scrollY+fr.top+top-90; window.scrollTo({top:Math.max(0,y),behavior:'smooth'});
 if(t.anim) animateBrain();
}
let brainTimer;
function animateBrain(){
 clearTimeout(brainTimer); const n=document.getElementById('ringn'); const pr=document.querySelector('#ring .pr'); const secs=[...document.querySelectorAll('#bsecs .bsec .ck')];
 if(!n||!pr) return;
 secs.forEach(c=>{c.className='ck';c.innerHTML=''});
 const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
 let v=0; const step=()=>{v=Math.min(BRAIN_PCT,v+2);n.textContent=v+'%';pr.style.strokeDashoffset=251.3*(1-v/100);
   const lit=Math.floor(v/BRAIN_PCT*BRAIN.length); secs.forEach((c,i)=>{if(i<lit&&!c.classList.contains(BRAIN[i].ok)){c.className='ck '+BRAIN[i].ok;c.innerHTML=BRAIN[i].ok==='ok'?ic('check',14):BRAIN[i].ok==='part'?ic('minus',14):''}});
   if(v<BRAIN_PCT) brainTimer=setTimeout(step,rm?0:38); else secs.forEach((c,i)=>{c.className='ck '+BRAIN[i].ok;c.innerHTML=BRAIN[i].ok==='ok'?ic('check',14):BRAIN[i].ok==='part'?ic('minus',14):''})};
 if(rm){v=BRAIN_PCT-2} step();
}

/* ---------- render ---------- */
const R={mode:screenMode,'wz-business':screenBusiness,'wz-meta':screenMeta,'wz-brain':screenWzBrain,saved:screenSaved,brain:screenBrain,settings:screenSettings,home:()=>screenHome(),tour:screenTour};
function render(){
 const frame=document.getElementById('frame');
 frame.className='frame '+(S.dev==='phone'?'phone':'')+(S.screen==='tour'?' touring':'');
 frame.innerHTML=(R[S.screen]||screenMode)();
 /* proto bar */
 const sel=document.getElementById('scr'); if(!sel.options.length){let g=null,og;SCREENS.forEach(s=>{if(s.g!==g){g=s.g;og=document.createElement('optgroup');og.label=g;sel.appendChild(og)}const o=document.createElement('option');o.value=s.id;o.textContent=s.l;og.appendChild(o)})}
 sel.value=S.screen;
 const sc=byId(S.screen); document.getElementById('states').innerHTML=sc.states.map(s=>`<button data-st="${s}" aria-pressed="${s===st()}">${s}</button>`).join('');
 document.querySelectorAll('#dev button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.dev===S.dev));
 document.querySelectorAll('#mode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===S.mode));
 if(S.screen==='tour') requestAnimationFrame(()=>requestAnimationFrame(placeTour));
}
document.getElementById('scr').addEventListener('change',e=>go(e.target.value));
document.getElementById('states').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.st[S.screen]=b.dataset.st;render()});
document.getElementById('dev').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.dev=b.dataset.dev;render()});
document.getElementById('mode').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.mode=b.dataset.mode;render()});
window.addEventListener('resize',()=>{if(S.screen==='tour')placeTour()});

document.getElementById('frame').addEventListener('click',e=>{
 const b=e.target.closest('[data-act]'); if(!b) return; e.preventDefault();
 const [k,v]=b.dataset.act.split(/:(.*)/s);
 if(k==='noop') return;
 if(k==='go'){ if(v==='wz-business'&&S.screen==='mode'){S.mode=st()==='just me picked'?'own':'agency'} if(v==='tour'){S.st.tour='1 Brain'} if(v==='settings'&&!metaOk()){S.st.settings='not connected'} go(v); return }
 if(k==='st'){S.st[S.screen]=v;render();return}
 if(k==='pick'){S.st.mode=v==='agency'?'agency picked':'just me picked';render();return}
 if(k==='acc'){const a=ACCTS.find(x=>x.id===v);S.acc=v;render();if(!a.ok)toast('No ads permission on this account');return}
 if(k==='step'){const n=+v;go(n===1?'wz-business':n===2?'wz-meta':n===6?'wz-brain':'wz-meta');if(n>2&&n<6)toast('Step '+n+' keeps today\'s content, in the new shell');return}
 if(k==='range'){S.range=v;render();return}
 if(k==='menu'){S.menu=!S.menu;render();return}
 if(k==='switch'){toast('Client switcher: Lumen Bikes · Dental Kirk (Setup 50%) · All clients');return}
 if(k==='revisit'){toast('Opens the wizard in "Edit setup" mode, step 1; Save and exit returns to Brain');go('wz-business');return}
 if(k==='tour'){ if(v==='done'){toast('tourCompletedAt saved · you are on Home');go('home');return} const i=+v; S.st.tour=TOUR[(i===1||i===2)?(metaOk()?1:2):i].k; render(); return }
 if(k==='nav'){const m={home:'home',brain:'brain',settings:'settings',iterate:null,concepts:null,eddy:null,clients:null,library:null,review:null,campaigns:null};
   if(m[v]){go(m[v]);return}
   if(v==='iterate'){S.menu=false;document.getElementById('frame').innerHTML=screenIterate(metaOk());window.scrollTo(0,0);return}
   if(v==='concepts'){S.menu=false;document.getElementById('frame').innerHTML=screenConcepts();window.scrollTo(0,0);return}
   if(v==='eddy'){S.menu=false;document.getElementById('frame').innerHTML=screenEddy();window.scrollTo(0,0);return}
   toast({clients:'Clients page (exists today): tiles with Setup step X of 6 · Continue setup',library:'Library (exists today)',review:'Home filtered on Needs you (exists today)',campaigns:'Campaigns: Soon section (exists today)'}[v]);return}
 if(k==='toast'){toast(v);return}
});
render();
})();
</script>
