<title>HookMill Campaigns v1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: same shell as onboarding-v2 (dark sidebar + light work area, single light theme by decision 12/10).
   Campaigns = one tree table (campaign > ad set > ad, rows expand in place) on desktop; drill-down cards on phone. */
:root{
  --bg:#EEEEEA; --card:#FDFDFB; --card-2:#F3F4F0; --input:#FFFFFF;
  --line:#DCDDD7; --line-soft:#E4E5E0; --line-strong:#CFD1CB; --control:#B9BCB5; --sep:#9A9F96;
  --fg:#15171A; --fg-2:#3B4047; --fg-3:#5A6068; --fg-btn:#4A5058; --on-ink-btn:#FFFFFF;
  --accent:#C8F03C; --accent-ink:#3E5200; --accent-soft:#F0F8D2; --accent-edge:#A9CC2A;
  --ink:#16181B; --ink-2:#202328; --ink-3:#2A2E33; --ink-line:#2E3238; --ink-fg:#F2F3EE; --ink-fg-2:#C5CAD0; --ink-fg-3:#9AA1A9; --ink-body:#E8EAE4;
  --ok-bg:#E2F3E8; --ok:#0B6B43; --ok-dot:#1C9A5E;
  --warn-bg:#FBF0D3; --warn:#7A5000; --warn-line:#E9C76B; --warn-dot:#D9A21B;
  --bad-bg:#FBE7DD; --bad:#A8360C; --bad-edge:#E4B9A6;
  --info-bg:#E6EBFC; --info:#2B4BC8; --info-line:#C3CEF6;
  --row-hover:#F6F7F2; --row-l1:#FAFAF7; --row-l2:#F6F6F2; --scrim:rgba(22,24,27,.55);
  --font:'Archivo','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r-chip:8px; --r-ctl:10px; --r-btn:12px; --r-card:16px; --r-panel:18px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;font-family:var(--font);font-size:14px;line-height:1.45;color:var(--fg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:100;background:var(--ink)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
a{color:var(--fg)} a:hover{color:var(--accent-ink)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg{flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* prototype bar (not product) */
.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--ink);color:var(--ink-fg-2);border-bottom:1px solid var(--ink-line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:12px}
.proto b{color:var(--ink-fg);font-family:var(--mono);font-size:11px;letter-spacing:.08em}
.proto select{background:var(--ink-2);color:var(--ink-fg);border:1px solid var(--ink-line);border-radius:8px;min-height:32px;padding:0 8px;max-width:100%}
.pg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--ink-2);border:1px solid var(--ink-line);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;color:var(--ink-fg-2);border-radius:7px;min-height:28px;padding:0 9px;cursor:pointer;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--fg);font-weight:700}
.proto .note{color:var(--ink-fg-3)}

/* frame */
.frame{container-type:inline-size;container-name:app;margin:0 auto;width:100%;background:var(--bg);position:relative}
.frame.phone{width:390px;max-width:100%;margin-block:20px;border:1px solid var(--line-strong);border-radius:28px;overflow:hidden;box-shadow:0 10px 40px rgba(21,23,26,.12)}

/* app shell (identical to onboarding-v2) */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 50px)}
.side{background:var(--ink);color:var(--ink-fg-2);padding:18px 14px 20px;display:flex;flex-direction:column;gap:18px;position:sticky;top:50px;height:calc(100vh - 50px);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 6px;color:var(--ink-fg);text-decoration:none}
.brand-mark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--fg);font-weight:800;font-stretch:125%;font-size:10px;flex:none}
.brand-name{font-weight:800;font-stretch:125%;font-size:15px;letter-spacing:-.01em}
.client{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 10px;border-radius:12px;background:var(--ink-2);border:1px solid var(--ink-line);color:var(--ink-fg);text-align:left;width:100%}
.client-av{display:inline-grid;place-items:center;flex:none;width:32px;height:32px;border-radius:9px;background:#1E2550;color:#E9DFC9;font-weight:800}
.client .t{flex:1;min-width:0;display:flex;flex-direction:column}
.client b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.client small{font-size:12px;color:var(--ink-fg-3)}
.client small.ok{color:#8BD7A9}
.navgrp{display:flex;flex-direction:column;gap:2px}
.navlab{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink-fg-3);padding:0 10px 6px}
.nav{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 10px;border-radius:10px;border:0;background:transparent;color:var(--ink-fg-2);font-weight:500;cursor:pointer;text-align:left;width:100%}
.nav svg{stroke:var(--ink-fg-3)}
.nav:hover{background:var(--ink-2)}
.nav[aria-current="page"]{background:var(--ink-3);color:#fff;font-weight:700}
.nav[aria-current="page"] svg{stroke:var(--accent)}
.badge{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--fg);background:var(--accent);border-radius:999px;padding:1px 7px}
.soon-mini{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink-fg-3);border:1px dashed var(--ink-fg-3);border-radius:999px;padding:0 6px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--ink-line);padding-top:12px}
.me{display:flex;align-items:center;gap:10px;padding:0 6px}
.me-av{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:999px;background:var(--ink-line);color:var(--ink-fg);font-weight:700;font-size:13px;flex:none}
.me .t{min-width:0;flex:1}
.me b{color:var(--ink-fg);font-weight:600;display:block}.me small{font-size:12px;color:var(--ink-fg-3)}
.lang{display:inline-flex;border:1px solid var(--ink-line);border-radius:8px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;color:var(--ink-fg-3);font-family:var(--mono);font-size:11px;min-height:30px;padding:0 8px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink-3);color:var(--ink-fg)}
.topm{display:none}
main.work{min-width:0;padding:24px 32px 120px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* type */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--fg-3);text-transform:uppercase}
.h1{margin:0;font-size:30px;line-height:1.1;font-weight:800;font-stretch:125%;letter-spacing:-.015em;text-wrap:balance}
.h2{margin:0;font-size:16px;font-weight:700;text-wrap:balance}
.lede{margin:0;color:var(--fg-3);max-width:640px;text-wrap:pretty}
.muted{color:var(--fg-3)} .small{font-size:13px} .tiny{font-size:12px}
.headrow{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.head{display:flex;flex-direction:column;gap:6px;min-width:0}
.acct{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;color:var(--fg-3);font-size:13px}
.acct .num{font-size:12px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ink{background:var(--ink);color:var(--ink-body);border-radius:var(--r-panel);padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ink .eyebrow{color:var(--ink-fg-2)}
.big{font-family:var(--mono);font-size:44px;font-weight:600;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-btn);border:1px solid transparent;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-sm{min-height:36px;padding:0 12px;border-radius:10px;font-size:13px}
.btn-xs{min-height:30px;padding:0 10px;border-radius:9px;font-size:12px}
.btn-accent{background:var(--accent);color:var(--fg)} .btn-accent:hover{background:#BDE52F;color:var(--fg)}
.btn-ink{background:var(--fg);color:var(--on-ink-btn)} .btn-ink:hover{color:var(--on-ink-btn);background:#2A2E33}
.btn-out{background:var(--card);border-color:var(--line-strong);font-weight:600}
.btn-out:hover{border-color:var(--fg)}
.btn-ghost{background:transparent;color:var(--fg-btn);font-weight:600}
.btn-ghost:hover{background:var(--card-2)}
.btn-icon{width:36px;min-height:36px;padding:0;border-radius:10px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.spin{width:14px;height:14px;border-radius:999px;border:2px solid var(--line-strong);border-top-color:var(--fg);animation:spin 1s linear infinite;flex:none}
.btn-ink .spin{border-color:#555;border-top-color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}

/* tags */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;height:fit-content;line-height:1.5}
.t-ok{background:var(--ok-bg);color:var(--ok)} .t-warn{background:var(--warn-bg);color:var(--warn)}
.t-bad{background:var(--bad-bg);color:var(--bad)} .t-info{background:var(--info-bg);color:var(--info)}
.t-neutral{background:var(--card-2);color:var(--fg-2);border:1px solid var(--line-soft)}
.t-win{background:var(--fg);color:var(--accent)}
.t-dash{background:transparent;color:var(--fg-3);border:1px dashed var(--control)}
.t-hm{background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent-edge);font-family:var(--mono);font-size:10px;letter-spacing:.04em}
.dot{width:7px;height:7px;border-radius:999px;background:currentColor;flex:none}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* alerts */
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;border:1px solid;flex-wrap:wrap}
.alert .a-body{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 240px}
.alert .a-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.al-bad{background:var(--bad-bg);border-color:var(--bad-edge);color:#5E1E06}
.al-warn{background:var(--warn-bg);border-color:var(--warn-line);color:#4A3100}
.al-ok{background:var(--ok-bg);border-color:#B7DEC5;color:#0B4D31}
.al-info{background:var(--info-bg);border-color:var(--info-line);color:#1D2F7A}

/* sync chip */
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg-2);white-space:nowrap}
.sync.ok .dot{color:var(--ok-dot)} .sync.warn .dot{color:var(--warn-dot)} .sync.bad .dot{color:var(--bad)} .sync.run .dot{color:var(--info)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.lseg{display:inline-flex;gap:2px;background:var(--card-2);border:1px solid var(--line);border-radius:11px;padding:2px;flex:none}
.lseg button{border:0;background:transparent;color:var(--fg-btn);border-radius:9px;min-height:32px;padding:0 10px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.lseg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 0 0 1px var(--line-strong)}
.lseg .c{font-family:var(--mono);font-size:11px;color:var(--fg-3)}
.search{display:flex;align-items:center;gap:8px;min-height:38px;padding:0 10px;border:1px solid var(--line-strong);border-radius:10px;background:var(--input);flex:1 1 220px;min-width:0;max-width:340px}
.search input{border:0;outline:0;background:transparent;min-width:0;flex:1;min-height:36px}
.search:focus-within{outline:2px solid var(--info);outline-offset:1px}
.toolbar .scroll{display:contents}
.ocard .top .sw{margin-top:2px}
.sortsel{min-height:38px;border:1px solid var(--line-strong);border-radius:10px;background:var(--input);padding:0 8px;display:none}

/* tree table */
.tblwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);overflow-x:auto;min-width:0}
table.tree{width:100%;border-collapse:separate;border-spacing:0;min-width:1060px;font-size:13px}
.tree th{position:sticky;top:0;background:var(--card);text-align:right;font-weight:600;color:var(--fg-3);font-size:12px;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tree th.l,.tree td.l{text-align:left}
.tree th button{border:0;background:transparent;color:inherit;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:2px 0}
.tree th button:hover{color:var(--fg)}
.tree th[aria-sort] button{color:var(--fg);font-weight:700}
.tree td{padding:8px 10px;border-bottom:1px solid var(--line-soft);text-align:right;vertical-align:middle;white-space:nowrap}
.tree tbody tr:last-child td{border-bottom:0}
.tree tr.lv0 td{background:var(--card)}
.tree tr.lv1 td{background:var(--row-l1)}
.tree tr.lv2 td{background:var(--row-l2)}
.tree tbody tr:hover td{background:var(--row-hover)}
.tree tr.total td{background:var(--card-2);font-weight:700;border-bottom:1px solid var(--line)}
.tree tr.changed td{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--accent-soft)}}
.ocard.changed{animation:flash 1.6s ease-out}
.tree .m{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
.tree .m.dim{color:var(--fg-3)}
.namecell{display:flex;align-items:center;gap:8px;min-width:0;max-width:380px}
.namecell .ind{flex:none}
.exp{width:26px;height:26px;border-radius:7px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--fg-3);flex:none}
.exp:hover{background:var(--card-2);color:var(--fg)}
.exp svg{transition:transform .15s}
.exp[aria-expanded="true"] svg{transform:rotate(90deg)}
.exp.none{visibility:hidden}
.nm{display:flex;flex-direction:column;min-width:0;gap:2px}
.nm .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv1 .nm .n,.lv2 .nm .n{font-weight:600}
.nm .s{display:flex;gap:6px;align-items:center;color:var(--fg-3);font-size:12px;overflow:hidden;white-space:nowrap}
.lvl{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--fg-3);text-transform:uppercase}
.thumb{width:22px;aspect-ratio:9/16;border-radius:4px;background:var(--t,#1E2550);flex:none;max-width:100%}
.thumb.img{aspect-ratio:1/1;width:28px;display:grid;place-items:center;font-family:var(--mono);font-size:8px;color:#fff}
mark{background:var(--accent);color:var(--fg);border-radius:3px;padding:0 1px}
.delta{display:block;font-family:var(--mono);font-size:11px;font-weight:500;margin-top:1px}
.delta.good{color:var(--ok)} .delta.bad{color:var(--bad)} .delta.flat{color:var(--fg-3)}
.budget{display:inline-flex;align-items:center;gap:6px;justify-content:flex-end}
.budget .k{font-size:11px;color:var(--fg-3);font-family:var(--mono)}
.bud-edit{border:1px solid transparent;background:transparent;border-radius:8px;min-height:30px;padding:0 6px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-family:var(--mono);font-weight:600}
.bud-edit:hover{border-color:var(--line-strong);background:var(--card)}
.bud-edit svg{stroke:var(--fg-3)}
.bud-shared{color:var(--fg-3);font-size:12px}
.rowact{display:inline-flex;gap:6px;justify-content:flex-end;align-items:center;position:relative}

/* switch (shadcn Switch) */
.sw{position:relative;width:36px;height:20px;border-radius:999px;border:0;background:var(--control);cursor:pointer;flex:none;padding:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:999px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--ok-dot)}
.sw[aria-checked="true"]::after{transform:translateX(16px)}
.sw[aria-checked="true"].held{background:#8FC9A9}
.sw[disabled]{opacity:.45;cursor:not-allowed}
.swcell{display:flex;align-items:center;gap:8px}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--fg-2)}
.stat.on .dot{color:var(--ok-dot)} .stat.off .dot{color:var(--control)} .stat.held .dot{color:var(--warn-dot)} .stat.bad .dot{color:var(--bad)}

/* menu */
.menu{position:absolute;right:0;top:calc(100% + 4px);z-index:40;min-width:220px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(21,23,26,.16);padding:6px;display:flex;flex-direction:column;text-align:left}
.menu button,.menu a{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 10px;border-radius:8px;border:0;background:transparent;cursor:pointer;text-decoration:none;color:var(--fg);font-size:13px;font-weight:500;white-space:nowrap}
.menu button:hover,.menu a:hover{background:var(--card-2);color:var(--fg)}
.menu svg{stroke:var(--fg-3)}
.menu hr{border:0;border-top:1px solid var(--line-soft);margin:4px 0}

/* phone cards (drill-down) */
.cards{display:none;flex-direction:column;gap:10px}
.crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--fg-3)}
.crumb button{border:0;background:transparent;color:var(--fg-2);font-weight:600;cursor:pointer;padding:6px 0;min-height:36px}
.crumb b{color:var(--fg)}
.ocard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ocard.win{border-color:var(--accent-edge);background:var(--accent-soft)}
.ocard .top{display:flex;gap:10px;align-items:flex-start}
.ocard .top .nm{flex:1}
.ocard .top .nm .n{white-space:normal;overflow:visible;font-size:15px}
.ocard .chips{display:flex;flex-wrap:wrap;gap:6px}
.ocard .mg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding-top:8px;border-top:1px solid var(--line-soft)}
.ocard .mg div{display:flex;flex-direction:column;min-width:0}
.ocard .mg small{font-size:11px;color:var(--fg-3)}
.ocard .mg span{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.ocard .foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ocard .foot .grow{flex:1}
.ocard .drill{display:flex;align-items:center;justify-content:space-between;min-height:44px;border:0;border-top:1px solid var(--line-soft);background:transparent;width:100%;padding:8px 0 0;font-weight:700;cursor:pointer;text-align:left}
.ocard .thumb{width:40px}
.ocard .thumb.img{width:48px}
.totals{display:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.totals div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.totals small{font-size:11px;color:var(--fg-3)} .totals span{font-family:var(--mono);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}

/* skeleton */
.sk{display:inline-block;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--line-soft),var(--card-2),var(--line-soft));background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

/* beam (waiting only) */
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
.beam{position:relative}
.beam::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--a),transparent 0 70%,var(--accent) 82%,var(--info) 92%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:beam 2.4s linear infinite;pointer-events:none}
@keyframes beam{to{--a:360deg}}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:10px;align-items:center}
.steps .st{width:20px;height:20px;border-radius:999px;display:inline-grid;place-items:center;flex:none;border:1.5px solid var(--ink-line)}
.steps .st.done{background:var(--accent);border-color:var(--accent);color:var(--fg)}
.steps .st.now{border-color:var(--accent)}
.steps li.todo{color:var(--ink-fg-3)}
.bar{height:6px;border-radius:999px;background:var(--ink-line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent)}

/* empty */
.empty{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center}
.ghost-rows{display:flex;flex-direction:column;gap:8px;opacity:.55}
.ghost-rows div{height:34px;border-radius:10px;border:1px dashed var(--control);background:var(--card-2)}

/* dialog + sheet */
.ov{position:fixed;inset:0;z-index:70;background:var(--scrim);display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.frame.phone ~ .layer .ov,.layer.phone .ov{left:50%;right:auto;width:390px;max-width:100%;transform:translateX(-50%)}
.dlg{width:460px;max-width:100%;max-height:calc(100vh - 48px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 60px rgba(21,23,26,.3);animation:dlg .18s ease-out}
@keyframes dlg{from{opacity:0;transform:translateY(6px)}}
.dlg h2{margin:0;font-size:18px;font-weight:800;font-stretch:115%;letter-spacing:-.01em;text-wrap:balance}
.dlg p{margin:0;color:var(--fg-2)}
.dlg .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding-top:4px}
.objline{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--card-2);border:1px solid var(--line-soft);min-width:0}
.objline .nm .n{white-space:normal}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.plist li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line-soft);min-width:0}
.plist li:first-child{border-top:0}
.plist .nm{flex:1}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line-soft);font-size:13px}
.kv:first-child{border-top:0}
.kv span:first-child{color:var(--fg-3)} .kv span:last-child{font-family:var(--mono);font-weight:600;text-align:right}
.money{display:flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:12px;background:var(--input);padding:0 12px;min-height:52px}
.money:focus-within{outline:2px solid var(--info);outline-offset:1px}
.money.err{border-color:var(--bad)}
.money span{font-family:var(--mono);color:var(--fg-3);font-size:18px}
.money input{border:0;outline:0;background:transparent;font-family:var(--mono);font-size:22px;font-weight:600;min-width:0;flex:1;font-variant-numeric:tabular-nums}
.money .per{font-size:13px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{min-height:34px;padding:0 10px;border-radius:999px;border:1px solid var(--line-strong);background:var(--card);font-family:var(--mono);font-size:12px;font-weight:600;cursor:pointer}
.quick button:hover{border-color:var(--fg)}
.fmsg{font-size:13px;display:flex;gap:6px;align-items:flex-start}
.fmsg.bad{color:var(--bad)} .fmsg.warn{color:var(--warn)} .fmsg.mute{color:var(--fg-3)}

.sheet{position:fixed;top:0;right:0;bottom:0;z-index:72;width:460px;max-width:100%;background:var(--card);border-left:1px solid var(--line);box-shadow:-20px 0 50px rgba(21,23,26,.18);display:flex;flex-direction:column;animation:sheet .2s ease-out;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
@keyframes sheet{from{transform:translateX(24px);opacity:0}}
.sheet-scrim{position:fixed;inset:0;z-index:71;background:var(--scrim)}
.sheet .sh-h{display:flex;align-items:flex-start;gap:10px;padding:18px 18px 12px;border-bottom:1px solid var(--line-soft)}
.sheet .sh-h .head{flex:1}
.sheet .sh-b{flex:1;overflow:auto;padding:12px 18px 24px;display:flex;flex-direction:column;gap:10px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;padding:12px 0;border-top:1px solid var(--line-soft)}
.hist li:first-child{border-top:0}
.hist .av{width:32px;height:32px;border-radius:999px;background:var(--card-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:12px}
.hist .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.hist .who{font-size:13px} .hist .who b{font-weight:700}
.fromto{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-family:var(--mono);font-size:12px}
.fromto s{color:var(--fg-3)}
.hist .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--fg-3)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ink-fg);padding:12px 16px;border-radius:12px;font-weight:600;font-size:13px;z-index:90;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.25)}

@media (prefers-reduced-motion:reduce){.beam::before,.pulse,.spin,.sk,.dlg,.sheet,.tree tr.changed td{animation:none!important}.beam::before{background:linear-gradient(90deg,var(--accent),var(--info))}.sw,.sw::after,.exp svg{transition:none}}

/* ============ responsive (container) ============ */
@container app (max-width: 980px){
  .empty{grid-template-columns:minmax(0,1fr)}
}
@container app (max-width: 760px){
  .app{grid-template-columns:minmax(0,1fr);min-height:auto}
  .side{display:none}
  .app.menuopen .side{display:flex;position:absolute;top:56px;left:0;right:0;height:auto;z-index:30}
  .topm{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--ink-fg);padding:8px 16px;min-height:56px;position:sticky;top:50px;z-index:20}
  .topm .client{min-height:40px;padding:4px 8px;flex:1;min-width:0}
  .topm .client-av{width:26px;height:26px;font-size:12px}
  .topm .mbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--ink-line);background:transparent;color:var(--ink-fg);display:grid;place-items:center;cursor:pointer;flex:none}
  main.work{padding:16px 16px 120px}
  .h1{font-size:24px}
  .headrow{align-items:stretch}
  .hbtns{width:100%;display:grid;grid-template-columns:1fr 1fr}
  .hbtns .sync{grid-column:1/-1;justify-self:start}
  .toolbar{gap:8px}
  .toolbar .scroll{display:flex;gap:8px;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:none}
  .search{max-width:none;flex:1 1 100%}
  .sortsel{display:block;flex:1 1 auto}
  .tblwrap{display:none}
  .cards{display:flex}
  .totals{display:grid}
  .ov{place-items:end center;padding:0}
  .dlg{width:100%;border-radius:20px 20px 0 0;max-height:88vh;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .dlg .btns{display:grid;grid-template-columns:1fr 1fr}
  .dlg .btns .btn{width:100%}
  .sheet{width:100%;top:auto;height:88vh;border-left:0;border-top:1px solid var(--line);border-radius:20px 20px 0 0}
  .alert .a-act{width:100%}
}
@media (max-width: 760px){
  .ov{place-items:end center;padding:0}
  .dlg{width:100%;border-radius:20px 20px 0 0;max-height:88vh;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .dlg .btns{display:grid;grid-template-columns:1fr 1fr}
  .sheet{width:100%;top:auto;height:88vh;border-left:0;border-top:1px solid var(--line);border-radius:20px 20px 0 0}
}
.layer.phone .ov{place-items:end center;padding:0}
.layer.phone .dlg{width:100%;border-radius:20px 20px 0 0;max-height:88vh}
.layer.phone .dlg .btns{display:grid;grid-template-columns:1fr 1fr}
.layer.phone .dlg .btns .btn{width:100%}
.layer.phone .sheet{left:50%;right:auto;transform:translateX(-50%);width:390px;max-width:100%;top:auto;height:88vh;border-left:0;border-top:1px solid var(--line);border-radius:20px 20px 0 0;animation:none}
.layer.phone .sheet-scrim{left:50%;right:auto;width:390px;max-width:100%;transform:translateX(-50%)}
</style>

function delta(o,k){
 if(S.period!=='7d')return '';
 const a=o.w,b=o.p; let x,y;
 if(k==='spend'){x=a.s;y=b.s}else if(k==='results'){x=a.r;y=b.r}else if(k==='cpa'){x=cpa(a);y=cpa(b)}else if(k==='ctr'){x=a.ctr;y=b.ctr}else{x=a.hr;y=b.hr}
 if(x==null||y==null||!y)return '<span class="delta flat">—</span>';
 const d=(x-y)/y*100; if(Math.abs(d)<1)return '<span class="delta flat">→ 0%</span>';
 const up=d>0; const better=k==='spend'?null:(k==='cpa'?!up:up);
 const cls=better==null?'flat':better?'good':'bad';
 return `<span class="delta ${cls}" title="vs. the 7 days before">${up?'↑':'↓'} ${Math.abs(d).toFixed(0)}%</span>`;
}

/* ---------- filtering & sorting ---------- */
function matchStatus(o){
 if(S.status==='all')return true;
 if(S.status==='active')return o.eff==='ACTIVE';
 if(S.status==='paused')return ['PAUSED','CAMPAIGN_PAUSED','ADSET_PAUSED'].includes(o.eff);
 return ['DISAPPROVED','WITH_ISSUES','PENDING_REVIEW','IN_PROCESS'].includes(o.eff);
}
const matchQ=o=>!S.q.trim()||o.name.toLowerCase().includes(S.q.trim().toLowerCase());
const matchO=o=>S.origin==='all'||o.hm;
function selfOk(o){return matchStatus(o)&&matchQ(o)&&matchO(o)}
function sortList(l){const k=S.sort,d=S.dir==='asc'?1:-1;return l.slice().sort((a,b)=>{let x=val(a,k),y=val(b,k);if(k==='name')return d*String(x).localeCompare(String(y));if(x==null)x=k==='cpa'?Infinity*d:-Infinity;if(y==null)y=k==='cpa'?Infinity*d:-Infinity;return d*(x-y)})}
function tree(){
 const out=[];
 for(const c of sortList(DATA)){
  const sets=[];
  for(const a of sortList(c.sets)){
   const ads=sortList(a.ads).filter(selfOk);
   if(selfOk(a)||ads.length)sets.push({a,ads:ads.length?ads:(S.q||S.status!=='all'||S.origin!=='all'?[]:a.ads),hit:!!ads.length});
  }
  if(selfOk(c)||sets.length)out.push({c,sets,hit:sets.length>0});
 }
 return out;
}
function flatAds(){return sortList(DATA.flatMap(c=>c.sets.flatMap(a=>a.ads))).filter(selfOk)}
const filtering=()=>S.q.trim()||S.status!=='all'||S.origin!=='all';
function counts(){const all=DATA;return{all:all.length,active:all.filter(c=>c.eff==='ACTIVE').length,paused:all.filter(c=>c.eff==='PAUSED').length,issues:DATA.flatMap(c=>c.sets.flatMap(a=>a.ads)).filter(d=>['DISAPPROVED','WITH_ISSUES'].includes(d.eff)).length}}
function totals(list){let s=0,r=0;for(const o of list){const x=cur(o);s+=x.s;r+=x.r}
 const ctrs=list.map(o=>cur(o).ctr).filter(v=>v!=null);return{s,r,cpa:r?s/r:null,ctr:ctrs.length?ctrs.reduce((a,b)=>a+b,0)/ctrs.length:null}}

function th(k,l,cls=''){const on=S.sort===k;return `<th class="${cls}" ${on?`aria-sort="${S.dir==='asc'?'ascending':'descending'}"`:''} scope="col"><button data-act="sort:${k}">${l}${on?ic(S.dir==='asc'?'sortu':'sortd',12):''}</button></th>`}
function swCell(o){
 const si=statusInfo(o);
 const lbl=`<span class="stat ${si.cls}"><i class="dot"></i>${si.txt}</span>`;
 if(S.role!=='owner')return `<div class="swcell" title="${T('viewOnly')}">${lbl}</div>`;
 const dis=S.state==='unusable'||o.eff==='DISAPPROVED';
 const reason=S.state==='unusable'?T('unusableT'):o.eff==='DISAPPROVED'?T('rejected'):'';
 return `<div class="swcell"><button class="sw ${si.held?'held':''}" role="switch" aria-checked="${o.status==='ACTIVE'}" aria-label="${o.status==='ACTIVE'?T('pauseBtn'):T('turnOnBtn')} ${esc(o.name)}" data-act="toggle:${o.id}" ${dis?`disabled title="${reason}"`:''}></button>${o.status==='ACTIVE'&&!si.held?'':lbl}</div>`;
}
function swOnly(o){
 if(S.role!=='owner')return '';
 const dis=S.state==='unusable'||o.eff==='DISAPPROVED';
 return `<button class="sw ${statusInfo(o).held?'held':''}" role="switch" aria-checked="${o.status==='ACTIVE'}" aria-label="${o.status==='ACTIVE'?T('pauseBtn'):T('turnOnBtn')} ${esc(o.name)}" data-act="toggle:${o.id}" ${dis?'disabled':''} style="width:44px;height:26px"></button>`;
}
function budCell(o){
 const b=budOf(o);
 if(o.lvl==='ad')return '';
 if(!b)return `<span class="bud-shared">${o.lvl==='campaign'?(S.lang==='pt'?'No conjunto':'Set per ad set'):''}</span>`;
 if(b.shared)return `<span class="bud-shared" title="${S.lang==='pt'?'Este conjunto divide o orçamento da campanha (CBO).':'This ad set shares the campaign budget (CBO).'}">${T('shared')}</span>`;
 const where=o.lvl==='campaign'?'CBO':'ABO';
 if(b.kind==='lifetime')return `<span class="budget" title="${S.lang==='pt'?'Orçamento vitalício: edite no Gerenciador':'Lifetime budget: edit in Ads Manager'}"><span class="k">${where}</span><span class="m">${$m(b.amt)}</span><span class="muted tiny">${T('lifetime')}</span>${ic('lock',12)}</span>`;
 const txt=`<span class="k">${where}</span>${$c(b.amt)}<span class="muted tiny" style="font-family:var(--font);font-weight:500">${T('perDay')}</span>`;
 return canWrite()?`<button class="bud-edit" data-act="budget:${o.id}" aria-label="${T('budT')} ${esc(o.name)}: ${$c(b.amt)}">${txt}${ic('pencil',13)}</button>`:`<span class="budget m">${txt}</span>`;
}
function actCell(o){
 const menu=S.menuFor===o.id?menuHtml(o):'';
 let it='';
 if(o.lvl==='ad'&&S.role!=='client'){
  it=o.fmt==='video'?`<button class="btn btn-xs ${o.verdict==='WINNER'?'btn-accent':'btn-out'}" data-act="iterate:${o.id}">${ic('iter',13)}${T('iterate')}</button>`
   :`<button class="btn btn-xs btn-out" disabled title="${T('imageOnly')}">${ic('iter',13)}${T('iterate')}</button>`;
 }
 return `<div class="rowact">${it}<button class="btn btn-ghost btn-icon" data-act="menu:${o.id}" aria-haspopup="menu" aria-expanded="${S.menuFor===o.id}" aria-label="More for ${esc(o.name)}">${ic('dots',16)}</button>${menu}</div>`;
}
function menuHtml(o){
 const url=AM+(o.lvl==='campaign'?'campaigns':o.lvl==='adset'?'adsets':'ads')+'?act=229184301&selected_'+(o.lvl==='adset'?'adset':o.lvl)+'_ids='+o.id;
 return `<div class="menu" role="menu">
  ${o.lvl==='ad'&&o.fmt==='video'&&S.role!=='client'?`<button role="menuitem" data-act="iterate:${o.id}">${ic('iter')}${T('iterateFull')}</button>`:''}
  ${o.hm?`<button role="menuitem" data-act="toast:Opens /creatives/cr_8812 (the HookMill creative this came from)">${ic('film')}${T('openCreative')}</button>`:''}
  <button role="menuitem" data-act="hist:${o.id}">${ic('clock')}${T('histOf')}</button><hr>
  <a role="menuitem" href="${url}" target="_blank" rel="noopener">${ic('ext')}${T('openAM')}</a></div>`;
}
function metricTds(o){
 const x=cur(o),c=cpa(x),zero=!x.s;
 const td=(v,k)=>`<td><span class="m ${zero?'dim':''}">${v}</span>${zero?'':delta(o,k)}</td>`;
 return td($m(x.s),'spend')+td(x.r||'—','results')+td($c(c),'cpa')+td(pct(x.ctr),'ctr')+td(o.lvl==='ad'&&o.fmt==='image'?'—':pct1(x.hr),'hook');
}
function row(o,depth,hasKids,openKey,extraSub=''){
 const isOpen=S.open.has(o.id)||(filtering()&&openKey);
 const exp=hasKids?`<button class="exp" data-act="exp:${o.id}" aria-expanded="${!!isOpen}" aria-label="${isOpen?'Collapse':'Expand'} ${esc(o.name)}">${ic('chev',14)}</button>`:'<span class="exp none"></span>';
 const th=o.lvl==='ad'?`<span class="thumb ${o.fmt==='image'?'img':''}" style="--t:${o.t}">${o.fmt==='image'?'IMG':''}</span>`:'';
 const sub=o.lvl==='campaign'?`<span class="lvl">${lv('campaign')}</span>·<span>${T('adsets',{n:o.sets.length})}</span>·<span>${T('ads',{n:o.sets.reduce((a,s)=>a+s.ads.length,0)})}</span>`
  :o.lvl==='adset'?`<span class="lvl">${lv('adset')}</span>·<span>${T('ads',{n:o.ads.length})}</span>`
  :`<span class="lvl">${lv('ad')}</span>·<span>${o.fmt==='image'?(S.lang==='pt'?'Imagem':'Image'):'Video'}</span>${extraSub}`;
 return `<tr class="lv${depth} ${S.flash===o.id?'changed':''}" aria-level="${depth+1}" ${hasKids?`aria-expanded="${!!isOpen}"`:''}>
  <td class="l">${swCell(o)}</td>
  <td class="l"><div class="namecell"><span class="ind" style="width:${depth*22}px"></span>${exp}${th}<div class="nm"><span class="n" title="${esc(o.name)}">${hl(o.name)}</span><span class="s">${sub} ${hmChip(o)} ${learnChip(o)}</span></div></div></td>
  <td>${budCell(o)}</td>${metricTds(o)}
  <td class="l">${verdictChips(o)}</td><td>${actCell(o)}</td></tr>`;
}
function table(){
 const head=`<thead><tr><th class="l" scope="col" style="width:150px">Status</th>${th('name',T('name'),'l')}${th('budget',T('budget'))}${th('spend',T('spend'))}${th('results',T('results'))}${th('cpa',T('cpa'))}${th('ctr',T('ctr'))}${th('hookRate',T('hook'))}<th class="l" scope="col">${T('verdict')}</th><th scope="col"><span class="sr">Actions</span></th></tr></thead>`;
 let body='',list;
 if(S.view==='tree'){
  const t=tree(); list=t.map(x=>x.c);
  for(const {c,sets,hit} of t){
   body+=row(c,0,true,hit);
   if(S.open.has(c.id)||(filtering()&&hit)) for(const {a,ads,hit:h2} of sets){
    body+=row(a,1,a.ads.length>0,h2);
    if(S.open.has(a.id)||(filtering()&&h2)) for(const d of ads) body+=row(d,2,false,false);
   }
  }
 } else {
  list=flatAds();
  for(const d of list){const {c,a}=parents(d);body+=row(d,0,false,false,`·<span>${esc(c.name)} › ${esc(a.name)}</span>`)}
 }
 const tt=totals(list);
 const tot=`<tr class="total"><td class="l" colspan="2">${T('total')} · ${S.view==='tree'?`${list.length} ${lv('campaign')}${list.length===1?'':'s'}`:`${list.length} ${lv('ad')}s`} · ${S.period==='7d'?T('p7'):T('p30')}</td><td></td><td><span class="m">${$m(tt.s)}</span></td><td><span class="m">${tt.r}</span></td><td><span class="m">${$c(tt.cpa)}</span></td><td><span class="m">${pct(tt.ctr)}</span></td><td></td><td></td><td></td></tr>`;
 if(!list.length)return `<div class="tblwrap"><table class="tree">${head}</table>${noMatch()}</div>`;
 return `<div class="tblwrap"><table class="tree" role="treegrid" aria-label="${T('campaigns')}">${head}<tbody>${tot}${body}</tbody></table></div>`;
}
const noMatch=()=>`<div class="card" style="border:0;align-items:flex-start"><b>${T('noMatch')}</b><button class="btn btn-out btn-sm" data-act="clear">${T('clear')}</button></div>`;

/* ---------- phone cards (drill-down) ---------- */
function ocard(o,sub='',isHead=false){
 const x=cur(o),c=cpa(x);
 const b=budOf(o);
 let budLine='';
 if(o.lvl!=='ad'){
  if(b&&b.shared)budLine=`<span class="bud-shared">${T('shared')} (CBO)</span>`;
  else if(b&&b.kind==='lifetime')budLine=`<span class="budget"><span class="k">CBO</span><span class="num">${$m(b.amt)}</span> <span class="muted tiny">${T('lifetime')}</span>${ic('lock',12)}</span>`;
  else if(b)budLine=canWrite()?`<button class="bud-edit" data-act="budget:${o.id}"><span class="k">${o.lvl==='campaign'?'CBO':'ABO'}</span>${$c(b.amt)}<span class="muted tiny">${T('perDay')}</span>${ic('pencil',13)}</button>`:`<span class="budget num"><span class="k">${o.lvl==='campaign'?'CBO':'ABO'}</span>${$c(b.amt)}${T('perDay')}</span>`;
  else budLine=`<span class="bud-shared">${S.lang==='pt'?'Orçamento por conjunto (ABO)':'Budget per ad set (ABO)'}</span>`;
 }
 const thumb=o.lvl==='ad'?`<span class="thumb ${o.fmt==='image'?'img':''}" style="--t:${o.t}">${o.fmt==='image'?'IMG':''}</span>`:'';
 const kids=o.lvl==='campaign'?o.sets.length:o.lvl==='adset'?o.ads.length:0;
 const drill=o.lvl==='ad'||isHead?'':`<button class="drill" data-act="drill:${o.id}">${o.lvl==='campaign'?T('viewAdsets',{n:kids}):T('viewAdsL',{n:kids})}${ic('chev')}</button>`;
 const iter=o.lvl==='ad'&&S.role!=='client'?(o.fmt==='video'?`<button class="btn btn-sm grow ${o.verdict==='WINNER'?'btn-accent':'btn-out'}" data-act="iterate:${o.id}">${ic('iter',14)}${T('iterateFull')}</button>`:`<span class="muted tiny grow">${T('imageOnly')}</span>`):'';
 const si=statusInfo(o);
 return `<article class="ocard ${o.lvl==='ad'&&o.verdict==='WINNER'?'win':''} ${S.flash===o.id?'changed':''}">
  <div class="top">${thumb}<div class="nm"><span class="lvl">${lv(o.lvl)}</span><span class="n">${hl(o.name)}</span>${sub?`<span class="s" style="white-space:normal">${sub}</span>`:''}</div>${swOnly(o)}</div>
  <div class="chips"><span class="stat ${si.cls}"><i class="dot"></i>${si.txt}</span>${hmChip(o)}${learnChip(o)}${verdictChips(o)}</div>
  <div class="mg"><div><small>${T('spend')}</small><span>${$m(x.s)}</span>${x.s?delta(o,'spend'):''}</div><div><small>${S.lang==='pt'?'Compras':'Purch.'}</small><span>${x.r||'—'}</span>${x.s?delta(o,'results'):''}</div><div><small>CPA</small><span>${$c(c)}</span>${x.s?delta(o,'cpa'):''}</div><div><small>${o.lvl==='ad'&&o.fmt==='video'?T('hook'):T('ctr')}</small><span>${o.lvl==='ad'&&o.fmt==='video'?pct1(x.hr):pct(x.ctr)}</span>${x.s?delta(o,o.lvl==='ad'&&o.fmt==='video'?'hook':'ctr'):''}</div></div>
  ${o.lvl!=='ad'?`<div class="foot">${budLine}</div>`:''}
  ${o.lvl==='ad'?`<div class="foot">${iter}<div class="rowact"><button class="btn btn-out btn-icon" data-act="menu:${o.id}" aria-label="More">${ic('dots')}</button>${S.menuFor===o.id?menuHtml(o):''}</div></div>`:`<div class="foot"><span class="grow"></span><div class="rowact"><button class="btn btn-ghost btn-sm" data-act="hist:${o.id}">${ic('clock',14)}${T('history')}</button><a class="btn btn-ghost btn-sm" href="${AM}campaigns" target="_blank" rel="noopener">${ic('ext',14)}Ads Manager</a></div></div>`}
  ${drill}</article>`;
}
function cards(){
 let h='',list=[];
 if(S.view==='ads'){
  list=flatAds(); h=list.map(d=>{const {c,a}=parents(d);return ocard(d,esc(c.name)+' › '+esc(a.name))}).join('');
 } else if(S.drill.a){
  const a=find(S.drill.a),{c}=parents(a);
  h=`<nav class="crumb" aria-label="Breadcrumb"><button data-act="drill:root">${ic('left',14)} ${T('back')}</button><span>/</span><button data-act="drill:${c.id}">${esc(c.name)}</button><span>/</span><b>${esc(a.name)}</b></nav>`;
  list=sortList(a.ads).filter(d=>!filtering()||selfOk(d)); h+=ocard(a,'',true)+list.map(d=>ocard(d)).join('');
 } else if(S.drill.c){
  const c=find(S.drill.c);
  h=`<nav class="crumb" aria-label="Breadcrumb"><button data-act="drill:root">${ic('left',14)} ${T('back')}</button><span>/</span><b>${esc(c.name)}</b></nav>`;
  list=sortList(c.sets); h+=ocard(c,'',true)+list.map(a=>ocard(a)).join('');
 } else { const t=tree(); list=t.map(x=>x.c); h=list.map(c=>ocard(c)).join('') }
 if(!list.length)h+=noMatch();
 const tt=totals(S.view==='ads'?flatAds():tree().map(x=>x.c));
 return `<div class="totals"><div><small>${T('spend')}</small><span>${$m(tt.s)}</span></div><div><small>${T('results')}</small><span>${tt.r}</span></div><div><small>${T('cpa')}</small><span>${$c(tt.cpa)}</span></div><div><small>${T('ctr')}</small><span>${pct(tt.ctr)}</span></div></div><div class="cards">${h}</div>`;
}

function firstSync(){

function page(){
 const st=S.state;
 let body;
 if(st==='nometa')return shell(header().replace(/<div class="hbtns">[^]*<\/div><\/div>$/,'</div>')+emptyState('nometa'));

function dlgHtml(){
 const d=S.dlg; if(!d)return '';
 const o=find(d.id);
 let inner='';
 const errBox=()=>d.err==='rate'?`<div class="alert al-warn" role="alert">${ic('clock',18)}<div class="a-body"><b>${T('rateT')}</b><span>${T('rateB',{s:60})}</span></div></div>`
  :d.err==='token'?`<div class="alert al-bad" role="alert">${ic('alert',18)}<div class="a-body"><b>${T('tokenT')}</b><span>${T('tokenB')}</span></div><div class="a-act"><button class="btn btn-out btn-sm" data-act="toast:Opens Settings › Connections">${T('reconnect')}</button></div></div>`:'';
 if(d.err==='changed'){
  const now=d.kind==='budget'||o.lvl!=='ad'?(S.lang==='pt'?'Desligado · $80.00/dia':'Off · $80.00/day'):'Off';
  inner=`<h2 id="dlgt">${T('changedT')}</h2>${objLine(o)}<p>${T('changedB',{now:`<b>${now}</b>`})}</p>
   <div class="kv"><span>${S.lang==='pt'?'Último sync':'Our last sync'}</span><span>${o.status==='ACTIVE'?T('on'):T('off')}${o.bud?' · '+$c(o.bud.amt)+T('perDay'):''}</span></div><div class="kv"><span>${S.lang==='pt'?'Meta agora':'Meta now'}</span><span>${now}</span></div>
   <div class="btns"><button class="btn btn-ghost" data-act="close">${T('cancel')}</button><button class="btn btn-ink" data-act="refreshrow:${o.id}">${ic('refresh')}${T('updateRow')}</button></div>`;
 } else if(d.kind==='toggle'){
  const on=o.status!=='ACTIVE';
  const {c,a}=parents(o);
  const pp=on?[c,a].filter(x=>x&&x.status==='PAUSED'):[];
  const budSrc=o.lvl==='campaign'?(o.bud?`${$c(o.bud.amt)}${T('perDay')} (CBO)`:'ABO'):(c&&c.cbo?`${$c(c.bud.amt)}${c.bud.kind==='lifetime'?' '+T('lifetime'):T('perDay')} · ${lv('campaign')}`:(a||o).bud?`${$c(((a||o).bud).amt)}${T('perDay')} · ${lv('adset')}`:'—');
  inner=`<h2 id="dlgt">${on?T('turnOnT',{lvl:lv(o.lvl)}):T('pauseT',{lvl:lv(o.lvl)})}</h2>${objLine(o)}
   ${on?`<p><b>${T('turnOnB')}</b></p><div><div class="kv"><span>${T('budget')}</span><span>${budSrc}</span></div><div class="kv"><span>${S.lang==='pt'?'Últimos 30 dias':'Last 30 days'}</span><span>${$m(o.m.s)} · CPA ${$c(cpa(o.m))}</span></div></div>`:`<p>${T('pauseB')}</p>`}
   ${pp.length?`<div style="display:flex;flex-direction:column;gap:8px"><b>${T('alsoOn')}</b><ul class="plist">${pp.map(p=>`<li><span class="stat off"><i class="dot"></i></span><div class="nm"><span class="lvl">${lv(p.lvl)}</span><span class="n" style="white-space:normal">${esc(p.name)}</span></div><span class="tag t-neutral">${T('off')} → ${T('on')}</span></li>`).join('')}</ul><span class="muted small">${T('alsoOnB',{lvl:lv(o.lvl)})}</span></div>`:''}
   ${errBox()}
   <div class="btns"><button class="btn btn-ghost" data-act="close">${T('cancel')}</button><button class="btn ${on?'btn-accent':'btn-ink'}" data-act="confirm" ${d.busy||d.err==='rate'?'disabled':''}>${d.busy?'<span class="spin"></span>':''}${on?(pp.length?T('turnOnN',{n:pp.length+1}):T('turnOnBtn')):T('pauseBtn')}</button></div>`;
 } else if(d.kind==='budget'){
  const b=o.bud, now=b.amt, v=parseFloat(d.v), ok=!isNaN(v);
  const max=now*2;
  let msg='',err=false;
  if(!ok){msg=`<span class="fmsg bad">${S.lang==='pt'?'Digite um valor.':'Enter an amount.'}</span>`;err=true}
  else if(v<MIN){msg=`<span class="fmsg bad">${ic('alert',14)}${T('min',{v:$c(MIN)})}</span>`;err=true}
  else if(v>max){msg=`<span class="fmsg bad">${ic('alert',14)}${T('max',{v:$c(max)})}</span>`;err=true}
  const learning=o.lvl==='adset'&&o.learn==='LEARNING'||o.lvl==='campaign'&&o.sets.some(s=>s.learn==='LEARNING');
  const big=ok&&!err&&v>now*1.2;
  const warn=!err&&ok&&v!==now&&(big||learning)?`<div class="alert al-warn">${ic('alert',16)}<div class="a-body"><span>${T('learnWarn')}</span></div></div>`:'';
  const diff=ok&&!err&&v!==now?`<span class="fmsg mute">${v>now?'+':'−'}${$c(Math.abs(v-now))} ${S.lang==='pt'?'por dia':'a day'} (${v>now?'+':'−'}${Math.abs((v-now)/now*100).toFixed(0)}%) · ${S.lang==='pt'?'mínimo':'min'} ${$c(MIN)} · ${S.lang==='pt'?'máximo':'max'} ${$c(max)}</span>`:`<span class="fmsg mute">${S.lang==='pt'?'mínimo':'min'} ${$c(MIN)} · ${S.lang==='pt'?'máximo nesta mudança':'max this change'} ${$c(max)}</span>`;
  inner=`<h2 id="dlgt">${T('budT')}</h2>${objLine(o)}
   <div class="kv"><span>${T('budNow')} · ${o.lvl==='campaign'?'CBO':'ABO'}</span><span>${$c(now)}${T('perDay')}</span></div>
   <div style="display:flex;flex-direction:column;gap:8px"><label for="budin" style="font-weight:700;font-size:13px">${T('budNew')}</label>
    <div class="money ${err&&ok?'err':''}"><span>$</span><input id="budin" inputmode="decimal" value="${esc(d.v)}" aria-describedby="budmsg"><span class="per">${T('perDay')}</span></div>
    <div class="quick">${[-20,20,50,100].map(p=>`<button data-act="bq:${p}">${p>0?'+':''}${p}%</button>`).join('')}</div>
    <div id="budmsg">${msg||diff}</div></div>
   ${warn}${errBox()}
   <span class="muted small">${T('budNote')}</span>
   <div class="btns"><button class="btn btn-ghost" data-act="close">${T('cancel')}</button><button class="btn btn-ink" data-act="confirm" ${err||!ok||v===now||d.busy||d.err==='rate'?'disabled':''}>${d.busy?'<span class="spin"></span>':''}${T('saveBud')}</button></div>`;
 }
 return `<div class="ov" data-act="close-ov"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgt">${inner}</div></div>`;
}
function sheetHtml(){
 if(!S.sheet)return '';
 const scope=S.sheet.scope, o=scope==='all'?null:find(scope);
 const list=scope==='all'?HIST:HIST.filter(h=>h.id===scope);
 return `<div class="sheet-scrim" data-act="closesheet"></div><aside class="sheet" role="dialog" aria-modal="true" aria-labelledby="sht">
  <div class="sh-h"><div class="head"><span class="eyebrow">${scope==='all'?'Mooncloth US':lv(o.lvl)}</span><h2 class="h2" id="sht" style="font-size:18px">${T('histT')}${o?' · '+esc(o.name):''}</h2></div><button class="btn btn-ghost btn-icon" data-act="closesheet" aria-label="Close">${ic('x',18)}</button></div>
  <div class="sh-b">
   ${o?`<div class="lseg" role="group"><button aria-pressed="true">${T('histScopeObj')}</button><button data-act="hist:all" aria-pressed="false">${T('histScopeAll')}</button></div>`:''}
   <span class="muted small">${T('histNote')}</span>
   ${list.length?`<ul class="hist">${list.map(h=>`<li><span class="av">${h.who[0]}</span><div class="t">
    <span class="who"><b>${h.who}</b> ${h.field==='status'?(h.to===T('on')||h.to==='On'?(S.lang==='pt'?'ligou':'turned on'):(S.lang==='pt'?'pausou':'paused')):(S.lang==='pt'?'mudou o orçamento diário de':'changed the daily budget of')} ${lv(h.lvl)} <b>${esc(h.name)}</b></span>
    <span class="fromto"><s>${h.from}</s>${ic('chev',12)}<span>${h.to}</span>${h.also?`<span class="tag t-neutral">+ ${h.also}</span>`:''}</span>
    ${h.ok?'':`<span class="fmsg bad">${ic('alert',14)}${esc(h.err)}</span>`}
    <span class="meta"><span class="tag ${h.ok?'t-ok':'t-bad'}">${h.ok?T('applied'):T('failed')}</span><span>${h.at}</span><span>·</span><span>${h.src==='s'?T('fromSend'):T('fromCampaigns')}</span></span></div></li>`).join('')}</ul>`
   :`<div class="card" style="background:var(--card-2)"><b>${S.lang==='pt'?'Nada mudou por aqui ainda':'No changes from HookMill yet'}</b><span class="muted small">${S.lang==='pt'?'Ligar, pausar e mudar orçamento aparecem aqui, com quem fez.':'Turning on, pausing and budget changes show up here, with who did them.'}</span></div>`}
  </div></aside>`;
}

/* ================= actions ================= */
const toastEl=document.getElementById('toast');let tt;
function toast(m){toastEl.textContent=m;toastEl.hidden=false;clearTimeout(tt);tt=setTimeout(()=>toastEl.hidden=true,2800)}
function apply(){
 const d=S.dlg,o=find(d.id);
 if(o.stale||S.write==='changed'){S.dlg.err='changed';S.dlg.busy=false;renderLayer();return}
 if(S.write==='rate'||S.write==='token'){S.dlg.err=S.write;S.dlg.busy=false;renderLayer();
   HIST.unshift({who:'Tordan',lvl:o.lvl,id:o.id,name:o.name,field:d.kind==='budget'?'budget':'status',from:d.kind==='budget'?$c(o.bud.amt):(o.status==='ACTIVE'?'On':'Off'),to:d.kind==='budget'?$c(+d.v):(o.status==='ACTIVE'?'Off':'On'),ok:false,err:S.write==='rate'?'Meta asked us to wait (rate limit)':'Meta access expired (META_TOKEN_INVALID)',src:'c',at:'Just now'});return}
 if(d.kind==='toggle'){
  const on=o.status!=='ACTIVE';const {c,a}=parents(o);const pp=on?[c,a].filter(x=>x&&x.status==='PAUSED'):[];
  HIST.unshift({who:'Tordan',lvl:o.lvl,id:o.id,name:o.name,field:'status',from:on?'Off':'On',to:on?'On':'Off',ok:true,src:'c',at:'Just now',also:pp.length?pp.map(p=>p.name).join(', '):null});
  o.status=on?'ACTIVE':'PAUSED';o.eff=on?'ACTIVE':'PAUSED';
  pp.forEach(p=>{p.status='ACTIVE';p.eff='ACTIVE'});
  // recompute children effective status
  DATA.forEach(cc=>cc.sets.forEach(aa=>{if(aa.status==='ACTIVE')aa.eff=cc.status==='PAUSED'?'CAMPAIGN_PAUSED':'ACTIVE';aa.ads.forEach(dd=>{if(dd.status==='ACTIVE'&&dd.eff!=='DISAPPROVED')dd.eff=cc.status==='PAUSED'?'CAMPAIGN_PAUSED':aa.status==='PAUSED'?'ADSET_PAUSED':'ACTIVE'})}));
  toast((on?(S.lang==='pt'?'Ligado: ':'Turned on: '):(S.lang==='pt'?'Pausado: ':'Paused: '))+o.name+(pp.length?` (+${pp.length})`:'')+(S.lang==='pt'?' · registrado no Histórico':' · logged in History'));
 } else {
  HIST.unshift({who:'Tordan',lvl:o.lvl,id:o.id,name:o.name,field:'budget',from:$c(o.bud.amt),to:$c(+d.v),ok:true,src:'c',at:'Just now'});
  o.bud.amt=+d.v; toast((S.lang==='pt'?'Orçamento salvo: ':'Budget saved: ')+$c(+d.v)+T('perDay')+' · '+o.name);
 }
 S.flash=o.id;S.dlg=null;render();setTimeout(()=>{S.flash=null},1700);
}
function openToggle(id){
 const o=find(id); if(!canWrite()||o.eff==='DISAPPROVED')return;
 S.dlg={kind:'toggle',id};S.menuFor=null;renderLayer();
}

function renderLayer(){
 const L=document.getElementById('layer');L.className='layer '+(S.dev==='phone'?'phone':'');
 L.innerHTML=dlgHtml()+sheetHtml();
 const bi=document.getElementById('budin');
 if(bi){bi.addEventListener('input',e=>{S.dlg.v=e.target.value;const p=e.target.selectionStart;renderLayer();const n=document.getElementById('budin');n.focus();try{n.setSelectionRange(p,p)}catch(_){}});}
 const f=L.querySelector('.dlg [data-act="confirm"]:not([disabled]),.dlg [data-act="refreshrow"]'); if(f&&!bi)f.focus();
}
function render(){
 const F=document.getElementById('frame');F.className='frame '+(S.dev==='phone'?'phone':'');
 const qa=document.activeElement&&document.activeElement.id==='q';const pos=qa?document.activeElement.selectionStart:0;
 F.innerHTML=page();
 if(qa){const q=document.getElementById('q');if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}}
 const ss=document.getElementById('sortsel');if(ss)ss.onchange=e=>{S.sort=e.target.value;S.dir=S.sort==='cpa'||S.sort==='name'?'asc':'desc';render()};
 const q=document.getElementById('q');if(q)q.oninput=e=>{S.q=e.target.value;render()};
 renderLayer();
 proto();
}
function proto(){
 const sel=document.getElementById('pstate');if(!sel.options.length){STATES.forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;sel.appendChild(o)})}
 sel.value=S.state;
 document.getElementById('prole').innerHTML=ROLES.map(([v,l])=>`<button data-v="${v}" aria-pressed="${S.role===v}">${l}</button>`).join('');
 document.getElementById('pwrite').innerHTML=WRITES.map(([v,l])=>`<button data-v="${v}" aria-pressed="${S.write===v}">${l}</button>`).join('');
 document.querySelectorAll('#pdev button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.dev));
}
document.getElementById('pstate').addEventListener('change',e=>{S.state=e.target.value;render()});
document.getElementById('prole').addEventListener('click',e=>{const b=e.target.closest('button');if(b){S.role=b.dataset.v;render()}});
document.getElementById('pwrite').addEventListener('click',e=>{const b=e.target.closest('button');if(b){S.write=b.dataset.v;render()}});
document.getElementById('pdev').addEventListener('click',e=>{const b=e.target.closest('button');if(b){S.dev=b.dataset.v;S.drill={c:null,a:null};render()}});

function onAct(e){
 const b=e.target.closest('[data-act]');
 if(!b){if(S.menuFor&&!e.target.closest('.menu')){S.menuFor=null;render()}return}
 if(b.tagName==='A'&&b.getAttribute('href')&&b.getAttribute('href')!=='#')return;
 e.preventDefault();
 const [k,v]=b.dataset.act.split(/:(.*)/s);
 if(k==='close-ov'){if(e.target===b){S.dlg=null;renderLayer()}return}
 if(k!=='menu'&&S.menuFor){S.menuFor=null}
 switch(k){
  case 'noop':return;
  case 'toast':toast(v);render();return;
  case 'lang':S.lang=v;render();return;
  case 'mmenu':S.mobileMenu=!S.mobileMenu;render();return;
  case 'nav':if(v!=='campaigns')toast('Goes to '+v+' (unchanged screen)');S.mobileMenu=false;render();return;
  case 'view':S.view=v;S.drill={c:null,a:null};render();return;
  case 'period':S.period=v;render();return;
  case 'status':S.status=v;render();return;
  case 'origin':S.origin=v;render();return;
  case 'clear':S.q='';S.status='all';S.origin='all';render();return;
  case 'sort':if(S.sort===v)S.dir=S.dir==='asc'?'desc':'asc';else{S.sort=v;S.dir=v==='cpa'||v==='name'?'asc':'desc'}render();return;
  case 'exp':S.open.has(v)?S.open.delete(v):S.open.add(v);render();return;
  case 'drill':if(v==='root')S.drill={c:null,a:null};else{const o=find(v);S.drill=o.lvl==='campaign'?{c:v,a:null}:{c:parents(o).c.id,a:v}}render();window.scrollTo(0,0);return;
  case 'menu':S.menuFor=S.menuFor===v?null:v;render();return;
  case 'toggle':openToggle(v);return;
  case 'budget':{if(!canWrite())return;const o=find(v);S.dlg={kind:'budget',id:v,v:String(o.bud.amt)};renderLayer();setTimeout(()=>{const i=document.getElementById('budin');if(i){i.focus();i.select()}},30);return}
  case 'bq':{const o=find(S.dlg.id);S.dlg.v=(Math.round(o.bud.amt*(1+(+v)/100)*100)/100).toFixed(2);renderLayer();return}
  case 'close':S.dlg=null;renderLayer();return;
  case 'confirm':S.dlg.busy=true;S.dlg.err=null;renderLayer();setTimeout(apply,700);return;
  case 'refreshrow':{const o=find(v);if(o.lvl!=='ad'&&o.bud){o.bud.amt=80}o.status='PAUSED';o.eff='PAUSED';o.stale=false;S.dlg=null;S.flash=o.id;render();toast(S.lang==='pt'?'Linha atualizada com o que está na Meta. Confira e tente de novo.':'Row updated from Meta. Check it and try again.');return}
  case 'hist':S.sheet={scope:v};S.menuFor=null;render();return;
  case 'closesheet':S.sheet=null;renderLayer();return;
  case 'iterate':{const o=find(v);toast((S.lang==='pt'?'Abrindo Iterar com ':'Opening Iterate with ')+'"'+o.name+'" (POST /iterate { metaAdId })');render();return}
  case 'sync':S.syncing=1;render();const iv=setInterval(()=>{S.syncing++;if(S.syncing>5){clearInterval(iv);S.syncing=0;if(['stale','failed'].includes(S.state))S.state='ready';toast(S.lang==='pt'?'Sincronizado com a Meta agora':'Synced with Meta just now')}render()},800);return;
 }
}
document.getElementById('frame').addEventListener('click',onAct);
document.getElementById('layer').addEventListener('click',onAct);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.dlg){S.dlg=null;renderLayer()}else if(S.sheet){S.sheet=null;renderLayer()}else if(S.menuFor){S.menuFor=null;render()}}});
try{const h=location.hash.slice(1);if(h==='phone')S.dev='phone'}catch(_){}
render();
})();
</script>
