<title>HookMill Format Remix</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: same shell as campaigns-v1 / onboarding-v2 (dark sidebar + light work area, single light theme by decision 12/10).
   Iterate a winner = one flow: Winner → Your goals (3-question quiz) → Plan (analysis + batch with Stretch / New audience / With AI)
   → Approve AI (only when AI pieces are on) → Generate → Pieces. Format Remix lives inside the batch; no separate menu item. */
:root{
  --bg:#EEEEEA; --card:#FDFDFB; --card-2:#F3F4F0; --input:#FFFFFF;
  --line:#DCDDD7; --line-soft:#E4E5E0; --line-strong:#CFD1CB; --control:#B9BCB5;
  --fg:#15171A; --fg-2:#3B4047; --fg-3:#5A6068; --fg-btn:#4A5058; --on-ink-btn:#FFFFFF;
  --accent:#C8F03C; --accent-hover:#BDE52F; --accent-ink:#3E5200; --accent-soft:#F0F8D2; --accent-edge:#A9CC2A;
  --ink:#16181B; --ink-2:#202328; --ink-3:#2A2E33; --ink-line:#2E3238; --ink-fg:#F2F3EE; --ink-fg-2:#C5CAD0; --ink-fg-3:#9AA1A9; --ink-body:#E8EAE4;
  --ok-bg:#E2F3E8; --ok:#0B6B43; --ok-dot:#1C9A5E; --ok-line:#B7DEC5; --ok-text:#0B4D31;
  --warn-bg:#FBF0D3; --warn:#7A5000; --warn-line:#E9C76B; --warn-dot:#D9A21B; --warn-text:#4A3100;
  --bad-bg:#FBE7DD; --bad:#A8360C; --bad-edge:#E4B9A6; --bad-text:#5E1E06;
  --info-bg:#E6EBFC; --info:#2B4BC8; --info-line:#C3CEF6; --info-text:#1D2F7A;
  --row-hover:#F6F7F2; --scrim:rgba(22,24,27,.55); --shadow:rgba(21,23,26,.16);
  --chat-bg:#F2F2F7; --chat-l:#E4E4EA; --chat-r:#2F7BF6; --chat-who:#6B6B73; --video-bg:#000; --video-ink:#111; --video-fg:#FFFFFF;
  --font:'Archivo','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r-chip:8px; --r-ctl:10px; --r-btn:12px; --r-card:16px; --r-panel:18px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;font-family:var(--font);font-size:14px;line-height:1.45;color:var(--fg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:100;background:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
svg{flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* prototype bar (not product) */
.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--ink);color:var(--ink-fg-2);border-bottom:1px solid var(--ink-line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:12px}
.proto b{color:var(--ink-fg);font-family:var(--mono);font-size:11px;letter-spacing:.08em}
.proto select{background:var(--ink-2);color:var(--ink-fg);border:1px solid var(--ink-line);border-radius:8px;min-height:32px;padding:0 8px;max-width:100%}
.pg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--ink-2);border:1px solid var(--ink-line);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;color:var(--ink-fg-2);border-radius:7px;min-height:28px;padding:0 9px;cursor:pointer;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--fg);font-weight:700}
.proto .note{color:var(--ink-fg-3)}

/* frame */
.frame{container-type:inline-size;container-name:app;margin:0 auto;width:100%;background:var(--bg);position:relative}
.frame.phone{width:390px;max-width:100%;margin-block:20px;border:1px solid var(--line-strong);border-radius:28px;overflow:hidden;box-shadow:0 10px 40px var(--shadow)}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 50px)}
.app.chat{grid-template-columns:248px minmax(0,1fr) 380px}
.side{background:var(--ink);color:var(--ink-fg-2);padding:18px 14px 20px;display:flex;flex-direction:column;gap:18px;position:sticky;top:50px;height:calc(100vh - 50px);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 6px;color:var(--ink-fg);text-decoration:none}
.brand-mark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--fg);font-weight:800;font-stretch:125%;font-size:10px;flex:none}
.brand-name{font-weight:800;font-stretch:125%;font-size:15px;letter-spacing:-.01em}
.client{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 10px;border-radius:12px;background:var(--ink-2);border:1px solid var(--ink-line);color:var(--ink-fg);text-align:left;width:100%;cursor:pointer}
.client-av{display:inline-grid;place-items:center;flex:none;width:32px;height:32px;border-radius:9px;background:#1E2550;color:#E9DFC9;font-weight:800}
.client .t{flex:1;min-width:0;display:flex;flex-direction:column}
.client b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.client small{font-size:12px;color:#8BD7A9}
.navgrp{display:flex;flex-direction:column;gap:2px}
.navlab{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink-fg-3);padding:0 10px 6px}
.nav{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 10px;border-radius:10px;border:0;background:transparent;color:var(--ink-fg-2);font-weight:500;cursor:pointer;text-align:left;width:100%}
.nav svg{stroke:var(--ink-fg-3)}
.nav:hover{background:var(--ink-2)}
.nav[aria-current="page"]{background:var(--ink-3);color:var(--ink-fg);font-weight:700}
.nav[aria-current="page"] svg{stroke:var(--accent)}
.badge{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--fg);background:var(--accent);border-radius:999px;padding:1px 7px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--ink-line);padding-top:12px}
.me{display:flex;align-items:center;gap:10px;padding:0 6px}
.me-av{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:999px;background:var(--ink-line);color:var(--ink-fg);font-weight:700;font-size:13px;flex:none}
.me .t{min-width:0;flex:1}
.me b{color:var(--ink-fg);font-weight:600;display:block}.me small{font-size:12px;color:var(--ink-fg-3)}
.lang{display:inline-flex;border:1px solid var(--ink-line);border-radius:8px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;color:var(--ink-fg-3);font-family:var(--mono);font-size:11px;min-height:30px;padding:0 8px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink-3);color:var(--ink-fg)}
.topm{display:none}
main.work{min-width:0;padding:24px 32px 140px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* type */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--fg-3);text-transform:uppercase}
.h1{margin:0;font-size:30px;line-height:1.1;font-weight:800;font-stretch:125%;letter-spacing:-.015em;text-wrap:balance}
.h2{margin:0;font-size:16px;font-weight:700;text-wrap:balance}
.h3{margin:0;font-size:15px;font-weight:700}
.lede{margin:0;color:var(--fg-3);max-width:660px;text-wrap:pretty}
.muted{color:var(--fg-3)} .small{font-size:13px} .tiny{font-size:12px}
.headrow{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.head{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 380px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.link{border:0;background:transparent;padding:0;color:var(--fg);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:24px}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-btn);border:1px solid transparent;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap;background:transparent}
.btn-sm{min-height:36px;padding:0 12px;border-radius:10px;font-size:13px}
.btn-xs{min-height:30px;padding:0 10px;border-radius:9px;font-size:12px}
.btn-accent{background:var(--accent);color:var(--fg)} .btn-accent:hover{background:var(--accent-hover)}
.btn-ink{background:var(--fg);color:var(--on-ink-btn)} .btn-ink:hover{background:var(--ink-3)}
.btn-out{background:var(--card);border-color:var(--line-strong);font-weight:600;color:var(--fg)}
.btn-out:hover{border-color:var(--fg)}
.btn-ghost{color:var(--fg-btn);font-weight:600}
.btn-ghost:hover{background:var(--card-2)}
.btn-icon{width:36px;min-height:36px;padding:0;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.sumbar .btn-out{background:var(--ink-2);border-color:var(--ink-line);color:var(--ink-fg)}
.spin{width:14px;height:14px;border-radius:999px;border:2px solid var(--line-strong);border-top-color:var(--fg);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* tags */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;line-height:1.5;height:fit-content}
.t-ok{background:var(--ok-bg);color:var(--ok)} .t-warn{background:var(--warn-bg);color:var(--warn)}
.t-bad{background:var(--bad-bg);color:var(--bad)} .t-info{background:var(--info-bg);color:var(--info)}
.t-neutral{background:var(--card-2);color:var(--fg-2);border:1px solid var(--line-soft)}
.t-win{background:var(--fg);color:var(--accent)}
.t-dash{color:var(--fg-3);border:1px dashed var(--control)}
.t-mono{font-family:var(--mono);font-size:10px;letter-spacing:.05em;font-weight:600}
.t-var{background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent-edge)}
.dot{width:7px;height:7px;border-radius:999px;background:currentColor;flex:none}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* alerts */
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;border:1px solid;flex-wrap:wrap}
.alert .a-body{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 240px}
.alert .a-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.al-bad{background:var(--bad-bg);border-color:var(--bad-edge);color:var(--bad-text)}
.al-warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-text)}
.al-ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-text)}
.al-info{background:var(--info-bg);border-color:var(--info-line);color:var(--info-text)}

/* flow rail */
.rail{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.rail button{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px 0 6px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg-3);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none}
.rail .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:999px;border:1px solid var(--line-strong);font-family:var(--mono);font-size:11px}
.rail button.done{color:var(--fg-2)} .rail button.done .n{background:var(--fg);color:var(--accent);border-color:var(--fg)}
.rail button[aria-current="step"]{border-color:var(--fg);color:var(--fg)} .rail button[aria-current="step"] .n{background:var(--accent);border-color:var(--accent-edge);color:var(--fg)}
.rail button[disabled]{cursor:default;opacity:.6}
.rail button.skip{border-style:dashed;opacity:.7}
.rail button.skip .n{border-style:dashed}
.crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--fg-3)}
.crumb button{border:0;background:transparent;color:var(--fg-2);font-weight:600;cursor:pointer;padding:6px 0;min-height:32px}

/* kpis */
.kpis{display:flex;gap:14px;flex-wrap:wrap}
.kpis span{display:flex;flex-direction:column}
.kpis small{font-size:11px;color:var(--fg-3)}
.kpis b{font-family:var(--mono);font-size:13px;font-weight:600}

/* mini scene thumbs (CSS drawn, stand in for video frames) */
.vthumb{position:relative;aspect-ratio:9/16;border-radius:10px;overflow:hidden;background:var(--wall,#3A3F4A);flex:none;max-width:100%}
.vthumb.r45{aspect-ratio:4/5}.vthumb.r11{aspect-ratio:1/1}
.vthumb::before{content:"";position:absolute;left:10%;top:12%;width:30%;height:24%;border-radius:3px;background:var(--win,rgba(255,255,255,.14))}
.vthumb .p-head{position:absolute;left:50%;top:var(--py,38%);width:30%;aspect-ratio:1;border-radius:50%;transform:translateX(-50%);background:var(--skin,#C99A7A);box-shadow:0 -7px 0 -1px var(--hair,#2B1E17)}
.vthumb .p-body{position:absolute;left:50%;bottom:-6%;width:66%;height:var(--bh,38%);border-radius:44% 44% 0 0;transform:translateX(-50%);background:var(--shirt,#C8C2B6)}
.vthumb.two .p-head{left:30%;width:24%}.vthumb.two .p-body{left:30%;width:46%}
.vthumb.two .p-head.b{left:72%;background:var(--skin2,#8D5F45);box-shadow:0 -7px 0 -1px var(--hair2,#121212)}.vthumb.two .p-body.b{left:72%;background:var(--shirt2,#41545E)}
.vthumb .cap{position:absolute;left:8%;right:8%;top:58%;background:var(--video-fg);color:var(--video-ink);font-weight:800;font-size:9px;line-height:1.15;padding:3px 5px;border-radius:4px;text-align:center}
.vthumb.big .cap{font-size:clamp(13px,3.6cqw,20px);padding:6px 10px;border-radius:8px}
.vthumb .dur{position:absolute;right:6px;bottom:6px;font-family:var(--mono);font-size:10px;background:rgba(0,0,0,.6);color:var(--video-fg);border-radius:4px;padding:0 4px}
.vthumb.chatv{background:var(--chat-bg)}
.vthumb.chatv::before{display:none}
.vthumb .bub{position:absolute;max-width:72%;font-size:7px;line-height:1.2;padding:3px 5px;border-radius:7px}
.vthumb .bub.l{left:8%;background:var(--chat-l);color:var(--video-ink)}.vthumb .bub.r{right:8%;background:var(--chat-r);color:var(--video-fg)}
.vthumb.prog{background:#101215}
.vthumb .noface{position:absolute;inset:auto 8% 8% 8%;font-family:var(--mono);font-size:8px;color:#9AA1A9}
.vthumb .box{position:absolute;left:10%;right:10%;top:16%;background:var(--video-fg);color:var(--video-ink);border-radius:8px;padding:4px;font-size:7px;font-weight:700;text-align:center}
.vthumb .sbar{position:absolute;left:8%;right:8%;top:10%;background:var(--video-fg);color:#666;border-radius:999px;padding:3px 6px;font-size:7px}
.vthumb.still{background:#E6DED2}
.vthumb.still::before{left:15%;top:46%;width:70%;height:18%;border-radius:40%;background:#2F3E46}
.vthumb .stars{position:absolute;left:10%;right:10%;bottom:12%;background:var(--video-fg);color:#D9A21B;border-radius:6px;font-size:8px;text-align:center;padding:2px}
.vthumb .mot{position:absolute;left:6%;top:22%;font-weight:800;font-size:10px;color:var(--accent);text-transform:uppercase;line-height:1}

/* library */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;min-width:0}
.lcard.win{border-color:var(--accent-edge)}
.lcard .t{display:flex;flex-direction:column;gap:8px;min-width:0}
.lcard .nm{font-weight:700;line-height:1.25}
.lcard .chips{display:flex;flex-wrap:wrap;gap:4px}
.lcard .acts{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.lcard .acts .btn{width:100%}
.drop{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:16px;border:1.5px dashed var(--control);border-radius:var(--r-card);background:var(--card)}
.drop .t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 240px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.lseg{display:inline-flex;gap:2px;background:var(--card-2);border:1px solid var(--line);border-radius:11px;padding:2px;flex:none}
.lseg button{border:0;background:transparent;color:var(--fg-btn);border-radius:9px;min-height:32px;padding:0 10px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.lseg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 0 0 1px var(--line-strong)}
.lseg .c{font-family:var(--mono);font-size:11px;color:var(--fg-3)}

/* quiz */
.quiz{max-width:680px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.qtop{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.qprog{display:flex;gap:4px;flex:1 1 160px;max-width:220px}
.qprog i{flex:1;height:4px;border-radius:999px;background:var(--line-strong)}
.qprog i.on{background:var(--fg)}
.anstat{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-3);padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.anstat b{color:var(--fg-2);font-weight:600}
.saved{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--accent-soft);border:1px solid var(--accent-edge);color:var(--accent-ink);font-size:13px}
.saved .a-body{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:2px}
.qopts{display:grid;gap:8px}
.qopts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.qopt{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;align-items:start;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:left;cursor:pointer;width:100%;min-width:0}
.qopt:hover{border-color:var(--control)}
.qopt[aria-checked="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.qopt .rd{width:20px;height:20px;border-radius:999px;border:1.5px solid var(--control);display:grid;place-items:center;margin-top:1px;background:var(--input)}
.qopt[aria-checked="true"] .rd{border-color:var(--fg);border-width:6px}
.qopt .cbx{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--control);display:grid;place-items:center;margin-top:1px;background:var(--input)}
.qopt[aria-checked="true"] .cbx{background:var(--fg);border-color:var(--fg);color:var(--accent)}
.qopt .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.qopt .t .r1{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.qopt .t b{font-size:15px}
.qopt .t span.d{font-size:13px;color:var(--fg-3)}
.qopt.full{grid-column:1/-1}
.qopt[aria-disabled="true"]{background:var(--card-2);cursor:not-allowed}
.qopt[aria-disabled="true"] b{color:var(--fg-3)}
.capin{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.capin input{width:110px;min-height:38px;border:1px solid var(--line-strong);border-radius:10px;padding:0 10px;background:var(--input);font-family:var(--mono)}
.capin input:focus{outline:2px solid var(--info);outline-offset:1px}
.qfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:4px}
.qfoot .grow{flex:1}

/* plan */
.pl2{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
.pleft{display:flex;flex-direction:column;gap:12px;position:sticky;top:66px;min-width:0}
.pright{display:flex;flex-direction:column;gap:14px;min-width:0}
.winrow{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:start}
.winrow .t{display:flex;flex-direction:column;gap:6px;min-width:0}
.blocks{display:flex;flex-wrap:wrap;gap:4px}
.blocks span{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:6px;border:1px solid var(--line);color:var(--fg-3);background:var(--card)}
.blocks span.kept{background:var(--accent-soft);border-color:var(--accent-edge);color:var(--accent-ink)}
.whylist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.whylist li{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-top:1px solid var(--line-soft);transition:background .2s;border-radius:8px}
.whylist li:first-child{border-top:0;padding-top:0}
.whylist li.hl{background:var(--accent-soft);padding-inline:8px}
.whylist .k{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.whylist .k em{font-style:normal;text-transform:none;letter-spacing:0}
.whylist b.say{font-size:14px}
.whylist span.d{color:var(--fg-2);font-size:13px}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.prefs{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:var(--r-card);background:var(--card-2);border:1px solid var(--line)}
.prefs .r{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.prefs .k{font-family:var(--mono);font-size:11px;color:var(--fg-3);letter-spacing:.04em}
.blk{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);display:flex;flex-direction:column;min-width:0}
.blk .bh{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-start;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line-soft)}
.blk .bh .t{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 260px}
.blk .bh .t .r1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.blk .rows{list-style:none;margin:0;padding:0 16px}
.prow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line-soft)}
.prow:first-child{border-top:0}
.prow .vthumb{width:36px;border-radius:6px}
.prow .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.prow .t .r1{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.code{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.02em}
.prow .d{font-size:13px;color:var(--fg-2)}
.price{font-family:var(--mono);font-size:12px;color:var(--fg-3);white-space:nowrap;text-align:right}
.price.free{color:var(--ok)}
.left-out{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-top:1px dashed var(--line-strong);font-size:12px;color:var(--fg-3)}
.blk .bf{padding:10px 16px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--fg-3);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.aiblk{border-color:var(--fg)}
.aiblk.off{border-color:var(--line);border-style:dashed}
.switch{position:relative;display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;cursor:pointer;font-weight:600;font-size:13px;min-height:36px;padding:0}
.switch .tr{width:38px;height:22px;border-radius:999px;background:var(--line-strong);position:relative;transition:background .15s}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:999px;background:var(--card);transition:transform .15s}
.switch[aria-checked="true"] .tr{background:var(--fg)}
.switch[aria-checked="true"] .tr::after{transform:translateX(16px);background:var(--accent)}
.aisub{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--fg-3);text-transform:uppercase;padding:12px 0 2px}
.airow{display:grid;grid-template-columns:24px 36px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line-soft)}
.airow .cb{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--control);display:grid;place-items:center;background:var(--input);cursor:pointer;margin-top:2px;padding:0}
.airow .cb[aria-checked="true"]{background:var(--fg);border-color:var(--fg);color:var(--accent)}
.airow .vthumb{width:36px;border-radius:6px}
.airow .t{display:flex;flex-direction:column;gap:6px;min-width:0}
.airow .t .r1{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.airow .rt{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.airow.dim .t,.airow.dim .vthumb{opacity:.7}
.because{display:flex;flex-direction:column;gap:4px;padding:8px 10px;border-radius:10px;background:var(--card-2);border:1px solid var(--line-soft);font-size:13px;color:var(--fg-2)}
.because button{align-self:flex-start;border:0;background:transparent;padding:0;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--fg-3);cursor:pointer;display:inline-flex;gap:5px;align-items:center;min-height:24px}
.because button:hover{color:var(--fg)}
.fmeta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--fg-3)}
.cost{font-family:var(--mono);font-weight:600;color:var(--fg);white-space:nowrap}
.tier{display:inline-flex;gap:2px}.tier i{width:6px;height:10px;border-radius:2px;background:var(--line-strong)}.tier i.on{background:var(--fg)}
.learned{display:flex;gap:6px;align-items:flex-start;font-size:12px;color:var(--ok)}
.meterline{display:flex;flex-direction:column;gap:6px}
.meterline .r{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--fg-3);flex-wrap:wrap}
.sumbar{position:sticky;bottom:0;z-index:15;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--ink);color:var(--ink-body);border-radius:var(--r-panel);padding:12px 14px 12px 18px;box-shadow:0 10px 30px var(--shadow);margin-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.sumbar .s{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 260px}
.sumbar .s b{font-size:15px}
.sumbar .s small{color:var(--ink-fg-3);font-size:12px}
.sumbar .s .mono{color:var(--accent)}
.sumbar .bb{display:flex;gap:8px;flex-wrap:wrap}

/* menu dialog */
.ov{position:fixed;inset:0;z-index:70;background:var(--scrim);display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.layer.phone .ov{left:50%;right:auto;width:390px;max-width:100%;transform:translateX(-50%)}
.dlg{width:760px;max-width:100%;max-height:calc(100vh - 48px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 60px var(--shadow);animation:dlg .18s ease-out}
@keyframes dlg{from{opacity:0;transform:translateY(6px)}}
.dlg h2{margin:0;font-size:18px;font-weight:800;font-stretch:115%;letter-spacing:-.01em}
.dlg .hd{display:flex;gap:10px;align-items:flex-start}
.dlg .hd .head{flex:1}
.mitems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mi{display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;min-width:0}
.mi:hover{border-color:var(--fg)}
.mi .r1{display:flex;gap:8px;align-items:center;justify-content:space-between}
.mi .r1 b{font-size:14px}
.mi .d{font-size:12px;color:var(--fg-3)}
.mi.cur{border-color:var(--accent-edge);background:var(--accent-soft)}
.mi[aria-disabled="true"]{cursor:not-allowed;background:var(--card-2)}
.mi[aria-disabled="true"]:hover{border-color:var(--line)}
.mi .lockmsg{font-size:12px;color:var(--warn);display:flex;gap:6px;align-items:flex-start}

/* approve */
.ftabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.ftabs button{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;white-space:nowrap;flex:none;color:var(--fg-2)}
.ftabs button[aria-selected="true"]{border-color:var(--fg);color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.ftabs .ck{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:999px;border:1.5px solid var(--control)}
.ftabs .ck.on{background:var(--ok-dot);border-color:var(--ok-dot);color:var(--video-fg)}
.appr{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.avcard{position:sticky;top:66px}
.scene{position:relative;aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:var(--wall,#3A3F4A);max-width:100%}
.scene::before{content:"";position:absolute;left:8%;top:10%;width:34%;height:30%;border-radius:4px;background:var(--win,rgba(255,255,255,.14))}
.scene::after{content:"";position:absolute;right:10%;top:30%;width:14%;height:40%;border-radius:40% 40% 4px 4px;background:var(--prop,rgba(0,0,0,.18))}
.scene .p-head{position:absolute;left:50%;top:30%;width:28%;aspect-ratio:1;border-radius:50%;transform:translateX(-50%);background:var(--skin,#C99A7A);box-shadow:0 -10px 0 -1px var(--hair,#2B1E17)}
.scene .p-body{position:absolute;left:50%;bottom:-4%;width:64%;height:38%;border-radius:44% 44% 0 0;transform:translateX(-50%);background:var(--shirt,#C8C2B6)}
.scene .lab{position:absolute;left:8px;bottom:8px;font-family:var(--mono);font-size:10px;background:rgba(0,0,0,.6);color:var(--video-fg);border-radius:5px;padding:1px 6px}
.scene.loading .p-head,.scene.loading .p-body{opacity:.25}
.scenes2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scenes3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.persona{display:flex;flex-direction:column;gap:2px;font-size:13px}
.swaps{font-family:var(--mono);font-size:12px;color:var(--fg-3)}
.swapbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.script{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.script li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:12px 14px;border-top:1px solid var(--line-soft)}
.script li:first-child{border-top:0}
.script .tc{display:flex;flex-direction:column;gap:2px;font-family:var(--mono);font-size:11px;color:var(--fg-3)}
.script .tc b{font-size:12px;color:var(--fg)}
.script .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.line{display:flex;gap:8px;align-items:flex-start}
.spk{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.04em;padding:2px 6px;border-radius:6px;background:var(--card-2);border:1px solid var(--line-soft);flex:none;margin-top:1px}
.spk.b{background:var(--info-bg);border-color:var(--info-line);color:var(--info)}
.say{flex:1;min-width:0;border:1px solid transparent;border-radius:8px;padding:1px 6px;margin:-2px -6px;outline:0}
.say:hover{border-color:var(--line-strong)}
.say:focus{border-color:var(--info);background:var(--input)}
.vis{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--fg-3)}
.from{font-family:var(--mono);font-size:10px;color:var(--ok);border:1px solid var(--ok-line);background:var(--ok-bg);border-radius:6px;padding:0 5px}
.hooks{display:flex;flex-direction:column;gap:8px}
.hook{display:grid;grid-template-columns:24px minmax(0,1fr) 120px;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;text-align:left;width:100%}
.hook.on{border-color:var(--accent-edge);background:var(--accent-soft)}
.hook.risk{border-color:var(--warn-line)}
.hook .cb{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--control);display:grid;place-items:center;background:var(--input)}
.hook.on .cb{background:var(--fg);border-color:var(--fg);color:var(--accent)}
.hook .txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.hook .txt b{font-weight:600}
.hook .rk{font-size:12px;color:var(--warn);display:flex;gap:6px;align-items:flex-start}
.score{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.score .r{display:flex;justify-content:space-between;font-size:11px;color:var(--fg-3)}
.score .r b{font-family:var(--mono);font-size:13px;color:var(--fg)}
.meter{height:6px;border-radius:999px;background:var(--line-soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--fg);border-radius:999px}
.meter.low i{background:var(--warn-dot)}
.meter.over i{background:var(--bad)}
.plines{display:flex;flex-direction:column;gap:8px}
.pline{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.pline .scene{aspect-ratio:1}
.pline .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.chatmock{background:var(--chat-bg);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;aspect-ratio:4/5;overflow:hidden;max-width:100%}

/* generating */
.gens{display:flex;flex-direction:column;gap:12px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:start;min-width:0}
.gcard .vthumb{width:56px}
.gcard .t{display:flex;flex-direction:column;gap:8px;min-width:0}
.gcard .r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.steps li{display:flex;gap:8px;align-items:center;color:var(--fg-2)}
.steps li.todo{color:var(--fg-3)}
.steps li.fail{color:var(--bad)}
.steps .st{width:18px;height:18px;border-radius:999px;display:inline-grid;place-items:center;flex:none;border:1.5px solid var(--control)}
.steps .st.done{background:var(--fg);border-color:var(--fg);color:var(--accent)}
.steps .st.now{border-color:var(--fg)}
.steps .st.fail{background:var(--bad);border-color:var(--bad);color:var(--video-fg)}
.bar{height:6px;border-radius:999px;background:var(--line-soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--fg);transition:width .6s}
.pct{font-family:var(--mono);font-size:13px;font-weight:600}
.frows{list-style:none;margin:0;padding:0 16px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) 140px auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line-soft);font-size:13px}
.frow:first-child{border-top:0}
.frow .st{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--fg-3);white-space:nowrap}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
.beam{position:relative}
.beam::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--a),transparent 0 70%,var(--accent) 82%,var(--info) 92%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:beam 2.4s linear infinite;pointer-events:none}
@keyframes beam{to{--a:360deg}}
.orbs{display:inline-flex;gap:4px}.orbs i{width:7px;height:7px;border-radius:999px;background:var(--fg);animation:orb 1.2s ease-in-out infinite}
.orbs.sm i{width:5px;height:5px}
.orbs i:nth-child(2){animation-delay:.15s}.orbs i:nth-child(3){animation-delay:.3s}
@keyframes orb{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.sk{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--line-soft),var(--card-2),var(--line-soft));background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

/* pieces */
.fgroup{display:flex;flex-direction:column;gap:10px}
.fgroup .gh{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pieces{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.piece{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.piece .pv{border:0;padding:0;background:transparent;cursor:pointer;display:block;width:100%;border-radius:10px;position:relative}
.piece .pv .vthumb{width:100%}
.piece .pv .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:999px;background:rgba(0,0,0,.55);display:grid;place-items:center;color:var(--video-fg)}
.piece .pv:hover .play{background:rgba(0,0,0,.75)}
.piece .lbl{display:flex;flex-wrap:wrap;gap:4px}
.piece .hk{font-size:13px;line-height:1.3;color:var(--fg-2)}
.piece .acts{display:flex;gap:6px}
.piece .acts .btn{flex:1}
.piece.updating .pv{opacity:.55}

/* player overlay */
.player{width:min(1040px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--ink);border-radius:var(--r-panel);display:grid;grid-template-columns:minmax(0,1fr) 300px;color:var(--ink-body);box-shadow:0 24px 60px var(--shadow)}
.player .stage{background:var(--video-bg);display:grid;place-items:center;padding:20px;min-width:0;container-type:inline-size}
.player .stage .vthumb{width:min(380px,100%);border-radius:14px}
.player .stage .vthumb.r45{width:min(460px,100%)} .player .stage .vthumb.r11{width:min(520px,100%)}
.pctrl{display:flex;align-items:center;gap:10px;width:min(380px,100%);margin-top:12px}
.pctrl button{width:36px;height:36px;border-radius:999px;border:0;background:var(--ink-2);color:var(--video-fg);display:grid;place-items:center;cursor:pointer}
.ptrack{flex:1;height:4px;background:#333;border-radius:999px;overflow:hidden}
.ptrack i{display:block;height:100%;background:var(--accent);width:0}
.ptrack.run i{animation:ptrack 8s linear forwards}
@keyframes ptrack{to{width:100%}}
.player .info{padding:18px;display:flex;flex-direction:column;gap:12px;border-left:1px solid var(--ink-line);min-width:0}
.player .info .eyebrow{color:var(--ink-fg-2)}
.player .kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-top:1px solid var(--ink-line)}
.player .kv span:first-child{color:var(--ink-fg-3)}
.player .kv span:last-child{font-family:var(--mono);text-align:right}
.ratio{display:inline-flex;gap:2px;background:var(--ink-2);border:1px solid var(--ink-line);border-radius:10px;padding:2px}
.ratio button{border:0;background:transparent;color:var(--ink-fg-2);border-radius:8px;min-height:30px;padding:0 10px;cursor:pointer;font-family:var(--mono);font-size:12px}
.ratio button[aria-pressed="true"]{background:var(--ink-3);color:var(--ink-fg)}
.player .info .btn{width:100%}
.player .info .btn-out{background:var(--ink-2);border-color:var(--ink-line);color:var(--ink-fg)}

/* chat panel */
.chat{background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:50px;height:calc(100vh - 50px);min-width:0}
.chat .ch{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-soft)}
.chat .ch .t{flex:1;display:flex;flex-direction:column;min-width:0}
.chat .ch small{font-size:12px;color:var(--fg-3)}
.chat .eddy{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--fg);color:var(--accent);font-family:var(--mono);font-size:11px;font-weight:600;flex:none}
.chat .ctx{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--line-soft);font-size:12px;color:var(--fg-3)}
.chat .msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;font-size:13px;line-height:1.45;padding:10px 12px;border-radius:14px}
.msg.me{align-self:flex-end;background:var(--fg);color:var(--on-ink-btn);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--card-2);border:1px solid var(--line-soft);border-bottom-left-radius:4px}
.msg.ai.think{display:flex;gap:10px;align-items:center;color:var(--fg-3)}
.plancard{align-self:stretch;border:1px solid var(--line);border-radius:14px;background:var(--card);display:flex;flex-direction:column;overflow:hidden}
.plancard .ph{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--line-soft)}
.plancard .ph .t{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.plancard dl{margin:0;padding:6px 12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:12px}
.plancard dt{color:var(--fg-3)} .plancard dd{margin:0;color:var(--fg)}

const wantsAuto=()=>S.ans.want.includes('auto');
function freePieces(){

 let st=FREE.filter(p=>p.g==='stretch'),nw=FREE.filter(p=>p.g==='new');
 const filt=p=>wantsAuto()||!p.want||S.ans.want.includes(p.want)||S.addBack.has(p.want);
 const outS=st.filter(p=>!filt(p)),outN=nw.filter(p=>!filt(p));
 st=st.filter(filt).slice(0,nS);nw=nw.filter(filt).slice(0,nN);
 return {st,nw,out:[...outS,...outN]};
}
function applyAnswers(){
 const a=S.ans;S.aiOn=new Set();S.suggest=false;S.aiBlock=a.ai!=='free';
 if(a.ai==='yes'){
  if(wantsAuto()){S.aiOn.add('avface');S.aiOn.add('discovery')}

 S.approved=new Set();S.tab=0;
}

const GSTEPS={person:['Writing voice lines','Generating the person in the scene','Lip-syncing','Cutting inserts from the original','Assembling the edit','Rendering 9:16'],
 two:['Writing voice lines (2 voices)','Generating host and guest','Lip-syncing host','Lip-syncing guest','Cutting shot / reverse-shot','Rendering 9:16'],

function gsteps(id){return id==='avface'?GSTEPS.face:F[id].people===2?GSTEPS.two:GSTEPS.person}
function allFree(){const f=freePieces();return [...f.st,...f.nw]}
function pageGen(){
 const failed=S.st.gen==='failed';const slots=S.genAI?aiSlots():[];
 const free=allFree();
 const freeDone=free.every(p=>(S.fprog[p.code]||0)>=100);
 const aiDone=slots.every(id=>(S.prog[id]||0)>=gsteps(id).length);
 const done=freeDone&&aiDone;
 const cards=slots.map((id,i)=>{const st=gsteps(id);const p=Math.min(S.prog[id]||0,st.length);const fin=p>=st.length;const isFail=failed&&i===slots.length-1&&!fin;
  const pct=Math.round(p/st.length*100);
  return `<article class="gcard ${!fin&&!isFail?'beam':''}" style="border-radius:var(--r-card)">${vthumb(id,'')}<div class="t"><div class="r"><span class="code">${F[id].code}</span><h3 class="h3">${F[id].name}</h3>${fin?`<span class="tag t-ok">${ic('check',12,2.6)} Ready</span>`:isFail?`<span class="tag t-bad">${L('Stopped','Parou')}</span>`:`<span class="tag t-info"><i class="dot pulse"></i> ${st[p]}</span>`}<span class="tiny muted">3 ${L('pieces','peças')}</span></div>
   <div class="bar" aria-hidden="true"><i style="width:${isFail?Math.max(pct,40):pct}%;${isFail?'background:var(--bad)':''}"></i></div>
   <ul class="steps">${st.map((t,k)=>{const cls=k<p?'done':isFail&&k===p?'fail':k===p?'now':'todo';return `<li class="${cls}"><span class="st ${cls}">${cls==='done'?ic('check',10,2.8):cls==='fail'?ic('x',10,2.8):''}</span>${t}${cls==='now'?' <span class="mono tiny muted">· ≈ '+(st.length-k)*1.5+' min</span>':''}</li>`}).join('')}</ul>
   ${isFail?`<div class="alert al-bad">${ic('alert',16)}<div class="a-body"><b>${L('Guest lip-sync failed','A dublagem do convidado falhou')}</b><span class="small">${L('The service timed out. Finished steps are saved.','O serviço demorou demais. As outras etapas ficaram salvas.')} ${T('retryNote')}</span></div><div class="a-act"><button class="btn btn-ink btn-sm" data-act="retrygen">${T('retry')}</button></div></div>`:''}
  </div><span class="pct gact">${isFail?'—':pct+'%'}</span></article>`}).join('');
 const fr=free.filter(p=>(S.fprog[p.code]||0)>=100).length;
 const frows=`<section class="blk"><div class="bh"><div class="t"><div class="r1"><h2 class="h2">${L('Free pieces','Peças grátis')}</h2><span class="tiny muted mono">${fr}/${free.length}</span></div><span class="small muted">${L('Edited from your video. Retry costs nothing.','Editadas do seu vídeo. Tentar de novo não custa nada.')}</span></div></div>
  <ul class="frows">${free.map(p=>{const v=S.fprog[p.code]||0;const st=v>=100?`<span class="tag t-ok">${ic('check',11,2.6)} Ready</span>`:v>0?`<span><i class="dot pulse" style="color:var(--info)"></i> ${p.usd?L('Creating the image','Criando a imagem'):L('Rendering','Renderizando')} · ${v}%</span>`:`<span>${L('Waiting in line','Na fila')}</span>`;return `<li class="frow"><span><span class="code">${p.code}</span> <span class="tiny muted">${p.type}</span></span><span class="bar"><i style="width:${v}%"></i></span><span class="st">${st}</span></li>`}).join('')}</ul></section>`;
 const total=free.length+slots.length*3;
 return flowHead(done?T('readyT',{n:total}):T('genT',{n:total}),done?'':T('genL'),done?`<button class="btn btn-accent" data-act="go:ready">${T('viewPieces')} ${ic('right',16)}</button>`:`<button class="btn btn-out btn-sm" data-act="toast:Rendering keeps going. Home › Waiting for you shows it.">${T('leave')}</button>`)+`<div class="gens">${slots.length?`<h2 class="h2">${L('With AI','Com IA')}</h2>`+cards:''}${frows}</div>`;
}

   return pieceTile(F[id].code,id,cap,lbl,pid,S.updating===pid)}).join('')}</div></section>`}).join('');

function send(text){

  <div class="mitems">${items.map(([id,f])=>{const dis=f.locked||f.soon;const inUse=S.aiList.includes(id)&&id!==cur;
   return `<button class="mi ${id===cur?'cur':''}" ${dis||inUse?'aria-disabled="true"':`data-act="pickf:${id}"`}><span class="r1"><b>${f.name}</b>${f.locked?`<span class="tag t-warn">${ic('lock',11)} Locked</span>`:f.soon?'<span class="tag t-dash">Wave 2</span>':f.beta?'<span class="tag t-info">Beta</span>':id===cur?'<span class="tag t-var">Current</span>':inUse?'<span class="tag t-neutral">In batch</span>':''}</span>
    <span class="d">${esc(f.desc)}</span>${f.locked?`<span class="lockmsg">${ic('alert',13)} <span>${esc(f.lockT)}</span></span>`:''}
    <span class="fmeta">${pplTxt(f.people)} · <span class="cost">${f.soon?'—':'X credits'}</span> ${tierHtml(f.tier)}</span></button>`}).join('')}</div></div></div>`;
}
function playerOv(){
 const a=S.player.split(':');let th,cap,name,varTxt,adName;
 if(a[0]==='f'){const p=FREE.find(x=>x.code===a[1]);th=p.th;cap=p.cap||'';name=p.type;varTxt=p.code;adName='MC·'+p.code}
 else{const id=a[1],k=+a[2];const sc=scriptFor(id);const sel=S.hooks[id]||[0,1,2];th=id;name=F[id].name;
  if(F[id].cls==='av'){cap='';varTxt=(id==='avface'?'Face ':'Persona ')+(k+1);adName='MC·'+F[id].code+'-'+(k+1)}
  else{cap=sc.hooks[sel[k]]?sc.hooks[sel[k]].t:'';varTxt='Hook '+HOOKVAR[k]+(k?' · same body':'');adName='MC·'+F[id].code+'·H'+HOOKVAR[k]}}
 return `<div class="ov" data-act="closeov"><div class="player" role="dialog" aria-modal="true" aria-label="Player" data-stop="1"><div class="stage"><div style="display:flex;flex-direction:column;align-items:center;width:100%">${vthumb(th,cap,{ratio:S.ratio,big:true})}<div class="pctrl"><button data-act="pp" aria-label="Play">${ic(S.playing?'pause':'play',16)}</button><span class="ptrack ${S.playing?'run':''}"><i></i></span><span class="mono tiny" style="color:#aaa">0:31</span></div></div></div>
  <div class="info"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div><span class="eyebrow">${esc(name)}</span><h2 class="h2" style="color:var(--ink-fg);margin-top:4px">${esc(cap||varTxt)}</h2></div><button class="btn btn-ghost btn-icon" style="color:var(--ink-fg)" data-act="closeov" aria-label="Close">${ic('x',18)}</button></div>
   <div class="ratio" role="group" aria-label="Size">${[['916','9:16'],['45','4:5'],['11','1:1']].map(([v,l])=>`<button data-act="ratio:${v}" aria-pressed="${S.ratio===v}">${l}</button>`).join('')}</div>
   <div><div class="kv"><span>Type</span><span>${esc(name)}</span></div><div class="kv"><span>Variable</span><span>${esc(varTxt)}</span></div><div class="kv"><span>From</span><span>I tried 11 sleep masks</span></div><div class="kv"><span>Ad name</span><span>${esc(adName)}</span></div></div>
   <button class="btn btn-accent" data-act="toast:Opens Send to Meta with this piece">${ic('meta',16)} ${T('sendMeta')}</button>
   <button class="btn btn-out" data-act="adjust:${S.player}">${ic('pencil',16)} ${T('adjust')}</button>
   <button class="btn btn-out" data-act="toast:Downloads the 9:16 file">${ic('down',16)} ${T('download')}</button></div></div></div>`;
}

/* ================= render ================= */
const frame=document.getElementById('frame'),layer=document.getElementById('layer');
function page(){return S.step==='pick'?pagePick():S.step==='quiz'?pageQuiz():S.step==='plan'?pagePlan():S.step==='approve'?pageApprove():S.step==='gen'?pageGen():pageReady()}
function render(){
 const ae=document.activeElement;const keepInput=ae&&ae.id==='cinput'?ae.value:null;
 frame.className='frame'+(S.dev==='phone'?' phone':'');
 layer.className='layer'+(S.dev==='phone'?' phone':'');
 frame.innerHTML=shell(page());
 layer.innerHTML=S.swapSlot!=null?swapMenu():S.player?playerOv():(S.chat&&isNarrow())?`<div class="ov chatov" data-act="closeov"><div class="chatwrap" data-stop="1">${chatPanel()}</div></div>`:'';
 const sel=document.getElementById('pstate');
 sel.innerHTML=STATES[S.step].map(([v,l])=>`<option value="${v}" ${S.st[S.step]===v?'selected':''}>${D.en['s_'+S.step]} · ${l}</option>`).join('');
 document.querySelectorAll('#pdev button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.dev));
 document.querySelectorAll('#pmeta button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.meta));
 document.querySelectorAll('#pbatch button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.batch));
 const m=document.getElementById('msgs');if(m)m.scrollTop=m.scrollHeight;
 if(keepInput!==null){const c=document.getElementById('cinput');if(c){c.value=keepInput;c.focus()}}
 const f=document.getElementById('cform');if(f)f.addEventListener('submit',e=>{e.preventDefault();const c=document.getElementById('cinput');const v=c.value;c.value='';send(v)});
 const c=document.getElementById('cinput');if(c)c.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const v=c.value;c.value='';send(v)}});
 const cap=document.getElementById('capv');if(cap)cap.addEventListener('input',()=>{S.ans.cap=Math.max(0,+cap.value||0)});
}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,2600)}
function go(s){S.step=s;S.maxStep=Math.max(S.maxStep,stepIdx(s));S.mobileMenu=false;S.hl=null;render();window.scrollTo({top:0})}

/* analysis runs while the person answers the quiz */
let anTimer=null;
function startAnalysis(){S.an=0;clearInterval(anTimer);anTimer=setInterval(()=>{if(S.an>=AN_STEPS.length){clearInterval(anTimer);return}S.an++;
 if(S.step==='quiz'){const el=document.getElementById('anstat');if(el)el.innerHTML=anStat()}else if(S.step==='plan')render()},2600)}

let genTimer=null;
function startGen(withAI){
 S.genAI=withAI;S.prog={};S.fprog={};aiSlots().forEach(id=>S.prog[id]=0);allFree().forEach(p=>S.fprog[p.code]=0);if(S.st.gen!=='failed')S.st.gen='running';
 clearInterval(genTimer);
 genTimer=setInterval(()=>{let all=true;
  allFree().forEach((p,i)=>{const v=S.fprog[p.code];if(v<100){all=false;if(i<3||Object.values(S.fprog).filter(x=>x>0&&x<100).length<3||v>0)S.fprog[p.code]=Math.min(100,v+Math.round(15+Math.random()*25))}});
  if(S.genAI)aiSlots().forEach((id,i,arr)=>{const L2=gsteps(id).length;if(S.st.gen==='failed'&&i===arr.length-1){if(S.prog[id]<3)S.prog[id]++;all=false;return}if(S.prog[id]<L2){all=false;if(Math.random()<.5)S.prog[id]++}});
  if(S.step==='gen')render();
  else if(S.step==='approve'){const el=document.getElementById('freestat');if(el){const fr=Object.values(S.fprog).filter(x=>x>=100).length;el.innerHTML=`<i class="dot pulse"></i> ${L('Free pieces','Peças grátis')}: ${fr}/${nFree()} ${L('ready','prontas')}`}}
  if(all)clearInterval(genTimer)},1100);
}

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 if(e.target.closest('.capin'))return;
 const a=el.dataset.act;
 if(a==='closeov'){if(!el.matches('button')&&e.target.closest('[data-stop]'))return;if(S.swapSlot==null&&!S.player)S.chat=false;S.swapSlot=null;S.player=null;S.playing=false;render();return}
 const [k,v,w]=a.split(':');
 if(k==='noop'){e.preventDefault();return}
 if(k==='toast'){toast(a.slice(6));return}
 if(k==='lang'){S.lang=v;S.msgs=null;render();return}
 if(k==='mmenu'){S.mobileMenu=!S.mobileMenu;render();return}
 if(k==='nav'){if(v==='library'||v==='iterate'){S.fromLib=v==='library';go('pick');return}if(v==='chat'){S.chatMode='free';S.msgs=null;S.chat=true;render();return}toast('Existing page: '+v);return}
 if(k==='chat'){S.chat=!S.chat;render();return}
 if(k==='chatmode'){S.chatMode=v;S.msgs=null;render();return}
 if(k==='lf'){S.libFilter=v;render();return}
 if(k==='pickad'){S.qi=0;S.ans=JSON.parse(JSON.stringify(S.batch==='next'?SAVED_ANS:DEF_ANS));S.addBack=new Set();S.maxStep=0;startAnalysis();go('quiz');return}
 if(k==='go'){go(v);return}
 if(k==='state'){S.st[v]=w;render();return}
 /* quiz */
 if(k==='ans'){const q=+v;const key=w;
  if(q===0)S.ans.goal=key;
  if(q===1){S.ans.ai=key;if(key==='free')S.ans.want=S.ans.want.filter(x=>x!=='face'&&x!=='format');if(!S.ans.want.length)S.ans.want=['auto']}
  if(q===2){let wl=S.ans.want.filter(x=>x!=='auto');if(key==='auto')wl=['auto'];else{wl=wl.includes(key)?wl.filter(x=>x!==key):[...wl,key];if(!wl.length)wl=['auto']}S.ans.want=wl}
  render();return}
 if(k==='qnext'||k==='qskip'){if(k==='qskip'){if(S.qi===0)S.ans.goal='auto';if(S.qi===1)S.ans.ai='auto';if(S.qi===2)S.ans.want=['auto']}
  if(S.qi<2){S.qi++;render();window.scrollTo({top:0})}else{applyAnswers();go('plan')}return}
 if(k==='qback'){S.qi=Math.max(0,S.qi-1);render();return}
 if(k==='qgo'){S.qi=+v;render();return}
 if(k==='skipall'){S.ans=JSON.parse(JSON.stringify(DEF_ANS));applyAnswers();go('plan');return}
 if(k==='usesaved'){S.ans=JSON.parse(JSON.stringify(SAVED_ANS));applyAnswers();go('plan');return}
 if(k==='editans'){S.qi=0;go('quiz');return}
 /* plan */
 if(k==='aitoggle'){S.aiOn.has(v)?S.aiOn.delete(v):S.aiOn.add(v);S.approved.delete(v);render();return}
 if(k==='aiblock'){S.aiBlock=!S.aiBlock;if(S.aiBlock&&S.ans.ai==='free'){S.ans.ai='yes';toast(L('AI allowed for this batch. The client preference changes to "Up to 400 credits".','IA liberada neste lote. A preferência do cliente vira "Até 400 créditos".'))}render();return}
 if(k==='addback'){S.addBack.add(v);render();return}
 if(k==='hl'){S.hl=S.hl===v?null:v;render();const r=document.getElementById('why-'+v);if(r&&S.hl)r.scrollIntoView({block:'nearest',behavior:'smooth'});return}
 if(k==='swap'){S.swapSlot=v;S.menuTab=F[v].cls;render();return}
 if(k==='addfmt'){S.swapSlot='add';S.menuTab='one';render();return}
 if(k==='mtab'){S.menuTab=v;render();return}
 if(k==='pickf'){const old=S.swapSlot;if(old==='add'){S.aiList.push(v);S.aiOn.add(v);toast(L('Added: ','Adicionado: ')+F[v].name)}else{const i=S.aiList.indexOf(old);S.aiList[i]=v;if(S.aiOn.has(old)){S.aiOn.delete(old);S.aiOn.add(v)}S.approved.delete(old);toast(L('Swapped: ','Trocado: ')+F[old].name+' → '+F[v].name)}S.swapSlot=null;render();return}
 if(k==='genfree'){S.aiOn=new Set();startGen(false);go('gen');return}
 if(k==='toapprove'){startGen(false);S.tab=0;go('approve');return}
 /* approve */
 if(k==='tab'){S.tab=+v;render();return}
 if(k==='hook'){const id=aiSlots()[S.tab];const cur=(S.hooks[id]||[0,1,2]).slice();const i=+v;const at=cur.indexOf(i);if(at>=0){if(cur.length<=1)return;cur.splice(at,1)}else{if(cur.length>=3)cur.shift();cur.push(i)}
  S.hooks[id]=cur;S.approved.delete(id);render();if(cur.length<3)toast(L('Pick 3 hooks','Escolha 3 ganchos'));return}
 if(k==='newface'||k==='newscript'){const id=aiSlots()[S.tab];const left=S.st.approve==='nofree'?0:(S.swaps[id]??3);
  if(left<=0){toast(L('This swap costs X credits (a confirm step goes here).','Esta troca custa X créditos (aqui entra a confirmação).'));return}
  S.busy=k==='newface'?'face':'script';S.approved.delete(id);render();
  setTimeout(()=>{S.busy=null;S.swaps[id]=left-1;if(k==='newface')S.faceV[id]=(S.faceV[id]||0)+1;else{const sc=scriptFor(id);sc.hooks.push(sc.hooks.shift())}render()},1400);return}
 if(k==='approve'){const id=aiSlots()[S.tab];if(F[id].cls!=='av'&&(S.hooks[id]||[0,1,2]).length<3){toast(L('Pick 3 hooks first','Escolha 3 ganchos antes'));return}S.approved.add(id);const nx=aiSlots().findIndex(s=>!S.approved.has(s));if(nx>=0)S.tab=nx;render();return}
 if(k==='unapprove'){S.approved.delete(aiSlots()[S.tab]);render();return}
 if(k==='dropai'){const id=aiSlots()[S.tab];S.aiOn.delete(id);S.tab=0;toast(L('Left out: ','Fora do lote: ')+F[id].name);if(!aiSlots().length){S.genAI=false;go('gen')}else render();return}
 if(k==='generate'){S.genAI=true;const keep={...S.fprog};startGen(true);S.fprog=keep;go('gen');return}
 if(k==='retrygen'){S.st.gen='running';render();return}
 /* pieces */
 if(k==='ratio'){S.ratio=v;render();return}
 if(k==='play'){S.player=a.slice(5);S.playing=true;render();return}
 if(k==='pp'){S.playing=!S.playing;render();return}
 if(k==='adjust'){S.player=null;S.adjPiece=a.slice(7);S.chatMode='adjust';S.msgs=null;S.chat=true;render();return}
 if(k==='say'){send(el.dataset.text);return}
 if(k==='planok'){S.chat=!isNarrow()&&S.chat;if(!S.aiList.includes('podcast'))S.aiList.push('podcast');S.aiOn.add('podcast');S.aiBlock=true;S.msgs.push({t:'Added REMIX-PODCAST to the With AI block. You approve the script and faces before anything is charged.'});go('plan');toast(L('REMIX-PODCAST added to With AI','REMIX-PODCAST adicionado em Com IA'));return}
 if(k==='adjok'){S.updating=S.adjPiece||'a:podcast:1';S.msgs.push({t:'Updating the opening. It takes about 2 minutes; the piece shows a spinner until then.'});if(S.step!=='ready')go('ready');else render();
  setTimeout(()=>{const p=S.updating.split(':');if(p[0]==='a'&&F[p[1]].cls!=='av'){const sc=scriptFor(p[1]);const sel=S.hooks[p[1]]||[0,1,2];sc.hooks[sel[+p[2]]]={...sc.hooks[sel[+p[2]]],t:'Why did ten of the eleven sleep masks I tested go in the trash?'}}S.updating=null;render();toast('Piece updated')},3200);return}
});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(S.swapSlot!=null||S.player){S.swapSlot=null;S.player=null;render()}else if(S.chat&&isNarrow()){S.chat=false;render()}});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.chat&&!document.activeElement.matches('textarea'))render()},200)});
document.getElementById('pstate').addEventListener('change',e=>{S.st[S.step]=e.target.value;if(S.step==='plan'&&e.target.value==='ready')S.an=AN_STEPS.length;if(S.step==='plan'&&e.target.value==='over'){S.ans.ai='yes';S.aiBlock=true;['avface','avfull','discovery','podcast'].forEach(x=>S.aiOn.add(x));S.suggest=false;S.an=AN_STEPS.length}if(S.step==='gen'&&e.target.value==='failed'){S.genAI=true;if(!aiSlots().length){S.aiOn.add('podcast');S.aiBlock=true}startGen(true)}render()});
document.getElementById('pdev').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.dev=b.dataset.v;try{location.hash=S.dev==='phone'?'phone':''}catch(_){}render()});
document.getElementById('pmeta').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.meta=b.dataset.v;render()});
document.getElementById('pbatch').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.batch=b.dataset.v;S.qi=0;S.ans=JSON.parse(JSON.stringify(S.batch==='next'?SAVED_ANS:DEF_ANS));if(S.step==='pick'){S.maxStep=0;startAnalysis();go('quiz')}else if(S.step==='quiz')render();else{applyAnswers();render()}});
if(location.hash==='#phone')S.dev='phone';
render();
})();
</script>
