<title>HookMill Variar Campeão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: same shell as wizard v1 (Vercel dashboard). Header + tabs; flow = left step rail + work area + sticky action bar. Single dark theme by decision (briefing). */
:root{
  --bg:#0a0a0a; --surface:#111111; --surface-2:#171717; --hover:#1f1f1f;
  --line:#262626; --line-2:#3a3a3a;
  --fg:#ededed; --fg-2:#a1a1a1; --fg-3:#878787;
  --btn:#ededed; --btn-fg:#0a0a0a;
  --blue:#52a8ff; --blue-bg:rgba(82,168,255,.12);
  --green:#62c073; --green-bg:rgba(98,192,115,.12);
  --amber:#f2a33a; --amber-bg:rgba(242,163,58,.12);
  --red:#ff6166; --red-bg:rgba(255,97,102,.12);
  --stage:#000000;
  --font:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r-sm:6px; --r:8px; --r-lg:12px;
  --gut:clamp(16px,3vw,24px);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg);margin:0;overflow-x:clip}
.page,.wz-body,.sec,.panel,.field,.prog,.stack,.vts,.hooks,.vrows,.final,.changes{grid-template-columns:minmax(0,1fr)}
body{font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ic{width:16px;height:16px;flex:none}
.mono{font-family:var(--mono)}
.muted{color:var(--fg-2)}
.faint{color:var(--fg-3)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
h1{font-size:24px;letter-spacing:-.02em}
h2{font-size:16px}
h3{font-size:14px}
p{margin:0}

/* prototype bar (not product chrome) */
.proto{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;white-space:nowrap;padding:6px var(--gut);border-bottom:1px dashed var(--line-2);background:var(--bg);font-size:12px;color:var(--fg-3)}
.proto::-webkit-scrollbar{display:none}
.proto-tag{font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;font-size:11px;border:1px dashed var(--line-2);padding:1px 6px;border-radius:4px}
.proto .seg{flex:none;overflow:visible;max-width:none}
.proto .seg button{font-size:12px;padding:2px 8px}
.proto-spacer{flex:1}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr-top{display:flex;align-items:center;gap:10px;padding:12px var(--gut) 4px}
.logo{width:24px;height:24px;border-radius:6px;background:var(--fg);display:grid;place-items:center;flex:none;border:0;padding:0}
.logo span{width:10px;height:10px;border:2px solid var(--bg);border-radius:2px}
.crumb{display:flex;align-items:center;gap:8px;min-width:0;font-weight:500}
.crumb .sep{color:var(--line-2);font-size:20px;font-weight:300}
.crumb .ws{display:flex;align-items:center;gap:8px;white-space:nowrap}
.crumb .cur{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ws-av{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#3a3a3a,#1a1a1a);border:1px solid var(--line-2)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.me{width:28px;height:28px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--fg-2)}
.tabs{display:flex;gap:4px;padding:0 calc(var(--gut) - 8px);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:10px 8px 11px;color:var(--fg-2);position:relative;white-space:nowrap;font-size:14px;border-radius:6px}
.tab:hover{color:var(--fg)}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--fg)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:500;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s;min-width:0}
.btn:hover{background:var(--hover);border-color:var(--line-2)}
.btn.primary{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.btn.primary:hover{background:#ffffff}
.btn.ghost{background:none;border-color:transparent;color:var(--fg-2)}
.btn.ghost:hover{color:var(--fg);background:var(--hover)}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.btn.lg{height:40px;padding:0 16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{max-width:100%;overflow-x:auto;scrollbar-width:none;display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);padding:2px;background:var(--surface);gap:2px;min-width:0}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;color:var(--fg-2);padding:4px 10px;border-radius:4px;font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--hover);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.input,.textarea,.select{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;color:var(--fg);font-size:14px}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--fg-3);box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.textarea{resize:vertical;min-height:64px;line-height:1.5}
.field{display:grid;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:13px;color:var(--fg-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.linkrow{display:flex;gap:8px}
.linkrow .input{flex:1;min-width:0}

/* status */
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--fg-3)}
.st-progress .dot{background:var(--blue);box-shadow:0 0 0 3px var(--blue-bg);animation:pulse 1.6s ease-in-out infinite}
.st-waiting .dot{background:var(--amber)}
.st-failed .dot{background:var(--red)}
.st-approved .dot{background:var(--green)}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(82,168,255,0)}}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--fg-2);white-space:nowrap}
.tag .ic{width:12px;height:12px}
.tag.ai{border-style:dashed}
.tag.amber{color:var(--amber);border-color:transparent;background:var(--amber-bg)}
.tag.solid{background:var(--surface-2)}
.step-lbl{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3)}
.row-sub{font-size:13px;color:var(--fg-2)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* pages */
.page{padding:28px var(--gut) 64px;max-width:1200px;margin:0 auto;display:grid;gap:28px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head>div:first-child{min-width:0}
.page-head .sub{color:var(--fg-2);margin-top:4px;max-width:65ch}
.page-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec{display:grid;gap:12px}
.sec-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.count{font-family:var(--mono);font-size:12px;color:var(--fg-3);margin-left:6px;font-weight:400}
.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px;display:grid;gap:14px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.stack{display:grid;gap:16px;min-width:0}

/* banners */
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);flex-wrap:wrap}
.banner.err{border-color:rgba(255,97,102,.35);background:var(--red-bg)}
.banner.err>.ic{color:var(--red)}
.banner.warn{border-color:rgba(242,163,58,.35);background:var(--amber-bg)}
.banner.warn>.ic{color:var(--amber)}
.banner.info>.ic{color:var(--blue)}
.banner .b-body{flex:1;min-width:200px;display:grid;gap:2px}
.banner .b-act{display:flex;gap:8px;flex-wrap:wrap}
.memo{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--fg-2)}
.memo .ic{margin-top:2px}
.memo b{color:var(--fg);font-weight:500}

/* checklist + progress */
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13px}
.checklist li{display:flex;gap:8px;align-items:center;color:var(--fg-2);min-width:0}
.checklist li.done{color:var(--fg)}
.checklist li.done .ic{color:var(--green)}
.checklist li.now{color:var(--fg)}
.checklist li .faint{margin-left:auto;font-family:var(--mono);font-size:12px;white-space:nowrap}
.checklist .sp{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--blue);border-top-color:transparent;animation:spin 1s linear infinite;flex:none;margin:1px}
.checklist .q{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;margin:1px}
@keyframes spin{to{transform:rotate(360deg)}}
.prog{display:grid;gap:8px}
.prog-bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog-bar b{display:block;height:100%;background:var(--blue);transition:width .6s ease}
.prog-bar.ok b{background:var(--green)}
.sk{display:block;background:linear-gradient(90deg,var(--surface-2) 0%,var(--hover) 50%,var(--surface-2) 100%);background-size:200% 100%;animation:sk 1.4s linear infinite;border-radius:4px}
@keyframes sk{to{background-position:-200% 0}}
.think{display:flex;gap:20px;align-items:center;padding:20px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);flex-wrap:wrap}
.think>div{flex:1;min-width:200px}
.orb{width:56px;height:56px;position:relative;flex:none;filter:blur(.5px)}
.orb i{position:absolute;inset:0;border-radius:50%;mix-blend-mode:screen;animation:orb 3.2s ease-in-out infinite}
.orb i:nth-child(1){background:radial-gradient(circle at 35% 35%,#ffffff 0,#8a8a8a 30%,transparent 62%)}
.orb i:nth-child(2){background:radial-gradient(circle at 65% 45%,var(--blue) 0,rgba(82,168,255,.3) 30%,transparent 60%);animation-delay:-1s;animation-duration:2.6s}
.orb i:nth-child(3){background:radial-gradient(circle at 45% 70%,#cfcfcf 0,#444 30%,transparent 60%);animation-delay:-2s;animation-duration:3.8s}
@keyframes orb{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(.86)}}
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
.beam{position:relative}
.beam::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:conic-gradient(from var(--a),transparent 0 72%,var(--blue) 88%,#ffffff 92%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:beam 2.4s linear infinite;pointer-events:none}
@keyframes beam{to{--a:360deg}}

/* wizard shell (same as v1) */
.wz{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 110px)}
.rail{border-right:1px solid var(--line);padding:20px 16px;display:grid;gap:18px;align-content:start;position:sticky;top:96px;align-self:start}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.steps li button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:var(--r-sm);border:0;background:none;color:var(--fg-2);text-align:left;font-size:14px}
.steps li button:hover{background:var(--hover);color:var(--fg)}
.steps li button[aria-current="step"]{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.steps li button .skip{margin-left:auto;font-size:12px;color:var(--fg-3)}
.sicon{width:18px;height:18px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;flex:none;font-family:var(--mono);font-size:10px;color:var(--fg-3)}
.sicon.done{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.sicon.done .ic{width:12px;height:12px}
.sicon.cur{border-color:var(--fg);color:var(--fg)}
.sicon.run{border-color:var(--blue);border-top-color:transparent;animation:spin 1s linear infinite}
.sicon.fail{border-color:var(--red);color:var(--red)}
.sicon.skip{border-style:dashed}
.rail-meta{display:grid;gap:6px;font-size:13px;color:var(--fg-2);border-top:1px solid var(--line);padding-top:14px}
.rail-meta div{display:flex;justify-content:space-between;gap:8px}
.rail-meta div span:last-child{text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wz-main{display:flex;flex-direction:column;min-width:0}
.wz-body{padding:24px var(--gut) 32px;display:grid;gap:20px;align-content:start;flex:1;max-width:1180px;width:100%}
.wz-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.wz-head>div{min-width:0}
.wz-head .sub{color:var(--fg-2);margin-top:4px;max-width:68ch}
.actionbar{position:sticky;bottom:0;z-index:10;background:var(--bg);border-top:1px solid var(--line);padding:12px var(--gut);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px}
.actionbar .hint{color:var(--fg-3);font-size:13px;margin-right:auto;min-width:0}
.mstep{display:none}

/* source step */
.opt-list{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;width:100%;min-width:0}
.opt:hover{border-color:var(--line-2)}
.opt[aria-checked="true"]{border-color:var(--fg)}
.radio{width:16px;height:16px;border-radius:50%;border:1px solid var(--line-2);flex:none;margin-top:2px;display:grid;place-items:center}
[aria-checked="true"]>.radio{border-color:var(--fg)}
[aria-checked="true"]>.radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--fg)}
.opt-body{flex:1;min-width:0;display:grid;gap:2px}
.own{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.drop{border:1px dashed var(--line-2);border-radius:var(--r-lg);padding:28px 16px;display:grid;justify-items:center;gap:8px;text-align:center;background:var(--surface)}
.drop.hot{border-color:var(--fg);box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.drop .big{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--fg-2)}
.or{display:flex;align-items:center;gap:10px;color:var(--fg-3);font-size:12px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.file{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
.file .thumb{width:48px}
.src-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}

/* thumbs + player */
.thumb{aspect-ratio:9/16;border-radius:6px;overflow:hidden;border:1px solid var(--line);max-width:100%;position:relative;background:var(--stage)}
.thumb svg{width:100%;height:100%;display:block}
.thumb .play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;opacity:.85}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:var(--r-lg);display:grid;place-items:center;padding:16px;min-width:0}
.player{position:relative;width:min(100%,calc(min(64vh,600px) * 9 / 16));aspect-ratio:9/16;border-radius:10px;overflow:hidden;background:#0d0d0d}
.player.lg{width:min(100%,calc(min(72vh,720px) * 9 / 16))}
.player svg.frame{position:absolute;inset:0;width:100%;height:100%}
.ov-head{position:absolute;left:7%;right:7%;top:8%;text-align:center;font-weight:700;font-size:clamp(13px,2vw,18px);line-height:1.15;color:#fff}
.ov-head span{background:#fff;color:#000;padding:2px 6px;border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.cap{position:absolute;left:6%;right:6%;bottom:24%;text-align:center;font-weight:700;color:#fff;font-size:clamp(15px,2.2vw,22px);line-height:1.15;text-shadow:0 2px 10px rgba(0,0,0,.8);text-transform:uppercase;letter-spacing:-.01em}
.ov-split{position:absolute;left:0;right:0;bottom:0;height:42%;background:#141414;border-top:2px solid #000;display:grid;place-items:center}
.ov-split i{width:56%;height:78%;border-radius:8px;background:#e9e9e9;opacity:.9;display:grid;gap:6%;padding:8%;align-content:start}
.ov-split i b{display:block;height:9%;background:#bdbdbd;border-radius:2px}
.pctrl{position:absolute;left:0;right:0;bottom:0;padding:24px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.75));display:flex;align-items:center;gap:10px;color:#fff}
.pctrl button{background:none;border:0;color:#fff;padding:4px;display:grid;place-items:center}
.scrub{flex:1;height:3px;background:rgba(255,255,255,.25);border-radius:2px;position:relative}
.scrub b{position:absolute;left:0;top:0;bottom:0;background:#fff;border-radius:2px}
.ptime{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
.an-ov{position:absolute;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:end start;padding:12px}
.an-ov span{font-family:var(--mono);font-size:11px;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.15);padding:2px 6px;border-radius:4px;color:#fff}

/* teardown */
.td-grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:24px;align-items:start}
.td-left{position:sticky;top:110px;display:grid;gap:12px;min-width:0}
.td-left .stage{padding:12px}
.tl-wrap{display:grid;gap:6px;min-width:0}
.tl{position:relative;display:flex;gap:2px;min-width:0}
.tl-b{min-width:0;height:44px;border:1px solid var(--line);border-radius:4px;background:var(--surface-2);display:grid;align-content:center;justify-items:start;padding:0 6px;gap:0;text-align:left;overflow:hidden}
.tl-b:hover{border-color:var(--line-2)}
.tl-b.on{border-color:var(--fg);background:var(--hover)}
.tl-b .step-lbl{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:var(--fg-2)}
.tl-b.on .step-lbl{color:var(--fg)}
.tl-b .tl-t{font-size:11px;color:var(--fg-3)}
.tl-ph{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);border-radius:1px;pointer-events:none;transition:left .1s linear}
.tl-cuts{position:relative;height:8px}
.tl-cuts i{position:absolute;top:0;width:1px;height:8px;background:var(--fg-3)}
.tl-legend{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--fg-3);font-family:var(--mono);flex-wrap:wrap}
.blk{display:grid;gap:8px;font-size:13px}
.blk dl{margin:0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 10px}
.blk dt{color:var(--fg-3);font-size:12px}
.blk dd{margin:0;min-width:0}
.facts{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--fg-2)}
.verdict{border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);padding:16px;display:grid;gap:12px}
.verdict ol{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:v}
.verdict li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;counter-increment:v}
.verdict li::before{content:counter(v);font-family:var(--mono);font-size:12px;color:var(--fg-3);border:1px solid var(--line-2);border-radius:4px;height:20px;display:grid;place-items:center}
.verdict li b{font-weight:600}
.secs{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.sect{border-top:1px solid var(--line)}
.sect:first-child{border-top:0}

.vt.soon{background:var(--bg);border-style:dashed}
.vt.soon .vt-title b,.vt.soon .vt-title>.row-sub{color:var(--fg-2)}

.cbx{width:18px;height:18px;border-radius:4px;border:1px solid var(--line-2);background:var(--surface-2);flex:none;display:grid;place-items:center;padding:0;margin-top:1px;color:var(--bg)}

.lays{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.lay{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);padding:6px;display:grid;gap:6px;text-align:left;font-size:12px;color:var(--fg-2);min-width:0;position:relative}

.stream::after{content:"";display:inline-block;width:7px;height:14px;background:var(--fg);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}

.tr-row .note{grid-column:1/-1;color:var(--fg-2);font-size:12px;margin-top:-4px}
.tr-row .cell-name{display:grid;gap:2px;min-width:0}

.cap-bar b.over{background:var(--red)}

.gen-thumb .pct{position:absolute;font-family:var(--mono);font-size:10px;color:var(--fg);background:rgba(0,0,0,.6);padding:1px 4px;border-radius:4px}

var VSTEPS=[['source','Winner','Campeão'],['teardown','Teardown','Diagnóstico'],['types','Variations','Variações'],['hooks','Hooks','Ganchos'],['estimate','Estimate','Estimativa'],['batch','Batch','Lote']];
var STATES={
 'v-source':[['empty','Empty','Vazio'],['uploading','Uploading','Enviando'],['linkload','Reading link','Lendo link'],['linkerr','Link failed','Link falhou'],['ready','Ready','Pronto'],['library','From Library','Da Biblioteca']],
 'v-teardown':[['loading','Analyzing','Analisando'],['ready','Ready','Pronto'],['error','Error','Erro']],
 'v-types':[['ready','Ready','Pronto']],
 'v-hooks':[['loading','Writing','Escrevendo'],['ready','Ready','Pronto']],
 'v-estimate':[['ready','Ready','Pronto'],['cap','Over monthly cap','Passa do teto']],
 'v-batch':[['loading','In progress','Em andamento'],['error','One failed','Uma falhou'],['ready','All done','Tudo pronto']],
 review:[['ready','Review','Revisão'],['changes','Request changes','Pedir ajustes']],
 library:[['ready','Ready','Pronto']],
 home:[['ready','Ready','Pronto']]
};
function stOf(k){k=k||S.screen;return S.st[k]||STATES[k][0][0];}
function inFlow(){return S.screen.indexOf('v-')===0;}
function cur(){return S.screen.slice(2);}
function stepIdx(id){for(var i=0;i<VSTEPS.length;i++){if(VSTEPS[i][0]===id)return i;}return 0;}
function stepName(id){var i=stepIdx(id);return t(VSTEPS[i][1],VSTEPS[i][2]);}
function hooksSkipped(){return !active('hooks');}
function stepKind(id){
 if(id==='hooks'&&hooksSkipped())return 'skip';
 var ci=stepIdx(cur()),i=stepIdx(id);
 if(id===cur()){
  var st=stOf();
  if((id==='teardown'||id==='batch'||id==='hooks')&&st==='loading')return 'run';
  if((id==='teardown'&&st==='error')||(id==='batch'&&st==='error')||(id==='source'&&st==='linkerr'))return 'fail';
  return 'cur';
 }
 return i<ci?'done':'todo';
}
function sicon(id,i){
 var k=stepKind(id);
 if(k==='done')return '<span class="sicon done">'+ic('check')+'</span>';
 if(k==='run')return '<span class="sicon run"></span>';
 if(k==='fail')return '<span class="sicon fail">!</span>';
 if(k==='skip')return '<span class="sicon skip">–</span>';
 return '<span class="sicon '+(k==='cur'?'cur':'')+'">'+(i+1)+'</span>';
}
function stepList(){return VSTEPS.map(function(s,i){var sk=stepKind(s[0])==='skip';return '<li><button data-go="v-'+s[0]+'"'+(s[0]===cur()?' aria-current="step"':'')+(sk?' disabled':'')+'>'+sicon(s[0],i)+t(s[1],s[2])+(sk?'<span class="skip">'+t('skipped','pulada')+'</span>':'')+'</button></li>';}).join('');}
function rail(){
 var ci=stepIdx(cur()),c=champ();
 return '<aside class="rail" aria-label="'+t('Steps','Etapas')+'"><div style="display:grid;gap:4px"><span class="step-lbl">'+t('Vary a winner','Variar campeão')+'</span><b style="font-size:15px" class="ell">'+(ci>0||stOf('v-source')==='ready'||stOf('v-source')==='library'?esc(c.name):t('New batch','Lote novo'))+'</b><span class="row-sub">Orbit Budget · '+t('Portuguese (BR)','Português (BR)')+'</span></div>'+
 '<ol class="steps">'+stepList()+'</ol>'+
 '<div class="rail-meta">'+(ci>0?'<div><span>'+t('Source','Origem')+'</span><span>'+c.src+'</span></div><div><span>'+t('Owner','Dono')+'</span><span>'+(third()?t('Someone else','Terceiro'):t('You','Você'))+'</span></div>':'')+(ci>2?'<div><span>'+t('Variations','Variações')+'</span><span class="mono">'+totalVars()+'</span></div>':'')+'<div><span class="faint">'+t('Saved','Salvo')+'</span><span class="faint">'+t('just now','agora')+'</span></div></div></aside>';
}
function mobileSteps(){
 var ci=stepIdx(cur());
 return '<div class="mstep"><button class="mstep-btn" data-mtoggle aria-expanded="'+S.stepsOpen+'">'+sicon(cur(),ci)+'<span><span class="step-lbl">'+t('Step','Etapa')+' '+(ci+1)+' '+t('of','de')+' 6</span><br><b>'+stepName(cur())+'</b></span>'+ic(S.stepsOpen?'x':'chevd')+'</button>'+
 '<div class="segs" aria-hidden="true">'+VSTEPS.map(function(s){var k=stepKind(s[0]);return '<i class="'+(k==='done'?'done':k==='run'?'run':k==='skip'?'skip':(k==='cur'||k==='fail')?'cur':'')+'"></i>';}).join('')+'</div>'+
 (S.stepsOpen?'<ol class="mstep-list">'+stepList()+'</ol>':'')+'</div>';
}
function actionbar(hint,back,primary){return '<div class="actionbar"><span class="hint">'+hint+'</span>'+(back?'<button class="btn back" data-go="v-'+back+'">'+ic('left')+t('Back','Voltar')+'</button>':'')+primary+'</div>';}

function chip(status,label){return '<span class="st st-'+status+'"><i class="dot"></i>'+esc(label)+'</span>';}
function seg(name,opts,cur0,aria){return '<div class="seg" role="group"'+(aria?' aria-label="'+aria+'"':'')+'>'+opts.map(function(o){return '<button type="button" data-set="'+name+'" data-val="'+o[0]+'" aria-pressed="'+(o[0]===cur0)+'">'+o[1]+'</button>';}).join('')+'</div>';}
function banner(kind,iconName,title,body,actions){return '<div class="banner '+kind+'" role="'+(kind==='err'?'alert':'status')+'">'+ic(iconName)+'<div class="b-body"><b>'+title+'</b>'+(body?'<span class="muted">'+body+'</span>':'')+'</div>'+(actions?'<div class="b-act">'+actions+'</div>':'')+'</div>';}
function capAt(tt){
 var B=BLOCKS();
 for(var i=0;i<B.length;i++){var b=B[i];if(tt>=b.s&&tt<b.e){var w=b.line.split(' '),g=[];for(var j=0;j<w.length;j+=3)g.push(w.slice(j,j+3).join(' '));return esc(g[Math.min(g.length-1,Math.floor((tt-b.s)/(b.e-b.s)*g.length))]);}}
 return '';
}
function player(o){
 var c=champ(),dur=c.dur;
 return '<div class="player'+(o.lg?' lg':'')+'">'+art(o.tone!=null?o.tone:c.tone,o.face!=null?o.face:c.face)+(o.split?'<div class="ov-split"><i><b></b><b></b><b></b><b></b></i></div>':'')+(o.band?'<div class="ov-head"><span>'+esc(o.band)+'</span></div>':'')+
  '<div class="cap" id="cap">'+capAt(S.t)+'</div>'+(o.overlay||'')+
  (o.overlay?'':'<div class="pctrl"><button data-play aria-label="'+t('Play','Reproduzir')+'">'+ic(S.playing?'pause':'play')+'</button><div class="scrub"><b id="scrub" style="width:'+(S.t/dur*100)+'%"></b></div><span class="ptime" id="ptime">'+fmt(S.t)+' / '+fmt(dur)+'</span><button aria-label="'+t('Sound','Som')+'">'+ic('vol')+'</button></div>')+'</div>';
}

/* ---------- STEP 3 · VARIATION TYPES ---------- */

     '</div><div><button class="btn sm ghost" data-toast="'+t('Generating 4 more faces (≈ 30 s)','Gerando mais 4 rostos (≈ 30 s)')+'">'+ic('refresh')+t('4 more faces','Mais 4 rostos')+'</button></div></div>';
   }

 var warn=over?banner('err','alert',t('This batch goes past the monthly cap','Este lote passa do teto do mês'),t('You have '+money(cap-spent)+' left of '+money(cap)+'. Remove a few variations, or raise the cap in Settings.','Sobram '+money(cap-spent)+' de '+money(cap)+'. Tire algumas variações ou aumente o teto em Configurações.'),'<button class="btn sm" data-go="v-types">'+t('Change variations','Mudar variações')+'</button><button class="btn sm ghost" data-toast="'+t('Opens Settings · Spend','Abre Configurações · Gastos')+'">'+t('Raise the cap','Aumentar o teto')+'</button>'):'';
 return '<div class="wz-body"><div class="wz-head"><div><h1>'+t('Estimate','Estimativa')+'</h1><p class="sub">'+t('What this batch costs and how long it takes, before anything runs. Prices come from the providers; the final cost of each variation is shown on its review.','Quanto este lote custa e quanto demora, antes de rodar qualquer coisa. Os preços vêm dos fornecedores; o custo final de cada variação aparece na revisão dela.')+'</p></div></div>'+warn+

  actionbar(over?'':t('Total now','Total agora')+' '+money(tot)+' · '+totalVars()+' '+t('variations','variações'),active('hooks')?'hooks':'types','<button class="btn primary" data-start'+(over?' disabled':'')+'>'+t('Approve and start batch','Aprovar e rodar o lote')+'</button>');

/* ---------- STEP 6 · BATCH ---------- */
function vBatch(){

 var done=st==='ready';

 var pct=Math.round((counts.ready+(done?0:counts.gen*0.45))/V.length*100);

  (done?'':'<div class="memo">'+ic('info')+'<span>'+t('You can close this page. Each variation shows up under <b>Waiting on you</b> as soon as it is ready.','Pode fechar esta página. Cada variação aparece em <b>Esperando você</b> assim que fica pronta.')+'</span></div>')+'</div>';
 var groups=['avatar','hooks','copy','layout'].filter(active).map(function(k){
  var rows=V.filter(function(v){return v.k===k;}).map(function(v){
   var s=v.s[st],th,side,extra='';
   if(s==='ready'){th=thumb(v.tone,v.face,true,k==='layout'?'':'');side=chip('waiting',t('Ready for review','Pronta pra revisar'))+'<button class="btn sm" data-review="'+v.id+'">'+t('Review','Revisar')+ic('arrowr')+'</button>';}

   else if(s==='waiting'){th=thumb(v.tone,v.face,false);side=chip('waiting',t('Pick a script','Escolher roteiro'))+'<button class="btn sm" data-toast="'+t('Opens the creative wizard at Scripts (v1)','Abre o wizard do criativo em Roteiros (v1)')+'">'+t('Open in wizard','Abrir no wizard')+ic('arrowr')+'</button>';}
   else {th='<div class="gen-thumb" style="border-color:rgba(255,97,102,.35)"><span style="color:var(--red)">'+ic('alert')+'</span></div>';side=chip('failed',t('Failed','Falhou'))+'<button class="btn sm" data-proto="ready">'+ic('refresh')+t('Regenerate','Refazer')+'</button>';
    extra='<span class="row-sub" style="color:var(--red)">'+t('Lipsync lost the face between 0:01 and 0:02 (the thumb covers the mouth in the first frame). Regenerate, or edit the first frame in Hooks.','O lipsync perdeu o rosto entre 0:01 e 0:02 (o dedo cobre a boca no primeiro frame). Refaça ou edite o primeiro frame em Ganchos.')+'</span>';}
   return '<div class="vrow'+(s==='gen'?' beam':'')+(s==='fail'?' fail':'')+'">'+th+'<div class="vrow-body"><b class="ell" style="font-weight:500">'+esc(v.name)+'</b><span class="row-sub ell">'+esc(v.change)+'</span>'+extra+'</div><div class="vrow-side">'+side+'</div></div>';
  }).join('');
  return '<section class="vgroup"><div class="sec-row"><h2 style="font-size:14px">'+typeTitle(k)+'<span class="count">'+V.filter(function(v){return v.k===k;}).length+'</span></h2></div><div class="vrows">'+rows+'</div></section>';

  actionbar(done?t('Approved variations go to the Library','Variações aprovadas vão pra Biblioteca'):'',null,'<button class="btn primary" data-review="h1"'+(counts.ready?'':' disabled')+'>'+t('Review the first ready one','Revisar a primeira pronta')+'</button>');

  '<div class="final-actions"><button class="btn lg" data-proto="changes">'+t('Request changes','Pedir ajustes')+'</button><button class="btn lg primary" data-approve>'+ic('check')+t('Approve','Aprovar')+'</button></div></div>';
 var ch='';
 if(st==='changes'){

   ['text',t('Change the hook text','Mudar o texto do gancho'),t('Edit the spoken line or the on-screen text, then only the first 3 s regenerate.','Edite a fala ou o texto na tela; só os 3 primeiros segundos são refeitos.')],
   ['edit',t('Change captions or CTA','Mudar legenda ou CTA'),t('Goes to Edit. No new generation.','Vai pra Edição. Sem geração nova.')]];
  ch='<div class="panel"><div class="panel-head"><h2>'+t('What should change?','O que precisa mudar?')+'</h2><button class="btn sm ghost" data-proto="ready">'+ic('x')+t('Close','Fechar')+'</button></div><div class="changes" role="radiogroup">'+L.map(function(x){return '<div class="chg" role="radio" tabindex="0" aria-checked="'+(S.chg===x[0])+'" data-chg="'+x[0]+'"><div class="chg-top"><span class="radio"></span><span class="opt-body"><b>'+x[1]+'</b><span class="row-sub">'+x[2]+'</span></span></div></div>';}).join('')+'</div><div style="display:flex;justify-content:flex-end"><button class="btn primary" data-go="v-batch" data-st="loading">'+t('Send back','Mandar de volta')+'</button></div></div>';
 }
 return '<div class="page" style="max-width:1000px"><div><button class="btn ghost sm" data-go="v-batch">'+ic('left')+t('Back to batch','Voltar pro lote')+'</button></div><div class="final">'+cmp+'<div class="stage">'+player(o)+'</div>'+meta+ch+'</div></div>';
}

/* ---------- render + routing ---------- */
var timers=[];
function renderFlow(){
 var m={source:vSource,teardown:vTeardown,types:vTypes,hooks:vHooks,estimate:vEstimate,batch:vBatch}[cur()];
 return '<div class="wz">'+rail()+'<div class="wz-main">'+mobileSteps()+m()+'</div></div>';
}
function render(){
 timers.forEach(clearInterval);timers=[];stopFx();
 document.documentElement.lang=S.lang==='pt'?'pt-BR':'en';
 renderProto();renderHeader();
 var main=document.getElementById('main');
 main.innerHTML=S.screen==='home'?renderHome():S.screen==='library'?renderLibrary():S.screen==='review'?vReview():renderFlow();
 startFx();
 var st=stOf();
 if(S.screen==='v-source'&&st==='uploading')timers.push(setInterval(function(){S.upPct+=3;if(S.upPct>=100){S.upPct=64;S.st['v-source']='ready';render();return;}var b=document.getElementById('upbar'),p=document.getElementById('uppct');if(b)b.style.width=S.upPct+'%';if(p)p.textContent=S.upPct+'%';},300));
 if(S.screen==='v-source'&&st==='linkload')timers.push(setInterval(function(){S.st['v-source']='linkerr';render();},2600));
 if(S.screen==='v-teardown'&&st==='loading')timers.push(setInterval(function(){S.anPct+=1;if(S.anPct>=100){S.anPct=58;S.st['v-teardown']='ready';S.openSec={hook:true};toast(t('Teardown ready','Diagnóstico pronto'));render();return;}var b=document.getElementById('anbar'),f=document.getElementById('anfr'),f2=document.getElementById('anfr2');if(b)b.style.width=S.anPct+'%';if(f)f.textContent=t('Reading frame ','Lendo frame ')+Math.round(870*S.anPct/100)+' / 870';if(f2)f2.textContent=Math.round(870*S.anPct/100)+' / 870';},350));
 if(S.screen==='v-hooks'&&st==='loading')timers.push(setInterval(function(){S.st['v-hooks']='ready';render();},3200));
 if(S.playing)startPlay();
}
function go(h,st){
 S.screen=h;
 if(st)S.st[h]=st;
 S.stepsOpen=false;S.editSec=null;S.hookEdit=null;S.playing=false;S.t=0;
 try{if(location.hash.slice(1)!==h)history.replaceState(null,'','#'+h);}catch(e){}
 render();window.scrollTo(0,0);
}
function startPlay(){
 timers.push(setInterval(function(){
  var dur=champ().dur;S.t+=0.1;if(S.t>=dur)S.t=0;
  var b=document.getElementById('scrub'),p=document.getElementById('ptime'),c=document.getElementById('cap'),ph=document.getElementById('ph');
  if(b)b.style.width=(S.t/dur*100)+'%';if(p)p.textContent=fmt(S.t)+' / '+fmt(dur);if(c)c.innerHTML=capAt(S.t);if(ph)ph.style.left=(S.t/dur*100)+'%';
  var B=BLOCKS();for(var i=0;i<B.length;i++){if(S.t>=B[i].s&&S.t<B[i].e&&S.block!==i&&S.screen==='v-teardown'){S.block=i;var keepT=S.t;render();S.t=keepT;return;}}
 },100));
}
/* image-generation stand-in (libraries.dev), only in waiting states */
var fxRaf=null;
function stopFx(){if(fxRaf)cancelAnimationFrame(fxRaf);fxRaf=null;}
function startFx(){
 var cs=[].slice.call(document.querySelectorAll('canvas.genfx'));if(!cs.length)return;
 var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
 var t0=performance.now();
 function draw(now){
  var tt=(now-t0)/1000;
  cs.forEach(function(c){
   var x=c.getContext('2d'),w=c.width,h=c.height,seed=+c.dataset.seed;
   var phase=((tt*0.35+seed*0.21)%1);var bs=Math.max(3,Math.round(14-phase*11));
   for(var yy=0;yy<h;yy+=bs){for(var xx=0;xx<w;xx+=bs){
    var dx=(xx-w/2)/(w*0.28),dy=(yy-h*0.45)/(h*0.24);var face=Math.max(0,1-(dx*dx+dy*dy));
    var body=yy>h*0.68?Math.max(0,1-Math.abs(xx-w/2)/(w*0.42)):0;
    var n=Math.sin(xx*12.9898+yy*78.233+seed*37+Math.floor(tt*6))*43758.5453;n=n-Math.floor(n);
    var v=Math.round(18+n*28*(1-phase)+face*120*phase+body*60*phase);
    x.fillStyle='rgb('+v+','+v+','+Math.min(255,v+6)+')';x.fillRect(xx,yy,bs,bs);
   }}
  });
  if(!reduce)fxRaf=requestAnimationFrame(draw);
 }
 fxRaf=requestAnimationFrame(draw);
}
function toast(msg){var el=document.getElementById('toast');el.innerHTML=ic('check')+'<span>'+esc(msg)+'</span>';el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){el.hidden=true;},2400);}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
 if(ev.target.closest('input,textarea,select'))return;
 var el=ev.target.closest('button,[data-chg]');if(!el||el.disabled)return;
 var d=el.dataset;
 if(d.proto){
  if(S.screen==='v-source'){S.fromLib=d.proto==='library';if(S.fromLib)S.owner='mine';}
  if(S.screen==='v-teardown'&&d.proto==='ready')S.openSec={hook:true};
  S.st[S.screen]=d.proto;render();return;
 }
 if(d.fresh!==undefined){S.st={};S.owner='mine';S.fromLib=false;S.edited={};S.hookGone={};}
 if(d.go){
  if(['offers','settings'].indexOf(d.go)>-1){toast(t('Same as the wizard v1 mockup','Igual ao mockup do wizard v1'));return;}
  if(d.go==='v-teardown'&&d.st==='ready')S.openSec={hook:true};
  go(d.go,d.st);return;
 }
 if(d.vary!==undefined){S.st={};S.owner='mine';S.fromLib=true;S.edited={};S.hookGone={};go('v-source','library');return;}
 if(d.review){S.review=d.review;S.cmp='var';go('review','ready');return;}
 if(d.mtoggle!==undefined){S.stepsOpen=!S.stepsOpen;render();return;}
 if(d.set){S[d.set]=d.val;render();return;}
 if(d.mine!==undefined){S.owner=S.owner==='mine'?'third':'mine';render();return;}
 if(d.block){S.block=+d.block;S.t=BLOCKS()[S.block].s+0.01;render();return;}
 if(d.play!==undefined){S.playing=!S.playing;render();return;}
 if(d.sec){S.openSec[d.sec]=!S.openSec[d.sec];if(!S.openSec[d.sec]&&S.editSec===d.sec)S.editSec=null;render();return;}
 if(d.editsec!==undefined){S.editSec=d.editsec||null;render();return;}
 if(d.savesec){S.edited[d.savesec]=true;S.editSec=null;toast(t('Saved. Variations will use your version.','Salvo. As variações usam a sua versão.'));render();return;}
 if(d.type){S.on[d.type]=!S.on[d.type];render();return;}
 if(d.qty){var k=d.qty,n=S.qty[k]+(+d.d);S.qty[k]=Math.max(1,Math.min(k==='hooks'?4:5,n));if(k==='hooks')S.hookGone={};render();return;}
 if(d.pickface){var fi=+d.pickface,ix=S.faces.indexOf(fi);if(ix>-1){if(S.faces.length>1)S.faces.splice(ix,1);}else S.faces.push(fi);render();return;}
 if(d.picklay){var li=S.lays.indexOf(d.picklay);if(li>-1){if(S.lays.length>1)S.lays.splice(li,1);}else S.lays.push(d.picklay);render();return;}
 if(d.hookedit!==undefined){S.hookEdit=d.hookedit||null;if(d.toast)toast(d.toast);render();return;}
 if(d.hookdel){S.hookGone[d.hookdel]=true;render();return;}
 if(d.hookadd!==undefined){if(S.qty.hooks<4)S.qty.hooks++;toast(t('Hook '+S.qty.hooks+' written','Gancho '+S.qty.hooks+' escrito'));render();return;}
 if(d.start!==undefined){S.st['v-batch']='loading';go('v-batch');toast(t('Batch started. You can leave this page.','Lote iniciado. Pode sair desta página.'));return;}
 if(d.chg){S.chg=d.chg;render();return;}
 if(d.approve!==undefined){S.libNew=true;S.libFilter='all';go('library');toast(t('Approved. Saved to Library as a variation.','Aprovado. Salvo na Biblioteca como variação.'));return;}
 if(d.toast){toast(d.toast);return;}
});
document.addEventListener('keydown',function(ev){
 if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('[data-chg]')){ev.preventDefault();ev.target.click();}
});

var valid=['home','library','review'].concat(VSTEPS.map(function(s){return 'v-'+s[0];}));
var h=(location.hash||'').slice(1);
go(valid.indexOf(h)>-1?h:'v-source');
})();
