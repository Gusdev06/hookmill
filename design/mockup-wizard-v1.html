<title>Máquina Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: Vercel-style dashboard. Global header + tabs; wizard = left step rail + work area + sticky action bar. Single dark theme by decision (briefing). */
:root{
  --bg:#0a0a0a;          /* page */
  --surface:#111111;     /* cards, rows */
  --surface-2:#171717;   /* inputs, raised */
  --hover:#1f1f1f;
  --line:#262626;        /* 1px borders */
  --line-2:#3a3a3a;      /* hover/strong borders */
  --fg:#ededed;
  --fg-2:#a1a1a1;
  --fg-3:#878787;
  --btn:#ededed; --btn-fg:#0a0a0a;
  --blue:#52a8ff; --blue-bg:rgba(82,168,255,.12);
  --green:#62c073; --green-bg:rgba(98,192,115,.12);
  --amber:#f2a33a; --amber-bg:rgba(242,163,58,.12);
  --red:#ff6166; --red-bg:rgba(255,97,102,.12);
  --stage:#000000;
  --font:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r-sm:6px; --r:8px; --r-lg:12px;
  --gut:clamp(16px,3vw,24px);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg);margin:0;overflow-x:clip}
/* every single-column grid shrinks instead of growing to min-content */
.page,.wz-body,.sec,.final,.panel,.changes,.opt-list,.scenes,.set-grid,.empty,.chg,.prog,.field{grid-template-columns:minmax(0,1fr)}
.seg,.search,.page-actions,.crumb,.wcard,.wcard-body,.opt,.opt-body,.actionbar .btn{min-width:0}
body{font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ic{width:16px;height:16px;flex:none}
.mono{font-family:var(--mono)}
.muted{color:var(--fg-2)}
.faint{color:var(--fg-3)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
h1{font-size:24px;letter-spacing:-.02em}
h2{font-size:16px}
h3{font-size:14px}
p{margin:0}

/* prototype bar — not product chrome */
.proto{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;white-space:nowrap;padding:6px var(--gut);border-bottom:1px dashed var(--line-2);background:var(--bg);font-size:12px;color:var(--fg-3)}
.proto-tag{font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;font-size:11px;border:1px dashed var(--line-2);padding:1px 6px;border-radius:4px}
.proto .seg button{font-size:12px;padding:2px 8px}
.proto .seg{flex:none;overflow:visible;max-width:none}
.proto::-webkit-scrollbar{display:none}
.proto-spacer{flex:1}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr-top{display:flex;align-items:center;gap:10px;padding:12px var(--gut) 4px}
.logo{width:24px;height:24px;border-radius:6px;background:var(--fg);display:grid;place-items:center;flex:none}
.logo span{width:10px;height:10px;border:2px solid var(--bg);border-radius:2px}
.crumb{display:flex;align-items:center;gap:8px;min-width:0;font-weight:500}
.crumb .sep{color:var(--line-2);font-size:20px;font-weight:300}
.crumb .ws{display:flex;align-items:center;gap:8px;white-space:nowrap}
.crumb .cur{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ws-av{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#3a3a3a,#1a1a1a);border:1px solid var(--line-2)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.me{width:28px;height:28px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--fg-2)}
.tabs{display:flex;gap:4px;padding:0 calc(var(--gut) - 8px);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:10px 8px 11px;color:var(--fg-2);position:relative;white-space:nowrap;font-size:14px;border-radius:6px}
.tab:hover{color:var(--fg)}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--fg)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:500;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--hover);border-color:var(--line-2)}
.btn.primary{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.btn.primary:hover{background:#ffffff}
.btn.ghost{background:none;border-color:transparent;color:var(--fg-2)}
.btn.ghost:hover{color:var(--fg);background:var(--hover)}
.btn.danger{color:var(--red)}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.btn.lg{height:40px;padding:0 16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{max-width:100%;overflow-x:auto;scrollbar-width:none;display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);padding:2px;background:var(--surface);gap:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;color:var(--fg-2);padding:4px 10px;border-radius:4px;font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--hover);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.input,.textarea,.select{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;color:var(--fg);font-size:14px}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--fg-3);box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.textarea{resize:vertical;min-height:64px;line-height:1.5}
.field{display:grid;gap:6px;min-width:0}
.field label{font-size:13px;color:var(--fg-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:0;max-width:320px}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--fg-3)}
.search .input{padding-left:32px;height:32px}

/* status */
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--fg-3)}
.st-progress .dot{background:var(--blue);box-shadow:0 0 0 3px var(--blue-bg);animation:pulse 1.6s ease-in-out infinite}
.st-waiting .dot{background:var(--amber)}
.st-failed .dot{background:var(--red)}
.st-approved .dot{background:var(--green)}
.st-draft .dot{background:var(--fg-3)}
.st-progress{color:var(--fg)}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(82,168,255,0)}}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--fg-2);white-space:nowrap}
.tag.ai{border-style:dashed}
.tag.amber{color:var(--amber);border-color:transparent;background:var(--amber-bg)}
.step-lbl{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3)}

/* pages */
.page{padding:28px var(--gut) 64px;max-width:1200px;margin:0 auto;display:grid;gap:28px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head .sub{color:var(--fg-2);margin-top:4px}
.page-actions{display:flex;gap:8px;align-items:center;flex:1;justify-content:flex-end;min-width:0}
.sec{display:grid;gap:12px}
.sec-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.count{font-family:var(--mono);font-size:12px;color:var(--fg-3);margin-left:6px;font-weight:400}

/* waiting cards */
.wait-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.wcard{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;align-items:stretch;transition:border-color .15s}
.wcard:hover{border-color:var(--line-2)}
.wcard .thumb{width:54px;flex:none}
.wcard-body{display:grid;gap:4px;min-width:0;align-content:start;flex:1}
.wcard-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcard-foot{margin-top:auto;padding-top:6px}

/* list (deployments) */
.list{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.row{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr) 20px;gap:16px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit}
.row:first-child{border-top:0}
.row:hover{background:var(--hover)}
.row-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:13px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-col{display:grid;gap:2px;min-width:0}
.row .chev{color:var(--fg-3)}
.who{display:inline-flex;align-items:center;gap:6px}
.who i{width:18px;height:18px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line-2);font-style:normal;font-size:10px;display:grid;place-items:center;color:var(--fg-2)}
.mini{height:3px;background:var(--line);border-radius:2px;overflow:hidden;width:120px;max-width:100%}
.mini b{display:block;height:100%;background:var(--blue)}

/* skeleton */
.sk{display:block;background:linear-gradient(90deg,var(--surface-2) 0%,var(--hover) 50%,var(--surface-2) 100%);background-size:200% 100%;animation:sk 1.4s linear infinite;border-radius:4px}
@keyframes sk{to{background-position:-200% 0}}

/* banners */
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);flex-wrap:wrap}
.banner.err{border-color:rgba(255,97,102,.35);background:var(--red-bg)}
.banner.err>.ic{color:var(--red)}
.banner.info>.ic{color:var(--blue)}
.banner .b-body{flex:1;min-width:200px;display:grid;gap:2px}
.banner .b-act{display:flex;gap:8px;flex-wrap:wrap}

/* empty */
.empty{border:1px dashed var(--line-2);border-radius:var(--r-lg);padding:40px clamp(16px,5vw,48px);display:grid;gap:20px;max-width:760px}
.empty ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.empty li{border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;font-size:13px;color:var(--fg-2);display:flex;gap:8px;background:var(--surface)}
.empty li .mono{color:var(--fg-3)}

/* wizard */
.wz{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 110px)}
.rail{border-right:1px solid var(--line);padding:20px 16px;display:grid;gap:18px;align-content:start;position:sticky;top:96px;align-self:start}
.rail .cname{background:none;border:1px solid transparent;border-radius:var(--r-sm);padding:4px 6px;margin:-4px -6px;font-weight:600;font-size:15px;width:calc(100% + 12px)}
.rail .cname:hover{border-color:var(--line)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:2px;position:relative}
.steps li button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:var(--r-sm);border:0;background:none;color:var(--fg-2);text-align:left;font-size:14px}
.steps li button:hover{background:var(--hover);color:var(--fg)}
.steps li button[aria-current="step"]{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.sicon{width:18px;height:18px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;flex:none;font-family:var(--mono);font-size:10px;color:var(--fg-3)}
.sicon.done{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.sicon.done .ic{width:12px;height:12px}
.sicon.cur{border-color:var(--fg);color:var(--fg)}
.sicon.run{border-color:var(--blue);border-top-color:transparent;animation:spin 1s linear infinite}
.sicon.fail{border-color:var(--red);color:var(--red)}
@keyframes spin{to{transform:rotate(360deg)}}
.rail-meta{display:grid;gap:6px;font-size:13px;color:var(--fg-2);border-top:1px solid var(--line);padding-top:14px}
.rail-meta div{display:flex;justify-content:space-between;gap:8px}
.wz-main{display:flex;flex-direction:column;min-width:0}
.wz-body{padding:24px var(--gut) 32px;display:grid;gap:20px;align-content:start;flex:1;max-width:1120px;width:100%}
.wz-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.wz-head>div{min-width:0}
.wz-head .sub{color:var(--fg-2);margin-top:4px;max-width:65ch}
.actionbar{position:sticky;bottom:0;z-index:10;background:var(--bg);border-top:1px solid var(--line);padding:12px var(--gut);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px}
.actionbar .hint{color:var(--fg-3);font-size:13px;margin-right:auto;min-width:0}
.mstep{display:none}

/* offer step */
.opt-list{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;width:100%}
.opt:hover{border-color:var(--line-2)}
.opt[aria-checked="true"]{border-color:var(--fg)}
.radio{width:16px;height:16px;border-radius:50%;border:1px solid var(--line-2);flex:none;margin-top:2px;display:grid;place-items:center}
.opt[aria-checked="true"] .radio,.eng[aria-checked="true"] .radio,.chg[aria-checked="true"] .radio{border-color:var(--fg)}
.opt[aria-checked="true"] .radio::after,.eng[aria-checked="true"] .radio::after,.chg[aria-checked="true"] .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--fg)}
.opt-body{flex:1;min-width:0;display:grid;gap:2px}
.opt-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.opt .when{flex:none}
.brief{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.brief .full{grid-column:1/-1}
.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px;display:grid;gap:14px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.linkrow{display:flex;gap:8px}
.linkrow .input,.linkrow .select{flex:1;min-width:0}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13px}
.checklist li{display:flex;gap:8px;align-items:center;color:var(--fg-2)}
.checklist li.done{color:var(--fg)}
.checklist li.done .ic{color:var(--green)}
.checklist li.now{color:var(--fg)}
.checklist .sp{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--blue);border-top-color:transparent;animation:spin 1s linear infinite;flex:none;margin:1px}
.checklist .q{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;margin:1px}

/* scripts */
.scripts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.script{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:flex;flex-direction:column;min-width:0}
.script.sel{border-color:var(--fg)}
.script-top{display:flex;align-items:center;gap:8px;padding:12px 14px 0;flex-wrap:wrap}
.script-top .dur{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--fg-2)}
.hook{margin:10px 14px 0;padding:12px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line)}
.hook .step-lbl{display:block;margin-bottom:4px}
.hook p{font-size:17px;font-weight:600;line-height:1.35;letter-spacing:-.01em}
.blocks{list-style:none;margin:0;padding:10px 14px 4px;display:grid;gap:0}
.blocks li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.blocks li:first-child{border-top:0}
.blocks .tc{font-family:var(--mono);font-size:12px;color:var(--fg-3);display:grid;gap:2px;align-content:start}
.blocks .tc b{font-family:var(--font);font-weight:500;color:var(--fg-2);font-size:12px}
.blocks li.cta .tc b{color:var(--fg)}
.blocks .textarea{min-height:52px;font-size:13px;padding:6px 8px}
.script-foot{display:flex;gap:8px;padding:10px 14px 14px;margin-top:auto;align-items:center;flex-wrap:wrap}
.script-foot .sp-r{margin-left:auto}
.memo{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--fg-2)}
.memo .ic{margin-top:2px}
.memo b{color:var(--fg);font-weight:500}

/* thinking orb */
.think{display:flex;gap:20px;align-items:center;padding:20px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);flex-wrap:wrap}
.think>div{flex:1;min-width:200px}
.orb{width:56px;height:56px;position:relative;flex:none;filter:blur(.5px)}
.orb i{position:absolute;inset:0;border-radius:50%;mix-blend-mode:screen;animation:orb 3.2s ease-in-out infinite}
.orb i:nth-child(1){background:radial-gradient(circle at 35% 35%,#ffffff 0,#8a8a8a 30%,transparent 62%)}
.orb i:nth-child(2){background:radial-gradient(circle at 65% 45%,var(--blue) 0,rgba(82,168,255,.3) 30%,transparent 60%);animation-delay:-1s;animation-duration:2.6s}
.orb i:nth-child(3){background:radial-gradient(circle at 45% 70%,#cfcfcf 0,#444 30%,transparent 60%);animation-delay:-2s;animation-duration:3.8s}
@keyframes orb{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(.86)}}
.stream{color:var(--fg)}
.stream::after{content:"";display:inline-block;width:7px;height:14px;background:var(--fg);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* avatar */
.faces{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.face{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);padding:0;text-align:left;display:grid;min-width:0}
.face .art{aspect-ratio:4/5;max-width:100%;display:block;width:100%}
.face .art svg,.face canvas{width:100%;height:100%;display:block}
.face-cap{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 10px;font-size:13px;border-top:1px solid var(--line)}
.face[aria-checked="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.face .pick{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--fg);color:var(--bg);display:none;place-items:center}
.face[aria-checked="true"] .pick{display:grid}
.desc-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}

/* engine */
.eng-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.engines{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.eng{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;text-align:left;align-content:start;cursor:pointer;min-width:0}
.eng:hover{border-color:var(--line-2)}
.eng[aria-checked="true"]{border-color:var(--fg)}
.eng-top{display:flex;gap:10px;align-items:flex-start}
.eng .trade{color:var(--fg-2);font-size:13px}
.eng-est{display:flex;gap:6px 16px;flex-wrap:wrap;font-family:var(--mono);font-size:13px;border-top:1px solid var(--line);padding-top:10px}
.eng-est span{color:var(--fg-3)}
.sum{list-style:none;margin:0;padding:0;display:grid;font-size:13px}
.sum li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line)}
.sum li:first-child{border-top:0}
.sum li span:first-child{color:var(--fg-2)}
.sum li.total{font-weight:600;font-size:14px}
.sum li.total span:first-child{color:var(--fg)}

/* generation */
.prog{display:grid;gap:8px}
.prog-bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog-bar b{display:block;height:100%;background:var(--blue);transition:width .6s ease}
.prog-bar.ok b{background:var(--green)}
.scenes{display:grid;gap:10px}

/* ---------- WIZARD ---------- */
function stepIdx(id){for(var i=0;i<STEPS.length;i++){if(STEPS[i][0]===id)return i;}return 0;}
function stepKind(id){
 var ci=stepIdx(S.step),i=stepIdx(id);
 if(id===S.step){
  var st=stOf();
  if((id==='generation'||id==='edit')&&st==='loading') return 'run';
  if((id==='generation'||id==='edit')&&st==='error') return 'fail';
  return 'cur';
 }
 return i<ci?'done':'todo';
}
function sicon(id,i){
 var k=stepKind(id);
 if(k==='done') return '<span class="sicon done">'+ic('check')+'</span>';
 if(k==='run') return '<span class="sicon run"></span>';
 if(k==='fail') return '<span class="sicon fail">!</span>';
 return '<span class="sicon '+(k==='cur'?'cur':'')+'">'+(i+1)+'</span>';
}
function stepList(){return STEPS.map(function(s,i){return '<li><button data-step="'+s[0]+'"'+(s[0]===S.step?' aria-current="step"':'')+'>'+sicon(s[0],i)+t(s[1],s[2])+'</button></li>';}).join('');}
function rail(){
 var ci=stepIdx(S.step);
 return '<aside class="rail" aria-label="'+t('Creative steps','Etapas do criativo')+'"><div style="display:grid;gap:4px"><input class="cname" id="cname" value="'+esc(cname())+'" aria-label="'+t('Creative name','Nome do criativo')+'"><span class="row-sub">Orbit Budget · '+D().contentLang+'</span></div>'+
 '<ol class="steps">'+stepList()+'</ol>'+
 '<div class="rail-meta">'+(ci>1?'<div><span>'+t('Script','Roteiro')+'</span><span>'+S.script+'</span></div>':'')+(ci>2?'<div><span>'+t('Face','Rosto')+'</span><span>'+(S.face+1)+'</span></div>':'')+(ci>3?'<div><span>'+t('Engine','Motor')+'</span><span>'+engineName()+'</span></div>':'')+'<div><span class="faint">'+t('Saved','Salvo')+'</span><span class="faint">'+t('just now','agora')+'</span></div></div></aside>';
}
function mobileSteps(){

/* ---------- render + routing ---------- */
var timers=[];
function render(){
 timers.forEach(clearInterval);timers=[];stopFx();
 document.documentElement.lang=S.lang==='pt'?'pt-BR':'en';
 renderProto();renderHeader();
 var main=document.getElementById('main');
 main.innerHTML=S.screen==='home'?renderHome():S.screen==='offers'?renderOffers():S.screen==='library'?renderLibrary():S.screen==='settings'?renderSettings():renderWizard();
 startFx();
 var k=key(),st=stOf();
 if(k==='w-generation'&&st==='loading'){timers.push(setInterval(function(){S.genPct=S.genPct>=96?40:S.genPct+2;var p=document.getElementById('genpct'),b=document.getElementById('genbar');if(p)p.textContent=S.genPct+'%';if(b)b.style.width=Math.round((2+S.genPct/100)/4*100)+'%';},900));}
 if(k==='w-edit'&&st==='loading'){timers.push(setInterval(function(){S.renderPct+=1;if(S.renderPct>=100){S.renderPct=49;S.dirty=false;S.st['w-edit']='ready';toast(t('Preview rendered','Prévia renderizada'));render();return;}var b=document.getElementById('renbar'),f=document.getElementById('renfr'),x=document.getElementById('renttl');if(b)b.style.width=S.renderPct+'%';if(f)f.textContent=frameText();if(x)x.textContent=renderOverlayText();},250));}
 if(S.playing) startPlay();
}
function go(h,st){
 if(h.indexOf('w-')===0){S.screen='wizard';S.step=h.slice(2);}else{S.screen=h;}
 if(st) S.st[key()]=st;
 S.stepsOpen=false;S.editing=null;S.playing=false;S.t=0;
 try{if(location.hash.slice(1)!==h) history.replaceState(null,'','#'+h);}catch(e){}
 render();window.scrollTo(0,0);
}

/* player */
function startPlay(){
 timers.push(setInterval(function(){
  S.t+=0.1;if(S.t>=27){S.t=0;}
  var caps=D().caps;
  var b=document.getElementById('scrub'),p=document.getElementById('ptime'),c=document.getElementById('cap'),e=document.getElementById('endcard');
  if(b)b.style.width=(S.t/27*100)+'%';if(p)p.textContent=fmt(S.t)+' / 0:27';
  if(c)c.innerHTML=caps[Math.min(caps.length-1,Math.floor(S.t/27*caps.length))];
  if(e)e.hidden=S.t<24;
  if(c)c.hidden=!!(e&&S.t>=24);
 },100));
}

/* image generation effect (stand-in for libraries.dev Image Generation) */
var fxRaf=null;
function stopFx(){if(fxRaf)cancelAnimationFrame(fxRaf);fxRaf=null;}
function startFx(){
 var cs=[].slice.call(document.querySelectorAll('canvas.genfx'));if(!cs.length)return;
 var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
 var t0=performance.now();
 function draw(now){
  var tt=(now-t0)/1000;
  cs.forEach(function(c){
   var x=c.getContext('2d'),w=c.width,h=c.height,seed=+c.dataset.seed;
   var phase=((tt*0.35+seed*0.21)%1);var bs=Math.max(3,Math.round(22-phase*19));
   for(var yy=0;yy<h;yy+=bs){for(var xx=0;xx<w;xx+=bs){
    var dx=(xx-w/2)/(w*0.28),dy=(yy-h*0.45)/(h*0.24);var face=Math.max(0,1-(dx*dx+dy*dy));
    var body=yy>h*0.68?Math.max(0,1-Math.abs(xx-w/2)/(w*0.42)):0;
    var n=Math.sin(xx*12.9898+yy*78.233+seed*37+Math.floor(tt*6))*43758.5453;n=n-Math.floor(n);
    var v=Math.round(18+n*28*(1-phase)+face*120*phase+body*60*phase);
    x.fillStyle='rgb('+v+','+v+','+Math.min(255,v+6)+')';x.fillRect(xx,yy,bs,bs);
   }}
  });
  if(!reduce) fxRaf=requestAnimationFrame(draw);
 }
 fxRaf=requestAnimationFrame(draw);
}

function toast(msg){var el=document.getElementById('toast');el.innerHTML=ic('check')+'<span>'+esc(msg)+'</span>';el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){el.hidden=true;},2400);}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
 if(ev.target.closest('input,textarea,select'))return;
 var el=ev.target.closest('button,[data-chg],[data-engine]');if(!el)return;
 var d=el.dataset;
 if(d.proto){S.st[key()]=d.proto;render();return;}
 if(d.go){go(d.go,d.st);return;}
 if(d.new!==undefined){S.cid=null;S.cnameCustom=null;S.st={};go('w-offer','ready');return;}
 if(d.open){var c=creative(+d.open);S.cid=c.id;S.cnameCustom=null;S.face=c.face;go(c.go,c.st);return;}
 if(d.step){if(d.st)S.st['w-'+d.step]=d.st;go('w-'+d.step);return;}
 if(d.mtoggle!==undefined){S.stepsOpen=!S.stepsOpen;render();return;}
 if(d.set){
  if(d.set==='offerTab'){S.st['w-offer']=d.val==='new'?'link':'ready';render();return;}
  if(['tpl','cap','pos'].indexOf(d.set)>-1)S.dirty=true;
  S[d.set]=d.val;render();return;
 }
 if(d.offer){S.offer=d.offer;render();return;}
 if(d.seloffer){S.selOffer=d.seloffer;render();return;}
 if(d.script){S.script=d.script;render();return;}
 if(d.edit!==undefined){S.editing=d.edit||null;if(d.toast)toast(d.toast);render();return;}
 if(d.face){S.face=+d.face;render();return;}
 if(d.engine){S.engine=d.engine;render();return;}
 if(d.generate!==undefined){S.st['w-generation']='loading';go('w-generation');toast(t('Generation started. You can leave this page.','Geração iniciada. Pode sair desta página.'));return;}
 if(d.play!==undefined){S.playing=!S.playing;render();return;}
 if(d.toggle){S[d.toggle]=!S[d.toggle];if(d.toggle==='endcard')S.dirty=true;render();return;}
 if(d.chg){S.chg=d.chg;render();return;}
 if(d.win){if(d.win==='new')S.newWin=!S.newWin;else LIBMETA[+d.win].w=!LIBMETA[+d.win].w;render();return;}
 if(d.approve!==undefined){S.libNew=true;S.libOffer='all';S.winOnly=false;go('library','ready');toast(t('Approved. Saved to Library.','Aprovado. Salvo na Biblioteca.'));return;}
 if(d.toast){toast(d.toast);return;}
});
document.addEventListener('keydown',function(ev){
 if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('[data-chg],[data-engine]')){ev.preventDefault();ev.target.click();}
});
document.addEventListener('input',function(ev){if(ev.target.id==='cname')S.cnameCustom=ev.target.value||null;});
document.addEventListener('change',function(ev){if(ev.target.id==='cname')renderHeader();});

var valid=['home','offers','library','settings'].concat(STEPS.map(function(s){return 'w-'+s[0];}));
var h=(location.hash||'').slice(1);
go(valid.indexOf(h)>-1?h:'home');
})();
