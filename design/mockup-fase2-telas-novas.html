<title>HookMill Phase 2 Screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: Ads Machine shell. Dark sidebar + light work area; dark "instrument" panels for summaries, waits and the editor stage.
   Single light theme by decision (mockup Ads Machine, 12/10). Every color is a token below. */
:root{
  --bg:#EEEEEA; --card:#FDFDFB; --card-2:#F3F4F0; --input:#FFFFFF;
  --line:#DCDDD7; --line-soft:#E4E5E0; --line-strong:#CFD1CB; --control:#B9BCB5; --sep:#9A9F96;
  --fg:#15171A; --fg-2:#3B4047; --fg-3:#5A6068; --fg-btn:#4A5058; --on-ink-btn:#FFFFFF;
  --accent:#C8F03C; --accent-ink:#3E5200; --accent-soft:#F0F8D2; --accent-edge:#A9CC2A;
  --ink:#16181B; --ink-2:#202328; --ink-3:#2A2E33; --ink-line:#2E3238; --ink-fg:#F2F3EE; --ink-fg-2:#C5CAD0; --ink-fg-3:#9AA1A9; --ink-body:#E8EAE4;
  --ok-bg:#E2F3E8; --ok:#0B6B43; --ok-dot:#1C9A5E;
  --warn-bg:#FBF0D3; --warn:#7A5000; --warn-line:#E9C76B;
  --bad-bg:#FBE7DD; --bad:#A8360C; --bad-edge:#E4B9A6;
  --info-bg:#E6EBFC; --info:#2B4BC8; --info-on-ink:#8FA6FF;
  --font:'Archivo','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r-chip:8px; --r-ctl:10px; --r-btn:12px; --r-card:16px; --r-panel:18px; --r-pill:999px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;font-family:var(--font);font-size:14px;line-height:1.45;color:var(--fg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
a{color:var(--fg)} a:hover{color:var(--accent-ink)}
.mono{font-family:var(--mono)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- prototype bar (not product) ---------- */
.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--ink);color:var(--ink-fg-2);border-bottom:1px solid var(--ink-line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:12px}
.proto b{color:var(--ink-fg);font-family:var(--mono);font-size:11px;letter-spacing:.08em}
.proto select{background:var(--ink-2);color:var(--ink-fg);border:1px solid var(--ink-line);border-radius:8px;min-height:32px;padding:0 8px;font:inherit;max-width:100%}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--ink-2);border:1px solid var(--ink-line);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;color:var(--ink-fg-2);border-radius:7px;min-height:28px;padding:0 10px;cursor:pointer;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--fg);font-weight:700}
.proto .note{margin-left:auto;color:var(--ink-fg-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.qthumb{aspect-ratio:9/16;border-radius:8px;border:1px dashed var(--control);background:var(--card-2)}

/* ---------- frame + container queries ---------- */
.stagewrap{padding-block:0}
.frame{container-type:inline-size;container-name:app;margin:0 auto;width:100%;background:var(--bg)}
.frame.phone{width:390px;max-width:100%;margin-block:20px;border:1px solid var(--line-strong);border-radius:28px;overflow:hidden;box-shadow:0 10px 40px rgba(21,23,26,.12)}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 50px);position:relative}
.side{background:var(--ink);color:var(--ink-fg-2);padding:18px 14px 20px;display:flex;flex-direction:column;gap:18px;position:sticky;top:50px;height:calc(100vh - 50px);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 6px;color:var(--ink-fg);text-decoration:none}
.brand-mark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--fg);font-weight:800;font-stretch:125%;font-size:10px}
.brand-name{font-weight:800;font-stretch:125%;font-size:15px;letter-spacing:-.01em}
.client{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 10px;border-radius:12px;background:var(--ink-2);border:1px solid var(--ink-line);color:var(--ink-fg);cursor:pointer;text-align:left;width:100%}
.client-av{display:inline-grid;place-items:center;flex:none;width:32px;height:32px;border-radius:9px;background:#1E2550;color:#E9DFC9;font-weight:800}
.client small{display:block;font-size:12px;color:var(--ink-fg-3)}
.navgrp{display:flex;flex-direction:column;gap:2px}
.navlab{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink-fg-3);padding:0 10px 6px}
.nav{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 10px;border-radius:10px;border:0;background:transparent;color:var(--ink-fg-2);font-weight:500;cursor:pointer;text-align:left;width:100%}
.nav svg{stroke:var(--ink-fg-3)}
.nav:hover{background:var(--ink-2)}
.nav[aria-current="page"]{background:var(--ink-3);color:#fff;font-weight:700}
.nav[aria-current="page"] svg{stroke:var(--accent)}
.badge{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--fg);background:var(--accent);border-radius:999px;padding:1px 7px}
.soon-mini{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink-fg-3);border:1px dashed var(--ink-fg-3);border-radius:999px;padding:0 6px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--ink-line);padding-top:12px}
.me{display:flex;align-items:center;gap:10px;padding:0 6px}
.me-av{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:999px;background:var(--ink-line);color:var(--ink-fg);font-weight:700;font-size:13px;flex:none}
.me b{color:var(--ink-fg);font-weight:600;display:block}.me small{font-size:12px;color:var(--ink-fg-3)}
.lang{display:inline-flex;margin-left:auto;border:1px solid var(--ink-line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--ink-fg-3);font-family:var(--mono);font-size:11px;min-height:30px;padding:0 8px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink-3);color:var(--ink-fg)}

.topm{display:none}
main.work{min-width:0;padding:24px 32px 120px}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* ---------- type ---------- */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--fg-3);text-transform:uppercase}
.h1{margin:0;font-size:30px;line-height:1.1;font-weight:800;font-stretch:125%;letter-spacing:-.015em;text-wrap:balance}
.h2{margin:0;font-size:16px;font-weight:700}
.lede{margin:0;color:var(--fg-3);max-width:680px;text-wrap:pretty}
.head{display:flex;flex-direction:column;gap:8px}
.headrow{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.muted{color:var(--fg-3)} .small{font-size:13px} .tiny{font-size:12px}

/* ---------- surfaces ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.sel{border:1.5px solid var(--fg)}
.ink{background:var(--ink);color:var(--ink-body);border-radius:var(--r-panel);padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.ink .eyebrow{color:var(--ink-fg-2)}
.ink-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ink-list li{display:flex;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--ink-line)}
.ink-list li:last-child{border-bottom:0;padding-bottom:0}
.ink-list span:first-child{color:var(--ink-fg-2)} .ink-list span:last-child{color:#fff;font-weight:600;text-align:right}
.big{font-family:var(--mono);font-size:54px;font-weight:600;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.col-main{flex:999 1 480px;min-width:0;display:flex;flex-direction:column;gap:16px}
.col-side{flex:1 1 300px;max-width:100%;min-width:0;display:flex;flex-direction:column;gap:16px}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:12px}
.divider{border-top:1px solid var(--line-soft)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-btn);border:1px solid transparent;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-lg{min-height:50px;padding:0 18px}
.btn-sm{min-height:36px;padding:0 12px;border-radius:10px;font-size:13px}
.btn-accent{background:var(--accent);color:var(--fg)} .btn-accent:hover{background:#BDE52F;color:var(--fg)}
.btn-ink{background:var(--fg);color:var(--on-ink-btn)} .btn-ink:hover{color:var(--on-ink-btn);background:#2A2E33}
.btn-out{background:var(--card);border-color:var(--line-strong);font-weight:600}
.btn-out:hover{border-color:var(--fg)}
.btn-ghost{background:transparent;color:var(--fg-btn);font-weight:600}
.btn-bad{background:var(--card);border-color:var(--bad-edge);color:var(--bad);font-weight:600}
.btn-on-ink{background:transparent;color:var(--ink-body);font-weight:600;border-color:var(--ink-line)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}

/* ---------- tags ---------- */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;height:fit-content}
.t-ok{background:var(--ok-bg);color:var(--ok)} .t-warn{background:var(--warn-bg);color:var(--warn)}
.t-bad{background:var(--bad-bg);color:var(--bad)} .t-info{background:var(--info-bg);color:var(--info)}
.t-neutral{background:var(--card-2);color:var(--fg-2);border:1px solid var(--line-soft)}
.t-ink{background:var(--fg);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:999px;background:currentColor;flex:none}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.soon{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;padding:3px 9px;border-radius:999px;background:var(--card);color:var(--fg-2);border:1px dashed var(--control);white-space:nowrap;height:fit-content}
.example{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;padding:2px 7px;border-radius:999px;background:repeating-linear-gradient(135deg,var(--card-2) 0 6px,var(--line-soft) 6px 12px);color:var(--fg-2);border:1px solid var(--line-strong);white-space:nowrap}

/* ---------- alerts ---------- */
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;border:1px solid}
.alert .a-body{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.alert b{font-weight:700}
.al-bad{background:var(--bad-bg);border-color:var(--bad-edge);color:#5E1E06}
.al-warn{background:var(--warn-bg);border-color:var(--warn-line);color:#4A3100}
.al-ok{background:var(--ok-bg);border-color:#B7DEC5;color:#0B4D31}
.al-info{background:var(--info-bg);border-color:#C3CEF6;color:#1D2F7A}

/* ---------- flow bar ---------- */
.flow{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:8px 10px 8px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.flow-name{display:flex;flex-direction:column}
.flow-name b{font-weight:800;font-stretch:125%;font-size:15px;letter-spacing:-.01em}
.flow-ph{display:flex;flex-wrap:wrap;align-items:center;gap:6px;list-style:none;margin:0;padding:0}
.chev{stroke:var(--sep)}
.ph{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px 0 8px;border-radius:999px;border:0;background:transparent;font-weight:600;cursor:pointer;color:var(--fg)}
.ph:hover{background:var(--card-2)}
.ph-next{color:var(--fg-btn);cursor:default}.ph-next:hover{background:transparent}
.ph small{font-family:var(--mono);font-size:11px;color:var(--fg-3);font-weight:500}
.ph-cur{display:flex;align-items:center;gap:4px;padding:3px 4px 3px 10px;border-radius:999px;background:var(--card-2);border:1px solid var(--line-soft)}
.ph-cur > span{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--fg-3);padding-right:4px}
.st{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 12px 0 6px;border-radius:999px;border:0;background:transparent;font-weight:600;cursor:pointer;color:var(--fg-btn);white-space:nowrap}
.st:hover{background:var(--card)}
.st.done{color:var(--fg)}
.st[aria-current="step"]{background:var(--fg);color:#fff;font-weight:700}
.st.soonst{color:var(--fg-3);cursor:help}
.circ{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:999px;font-family:var(--mono);font-size:11px;font-weight:600;border:1.5px solid var(--control);color:var(--fg);flex:none;position:relative}
.circ.on{background:var(--accent);border-color:var(--accent);color:var(--fg)}
.circ.dash{border-style:dashed;color:var(--fg-3)}
.circ.run::after{content:"";position:absolute;inset:-4px;border-radius:999px;border:2px solid transparent;border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flow-exit{margin-left:auto}
.flow-m{display:none}

/* ---------- action bar ---------- */
.actionbar{position:sticky;bottom:0;z-index:5;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:10px 10px 10px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;box-shadow:0 -6px 24px rgba(21,23,26,.06);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.actionbar .hint{flex:1 1 220px;color:var(--fg-2);font-size:13px;min-width:0}
.actionbar .btns{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- ad frame (video content colors are data) ---------- */
.adf{position:relative;width:100%;max-width:100%;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:var(--t-bg);color:#fff;flex:none}
.adf .orb{position:absolute;width:58%;aspect-ratio:1;right:-14%;top:7%;border-radius:999px;background:var(--t-orb)}
.adf .pil{position:absolute;left:-15%;right:-15%;bottom:-8%;height:38%;border-radius:50% 50% 0 0;background:var(--t-pil)}
.adf .msk{position:absolute;left:20%;width:60%;bottom:17%;aspect-ratio:2.7/1;border-radius:999px;background:var(--t-msk)}
.adf .cap{position:absolute;left:9%;right:9%;top:29%;text-align:center;font-weight:800;line-height:1.6;text-wrap:balance;font-size:var(--cap,16px)}
.adf .cap span{background:#111316;color:#fff;padding:2px 6px;border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.adf .lbl{position:absolute;top:8px;left:8px;font-family:var(--mono);font-size:10px;font-weight:600;padding:3px 7px;border-radius:999px;background:rgba(253,253,251,.94);color:var(--fg)}
.adf .chips{position:absolute;left:8px;right:8px;bottom:8px;display:flex;justify-content:space-between}
.adf .chips span{font-family:var(--mono);font-size:10px;font-weight:600;padding:3px 7px;border-radius:999px;background:rgba(17,19,22,.8);color:#fff}
.tn-night{--t-bg:#1E2550;--t-orb:#E9DFC9;--t-pil:#2C3570;--t-msk:#0E1230}
.tn-dawn{--t-bg:#F2C29A;--t-orb:#FF8E4D;--t-pil:#FBE4CF;--t-msk:#2B2142}
.tn-plum{--t-bg:#3A2142;--t-orb:#F3D3E3;--t-pil:#50305B;--t-msk:#170C1C}
.tn-sage{--t-bg:#BFCFB8;--t-orb:#F6F1E2;--t-pil:#E4EBDF;--t-msk:#22362B}
.tn-sand{--t-bg:#E5D8C3;--t-orb:#C99A62;--t-pil:#F5EDE1;--t-msk:#1E2550}
.tn-ink{--t-bg:#17191C;--t-orb:#C8F03C;--t-pil:#25282D;--t-msk:#0B0C0E}

/* ---------- waiting effects (only in waiting states) ---------- */
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
.beam{position:relative}
.beam::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--a),transparent 0 70%,var(--accent) 82%,var(--info) 92%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:beam 2.4s linear infinite;pointer-events:none}
@keyframes beam{to{--a:360deg}}
.imggen{position:relative;overflow:hidden;background:radial-gradient(circle at 30% 30%,#D9DCD3 0 2px,transparent 3px) 0 0/9px 9px,radial-gradient(circle at 70% 60%,#CDD0C7 0 1.5px,transparent 2.5px) 0 0/7px 7px,var(--card-2)}
.imggen::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,rgba(200,240,60,.0) 40%,rgba(200,240,60,.35) 50%,rgba(253,253,251,.6) 52%,transparent 62%);background-size:100% 220%;animation:scan 2.2s ease-in-out infinite}
@keyframes scan{from{background-position:0 120%}to{background-position:0 -120%}}
@media (prefers-reduced-motion:reduce){.beam::before,.imggen::after,.circ.run::after,.pulse,.spin{animation:none!important}.beam::before{background:linear-gradient(90deg,var(--accent),var(--info))}}

/* ---------- bars ---------- */
.bar{height:8px;border-radius:999px;background:var(--line-soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--fg)}
.bar.okb i{background:var(--ok-dot)}
.ink .bar{background:var(--ink-line)} .ink .bar i{background:var(--accent)}

/* ---------- face tiles ---------- */
.faces{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.face{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:4/5;border:1px solid var(--line);background:var(--fbg);cursor:pointer;padding:0;width:100%}
.face .fh{position:absolute;left:28%;width:44%;top:14%;aspect-ratio:1/1.05;border-radius:50% 50% 46% 46%;background:var(--fhair)}
.face .fs{position:absolute;left:32%;width:36%;top:21%;aspect-ratio:1/1.2;border-radius:46% 46% 50% 50%;background:var(--fskin)}
.face .fb{position:absolute;left:14%;right:14%;bottom:-8%;height:34%;border-radius:48% 48% 0 0;background:var(--fcloth)}
.face[aria-pressed="true"]{outline:2.5px solid var(--fg);outline-offset:2px}
.face .chk{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:999px;background:var(--accent);display:grid;place-items:center}
.face .fl{position:absolute;left:8px;bottom:8px;font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:rgba(253,253,251,.94);color:var(--fg)}
.face.faded{opacity:.4;filter:grayscale(.6)}
.face.gen{background:none}
.face.gen .genlab{position:absolute;left:8px;right:8px;bottom:8px;font-family:var(--mono);font-size:11px;color:var(--fg-2);display:flex;justify-content:space-between}

/* ---------- form bits ---------- */
label.lab{font-weight:700;font-size:13px}
.inp,.ta,.sel{width:100%;border:1px solid var(--line-strong);border-radius:10px;background:var(--input);font:inherit;color:var(--fg);padding:10px 12px;min-height:44px}
.ta{resize:vertical;min-height:72px}
.toggle{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--card-2);border:1px solid var(--line-soft);border-radius:12px;padding:3px}
.toggle button{border:0;background:transparent;border-radius:9px;min-height:38px;padding:0 12px;font-weight:600;color:var(--fg-btn);cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
.radio{width:20px;height:20px;border-radius:999px;border:1.5px solid var(--control);display:inline-grid;place-items:center;flex:none}
.radio.on{border-color:var(--fg)} .radio.on::after{content:"";width:10px;height:10px;border-radius:999px;background:var(--fg)}
.chk-box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--control);display:inline-grid;place-items:center;flex:none}
.chk-box.on{background:var(--accent);border-color:var(--accent)}
.switch{width:40px;height:24px;border-radius:999px;background:var(--line-strong);position:relative;flex:none;border:0;cursor:pointer}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:999px;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--fg)} .switch[aria-checked="true"]::after{left:19px;background:var(--accent)}

const FLOWS={
 concepts:{name:'New concepts',phases:[
  {id:'plan',l:'Plan',steps:[['know','What we know'],['concepts','Concepts','soon'],['scripts','Scripts']]},
  {id:'make',l:'Make',steps:[['face','Face'],['engine','Engine'],['gen','Generate'],['edit','Edit']]},

};
const STEP_GO={face:'face',engine:'engine',gen:'gen',edit:'edit',send:'send',batch:'batch',pick:'soon-pick',plan:'soon-plan'};
function flowbar(kind,cur,running){
 const f=FLOWS[kind];const all=[];f.phases.forEach(p=>p.steps.forEach(s=>all.push({...{id:s[0],l:s[1],soon:!!s[2]},ph:p.id})));
 const active=all.filter(s=>!s.soon);const ci=active.findIndex(s=>s.id===cur);const curPh=all.find(s=>s.id===cur).ph;
 const phIdx=f.phases.findIndex(p=>p.id===curPh);
 let num=0;const numOf={};all.forEach(s=>{if(!s.soon)numOf[s.id]=++num});
 const stepBtn=s=>{
  if(s.soon) return `<button class="st soonst" data-toast="Concepts is coming soon. Today the flow uses one concept: the offer you picked."><span class="circ dash">–</span>${s.l}<span class="soon" style="font-size:9px;padding:1px 6px">SOON</span></button>`;
  const i=active.findIndex(a=>a.id===s.id);const done=i<ci;const isCur=i===ci;
  const c=done?`<span class="circ on">${ic('check',12,'#15171A',3)}</span>`:`<span class="circ ${isCur?'on':''} ${isCur&&running?'run':''}">${numOf[s.id]}</span>`;
  const go=STEP_GO[s.id]||'';
  return `<button class="st ${done?'done':''}" ${isCur?'aria-current="step"':''} data-go="${go}" ${go?'':`data-toast="${s.l} exists today; only the skin changes (plan §1)."`}>${c}${s.l}</button>`;
 };
 const parts=f.phases.map((p,pi)=>{
  if(pi<phIdx) return `<li><button class="ph" data-toast="${p.l}: ${p.steps.map(s=>s[1]).join(' · ')} done. Click to reopen any of them."><span class="circ on">${ic('check',12,'#15171A',3)}</span>${p.l}<small>${p.steps.filter(s=>!s[2]).length} done</small></button></li>`;
  if(pi>phIdx) return `<li><span class="ph ph-next"><span class="circ">${pi+1}</span>${p.l}<small>${p.steps.map(s=>s[1]).join(' · ')}</small></span></li>`;
  return `<li class="ph-cur"><span>${p.l.toUpperCase()}</span>${p.steps.map(stepBtn).join('')}</li>`;
 });
 const sepd=`<li aria-hidden="true">${ic('chev',16,'#9A9F96',2).replace('<svg','<svg class="chev"')}</li>`;
 const segs=all.map(s=>{if(s.soon)return '<i class="z"></i>';const i=active.findIndex(a=>a.id===s.id);return `<i class="${i<ci?'d':i===ci?'c':''}"></i>`}).join('');
 return `<nav class="flow" aria-label="${f.name} steps"><div class="flow-name"><span class="eyebrow">MOONCLOTH</span><b>${f.name}</b></div><ol class="flow-ph">${parts.join(sepd)}</ol><button class="btn btn-ghost flow-exit" data-go="soon-home">${ic('x',16)}Exit</button></nav>
 <nav class="flow-m" aria-label="${f.name} steps"><div class="r1"><div class="t"><span class="eyebrow">${f.name} · ${f.phases[phIdx].l}</span><b>${all.find(s=>s.id===cur).l}</b></div><span class="num small muted">Step ${ci+1} of ${active.length}</span><button class="icobtn" style="border-color:var(--line);color:var(--fg)" aria-label="Exit" data-go="soon-home">${ic('x',18)}</button></div><div class="segs" style="grid-template-columns:repeat(${all.length},1fr)">${segs}</div></nav>`;
}
function actionbar(hint,back,primary){return `<div class="actionbar"><span class="hint">${hint}</span><div class="btns">${back}${primary}</div></div>`}

R.gen=st=>{

 const status=i=>{ if(all) return 'ready'; if(i<2) return 'ready'; if(i===2) return failed?'failed':'generating'; if(i===3) return failed?'generating':'queued'; return 'queued'; };

 const row=(s,i)=>{const stt=status(i);
  const chip={ready:'<span class="tag t-ok"><span class="dot"></span>Ready</span>',generating:`<span class="tag t-info"><span class="dot pulse"></span>Generating · ${i===2?'64':'18'}%</span>`,queued:'<span class="tag t-neutral">Queued</span>',failed:'<span class="tag t-bad">Failed</span>'}[stt];
  const thumb=stt==='ready'?adf(s.tone,'',{}):stt==='generating'?'<div class="imggen"></div>':`<div class="qthumb"></div>`;
  const act=stt==='ready'?`<button class="btn btn-sm btn-ghost" data-toast="Regenerate scene ${s.n}: only this scene runs again">${ic('refresh',14)}Regenerate</button>`:stt==='failed'?`<button class="btn btn-sm btn-ink" data-toast="Scene 3 queued again">${ic('refresh',14)}Regenerate scene</button><button class="btn btn-sm btn-out" data-toast="Opens the prompt inline, with Regenerate with this prompt / Cancel below it">${ic('pen',14)}Edit prompt</button>`:stt==='generating'?`<div class="bar minibar"><i style="width:${i===2?64:18}%"></i></div>`:'';
  return `<div class="srow ${stt==='generating'?'beam':''} ${stt==='failed'?'failed':''}"><div class="thumb">${thumb}</div><div class="meta"><div class="line1"><b>Scene ${s.n} · ${s.lab}</b><span class="num tiny muted">${s.tc}</span>${chip}</div>${stt==='failed'?`<span class="reason">The model refused: "hands too close to face" tripped its filter. Regenerate usually works; if it fails twice, edit the prompt.</span>`:''}<span>“${s.say}”</span><span class="prompt">${s.pr}</span></div><div class="act">${act}</div></div>`;};
 return shell('concepts',`${flowbar('concepts','gen',!all)}
 <div class="cols"><div class="col-main">
  <div class="head"><span class="eyebrow">${all?'DONE · 6 MIN 12 S':'STARTED 2 MIN AGO · KLING 3.0'}</span><h1 class="h1">${all?'All 5 scenes are ready':`Generating · ${ready} of 5 scenes ready`}</h1></div>
  ${failed?`<div class="alert al-bad" role="alert">${ic('alert',20)}<div class="a-body"><b>Scene 3 failed. The other scenes keep going.</b><span>Only scene 3 runs again. Nothing else is lost or charged twice.</span></div></div>`:''}
  ${all?`<div class="alert al-ok" role="status">${ic('check',20,'#0B6B43',2.5)}<div class="a-body"><b>5 of 5 ready in 6 min 12 s · $4.18 spent</b><span>Next you choose the captions, hook text and CTA.</span></div></div>`:''}
  <div class="rows" aria-live="polite">${SCENES.map(row).join('')}</div>
 </div>
 <aside class="col-side"><div class="ink ${all?'':'beam'}" role="status"><span class="eyebrow">${all?'READY':'GENERATING'}</span>
  <div style="display:flex;align-items:baseline;gap:10px"><span class="big">${ready}/5</span><span style="color:#fff;font-weight:600">scenes</span></div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <ul class="ink-list"><li><span>Now</span><span>${all?'Finished':failed?'Scene 4 of 5':'Scene 3 of 5'}</span></li><li><span>Time left</span><span>${all?'—':'about 4 min'}</span></li><li><span>Engine</span><span>Kling 3.0 · 9:16</span></li></ul>
  ${all?'':`<p class="small" style="margin:0;color:var(--ink-fg-2)">You can close this page. The ad keeps generating and shows up in Home › Waiting for you when it's ready.</p><button class="btn btn-on-ink" data-go="soon-home">${ic('left',16)}Back to Home</button>`}
 </div></aside></div>
 ${actionbar(all?'All scenes ready.':failed?'Continue unlocks when scene 3 is ready.':'Continue unlocks when all 5 scenes are ready.',backBtn('engine','Engine'),`<button class="btn btn-accent" data-go="edit" ${all?'':'disabled'}>Continue to Edit${ic('right',16)}</button>`)}`);
};

/* ---- Edit ---- */

 const overlay=rendering?`<div class="overlay" role="status"><span class="eyebrow">RENDERING</span><span class="num" style="font-size:40px;font-weight:600;color:var(--accent)">46%</span><span class="num small">frame 372 of 810 · about 1 min left</span><ul class="check"><li>${ic('check',14,'#C8F03C',2.5)}Prepared scenes and fonts</li><li><span class="dot pulse" style="color:var(--accent)"></span>Drawing frames</li><li class="todo">○ Encoding MP4</li><li class="todo">○ Saving the file</li></ul></div>`:fail?`<div class="overlay" role="alert"><span class="tag t-bad" style="align-self:flex-start">Render failed</span><b style="color:#fff">Stopped at frame 388.</b><span class="small">The file came out incomplete. Nothing you set is lost.</span><button class="btn btn-accent btn-sm" data-state="rendering" style="align-self:flex-start">${ic('refresh',14)}Render again</button></div>`:'';
 return shell('concepts',`${flowbar('concepts','edit')}
 <div class="head"><h1 class="h1">Captions, hook and CTA</h1><p class="lede">Choose a template, then tune the text. For anything more precise, open the editor.</p></div>

 ${after?`<div class="alert al-warn">${ic('alert',20)}<div class="a-body"><b>3 editor changes aren't exported yet.</b><span>Export in the editor before you continue, so Review shows what you changed.</span><div><button class="btn btn-sm btn-ink" data-go="editor">Open the editor</button></div></div></div>`:''}
 <div class="cols" style="align-items:stretch"><div class="col-main" style="flex-basis:420px">
  <div class="stagecard ${rendering?'beam':''}"><div class="player">${adf('dawn',HOOKS.a,{cap:'17px',chips:false})}${overlay}</div>
   <div class="scrub"><button class="playbtn" aria-label="Play">${ic('play',14,'#15171A')}</button><div class="bar"><i style="width:30%"></i></div><span>0:08 / 0:27</span></div></div>
 </div>
 <aside class="col-side" style="flex-basis:340px">
  <div class="entry"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>Edit in video</b>${after?'<span class="tag t-ink">with editor changes</span>':''}</div><span class="small" style="color:var(--fg-2)">Move text, change when it shows, fix a word the transcript got wrong, trim or delete scenes.</span><button class="btn btn-ink btn-sm" style="align-self:flex-start" data-go="editor">${ic('pen',14)}Edit in video</button></div>
  <div class="card" style="gap:14px">
   <div class="fieldrow"><span class="lab">Template</span><div class="tpls">${[['clean','Clean','<i style="bottom:18%"></i>'],['bold','Bold captions','<i style="top:30%;height:14%"></i><i style="bottom:18%"></i>'],['head','Headline + captions','<i style="top:8%;height:12%;background:#C8F03C"></i><i style="bottom:18%"></i>']].map(([k,l,m])=>`<button class="tpl" aria-pressed="${S.tpl===k}" data-tpl="${k}"><span class="mini">${m}</span>${l}</button>`).join('')}</div></div>
   <div class="fieldrow"><span class="lab">Caption style</span><div class="toggle">${[['word','Word by word'],['line','Full line'],['off','Off']].map(([k,l])=>`<button aria-pressed="${S.cap===k}" data-cap="${k}">${l}</button>`).join('')}</div></div>
   <div class="fieldrow"><span class="lab">Caption position</span><div class="toggle">${['top','middle','bottom'].map(k=>`<button aria-pressed="${S.pos===k}" data-pos="${k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div>${after?'<span class="tiny" style="color:var(--warn)">Set in the editor. Picking here replaces the editor position.</span>':''}</div>
   <div class="fieldrow"><label class="lab" for="hk">Hook text on screen</label><input id="hk" class="inp" value="${HOOKS.a}"></div>
   <div class="fieldrow"><label class="lab" for="cta">CTA text</label><input id="cta" class="inp" value="60 nights to try it. Link below."></div>
   <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span><b class="small">End card</b><span class="tiny muted" style="display:block">Shows the CTA for 2 s after the last scene</span></span><button class="switch" role="switch" aria-checked="${S.endcard}" aria-label="End card" data-act="endcard"></button></div>
   ${dirty?`<button class="btn btn-accent" data-state="rendering">Render preview</button>`:''}
  </div>
 </aside></div>
 ${actionbar(dirty?'Render first so Review shows the latest version.':rendering?'Rendering. You can leave; it keeps going.':after?'Continue is locked until the editor changes are exported.':'Rendered 1 min ago · Bold captions',backBtn('gen','Generate'),`<button class="btn btn-accent" ${dirty||rendering||fail||after?'disabled':''} data-toast="Review is the Ad preview screen from the mockup, with the closed 4-path Request a change">Continue to Review${ic('right',16)}</button>`)}`);
};

/* ---- Send ---- */

 <div class="srcs">
  <div class="card" style="gap:14px"><span class="eyebrow">READY TODAY</span>
   <div style="display:flex;gap:14px;align-items:flex-start"><div style="width:84px;flex:none">${adf('dawn','',{})}</div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><b style="font-size:16px">The 5am problem</b><span class="small muted">Script A · Face 2 · Kling 3.0</span><span class="num tiny muted">0:27 · 9:16 · 1080×1920 · MP4 · 14.2 MB</span><span class="tag t-ok" style="align-self:flex-start"><span class="dot"></span>Approved by Tordan</span></div></div>

   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-accent" data-state="done">${ic('dl',16)}Download MP4</button><button class="btn btn-out" data-copy="I tried 11 sleep masks before this one. It's weighted, so it stays put, and it blocks every bit of light. 60 nights to try it.">${ic('copy',16)}Copy ad text</button></div>
  </div>
  <div class="soon-block"><div class="soon-head"><span class="soon">${ic('clock',12)}SOON</span><span class="what"><b>Send to Meta.</b> Creates a paused test campaign in Mooncloth's ad account with this name. Needs the Meta connection.</span></div>
   <div class="soon-body" inert aria-hidden="true" style="display:flex;flex-direction:column;gap:12px">

 ${actionbar('Download works today. Send to Meta comes with the Meta connection.',backBtn('','Review').replace('data-go=""','data-toast="Review exists today; only the skin changes."'),`<button class="btn btn-accent" data-state="done">${ic('dl',16)}Download and save</button>`)}`);

/* ---- Batch ---- */
R.batch=st=>{
 const failed=st==='one failed', all=st==='all ready';
 const G=[
  {t:'Control',d:'The original, rendered again as the baseline.',items:[{n:'Control · original',ch:'Nothing changed. Lets you compare fairly.',tone:'night',h:HOOKS.c,s:'ready'}]},
  {t:'New faces',d:'Same script and timing, another person on camera.',items:[{n:'Face 1',ch:'Warm, early 30s',tone:'sand',s:'ready'},{n:'Face 2',ch:'Short hair, late 30s',tone:'sage',s:'ready'},{n:'Face 3',ch:'Curly hair, 28',tone:'plum',s:'generating',p:64},{n:'Face 4',ch:'Glasses, 40',tone:'dawn',s:'queued'}]},
  {t:'New hooks',d:'New first 3 seconds, original body and CTA.',items:[{n:'Hook 1: the 5am problem',ch:'“'+HOOKS.a+'”',tone:'dawn',h:HOOKS.a,s:'ready'},{n:'Hook 2: the partner angle',ch:'“'+HOOKS.b+'”',tone:'plum',h:HOOKS.b,s:'ready'},{n:'Hook 3: the flashlight test',ch:'“'+HOOKS.d+'”',tone:'ink',h:HOOKS.d,s:'ready'},{n:'Hook 4: the drawer of masks',ch:'“There are 10 masks in this drawer I never use.”',tone:'sand',h:'',s:failed?'failed':'generating',p:30}]},
  {t:'New layout',d:'Same footage, new caption and headline layout. No AI generation.',items:[{n:'Caption bar on top',ch:'Hook bar moved up, bigger captions',tone:'night',h:HOOKS.c,s:'ready'},{n:'Headline + captions',ch:'Lime headline, word-by-word captions',tone:'night',h:HOOKS.c,s:'queued'}]}
 ];
 let total=0,ready=0;G.forEach(g=>g.items.forEach(it=>{if(all)it.s='ready';total++;if(it.s==='ready')ready++;}));
 const chip=it=>({ready:'<span class="tag t-ok"><span class="dot"></span>Ready</span>',generating:`<span class="tag t-info"><span class="dot pulse"></span>Generating · ${it.p}%</span>`,queued:'<span class="tag t-neutral">Queued</span>',failed:'<span class="tag t-bad">Failed</span>'}[it.s]);
 const row=it=>`<div class="srow ${it.s==='generating'?'beam':''} ${it.s==='failed'?'failed':''}"><div class="thumb">${it.s==='ready'?adf(it.tone,'',{}):it.s==='generating'?'<div class="imggen"></div>':'<div class="qthumb"></div>'}</div><div class="meta"><div class="line1"><b>${it.n}</b>${chip(it)}</div>${it.s==='failed'?'<span class="reason">Lipsync drifted 0.3 s on the new line. Retrying usually fixes it; the other 10 are not affected.</span>':''}<span class="small" style="color:var(--fg-2)">${it.ch}</span></div><div class="act">${it.s==='ready'?`<button class="btn btn-sm btn-out" data-toast="Opens Ad preview for this iteration">Review${ic('right',14)}</button>`:it.s==='failed'?`<button class="btn btn-sm btn-ink" data-toast="Hook 4 queued again">${ic('refresh',14)}Retry</button>`:it.s==='generating'?`<div class="bar minibar"><i style="width:${it.p}%"></i></div>`:''}</div></div>`;
 return shell('iterate',`${flowbar('iterate','batch',!all)}
 <div class="cols"><div class="col-main">
  <div class="head"><span class="eyebrow">FROM “I TRIED 11 SLEEP MASKS” · ${all?'DONE IN 9 MIN':'STARTED 4 MIN AGO'}</span><h1 class="h1">${all?`All ${total} iterations are ready`:`Making ${total} iterations · ${ready} ready`}</h1></div>
  ${failed?`<div class="alert al-bad" role="alert">${ic('alert',20)}<div class="a-body"><b>Hook 4 failed. Everything else keeps going.</b><span>Retry runs only Hook 4.</span></div></div>`:''}
  ${all?`<div class="alert al-ok" role="status">${ic('check',20,'#0B6B43',2.5)}<div class="a-body"><b>${total} of ${total} ready in 9 min · $11.20 spent</b><span>Pick which ones to keep in Review.</span></div></div>`:''}
  ${G.map(g=>`<section class="grp"><div class="grp-h"><h3>${g.t} <span class="num muted" style="font-weight:500">· ${g.items.length}</span></h3><span class="tiny muted">${g.d}</span></div><div class="rows">${g.items.map(row).join('')}</div></section>`).join('')}
  <div class="soon-block" style="padding:12px"><div class="soon-head"><span class="soon">${ic('clock',12)}SOON</span><span class="what"><b>New copy</b> isn't in this batch. It arrives with the copy iteration type.</span></div></div>
 </div>
 <aside class="col-side"><div class="ink ${all?'':'beam'}" role="status"><span class="eyebrow">THIS BATCH</span>
  <div style="display:flex;align-items:baseline;gap:10px"><span class="big">${ready}/${total}</span><span style="color:#fff;font-weight:600">ready</span></div>
  <div class="bar"><i style="width:${Math.round(ready/total*100)}%"></i></div>
  <ul class="ink-list"><li><span>Time left</span><span>${all?'—':'about 5 min'}</span></li><li><span>Estimate</span><span class="num">$11.60</span></li><li><span>Kept from original</span><span>Body, voice, CTA</span></li></ul>
  ${all?'':`<p class="small" style="margin:0;color:var(--ink-fg-2)">You can close this page. Ready iterations show up in Review and in Home › Waiting for you as they finish.</p>`}
  <button class="btn ${all?'btn-accent':'btn-on-ink'}" data-toast="Review & select: grid of the ready iterations">${all?`Review ${total} iterations`:`Review the ${ready} ready`}${ic('right',16)}</button>
 </div></aside></div>`);
};

   <div class="ed-toolbar"><span class="ed-chip">Safe zones: <b style="color:var(--ink-fg)">Reels</b> | TikTok</span>${exp?'':'<span class="ed-chip warn">Hook sits under the Reels UI by 38 px</span>'}<span class="ed-chip">Fit</span></div>
   <div class="vid">${adf('dawn',HOOKS.a,{cap:S.dev==='phone'?'15px':'17px'})}<div class="safe t"></div><div class="safe b"></div><div class="safe r"></div>${exp?'':'<div class="guide"></div><div class="selbox"><span class="rot"></span><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i><i class="e"></i><i class="f"></i><span class="tagxy">X 540 · Y 512</span></div>'}</div>
  </div>
  <aside class="ed-panel" aria-label="Hook properties">

   </div>
   <div class="ed-sec"><h4>POSITION</h4><div class="two"><div class="ninp"><span>X</span>540</div><div class="ninp"><span>Y</span>512</div><div class="ninp"><span>Box</span>860</div><div class="ninp"><span>Rot</span>0°</div></div></div>

  </aside>

/* ---- Soon: Plan ---- */
R['soon-plan']=()=>{
 const live=[['faces','New faces',4,'Same script, another person on camera.',['Face 1','Face 2','Face 3','Face 4']],['hooks','New hooks',4,'New spoken and on-screen hook on the original body.',['5am problem','Partner angle']],['layout','New layout',2,'Same footage, new caption layout. No AI generation.',['Caption bar top','Headline + captions']]];
 const soon=[['New copy','New body copy modeled on the winner.'],['New openers','New first 3 seconds of footage, same words.'],['Shorter cuts','15 and 20 second versions.'],['Feed and square','4:5 and 1:1 versions, captions re-laid out.'],['New CTAs','Test a new offer line at the end.'],['New voice','Same script, another voice. Needs the creator’s written OK.']];
 let total=0;live.forEach(l=>{if(S.plan[l[0]])total+=l[2]});total+=1;
 return shell('iterate',`${flowbar('iterate','plan')}
 <div class="head"><h1 class="h1">What should change?</h1><p class="lede">Turn on the kinds of iterations you want. The body and CTA that work stay as they are. A control version is always included.</p></div>
 <div class="cols"><div class="col-main">
  <div class="grid-auto">${live.map(l=>{const on=!!S.plan[l[0]];return `<button class="opt ${on?'on':''}" aria-pressed="${on}" data-plan="${l[0]}"><span class="top"><b style="font-size:16px">${l[1]}</b><span class="chk-box ${on?'on':''}">${on?ic('check',13,'#15171A',3):''}</span></span><span class="small" style="color:var(--fg-2)">${l[3]}</span><span style="display:flex;flex-wrap:wrap;gap:6px">${l[4].map(x=>`<span class="pill">${x}</span>`).join('')}</span><span class="foot"><span class="tiny muted">Pick in the next step</span><span class="num" style="font-weight:600;font-size:15px">${on?'+'+l[2]:'0'}</span></span></button>`}).join('')}</div>
  <div class="soon-block"><div class="soon-head"><span class="soon">${ic('clock',12)}SOON</span><span class="what"><b>More kinds of iteration.</b> These show what's coming. They aren't counted in the batch or the cost.</span></div>
   <div class="grid-auto">${soon.map(s=>`<div class="opt soonopt" aria-disabled="true"><span class="top"><b class="soft">${s[0]}</b><span class="soon" style="font-size:9px;padding:1px 6px">SOON</span></span><span class="small soft">${s[1]}</span></div>`).join('')}</div></div>
 </div>
 <aside class="col-side"><div class="ink"><span class="eyebrow">THIS BATCH</span><div style="display:flex;align-items:baseline;gap:10px"><span class="big">${total}</span><span style="color:#fff;font-weight:600">iterations</span></div>
  <ul class="ink-list"><li><span>Ready in</span><span>about ${Math.max(5,Math.round(total*.8))} min</span></li><li><span>Generation cost</span><span class="num">~$${(total*1.05).toFixed(2)}</span></li><li><span>This month</span><span class="num">$212 of $400</span></li><li><span>Kept from original</span><span>Body, voice, CTA</span></li></ul>
  <button class="btn btn-accent btn-lg" data-go="batch">Generate ${total} iterations${ic('right',16)}</button></div></aside></div>`);
};

/* ================= render ================= */
const frame=document.getElementById('frame');
const selEl=document.getElementById('scr');
const groups=[...new Set(SCREENS.map(s=>s.g))];
selEl.innerHTML=groups.map(g=>`<optgroup label="${g}">${SCREENS.filter(s=>s.g===g).map(s=>`<option value="${s.id}">${s.l}</option>`).join('')}</optgroup>`).join('');
function cur(){const s=byId(S.screen);return S.st[s.id]||s.states[0]}
function render(){
 const s=byId(S.screen);selEl.value=s.id;
 document.getElementById('states').innerHTML=s.states.map(x=>`<button data-st="${x}" aria-pressed="${cur()===x}">${x}</button>`).join('');
 document.querySelectorAll('#dev button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.dev===S.dev));
 frame.className='frame'+(S.dev==='phone'?' phone':'');
 frame.innerHTML=R[s.id](cur());
}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}
function go(id,state){if(!R[id])return;S.screen=id;S.menu=false;if(state)S.st[id]=state;try{history.replaceState(null,'','#'+id)}catch(e){}render();window.scrollTo({top:0})}
selEl.addEventListener('change',e=>go(e.target.value));
document.addEventListener('click',e=>{
 if(e.target.closest('select,input,textarea'))return;
 const b=e.target.closest('button,a,[data-eng]');if(!b)return;
 const d=b.dataset;
 if(d.st){S.st[S.screen]=d.st;render();return}
 if(d.dev){S.dev=d.dev;render();return}
 if(b.tagName==='A'&&d.go){e.preventDefault()}
 if(d.go){go(d.go,d.stateAfter);return}
 if(d.state){S.st[S.screen]=d.state;render();if(d.state==='done')toast('Downloaded MC_NEW_1012_A_F2_9x16.mp4 · saved to Library');return}
 if(d.face){S.face=+d.face;render();return}
 if(d.eng){S.eng=d.eng;if(S.screen==='engine'&&cur()==='over cap'&&d.eng==='lipsync'){S.st.engine='ready'} render();return}
 if(d.model){e.stopPropagation();S.model=d.model;render();return}
 if(d.fmt){S.fmt=d.fmt;render();return}
 if(d.tpl){S.tpl=d.tpl;S.st.edit='changed';render();return}
 if(d.cap){S.cap=d.cap;S.st.edit='changed';render();return}
 if(d.pos){S.pos=d.pos;S.st.edit='changed';render();return}
 if(d.plan){S.plan[d.plan]=!S.plan[d.plan];render();return}
 if(d.dock){S.dock=d.dock;render();return}
 if(d.act==='menu'){S.menu=!S.menu;render();return}
 if(d.act==='endcard'){S.endcard=!S.endcard;S.st.edit='changed';render();return}
 if(d.act==='lib'){S.lib=!S.lib;render();return}
 if(d.copy){try{navigator.clipboard.writeText(d.copy).then(()=>toast('Copied'),()=>toast('Select the text to copy it'))}catch(err){toast('Select the text to copy it')}return}
 if(d.toast){toast(d.toast);return}
});
document.addEventListener('keydown',e=>{const el=e.target.closest&&e.target.closest('[data-eng]');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();S.eng=el.dataset.eng;render()}});
render();
})();
</script>
