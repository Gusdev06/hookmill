<title>HookMill Auto Variations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&family=Caveat:wght@600&display=swap">
<style>
/* Layout: HookMill shell (dark sidebar + light work area). One progressive screen: source → why it works → batch plan, with the dark instrument panel on the right.
   Single light theme by decision (Ads Machine skin, 12/10). Tokens are the approved Phase 2 tokens. Colors inside .tf frames are video content (data), not UI. */
:root{
  --bg:#EEEEEA; --card:#FDFDFB; --card-2:#F3F4F0; --input:#FFFFFF;
  --line:#DCDDD7; --line-soft:#E4E5E0; --line-strong:#CFD1CB; --control:#B9BCB5; --sep:#9A9F96;
  --fg:#15171A; --fg-2:#3B4047; --fg-3:#5A6068; --fg-btn:#4A5058; --on-ink-btn:#FFFFFF;
  --accent:#C8F03C; --accent-ink:#3E5200; --accent-soft:#F0F8D2; --accent-edge:#A9CC2A;
  --ink:#16181B; --ink-2:#202328; --ink-3:#2A2E33; --ink-line:#2E3238; --ink-fg:#F2F3EE; --ink-fg-2:#C5CAD0; --ink-fg-3:#9AA1A9; --ink-body:#E8EAE4;
  --ok-bg:#E2F3E8; --ok:#0B6B43; --ok-dot:#1C9A5E;
  --warn-bg:#FBF0D3; --warn:#7A5000; --warn-line:#E9C76B;
  --bad-bg:#FBE7DD; --bad:#A8360C; --bad-edge:#E4B9A6;
  --info-bg:#E6EBFC; --info:#2B4BC8;
  --font:'Archivo','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --hand:'Caveat','Bradley Hand','Segoe Print',cursive;
  --r-chip:8px; --r-ctl:10px; --r-btn:12px; --r-card:16px; --r-panel:18px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;font-family:var(--font);font-size:14px;line-height:1.45;color:var(--fg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
a{color:var(--fg)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}

/* prototype bar (not product) */
.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--ink);color:var(--ink-fg-2);border-bottom:1px solid var(--ink-line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:12px}
.proto b{color:var(--ink-fg);font-family:var(--mono);font-size:11px;letter-spacing:.08em}
.proto select{background:var(--ink-2);color:var(--ink-fg);border:1px solid var(--ink-line);border-radius:8px;min-height:32px;padding:0 8px;font:inherit;max-width:100%}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--ink-2);border:1px solid var(--ink-line);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;color:var(--ink-fg-2);border-radius:7px;min-height:28px;padding:0 10px;cursor:pointer;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--fg);font-weight:700}
.proto .note{margin-left:auto;color:var(--ink-fg-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.frame{container-type:inline-size;container-name:app;margin:0 auto;width:100%;background:var(--bg);position:relative}
.frame.phone{width:390px;max-width:100%;margin-block:20px;border:1px solid var(--line-strong);border-radius:28px;overflow:hidden;box-shadow:0 10px 40px rgba(21,23,26,.12)}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 50px);position:relative}
.side{background:var(--ink);color:var(--ink-fg-2);padding:18px 14px 20px;display:flex;flex-direction:column;gap:18px;position:sticky;top:50px;height:calc(100vh - 50px);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 6px;color:var(--ink-fg);text-decoration:none}
.brand-mark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--fg);font-weight:800;font-stretch:125%;font-size:10px;flex:none}
.brand-name{font-weight:800;font-stretch:125%;font-size:15px}
.client{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 10px;border-radius:12px;background:var(--ink-2);border:1px solid var(--ink-line);color:var(--ink-fg);cursor:pointer;text-align:left;width:100%}
.client-av{display:inline-grid;place-items:center;flex:none;width:32px;height:32px;border-radius:9px;background:#1E2550;color:#E9DFC9;font-weight:800}
.client small{display:block;font-size:12px;color:var(--ink-fg-3)}
.navgrp{display:flex;flex-direction:column;gap:2px}
.navlab{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink-fg-3);padding:0 10px 6px}
.nav{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 10px;border-radius:10px;border:0;background:transparent;color:var(--ink-fg-2);font-weight:500;cursor:pointer;text-align:left;width:100%}
.nav svg{stroke:var(--ink-fg-3)}
.nav:hover{background:var(--ink-2)}
.nav[aria-current="page"]{background:var(--ink-3);color:#fff;font-weight:700}
.nav[aria-current="page"] svg{stroke:var(--accent)}
.badge{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--fg);background:var(--accent);border-radius:999px;padding:1px 7px}
.soon-mini{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink-fg-3);border:1px dashed var(--ink-fg-3);border-radius:999px;padding:0 6px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--ink-line);padding-top:12px}
.me{display:flex;align-items:center;gap:10px;padding:0 6px}
.me-av{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:999px;background:var(--ink-line);color:var(--ink-fg);font-weight:700;font-size:13px;flex:none}
.me b{color:var(--ink-fg);font-weight:600;display:block}.me small{font-size:12px;color:var(--ink-fg-3)}
.lang{display:inline-flex;margin-left:auto;border:1px solid var(--ink-line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--ink-fg-3);font-family:var(--mono);font-size:11px;min-height:30px;padding:0 8px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink-3);color:var(--ink-fg)}
.topm{display:none}
main.work{min-width:0;padding:24px 32px 120px}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* type */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--fg-3);text-transform:uppercase}
.h1{margin:0;font-size:30px;line-height:1.1;font-weight:800;font-stretch:125%;letter-spacing:-.015em;text-wrap:balance}
.h2{margin:0;font-size:16px;font-weight:700;text-wrap:balance}
.lede{margin:0;color:var(--fg-3);max-width:680px;text-wrap:pretty}
.head{display:flex;flex-direction:column;gap:8px}
.muted{color:var(--fg-3)} .small{font-size:13px} .tiny{font-size:12px}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ink{background:var(--ink);color:var(--ink-body);border-radius:var(--r-panel);padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.ink .eyebrow{color:var(--ink-fg-2)}
.ink-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ink-list li{display:flex;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--ink-line)}
.ink-list li:last-child{border-bottom:0;padding-bottom:0}
.ink-list span:first-child{color:var(--ink-fg-2)} .ink-list span:last-child{color:#fff;font-weight:600;text-align:right}
.big{font-family:var(--mono);font-size:54px;font-weight:600;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.col-main{flex:999 1 480px;min-width:0;display:flex;flex-direction:column;gap:16px}
.col-side{flex:1 1 300px;max-width:100%;min-width:0;display:flex;flex-direction:column;gap:16px;position:sticky;top:66px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-btn);border:1px solid transparent;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-lg{min-height:50px;padding:0 18px}
.btn-sm{min-height:36px;padding:0 12px;border-radius:10px;font-size:13px}
.btn-accent{background:var(--accent);color:var(--fg)} .btn-accent:hover{background:#BDE52F}
.btn-ink{background:var(--fg);color:var(--on-ink-btn)} .btn-ink:hover{background:#2A2E33}
.btn-out{background:var(--card);border-color:var(--line-strong);font-weight:600} .btn-out:hover{border-color:var(--fg)}
.btn-ghost{background:transparent;color:var(--fg-btn);font-weight:600}
.btn-on-ink{background:transparent;color:var(--ink-body);font-weight:600;border-color:var(--ink-line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{border:0;background:none;padding:0;cursor:pointer;font-weight:700;text-decoration:underline;text-underline-offset:3px;color:var(--fg)}

/* tags */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;height:fit-content}
.t-ok{background:var(--ok-bg);color:var(--ok)} .t-warn{background:var(--warn-bg);color:var(--warn)}
.t-bad{background:var(--bad-bg);color:var(--bad)} .t-info{background:var(--info-bg);color:var(--info)}
.t-neutral{background:var(--card-2);color:var(--fg-2);border:1px solid var(--line-soft)}
.t-ink{background:var(--fg);color:var(--accent)}
.code{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.02em;padding:2px 7px;border-radius:6px;background:var(--card-2);border:1px solid var(--line-soft);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:999px;background:currentColor;flex:none}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.soon{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:var(--card);color:var(--fg-2);border:1px dashed var(--control);white-space:nowrap}

/* alerts */
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;border:1px solid}
.alert svg{flex:none}
.alert .a-body{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.al-bad{background:var(--bad-bg);border-color:var(--bad-edge);color:#5E1E06}
.al-warn{background:var(--warn-bg);border-color:var(--warn-line);color:#4A3100}
.al-ok{background:var(--ok-bg);border-color:#B7DEC5;color:#0B4D31}
.al-info{background:var(--info-bg);border-color:#C3CEF6;color:#1D2F7A}
.arow{display:flex;gap:8px;flex-wrap:wrap}

/* flow bar */
.flow{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:8px 10px 8px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.flow-name{display:flex;flex-direction:column}
.flow-name b{font-weight:800;font-stretch:125%;font-size:15px}
.flow-ph{display:flex;flex-wrap:wrap;align-items:center;gap:6px;list-style:none;margin:0;padding:0}
.ph{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px 0 8px;border-radius:999px;border:0;background:transparent;font-weight:600;color:var(--fg)}
.ph-next{color:var(--fg-btn)}
.ph small{font-family:var(--mono);font-size:11px;color:var(--fg-3);font-weight:500}
.ph-cur{display:flex;align-items:center;gap:4px;padding:3px 4px 3px 10px;border-radius:999px;background:var(--card-2);border:1px solid var(--line-soft)}
.ph-cur > span{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--fg-3);padding-right:4px}
.st{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 12px 0 6px;border-radius:999px;background:var(--fg);color:#fff;font-weight:700;white-space:nowrap}
.circ{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:999px;font-family:var(--mono);font-size:11px;font-weight:600;border:1.5px solid var(--control);color:var(--fg);flex:none;position:relative}
.circ.on{background:var(--accent);border-color:var(--accent)}
.circ.run::after{content:"";position:absolute;inset:-4px;border-radius:999px;border:2px solid transparent;border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flow-exit{margin-left:auto}
.flow-m{display:none}

/* action bar */
.actionbar{position:sticky;bottom:0;z-index:5;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:10px 10px 10px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;box-shadow:0 -6px 24px rgba(21,23,26,.06);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.actionbar .hint{flex:1 1 220px;color:var(--fg-2);font-size:13px;min-width:0}
.actionbar .btns{display:flex;gap:8px;flex-wrap:wrap}

/* waiting effects (only in waiting states) */
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
.beam{position:relative}
.beam::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--a),transparent 0 70%,var(--accent) 82%,var(--info) 92%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:beam 2.4s linear infinite;pointer-events:none}
@keyframes beam{to{--a:360deg}}
.imggen{position:relative;overflow:hidden;aspect-ratio:9/16;border-radius:8px;border:1px solid var(--line);background:radial-gradient(circle at 30% 30%,#D9DCD3 0 2px,transparent 3px) 0 0/9px 9px,radial-gradient(circle at 70% 60%,#CDD0C7 0 1.5px,transparent 2.5px) 0 0/7px 7px,var(--card-2)}
.imggen::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,rgba(200,240,60,0) 40%,rgba(200,240,60,.35) 50%,rgba(253,253,251,.6) 52%,transparent 62%);background-size:100% 220%;animation:scan 2.2s ease-in-out infinite}
@keyframes scan{from{background-position:0 120%}to{background-position:0 -120%}}
.sk{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--card-2) 0%,var(--line-soft) 50%,var(--card-2) 100%);background-size:200% 100%;animation:shim 1.6s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.beam::before,.imggen::after,.circ.run::after,.pulse,.sk{animation:none!important}.beam::before{background:linear-gradient(90deg,var(--accent),var(--info))}}

.bar{height:8px;border-radius:999px;background:var(--line-soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--fg)}
.ink .bar{background:var(--ink-line)} .ink .bar i{background:var(--accent)}
.minibar{width:120px;height:6px}
.qthumb{aspect-ratio:9/16;border-radius:8px;border:1px dashed var(--control);background:var(--card-2)}
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:13px}
.check li{display:flex;gap:10px;align-items:flex-start}
.check li > span:last-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.check small{font-family:var(--mono);font-size:11px;color:var(--ink-fg-3);overflow-wrap:anywhere}
.check .todo{color:var(--ink-fg-3)}
.check .stop{color:#FFB79A}
.chk-box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--control);display:inline-grid;place-items:center;flex:none;background:var(--card)}
.chk-box.on{background:var(--accent);border-color:var(--accent)}

/* source */
.src{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:start}
.src .facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--mono);font-size:12px;color:var(--fg-3)}
.blocks{display:flex;gap:3px;width:100%}
.blocks span{flex:var(--w);min-width:0;border-radius:6px;padding:5px 6px;font-size:11px;font-weight:600;background:var(--card-2);border:1px solid var(--line-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blocks span.k{background:var(--accent-soft);border-color:#DCEB9F}
.blocks small{display:block;font-family:var(--mono);font-weight:500;font-size:10px;color:var(--fg-3)}
.drop{border:1.5px dashed var(--control);border-radius:16px;background:var(--card);padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.libpick{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.libpick .t{width:40px;flex:none}
.srcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px;align-items:start}

/* why */
.why{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.why li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line-soft)}
.why li:first-child{border-top:0;padding-top:2px}
.why .k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--fg-3);padding-top:2px}
.why .ref{display:block;font-size:12px;color:var(--fg-3);margin-top:3px}
.keeps{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.keeps span.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);border:1px solid #DCEB9F;font-weight:600}
.cardfoot{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;border-top:1px solid var(--line-soft);padding-top:10px;font-size:12px;color:var(--fg-3)}

/* plan */
.pgrp{display:flex;flex-direction:column;gap:0}
.pgrp-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;padding-bottom:10px}
.pgrp-h h3{margin:0;font-size:15px;font-weight:700;display:flex;gap:8px;align-items:center}
.prow{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line-soft)}
.prow .l{display:flex;flex-direction:column;gap:3px;min-width:0}
.prow .l .c{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prow .say{font-size:13px;color:var(--fg-2);text-wrap:pretty}
.nomusic{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--fg-3);border-top:1px dashed var(--line-strong);padding-top:10px;margin-top:2px}

/* rows (batch) */
.rows{display:flex;flex-direction:column;gap:10px}
.srow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:start;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.srow.failed{border-color:var(--bad-edge)}
.srow .meta{display:flex;flex-direction:column;gap:5px;min-width:0}
.srow .line1{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.srow .reason{color:var(--bad);font-size:13px;font-weight:600}
.srow .act{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.grp{display:flex;flex-direction:column;gap:10px}
.grp-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 10px;padding:4px 2px}
.grp-h h3{margin:0;font-size:15px;font-weight:700}

/* result */
.folders{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:12px}
.folder{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:var(--r-card);background:var(--card);border:1px solid var(--line)}
.folder .fi{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--card-2);border:1px solid var(--line-soft)}
.folder.div .fi{background:var(--fg)}
.folder .ft{display:flex;flex-direction:column;gap:5px;min-width:0}
.folder .path{font-family:var(--mono);font-size:12px;font-weight:600;overflow-wrap:anywhere}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.rcard{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:14px;background:var(--card);border:1px solid var(--line);min-width:0}
.rcard.out{opacity:.5}
.rcard .tw{position:relative;cursor:pointer;border:0;padding:0;background:none;display:block;width:100%}
.rcard .tw .play{position:absolute;inset:auto auto 8px 8px;width:30px;height:30px;border-radius:999px;background:rgba(253,253,251,.94);display:grid;place-items:center}

 hand:{name:'Native hook · handwriting',axis:'div',code:'NATIVE-HAND',does:'Opens on a number or claim written by hand on paper.',when:'The hook carries one strong number or claim.',needs:'Analysis (Claude)'},
 split:{name:'Layout · split with page',axis:'div',code:'LAYOUT-SPLIT-LP',does:'Top half: product page or product photo. Bottom half: the original video.',when:'The Brain has the product page URL or a product photo.',needs:'Brain › Product (URL or photo)'},
 pip:{name:'Layout · picture-in-picture',axis:'div',code:'LAYOUT-PIP',does:'Product page full screen, the creator in a corner window.',when:'Talking-head video and the Brain has the product page or photo.',needs:'Brain › Product'},
 story:{name:'Layout · story frame',axis:'div',code:'LAYOUT-STORY',does:'The video inside an Instagram story frame, with bars and reply field.',when:'Always available. Used when the batch still needs a new look.',needs:'Nothing'},

  </div>
  <div class="card"><b>Or pick from your Library</b>
   ${[['I tried 11 sleep masks','Winner · 0:32 · marked Sep 28','night'],['Flashlight test','Winner · 0:21 · marked Oct 2','ink'],['Partner reads till 1am','0:27 · approved Oct 5','plum']].map((a,i)=>`<div class="libpick"><div class="t">${tf(i===1?'static':'orig').replace('tn-night','tn-'+a[2])}</div><span style="flex:1;min-width:0"><b class="small">${a[0]}</b><span class="tiny muted" style="display:block">${a[1]}</span></span><button class="btn btn-sm btn-out" data-go="flow" data-state-after="analyzing">Use this</button></div>`).join('')}
   <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap" class="tiny muted"><span class="soon">SOON</span>Pick your best ads straight from Meta.</div>
  </div></div>
  ${actionbar(up?'Uploading. The analysis starts by itself.':'Choose a video to start.',`<button class="btn btn-accent" disabled>Generate</button>`,true)}`);
 }
 if(st==='analysis failed'){
  return shell('iterate',`${flowbar('analyze')}
  <div class="head"><h1 class="h1">We couldn't read this video</h1></div>
  <div class="alert al-bad" role="alert">${ic('alert',20)}<div class="a-body"><b>The file stops playing at 0:11 of 0:32.</b><span>Without the rest we can't see the proof or the CTA, so there is nothing to plan from. Export it again from your editor and upload the new file. Nothing was charged.</span><div class="arow"><button class="btn btn-sm btn-ink" data-go="flow" data-state-after="empty">${ic('up',14)}Upload another file</button><button class="btn btn-sm btn-out" data-go="flow" data-state-after="analyzing">${ic('refresh',14)}Try again</button></div></div></div>
  <div class="cols"><div class="col-main">${sourceCard('analyzing').replace('reading…','stopped<small>file ends at 0:11</small>').replace(/frame 412 of 960/,'')}</div>
  <aside class="col-side"><div class="ink"><span class="eyebrow">ANALYSIS STOPPED</span><ul class="check">
   <li>${ic('check',16,'#C8F03C',2.5)}<span>Uploaded<small>78 MB · 0:32 in the header</small></span></li>
   <li class="stop">${ic('x',16,'#FFB79A',2.5)}<span>Reading the video<small>decoder error at frame 330: file truncated</small></span></li>
   <li class="todo">${ic('clock',16,'#9AA1A9')}<span>Checking against the Brain</span></li>
   <li class="todo">${ic('clock',16,'#9AA1A9')}<span>Planning the batch</span></li></ul></div></aside></div>
  ${actionbar('Upload a complete file to continue.',`<button class="btn btn-accent" disabled>Generate</button>`,true)}`);
 }
 if(st==='analyzing'){
  return shell('iterate',`${flowbar('analyze',true)}
  <div class="head"><span class="eyebrow">STARTED 34 S AGO</span><h1 class="h1">Reading your ad</h1></div>
  <div class="cols"><div class="col-main">${sourceCard('analyzing')}
   <section class="card" aria-busy="true"><h2 class="h2">Why this ad works</h2>${[90,76,84].map(w=>`<div style="display:grid;grid-template-columns:76px 1fr;gap:12px;padding:8px 0"><div class="sk" style="width:50px"></div><div style="display:flex;flex-direction:column;gap:6px"><div class="sk" style="width:${w}%"></div><div class="sk" style="width:${w-30}%"></div></div></div>`).join('')}</section>
   <section class="card" aria-busy="true"><h2 class="h2">The batch</h2>${[1,2,3,4].map(()=>`<div class="prow"><div class="imggen"></div><div style="display:flex;flex-direction:column;gap:6px"><div class="sk" style="width:30%"></div><div class="sk" style="width:80%"></div></div></div>`).join('')}</section>
  </div>
  <aside class="col-side"><div class="ink beam" role="status"><span class="eyebrow">ANALYZING</span>
   <div style="display:flex;align-items:baseline;gap:10px"><span class="big">2/3</span><span style="color:#fff;font-weight:600">steps</span></div>
   <div class="bar"><i style="width:52%"></i></div>
   <ul class="check">
    <li>${ic('check',16,'#C8F03C',2.5)}<span>Reading the video<small>transcript · 6 cuts · 5 blocks · best frame at 0:16</small></span></li>
    <li><span class="dot pulse" style="color:var(--accent);margin:4px"></span><span style="color:#fff">Checking against the Brain<small>audience, offer, proof, product page</small></span></li>
    <li class="todo">${ic('clock',16,'#9AA1A9')}<span>Planning the batch</span></li></ul>
   <ul class="ink-list"><li><span>Time left</span><span>about 40 s</span></li></ul>
   <p class="small" style="margin:0;color:var(--ink-fg-2)">You can close this page. The plan waits for you in Home › Waiting for you.</p>
   <button class="btn btn-on-ink" data-toast="Back to Home">${ic('left',16)}Back to Home</button></div></aside></div>
  ${actionbar('Generate unlocks when the plan is ready.',`<button class="btn btn-accent" disabled>Generate</button>`,true)}`);
 }
 // ready variants
 const p=plan(st);const n=p.it.length+p.div.length;
 const notes=st==='no Brain'?`<div class="alert al-warn">${ic('alert',20)}<div class="a-body"><b>Mooncloth's Brain is empty, so this read comes from the video alone.</b><span>Without the product page and reviews, the two layouts that use them were swapped for a note and a story frame. Fill the Brain and the next batch gets sharper.</span><div class="arow"><button class="btn btn-sm btn-out" data-go="music">Open the Brain</button></div></div></div>`
  :st==='short video'?`<div class="alert al-warn">${ic('alert',20)}<div class="a-body"><b>7 seconds and one continuous shot, so there are no blocks to cut, reorder or open on.</b><span>The plan uses on-screen text, captions, layouts and a static instead: ${n} pieces.</span></div></div>`:'';
 return shell('iterate',`${flowbar('analyze')}
  <div class="head"><span class="eyebrow">ANALYZED IN 1 MIN 12 S</span><h1 class="h1">${n} new pieces from this ad</h1></div>
  ${notes}
  <div class="cols"><div class="col-main">${sourceCard(st)}${whyCard(st)}${planCard(st)}</div>
  <aside class="col-side">${inkPanel(st)}</aside></div>
  ${actionbar(`${n} pieces · ${n*3} files · about ${Math.round(n*0.4)} min · no video credits`,`<button class="btn btn-accent btn-lg" data-go="batch" data-state-after="in progress">Generate ${n} pieces${ic('right',16)}</button>`,true)}`);
};

/* ---- batch ---- */
const ITEMS=()=>[...PLAN_FULL.it.map(r=>({k:r[0],say:r[1],g:'it'})),...PLAN_FULL.div.map(r=>({k:r[0],say:r[1],g:'div'}))];
R.batch=st=>{
 const failed=st==='one failed', all=st==='all ready';
 const S0={cut:'ready',cold:'ready',order:'ready',pace:'rendering',hooktext:'ready',endcard:'queued',split:failed?'failed':'ready',review:'ready',search:'rendering',pip:'queued',static:'ready'};
 const pct={pace:64,search:31};
 const items=ITEMS().map(it=>({...it,s:all?'ready':S0[it.k]}));
 const total=items.length, ready=items.filter(i=>i.s==='ready').length;
 const chip=it=>({ready:'<span class="tag t-ok"><span class="dot"></span>Ready</span>',rendering:`<span class="tag t-info"><span class="dot pulse"></span>Rendering · ${pct[it.k]}%</span>`,queued:'<span class="tag t-neutral">Queued</span>',failed:'<span class="tag t-bad">Failed</span>'}[it.s]);
 const row=it=>`<div class="srow ${it.s==='rendering'?'beam':''} ${it.s==='failed'?'failed':''}"><div>${it.s==='ready'?tf(it.k):it.s==='rendering'?'<div class="imggen"></div>':'<div class="qthumb"></div>'}</div><div class="meta"><div class="line1"><span class="code">${K[it.k].code}</span>${chip(it)}</div>${it.s==='failed'?'<span class="reason">The product page didn\'t load: mooncloth.com blocked our browser (403). Retry with the product photo from the Brain, or leave this piece out.</span>':''}<span class="small" style="color:var(--fg-2)">${it.say}</span>${it.s==='rendering'?`<span class="num tiny muted">${it.k==='pace'?'4:5 · frame 520 of 810':'9:16 · frame 250 of 810'}</span>`:''}</div><div class="act">${it.s==='ready'?`<button class="btn btn-sm btn-out" data-go="result" data-state-after="preview" data-prev="${K[it.k].code}">Preview</button>`:it.s==='failed'?`<button class="btn btn-sm btn-ink" data-toast="Retrying with the product photo">${ic('refresh',14)}Retry with photo</button><button class="btn btn-sm btn-ghost" data-toast="LAYOUT-SPLIT-LP left out of the zip">Leave out</button>`:it.s==='rendering'?`<div class="bar minibar"><i style="width:${pct[it.k]}%"></i></div>`:''}</div></div>`;
 const grp=(g,t,d,cls)=>{const its=items.filter(i=>i.g===g);return `<section class="grp"><div class="grp-h"><h3><span class="tag ${cls}">${t}</span> <span class="num muted" style="font-weight:500">· ${its.length}</span></h3><span class="tiny muted">${d}</span></div><div class="rows">${its.map(row).join('')}</div></section>`};
 return shell('iterate',`${flowbar('batch',!all)}
  <div class="cols"><div class="col-main">
   <div class="head"><span class="eyebrow">FROM “I TRIED 11 SLEEP MASKS” · ${all?'DONE IN 4 MIN 40 S':'STARTED 2 MIN AGO'}</span><h1 class="h1">${all?`All ${total} pieces are ready`:`Rendering ${total} pieces · ${ready} ready`}</h1></div>
   ${failed?`<div class="alert al-bad" role="alert">${ic('alert',20)}<div class="a-body"><b>LAYOUT-SPLIT-LP failed. The other 10 keep going.</b><span>Retry runs only this piece. Rendering costs nothing, so a retry costs nothing.</span></div></div>`:''}
   ${all?`<div class="alert al-ok" role="status">${ic('check',20,'#0B6B43',2.5)}<div class="a-body"><b>${total} of ${total} ready in 4 min 40 s · $0.06 spent in total</b><span>Preview them, then download the zip.</span></div></div>`:''}
   ${grp('it','Stretch its life','Same concept, fresh edit','t-neutral')}
   ${grp('div','New audience','New first frame and layout','t-ink')}
  </div>
  <aside class="col-side"><div class="ink ${all?'':'beam'}" role="status"><span class="eyebrow">${all?'READY':'RENDERING'}</span>
   <div style="display:flex;align-items:baseline;gap:10px"><span class="big">${ready}/${total}</span><span style="color:#fff;font-weight:600">pieces</span></div>
   <div class="bar"><i style="width:${Math.round(ready/total*100)}%"></i></div>
   <ul class="ink-list"><li><span>Now</span><span>${all?'Finished':'PACE-FAST, NATIVE-SEARCH'}</span></li><li><span>Time left</span><span>${all?'—':'about 2 min'}</span></li><li><span>Files</span><span>${all?total*3:ready*3} of ${total*3}</span></li><li><span>Video credits</span><span>None used</span></li></ul>
   ${all?'':`<p class="small" style="margin:0;color:var(--ink-fg-2)">You can close this page. The batch keeps rendering and shows up in Home › Waiting for you.</p><button class="btn btn-on-ink" data-toast="Back to Home">${ic('left',16)}Back to Home</button>`}
  </div></aside></div>
  ${actionbar(all?'All pieces ready.':failed?'You can download now; the failed piece stays out unless you retry it.':'Download unlocks when all pieces are done. Ready ones can be previewed now.',`<button class="btn btn-accent" data-go="result" data-state-after="ready" ${all||failed?'':'disabled'}>Continue to download${ic('right',16)}</button>`,true)}`);
};

/* ---- result ---- */
R.result=st=>{
 const items=ITEMS();
 const shown=items.filter(i=>S.filter==='all'||i.g===S.filter);
 const inZip=items.filter(i=>!S.out[i.k]);
 const nIt=inZip.filter(i=>i.g==='it').length, nDiv=inZip.filter(i=>i.g==='div').length;
 const card=it=>{const out=!!S.out[it.k];return `<div class="rcard ${out?'out':''}"><button class="tw" data-go="result" data-state-after="preview" data-prev="${K[it.k].code}" aria-label="Preview ${K[it.k].code}">${tf(it.k)}<span class="play">${ic('play',12,'#15171A')}</span></button>
  <div style="display:flex;flex-wrap:wrap;gap:5px;align-items:center"><span class="code" style="font-size:11px">${K[it.k].code}</span></div>
  <span class="say">${it.say}</span>
  <div class="bot"><span class="tag ${it.g==='it'?'t-neutral':'t-ink'}" style="font-size:10px">${it.g==='it'?'Stretch':'New audience'}</span><button class="inzip" data-out="${it.k}" aria-pressed="${!out}"><span class="chk-box ${out?'':'on'}" style="width:18px;height:18px">${out?'':ic('check',11,'#15171A',3)}</span>In zip</button></div></div>`};
 let modal='';
 if(st==='preview'){
  const it=items.find(i=>K[i.k].code===S.prev)||items[6];
  const orig=S.cmp==='orig';
  modal=`<div class="modal" role="dialog" aria-modal="true" aria-label="Preview ${K[it.k].code}"><div class="sheet">
   <div class="stage"><div class="cmp" role="group" aria-label="Compare"><button data-cmp="var" aria-pressed="${!orig}">Variation</button><button data-cmp="orig" aria-pressed="${orig}">Original</button></div>
    <div class="pl">${tf(orig?'orig':it.k)}</div>
    <div class="scrub"><button class="playbtn" aria-label="Play">${ic('play',14,'#15171A')}</button><div class="bar"><i style="width:22%"></i></div><span>0:03 / ${it.k==='cut'?'0:15':it.k==='pace'?'0:27':'0:32'}</span></div></div>
   <div class="side2"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><span class="eyebrow">${it.g==='it'?'STRETCH ITS LIFE':'NEW AUDIENCE'}</span><h2 class="h2" style="font-size:18px">${K[it.k].name}</h2></div><button class="btn btn-sm btn-ghost" data-go="result" data-state-after="ready" aria-label="Close preview">${ic('x',16)}</button></div>
    <div><span class="tiny muted">The one thing that changed</span><p style="margin:4px 0 0">${it.say}</p></div>
    <div style="display:flex;flex-direction:column;gap:6px"><span class="tiny muted">Files in the zip</span><ul class="fnames">${['9x16','4x5','1x1'].map(f=>`<li>${fileOf(it.k,f)}</li>`).join('')}</ul></div>
    <div class="kv"><span>Folder</span><span class="mono tiny">${it.g==='it'?'1-stretch-its-life':'2-new-audience'}</span></div>
    <div class="arow"><button class="btn btn-sm btn-out" data-out="${it.k}">${S.out[it.k]?'Put back in zip':'Leave out of zip'}</button><button class="btn btn-sm btn-ghost" data-toast="Opens this piece in the editor (Edit in video)">Edit in video</button></div>
   </div></div></div>`;
 }
 const done=st==='downloaded';
 return shell('iterate',`${flowbar('result')}
  <div class="head"><span class="eyebrow">FROM “I TRIED 11 SLEEP MASKS” · 12 OCT</span><h1 class="h1">${inZip.length} pieces, ready to upload</h1><p class="lede">Two folders, because they go to different places in Ads Manager. Every file name says what changed.</p></div>
  ${done?`<div class="alert al-ok" role="status">${ic('check',20,'#0B6B43',2.5)}<div class="a-body"><b>Downloaded · ${inZip.length*3} files</b><span class="num small" style="overflow-wrap:anywhere">MC_1012_I-TRIED-11-MASKS_variations.zip</span><span>All ${inZip.length} are in the Library as variations of “I tried 11 sleep masks”.</span></div></div>`:''}
  <div class="folders">
   <div class="folder">${'<span class="fi">'+ic('folder',20)+'</span>'}<div class="ft"><span class="path">1-stretch-its-life/ · ${nIt} pieces</span><b>A test ad set for this same concept</b><span class="small" style="color:var(--fg-2)">Keep it apart from the winner's ad set, which stays running. New ads in the winner's set barely get delivery. When one beats the winner, move it to the main set.</span></div></div>
   <div class="folder div">${'<span class="fi">'+ic('folder',20,'#C8F03C')+'</span>'}<div class="ft"><span class="path">2-new-audience/ · ${nDiv} pieces</span><b>A new ad set</b><span class="small" style="color:var(--fg-2)">These look different to Meta, so they can find people the winner doesn't reach. One ad set, all ${nDiv} together.</span></div></div>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center"><div class="filt" role="group" aria-label="Filter">${[['all','All · '+items.length],['it','Stretch · '+items.filter(i=>i.g==='it').length],['div','New audience · '+items.filter(i=>i.g==='div').length]].map(([k,l])=>`<button data-filter="${k}" aria-pressed="${S.filter===k}">${l}</button>`).join('')}</div><span class="tiny muted">Each piece: 9:16, 4:5 and 1:1 in the same folder.</span></div>
  <div class="rgrid">${shown.map(card).join('')}</div>
  ${actionbar(`${inZip.length} pieces · ${inZip.length*3} files · 212 MB`,`<button class="btn btn-out" data-toast="Back to Home">Home</button><button class="btn btn-accent" data-go="result" data-state-after="downloaded">${ic('dl',16)}Download zip</button>`)}`,modal);
};

/* ---- Brain › Music ---- */
R.music=st=>{
 const up=st==='uploading', has=st==='with tracks'||up;
 const T=[['Low Hum','2:14','Calm · 72 BPM'],['Night Drive','1:48','Upbeat · 118 BPM']];
 const wave=n=>`<span class="wave" aria-hidden="true">${Array.from({length:22},(_,i)=>`<i style="height:${4+((i*7+n*5)%13)}px"></i>`).join('')}</span>`;
 return shell('brain',`
  <div class="head"><span class="eyebrow">MOONCLOTH</span><h1 class="h1">Brain</h1><p class="lede">What HookMill knows about this client. Every batch reads it.</p></div>
  <div class="tabs" role="tablist">${['Product','Audience','Offer','Proof','Music'].map(t=>`<button role="tab" ${t==='Music'?'aria-current="page"':''} data-toast="${t}: exists in the Brain today">${t}</button>`).join('')}</div>
  <div class="cols"><div class="col-main">
   <section class="card"><div class="head" style="gap:4px"><h2 class="h2">Music for variations <span class="tag t-neutral" style="margin-left:6px">Optional</span></h2><span class="small muted">Upload tracks once. When there's a track here, each batch can include one music variation. With no tracks, batches simply don't have one.</span></div>
    <div class="drop" style="padding:20px">${ic('note',22)}<b>Drop audio files here</b><span class="small muted">MP3, WAV or M4A · up to 20 MB each · up to 10 tracks</span><button class="btn btn-ink btn-sm" data-go="music" data-state-after="uploading" ${S.lic?'':'disabled'}>Choose files</button></div>
    <button class="kv" style="border:0;background:none;padding:0;cursor:pointer;justify-content:flex-start;gap:10px;align-items:flex-start;text-align:left" data-act="lic"><span class="chk-box ${S.lic?'on':''}">${S.lic?ic('check',13,'#15171A',3):''}</span><span style="color:var(--fg)">Mooncloth has the rights to use these tracks in paid ads.<span class="tiny muted" style="display:block">HookMill doesn't check licenses. You answer for the tracks you upload.</span></span></button>
   </section>
   <section class="card" style="gap:0"><h2 class="h2" style="padding-bottom:10px">Tracks <span class="num muted" style="font-weight:500">· ${has?(up?3:2):0}</span></h2>
    ${has?T.map((t,i)=>`<div class="track"><button class="pb" aria-label="Play ${t[0]}" data-toast="Playing ${t[0]}">${ic('play',14)}</button><div style="display:flex;flex-direction:column;gap:4px;min-width:0"><b class="small">${t[0]}</b><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${wave(i)}<span class="num tiny muted">${t[1]} · ${t[2]}</span></div></div><button class="btn btn-sm btn-ghost" aria-label="Remove ${t[0]}" data-toast="${t[0]} removed">${ic('trash',16)}</button></div>`).join('')
     +(up?`<div class="track"><span class="pb" aria-hidden="true" style="cursor:default">${ic('up',14)}</span><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="display:flex;justify-content:space-between;gap:8px"><b class="small">soft-piano-loop.wav</b><span class="num tiny">44%</span></div><div class="bar" style="height:6px"><i style="width:44%"></i></div></div><button class="btn btn-sm btn-ghost" data-go="music" data-state-after="with tracks">Cancel</button></div>`:'')
     :`<p class="small muted" style="margin:0;padding:10px 0;border-top:1px solid var(--line-soft)">No tracks yet. Batches from Mooncloth won't include a music variation.</p>`}
   </section></div>
   <aside class="col-side"><div class="ink"><span class="eyebrow">HOW IT'S USED</span><ul class="ink-list"><li><span>Per batch</span><span>1 music variation</span></li><li><span>Which track</span><span>Tempo that fits the cut</span></li><li><span>Voice</span><span>Kept; music sits under it</span></li><li><span>File tag</span><span class="num">MUSIC-T1</span></li></ul>
    <p class="small" style="margin:0;color:var(--ink-fg-2)">Meta and TikTok already swap music for free, so HookMill makes at most one music piece per batch.</p></div></aside></div>`);
};

/* ---- catalog ---- */
R.catalog=()=>{
 const ks=Object.keys(K).filter(k=>S.catf==='all'||K[k].axis===S.catf);
 const it=k=>{const t=K[k];return `<div class="citem"><div>${tf(k)}</div><div class="ct"><span class="tag ${t.axis==='it'?'t-neutral':'t-ink'}" style="align-self:flex-start">${t.axis==='it'?'Iteration · Stretch':'Diversity · New audience'}</span><b>${t.name}</b><span class="code" style="align-self:flex-start">${t.code}</span><span class="rule">${t.does}</span><span class="rule"><em>THE AI USES IT WHEN</em>${t.when}</span><span class="rule"><em>NEEDS</em>${t.needs}</span></div></div>`};
 return `<main class="work"><div class="wrap">
  <div class="head"><span class="eyebrow">FOR MAQUINA-VIDEO · REMOTION TEMPLATES · V1, NO VIDEO CREDITS</span><h1 class="h1">The ${Object.keys(K).length} variation types</h1><p class="lede">Each frame shows how the piece looks at 9:16. Every type changes one thing on top of the original video. Diversity types change the first frame, which is what Meta compares. Placeholder art; the real piece uses the uploaded video.</p></div>
  <div class="secth"><div class="filt" role="group" aria-label="Filter types">${[['all','All'],['div','Diversity · '+Object.values(K).filter(t=>t.axis==='div').length],['it','Iteration · '+Object.values(K).filter(t=>t.axis==='it').length]].map(([k,l])=>`<button data-catf="${k}" aria-pressed="${S.catf===k}">${l}</button>`).join('')}</div><span class="tiny muted">Batch rule: 8 to 12 pieces, at least 40% diversity, layouts and static first.</span></div>
  <div class="catgrid">${ks.map(it).join('')}
   <div class="citem" style="background:var(--card-2);border-style:dashed"><div>${tf('formats')}</div><div class="ct"><span class="tag t-neutral" style="align-self:flex-start">Not a variation</span><b>Formats</b><span class="code" style="align-self:flex-start">_9x16 _4x5 _1x1</span><span class="rule">Every piece is rendered in all three, captions and layouts re-laid out. Delivered together in the same folder.</span><span class="rule"><em>NEVER COUNTS</em>Not in the piece count, not in the plan lines.</span></div></div>
  </div></div></main>`;
};

/* ================= render ================= */
const frame=document.getElementById('frame');
const selEl=document.getElementById('scr');
const groups=[...new Set(SCREENS.map(s=>s.g))];
selEl.innerHTML=groups.map(g=>`<optgroup label="${g}">${SCREENS.filter(s=>s.g===g).map(s=>`<option value="${s.id}">${s.l}</option>`).join('')}</optgroup>`).join('');
const DEF={flow:'ready'};
function cur(){const s=byId(S.screen);return S.st[s.id]||DEF[s.id]||s.states[0]}
function render(){
 const s=byId(S.screen);selEl.value=s.id;
 document.getElementById('states').innerHTML=s.states.map(x=>`<button data-st="${x}" aria-pressed="${cur()===x}">${x}</button>`).join('');
 document.querySelectorAll('#dev button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.dev===S.dev));
 frame.className='frame'+(S.dev==='phone'?' phone':'');
 frame.innerHTML=R[s.id](cur());
}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}
function go(id,state){if(!R[id])return;S.screen=id;S.menu=false;if(state)S.st[id]=state;try{history.replaceState(null,'','#'+id)}catch(e){}render();window.scrollTo({top:0})}
selEl.addEventListener('change',e=>go(e.target.value));
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 const d=b.dataset;
 if(d.st){S.st[S.screen]=d.st;render();return}
 if(d.dev){S.dev=d.dev;render();return}
 if(d.prev){S.prev=d.prev;S.cmp='var'}
 if(d.go){go(d.go,d.stateAfter);if(d.go==='result'&&d.stateAfter==='downloaded')toast('Downloaded MC_1012_I-TRIED-11-MASKS_variations.zip');return}
 if(d.out){S.out[d.out]=!S.out[d.out];render();return}
 if(d.filter){S.filter=d.filter;render();return}
 if(d.catf){S.catf=d.catf;render();return}
 if(d.cmp){S.cmp=d.cmp;render();return}
 if(d.act==='menu'){S.menu=!S.menu;render();return}
 if(d.act==='lic'){S.lic=!S.lic;render();return}
 if(d.toast){toast(d.toast);return}
});
render();
})();
</script>
