<title>HookMill Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Montserrat:wght@800;900&family=Inter:wght@800&family=Anton&family=Bebas+Neue&display=swap">
<style>
/* Layout: CapCut-style editor inside the HookMill (Vercel/Geist) system. Top bar / preview + properties panel (320px) / multi-track timeline. Single dark theme by decision (wizard v1 spec §2.10). Same tokens as the wizard; blue = selection/ring, amber = attention (safe zone, suspicious word, empty bar), red = export error. Contract: docs/contratos/editor-v1.md */
:root{
  --bg:#0a0a0a; --surface:#111111; --surface-2:#171717; --hover:#1f1f1f;
  --line:#262626; --line-2:#3a3a3a;
  --fg:#ededed; --fg-2:#a1a1a1; --fg-3:#878787;
  --btn:#ededed; --btn-fg:#0a0a0a;
  --blue:#52a8ff; --blue-bg:rgba(82,168,255,.12);
  --green:#62c073; --green-bg:rgba(98,192,115,.12);
  --amber:#f2a33a; --amber-bg:rgba(242,163,58,.12);
  --red:#ff6166; --red-bg:rgba(255,97,102,.12);
  --stage:#000000;
  --font:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r-sm:6px; --r:8px; --r-lg:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg);margin:0;overflow-x:clip;height:100%}
body{font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ic{width:16px;height:16px;flex:none}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--fg-2)}
.faint{color:var(--fg-3)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
.step-lbl{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3);font-weight:400}

/* prototype bar (not product chrome) */
.proto{display:flex;align-items:center;gap:10px;overflow-x:auto;scrollbar-width:none;white-space:nowrap;padding:6px 16px;border-bottom:1px dashed var(--line-2);background:var(--bg);font-size:12px;color:var(--fg-3);height:37px}
.proto::-webkit-scrollbar{display:none}
.proto-tag{font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;font-size:11px;border:1px dashed var(--line-2);padding:1px 6px;border-radius:4px}
.proto .seg{flex:none}
.proto .seg button{font-size:12px;padding:2px 8px}
.proto-spacer{flex:1}

/* controls (same as wizard) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:500;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s;min-width:0}
.btn:hover{background:var(--hover);border-color:var(--line-2)}
.btn.primary{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.btn.primary:hover{background:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--fg-2)}
.btn.ghost:hover{color:var(--fg);background:var(--hover)}
.btn.danger{color:var(--red)}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.btn.icon{width:32px;padding:0}
.btn.sm.icon{width:28px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--hover);border-color:var(--line-2);color:var(--fg)}
.seg{max-width:100%;overflow-x:auto;scrollbar-width:none;display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);padding:2px;background:var(--surface);gap:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;color:var(--fg-2);padding:3px 9px;border-radius:4px;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.seg button[aria-pressed="true"]{background:var(--hover);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.seg button[disabled]{opacity:.45;cursor:not-allowed}
.input,.textarea,.select{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:5px 9px;color:var(--fg);font-size:13px;min-width:0}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--fg-3);box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.input[disabled],.textarea[disabled],.select[disabled]{opacity:.5;cursor:not-allowed}
.textarea{resize:vertical;min-height:56px;line-height:1.45}
.select{height:30px;padding:0 8px}
.switch{width:32px;height:18px;border-radius:999px;background:var(--line-2);position:relative;border:0;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--fg);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--blue)}
.switch[aria-checked="true"]::after{transform:translateX(14px)}
.switch[disabled]{opacity:.45;cursor:not-allowed}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--fg-2);white-space:nowrap}
.tag .ic{width:12px;height:12px}
.tag.amber{color:var(--amber);border-color:transparent;background:var(--amber-bg)}
.tag.dash{border-style:dashed}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--fg-3)}
.dot.green{background:var(--green)}.dot.blue{background:var(--blue);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--fg-2);background:var(--surface-2);white-space:nowrap}

/* app frame */
.app{container:app/inline-size;height:calc(100dvh - 37px);background:var(--bg);position:relative;overflow:hidden;margin:0 auto}
.app.phone{width:390px;max-width:calc(100% - 32px);height:min(844px,calc(100dvh - 37px - 32px));margin:16px auto;border:1px solid var(--line-2);border-radius:22px}
.ed{display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;height:100%;position:relative}

/* top bar */
.ed-top{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);min-width:0}
.ed-name{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.ed-name b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ed-name .sep{color:var(--line-2);font-size:18px;font-weight:300}
.ed-save{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-3);white-space:nowrap}
.ed-actions{display:flex;align-items:center;gap:6px;flex:none}
.vsep{width:1px;height:20px;background:var(--line);flex:none}
.exp-btn{min-width:118px}

/* middle */
.ed-mid{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:0}
.stage-wrap{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg)}
.viewport{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;outline:none;background:radial-gradient(circle at 50% 50%,#0f0f0f,#050505 70%)}
.frame{position:relative;flex:none;touch-action:none;user-select:none;-webkit-user-select:none}
.fbg{position:absolute;inset:0;border-radius:4px;overflow:hidden;background:#0d0d0d;box-shadow:0 0 0 1px var(--line)}
.fbg svg{width:100%;height:100%;display:block}
.stage-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);min-width:0;flex-wrap:wrap}
.tc{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--fg)}
.tc span{color:var(--fg-3)}
.sb-spacer{flex:1}
.warnchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--amber);background:var(--amber-bg);border-radius:999px;padding:2px 9px;min-width:0;max-width:100%;overflow:hidden;white-space:nowrap}
.warnchip span{overflow:hidden;text-overflow:ellipsis}

/* overlays on the video */
.ov{position:absolute;line-height:1.14;cursor:move;touch-action:none;white-space:pre-wrap;overflow-wrap:break-word;letter-spacing:-.005em}
.ov .tx{display:inline}
.ov .tx.box{padding:.1em .32em;border-radius:.14em;-webkit-box-decoration-break:clone;box-decoration-break:clone;line-height:1.34}
.ov .tx.pill{padding:.12em .7em;border-radius:999px;-webkit-box-decoration-break:clone;box-decoration-break:clone;line-height:1.36}
.ov .w.on.wbg{padding:0 .12em;border-radius:.12em}
.ov.ghost{opacity:.32}
.ov:not(.sel):hover{outline:1px dashed rgba(255,255,255,.55);outline-offset:6px}
.ov.sel{outline:1.5px solid var(--blue);outline-offset:6px;z-index:4}
.ov.unsafe:not(.sel){outline:1px dashed var(--amber);outline-offset:6px}
.ov.sel.unsafe{outline-color:var(--amber)}
.ov.locked{cursor:not-allowed}
.ov.sel.locked{outline:1.5px dashed var(--fg-2)}
.ov.nomove{cursor:pointer}
.ov.cap .w.low{text-decoration:underline dotted var(--amber);text-decoration-thickness:.08em;text-underline-offset:.12em}
.hd{position:absolute;width:11px;height:11px;background:#fff;border:1.5px solid var(--blue);border-radius:2px;z-index:2}
.hd::before{content:"";position:absolute;inset:-9px}
.hd.nw{left:-13px;top:-13px;cursor:nwse-resize}.hd.ne{right:-13px;top:-13px;cursor:nesw-resize}
.hd.sw{left:-13px;bottom:-13px;cursor:nesw-resize}.hd.se{right:-13px;bottom:-13px;cursor:nwse-resize}
.hd.e,.hd.w{top:50%;margin-top:-9px;width:7px;height:18px;border-radius:3px;cursor:ew-resize}
.hd.e{right:-10px}.hd.w{left:-10px}
.hd.rot{left:50%;top:-40px;margin-left:-6px;width:12px;height:12px;border-radius:50%;cursor:grab}
.hd.rot::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:17px;margin-left:-.75px;background:var(--blue)}
.lockbadge{position:absolute;top:-14px;right:-14px;width:22px;height:22px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line-2);display:grid;place-items:center;color:var(--fg-2)}
.lockbadge .ic{width:12px;height:12px}
.cover{position:absolute;transform:translate(-50%,-50%);pointer-events:none;outline:1.5px dashed var(--amber);outline-offset:3px;z-index:3}
.cover-l{position:absolute;left:50%;top:100%;transform:translate(-50%,8px);font-family:var(--mono);font-size:10px;color:var(--amber);white-space:nowrap;background:rgba(0,0,0,.78);padding:1px 6px;border-radius:3px}
.ov-end{position:absolute;inset:0;border-radius:4px;display:grid;place-items:center;align-content:center;gap:4%;text-align:center;padding:8%;cursor:pointer}
.ov-end.sel{outline:1.5px solid var(--blue);outline-offset:-1px}
.ov-end b{line-height:1.1}
/* safe zones + guides */
.safe{position:absolute;inset:0;pointer-events:none;border-radius:4px;overflow:hidden}
.sz{position:absolute;background:repeating-linear-gradient(135deg,rgba(242,163,58,.13) 0 5px,transparent 5px 11px)}
.safe.strong .sz{background:repeating-linear-gradient(135deg,rgba(242,163,58,.26) 0 5px,transparent 5px 11px)}
.safe-rect{position:absolute;border:1px dashed rgba(242,163,58,.55)}
.sz-lbl{position:absolute;left:6px;top:4px;font-family:var(--mono);font-size:10px;color:var(--amber);letter-spacing:.04em;text-transform:uppercase}
.gd{position:absolute;background:var(--blue);pointer-events:none;z-index:6}
.gd.v{top:-6px;bottom:-6px;width:1px}
.gd.h{left:-6px;right:-6px;height:1px}
.gd.safe-g{background:var(--amber)}
.read{position:absolute;z-index:7;transform:translate(-50%,-100%);font-family:var(--mono);font-size:11px;background:var(--blue);color:#000;padding:1px 6px;border-radius:4px;white-space:nowrap;pointer-events:none}
.shake{animation:shake .32s}
@keyframes shake{25%{translate:-4px 0}75%{translate:4px 0}}

/* cards above the preview: export, conflict, browser */
.bn{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:10px 12px 0}
.bn:empty{display:none}
.card{padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:grid;grid-template-columns:minmax(0,1fr);gap:8px;position:relative}
.card.err{border-color:rgba(255,97,102,.35);background:var(--red-bg)}
.card.warn{border-color:rgba(242,163,58,.35);background:var(--amber-bg)}
.card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-head b{font-weight:600}
.card-head .sp{margin-left:auto;display:flex;gap:6px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--blue);transition:width .4s}
.steps-in{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--fg-3);list-style:none;margin:0;padding:0}
.steps-in li{display:flex;align-items:center;gap:6px}
.steps-in li.done{color:var(--fg-2)}.steps-in li.done .ic{color:var(--green);width:13px;height:13px}
.steps-in li.now{color:var(--fg)}
.spn{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--blue);border-top-color:transparent;animation:spin 1s linear infinite;flex:none}
.q{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line-2);flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
.beam::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:conic-gradient(from var(--a),transparent 0 72%,var(--blue) 88%,#ffffff 92%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:beam 2.4s linear infinite;pointer-events:none}
@keyframes beam{to{--a:360deg}}

/* properties panel */
.panel{border-left:1px solid var(--line);overflow-y:auto;background:var(--surface);min-height:0}
.p-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.p-head b{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psec{padding:14px 16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.psec-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fld{display:grid;gap:5px;min-width:0}
.fld>label,.fld>.lbl{font-size:12px;color:var(--fg-2);display:flex;align-items:center;gap:6px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.nf{display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);height:30px;min-width:0;overflow:hidden}
.nf:focus-within{border-color:var(--fg-3)}
.nf span{font-family:var(--mono);font-size:11px;color:var(--fg-3);padding:0 6px 0 9px;flex:none}
.nf input{border:0;background:none;width:100%;min-width:0;font-family:var(--mono);font-size:12px;padding:0 6px 0 0;height:100%;font-variant-numeric:tabular-nums}
.nf input:focus{outline:none}
.nf em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--fg-3);padding-right:8px}
.nf.dis{opacity:.5}
.range{width:100%;accent-color:var(--fg)}
.sws{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{width:22px;height:22px;border-radius:5px;border:1px solid var(--line-2);padding:0;flex:none}
.sw[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:2px}
.sw[disabled]{opacity:.4;cursor:not-allowed}
.sw-hex{width:92px;font-family:var(--mono);font-size:12px}
.row-b{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.lockrow{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--fg-2);padding:8px 10px;border:1px dashed var(--line-2);border-radius:var(--r-sm);line-height:1.45}
.lockrow .ic{margin-top:1px;width:14px;height:14px}
.memo{display:flex;gap:8px;font-size:12px;color:var(--fg-2);line-height:1.45}
.memo .ic{width:14px;height:14px;margin-top:1px}
.memo.amber{color:var(--amber)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:13px;margin:0}
.kv dt{color:var(--fg-2)}.kv dd{margin:0;text-align:right;font-family:var(--mono);font-size:12px}
.p-foot{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px}
/* words */
.wl{display:grid;gap:2px;max-height:280px;overflow-y:auto;margin:0 -6px;padding:0 6px}
.wl-row{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;padding:4px 6px;border-radius:5px;font-size:13px;align-items:baseline}
.wl-row.cur{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.wl-row.cut{color:var(--fg-3);text-decoration:line-through}
.wl-row .mono{font-size:11px;color:var(--fg-3)}
.wd{border:0;background:none;padding:0 2px;border-radius:3px;color:inherit;font-size:13px}
.wd:hover{background:var(--hover)}
.wd.low{color:var(--amber);text-decoration:underline dotted;text-underline-offset:3px}
.wedit{display:grid;gap:8px;padding:10px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface-2);margin:4px 0}
.wedit .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* trim visual */
.trimviz{position:relative;height:28px;border-radius:5px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 5px,transparent 5px 10px);border:1px solid var(--line);margin-bottom:12px}
.trimviz b{position:absolute;top:-1px;bottom:-1px;border:1.5px solid var(--fg);border-radius:5px;background:rgba(255,255,255,.08)}
.trimviz span{position:absolute;bottom:-18px;font-family:var(--mono);font-size:10px;color:var(--fg-3)}
.cutlist{display:grid;gap:4px;font-size:12px;margin:0;padding-left:18px}
.cutlist li{color:var(--fg-2)}
.cutlist s{color:var(--fg-3)}
.dl-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;padding:4px 0;border-top:1px solid var(--line)}
.dl-row:first-child{border-top:0}

/* timeline */
.tl{border-top:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;height:262px;min-height:0}
.tl-bar{display:flex;align-items:center;gap:6px;padding:6px 12px;border-bottom:1px solid var(--line);min-width:0;overflow-x:auto;scrollbar-width:none}
.tl-bar::-webkit-scrollbar{display:none}
.tl-bar>*{flex:none}
.tl-scroll{flex:1;overflow:auto;position:relative;--hw:150px;min-height:0;overscroll-behavior:contain}
.tl-inner{position:relative;width:max-content;min-width:100%}
.trow{display:flex;height:34px;border-bottom:1px solid var(--line)}
.trow.scn{height:58px}
.trow.rul{height:24px;position:sticky;top:0;z-index:7;background:var(--surface)}
.th{position:sticky;left:0;z-index:6;width:var(--hw);flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:0 10px;font-size:12px;color:var(--fg-2);white-space:nowrap;overflow:hidden}
.th .ic{width:14px;height:14px;color:var(--fg-3)}
.th .tn{overflow:hidden;text-overflow:ellipsis}
.th .lk{margin-left:auto;color:var(--fg-3)}
.lane{position:relative;flex:none}
.rul .lane{cursor:text}
.tick{position:absolute;bottom:0;width:1px;height:5px;background:var(--line-2)}
.tick.big{height:9px;background:var(--fg-3)}
.tick-l{position:absolute;top:3px;font-family:var(--mono);font-size:10px;color:var(--fg-3);transform:translateX(3px);font-variant-numeric:tabular-nums}
.clip{position:absolute;top:4px;bottom:4px;border-radius:5px;border:1px solid var(--line-2);background:var(--surface-2);font-size:11px;color:var(--fg);display:flex;align-items:center;gap:5px;padding:0 8px;overflow:hidden;white-space:nowrap;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.clip:hover{border-color:var(--fg-3)}
.clip .ic{width:12px;height:12px;flex:none;color:var(--fg-2)}
.clip>span{overflow:hidden;text-overflow:ellipsis}
.clip.sel{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg);overflow:visible;z-index:3}
.clip.capw .ln{position:absolute;top:22%;bottom:22%;width:1px;background:var(--line-2)}
.clip.capw .ln.low{background:var(--amber);width:2px}
.clip.scn{padding:0;background-size:auto 100%;background-repeat:repeat-x;align-items:flex-end}

 if(S.tdrag&&S.tdrag.stat)S.tdrag=null;
 if(eg&&clip&&!m2){
  e.preventDefault();var kind=clip.dataset.c,i=+clip.dataset.i,orig;
  if(kind==='scene')orig={in:D.scenes[i].in,out:D.scenes[i].out};else{orig={in:tim(kind)[0],out:tim(kind)[1]};}
  snap(kind==='scene'?t('trim scene ','cortar cena ')+D.scenes[i].n:t('change timing of ','mudar tempo do ')+lname(kind));
  S.tdrag={kind:kind,i:i,side:eg.dataset.side,x0:e.clientX,orig:orig,moved:false};return;
 }
 if(clip){
  var c=clip.dataset.c,ci=+clip.dataset.i;
  if(c==='scene'){select({k:'scene',i:ci},true);if(D.scenes[ci].locked)toast(lockWhy('remix_reorder_unsupported'));else if(!m2)S.rdrag={i:ci,x0:e.clientX,dx:0,moved:false,target:0};}
  else if(c==='end'){select({k:'end'},true);}
  else{select({k:c},true);if(D.L[c].lock)toast(lockWhy(D.L[c].lock));else if(!m2)S.mdrag={kind:c,x0:e.clientX,orig:{in:tim(c)[0],out:tim(c)[1]},moved:false};}
  if(m2)S.msheet=null;

 }
 S.phd=true;S.t=clamp((e.clientX-lr.left-PAD)/Z,0,total()-1/FPS);

});
function snapTime(v,ignore){
 if(!S.snap)return {v:fr(v),s:null};
 var Z=tlZoom(),th=8/Z,c=[0,S.t,sceneTotal(),total()];layout().forEach(function(l){c.push(l.end);});
 Object.keys(D.L).forEach(function(k){if(k!==ignore){var tm=tim(k);c.push(tm[0],tm[1]);}});
 var best=null;c.forEach(function(x){if(Math.abs(x-v)<th&&(best===null||Math.abs(x-v)<Math.abs(best-v)))best=x;});
 return best===null?{v:fr(v),s:null}:{v:best,s:best};
}
document.addEventListener('pointermove',function(e){
 var d=S.drag;
 if(d&&!d.stat){
  var dx=e.clientX-d.sx,dy=e.clientY-d.sy;if(!d.moved&&Math.hypot(dx,dy)<3)return;
  if(!d.moved){d.moved=true;snap({move:t('move ','mover '),scale:t('resize ','redimensionar '),width:t('box width of ','largura da caixa do '),rot:t('rotate ','girar ')}[d.mode]+lname(d.k));}
  var L=D.L[d.k],g=[];
  if(d.mode==='move'){
   var nx=d.o.x+dx/d.u,ny=d.o.y+dy/d.u;
   if(S.snap&&!e.altKey){var th=7/d.u,z=safeRect(),hw=d.hw,hh=d.hh;
    if(Math.abs(nx-LW/2)<th){nx=LW/2;g.push({v:LW/2});}else if(Math.abs(nx-hw-z.l)<th){nx=z.l+hw;g.push({v:z.l,safe:1});}else if(Math.abs(nx+hw-z.r)<th){nx=z.r-hw;g.push({v:z.r,safe:1});}
    if(Math.abs(ny-LH/2)<th){ny=LH/2;g.push({h:LH/2});}else if(Math.abs(ny-hh-z.t)<th){ny=z.t+hh;g.push({h:z.t,safe:1});}else if(Math.abs(ny+hh-z.b)<th){ny=z.b-hh;g.push({h:z.b,safe:1});}
    if(L.orig&&Math.abs(ny-L.orig.y)<th&&Math.abs(nx-L.orig.x)<th){nx=L.orig.x;ny=L.orig.y;g.push({h:L.orig.y});}}
   L.x=Math.round(nx);L.y=Math.round(ny);d.read='X '+L.x+' · Y '+L.y;
  }else if(d.mode==='scale'){
   var f=Math.hypot(e.clientX-d.cx,e.clientY-d.cy)/d.d0;L.scale=clamp(Math.round(d.o.scale*f*100)/100,.25,4);d.read=Math.round(L.scale*100)+'%';
  }else if(d.mode==='width'){
   var rad=L.r*Math.PI/180,along=(dx*Math.cos(rad)+dy*Math.sin(rad))/d.u*(d.side==='w'?-1:1);L.w=clamp(Math.round(d.o.w+2*along),108,1620);d.read=t('box ','caixa ')+L.w+' px';
  }else{
   var a=Math.atan2(e.clientY-d.cy,e.clientX-d.cx),r=d.o.r+(a-d.a0)*180/Math.PI;r=((r+540)%360)-180;
   if(e.shiftKey)r=Math.round(r/15)*15;else{[-90,0,90,180,-180].forEach(function(s){if(Math.abs(r-s)<3)r=s;});}
   L.r=Math.round(r);d.read=L.r+'°';if(L.r%90===0)g.push({v:L.x});
  }
  d.guides=g;renderStage();return;
 }
 var Z=tlZoom();
 if(S.tdrag&&!S.tdrag.stat){
  var td=S.tdrag,dt=(e.clientX-td.x0)/Z;td.moved=true;
  if(td.kind==='scene'){var sc=D.scenes[td.i];if(td.side==='l')sc.in=fr(clamp(td.orig.in+dt,0,td.orig.out-MINCLIP));else sc.out=fr(clamp(td.orig.out+dt,td.orig.in+MINCLIP,sc.src));S.snapT=null;}
  else{var Lx=D.L[td.kind];materialize(td.kind);var sv=snapTime((td.side==='l'?td.orig.in:td.orig.out)+dt,td.kind);S.snapT=sv.s;
   if(td.side==='l')Lx.in=clamp(sv.v,0,Lx.out-MINCLIP);else Lx.out=clamp(sv.v,Lx.in+MINCLIP,total());}
  renderTL();renderStage();return;
 }
 if(S.rdrag){var rd=S.rdrag;rd.dx=e.clientX-rd.x0;if(!rd.moved&&Math.abs(rd.dx)<5)return;rd.moved=true;
  var L2=layout(),me=L2.filter(function(l){return l.i===rd.i;})[0],cx=(me.start+me.dur/2)*Z+rd.dx,others=L2.filter(function(l){return l.i!==rd.i;}),acc=0,tgt=0;
  for(var j=0;j<others.length;j++){if((acc+others[j].dur/2)*Z<cx)tgt=j+1;acc+=others[j].dur;}
  rd.target=tgt;renderTL();return;}
 if(S.mdrag){var md=S.mdrag,dt2=(e.clientX-md.x0)/Z;if(!md.moved&&Math.abs(e.clientX-md.x0)<4)return;if(!md.moved){md.moved=true;snap(t('move in time: ','mover no tempo: ')+lname(md.kind));materialize(md.kind);}
  var Lm=D.L[md.kind],len=md.orig.out-md.orig.in,sv2=snapTime(md.orig.in+dt2,md.kind),ni=sv2.v;
  if(sv2.s===null){var sv3=snapTime(md.orig.out+dt2,md.kind);if(sv3.s!==null){ni=sv3.v-len;S.snapT=sv3.s;}else S.snapT=null;}else S.snapT=sv2.s;
  ni=clamp(ni,0,total()-len);Lm.in=fr(ni);Lm.out=fr(ni+len);renderTL();renderStage();return;}
 if(S.phd){var ln=document.querySelector('#tls .lane');if(!ln)return;var lr=ln.getBoundingClientRect();S.t=clamp((e.clientX-lr.left-PAD)/Z,0,total()-1/FPS);renderStage();movePH();}
});
document.addEventListener('pointerup',function(){
 var any=false;
 if(S.drag&&!S.drag.stat){if(S.drag.moved)changed();S.drag=null;any=true;}
 if(S.tdrag&&!S.tdrag.stat){var td=S.tdrag;if(td.moved)changed();else S.undo.pop();
  if(td.kind==='scene'&&td.moved){var cut=capsAbs().filter(function(c){return c.cut&&c.g.sid===D.scenes[td.i].id;}).length;if(cut)toast(cut+' '+t(cut>1?'caption lines left with the cut speech':'caption line left with the cut speech',cut>1?'linhas de legenda saíram com a fala cortada':'linha de legenda saiu com a fala cortada'),['undo',t('Undo','Desfazer')]);}

 if(S.rdrag){var rd=S.rdrag,ids=enabledIdx();if(rd.moved&&rd.target!==ids.indexOf(rd.i)){snap(t('reorder scenes','reordenar cenas'));var n0=D.scenes[rd.i].n,ni=reorder(rd.i,rd.target);S.sel={k:'scene',i:ni};S.t=layout().filter(function(x){return x.i===ni;})[0].start+.05;changed();toast(t('Scene ','Cena ')+n0+' '+t('moved. Its captions went with it.','movida. A legenda dela foi junto.'),['undo',t('Undo','Desfazer')]);}S.rdrag=null;any=true;}
 if(S.mdrag){if(S.mdrag.moved)changed();S.mdrag=null;S.snapT=null;any=true;}
